# https://taskfile.dev  —  本机：task <name>；查看全部：task --list
version: '3'

env:
  GOFLAGS: -mod=mod

tasks:
  default:
    desc: 列出可用任务
    cmds: [task --list]

  fmt:
    desc: 格式化 Go 代码（gofumpt + goimports，由 golangci-lint fmt 驱动）
    cmds: [golangci-lint fmt ./...]

  fmt:check:
    desc: 检查格式，不修改
    cmds:
      - test -z "$(gofumpt -l .)" || { gofumpt -l .; echo '请运行 task fmt'; exit 1; }

  proto:
    desc: Protobuf lint 与代码生成（api/proto -> api/gen/go）
    cmds:
      - buf lint
      - buf generate

  proto:breaking:
    desc: 契约没有破坏性变更（与 main 分支比较；CI 对比上一个提交）
    cmds: ["buf breaking --against '.git#branch=main'"]

  proto:check:
    desc: 生成代码与契约一致（CI 同样检查）
    cmds:
      - buf lint
      - buf generate
      - git diff --exit-code -- api/gen

  build:
    desc: 编译全部服务到 bin/
    cmds: [go build -o bin/ ./cmd/...]

  run:
    desc: 本机前台运行一个服务（dev 命名空间，见 docs/runbook/local-dev.md；task run -- auth-service）
    cmds: ["bash scripts/dev.sh run {{.CLI_ARGS}}"]

  vet:
    desc: go vet
    cmds: [go vet ./...]

  mod:check:
    desc: go.mod/go.sum 与代码一致（含只在 Linux 上引入的依赖；需要联网）
    cmds: [go mod tidy -diff]

  lint:
    desc: golangci-lint
    cmds: [golangci-lint run ./...]

  test:
    desc: 单元测试（带竞态检测）
    cmds: [go test -race -count=1 ./...]

  test:integration:
    desc: 连同集成测试一起跑：只导出 .env 里的 TEST_*（测试服 exchange_test 库、Redis DB 15），需要联网
    cmds:
      # Migration tests round-trip every schema to the remote server: more than go test's default 10 minutes.
      - eval "$(grep -E '^TEST_' .env | sed 's/^/export /')" && go test -race -count=1 -timeout 30m ./...

  test:cover:
    desc: 覆盖率汇总
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  vuln:
    desc: govulncheck（需要联网）
    cmds: [govulncheck ./...]

  scripts:check:
    desc: 部署脚本语法检查
    cmds:
      - bash -n deploy/server-update.sh deploy/redpanda/topics.sh deploy/compose/nginx/update-cloudflare-ips.sh
      - for f in scripts/*.sh scripts/e2e/*.sh scripts/e2e/lib/*.sh scripts/fault/*.sh scripts/ops/*.sh; do bash -n "$f"; done

  dev:
    desc: 本机启动全部服务（直连测试服基础设施的 dev 命名空间：库 exchange_dev、Redis DB 1、Kafka 前缀 dev.；网关 http://localhost:8080；Ctrl-C 停止）
    cmds:
      - bash scripts/dev.sh

  e2e:
    desc: 对已部署的非生产环境跑端到端检查（默认 https://astras.vip，BASE=... 可改；读 .env 的 CAPTCHA_BYPASS_TOKEN；约 15 分钟）
    cmds:
      - for f in scripts/e2e/*.sh; do bash "$f" || exit 1; done

  fault:
    desc: 对测试环境做故障注入（Redpanda、ClickHouse、Redis 停机与 PostgreSQL 重启），每项会中断服务约半分钟，结束时恢复
    cmds:
      - for f in scripts/fault/*.sh; do echo "### $f"; bash "$f" || exit 1; done

  web:install:
    desc: 安装前端依赖（web/ 的 pnpm workspace：apps/pc、apps/m、apps/admin、packages/core、packages/ui、e2e）
    dir: web
    cmds: [pnpm install --prefer-offline]

  web:dev:
    desc: 本机启动前端（task web:dev -- pc|m|admin，默认 pc；/v1 与 WebSocket 代理到测试服；端口 5173/5174/5180）
    dir: web
    cmds:
      - pnpm install --prefer-offline --silent
      - |
        case "{{.CLI_ARGS}}" in
          m) f=@exchange/m ;;
          admin) f=@exchange/admin ;;
          *) f=@exchange/pc ;;
        esac
        pnpm --filter "$f" dev

  web:build:
    desc: 构建三个站点与旧后台（各自的 dist/）
    dir: web
    cmds: [pnpm install --frozen-lockfile --prefer-offline, pnpm build]

  web:types:
    desc: 由 api/openapi 与 api/admin 重新生成 TypeScript 类型（packages/core）
    dir: web
    cmds: [pnpm types]

  web:storybook:
    desc: 本机启动设计系统目录（Storybook，http://localhost:6006）
    dir: web
    cmds: [pnpm install --prefer-offline --silent, pnpm storybook]

  web:check:
    desc: 前端类型与契约一致、无硬编码颜色、类型检查、单元测试
    dir: web
    cmds:
      - pnpm install --frozen-lockfile --prefer-offline --silent
      - pnpm types >/dev/null && git diff --exit-code -- packages/core/src/api/gen
      - pnpm lint
      - pnpm typecheck
      - pnpm test

  web:lighthouse:
    desc: 对部署后的 PC 站与手机站各三页跑 Lighthouse（设计 §12.1 的性能预算；需要本机 Chrome；报告在 .lighthouseci/）
    dir: web/lighthouse
    cmds:
      - pnpm dlx @lhci/cli@0.15 autorun --config=pc.json || true
      - pnpm dlx @lhci/cli@0.15 autorun --config=m.json || true

  admin:types:
    desc: 同 web:types（管理后台的类型也由它生成）
    cmds: [task: web:types]

  ci:
    desc: 与 CI 相同的本地检查（不含 vuln）
    deps: [fmt:check, mod:check, vet, lint, scripts:check, web:check]
    cmds:
      - task: test

  deploy:
    desc: 在测试服拉取并更新（可带提交号：task deploy -- <ref>）
    cmds: ["ssh exchange 'bash /opt/exchange/src/deploy/server-update.sh {{.CLI_ARGS}}'"]

  deploy:status:
    desc: 测试服容器状态（基础设施 + 应用）
    cmds: ["ssh exchange 'cd /opt/exchange/infra && sudo docker compose -f docker-compose.yml -f docker-compose.apps.yml ps'"]

  deploy:logs:
    desc: 测试服容器日志（task deploy:logs -- api-gateway）
    cmds: ["ssh exchange 'cd /opt/exchange/infra && sudo docker compose -f docker-compose.yml -f docker-compose.apps.yml logs --tail=100 {{.CLI_ARGS}}'"]

  topics:
    desc: 在测试服幂等核对 Redpanda topic
    cmds: ["ssh exchange 'bash /opt/exchange/infra/redpanda/topics.sh'"]
