# 站点路由，被 80 与 443 两个 server 共用。
# 用 docker 内置 DNS 按请求解析上游：api-gateway 尚未部署时返回 502，而不是让 nginx 启动失败。
resolver 127.0.0.11 valid=10s ipv6=off;

location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
}

location /v1/ws {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}

location /v1/ {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# H5（web/h5 的构建产物，由 deploy/server-update.sh 写入）。带哈希的资源永久缓存；
# index.html 与 SPA 回退每次向源站确认，否则浏览器可能缓存旧页面、去引用部署时已删除的资源。
location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

location / {
    root  /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
