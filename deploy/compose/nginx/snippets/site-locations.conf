# 站点路由，被 80 与 443 两个 server 共用。
# 用 docker 内置 DNS 按请求解析上游：api-gateway 尚未部署时返回 502，而不是让 nginx 启动失败。
resolver 127.0.0.11 valid=10s ipv6=off;

location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
}

location /v1/ws {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}

location /v1/ {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# 管理后台 API：nginx 直接转发 admin-service，不经用户网关（§5.12）。会话 Cookie 限定 Path=/admin/。
# 需要 IP 白名单时在服务器上建 snippets/admin-access.local.conf（allow ...; deny all;），这里自动包含。
location /admin/v1/ {
    include /etc/nginx/snippets/admin-access*.conf;
    set $admin http://admin-service:8093;
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}

# 管理后台前端（web/admin 的构建产物，base 为 /admin/），不被搜索引擎收录、不允许嵌入框架。
location = /admin {
    return 301 /admin/;
}

location /admin/assets/ {
    include /etc/nginx/snippets/admin-access*.conf;
    root /usr/share/nginx/console;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /admin/ {
    include /etc/nginx/snippets/admin-access*.conf;
    root /usr/share/nginx/console;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /admin/index.html;
}

# H5（web/h5 的构建产物，由 deploy/server-update.sh 写入）。带哈希的资源永久缓存；
# index.html 与 SPA 回退每次向源站确认，否则浏览器可能缓存旧页面、去引用部署时已删除的资源。
location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

location / {
    root  /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
