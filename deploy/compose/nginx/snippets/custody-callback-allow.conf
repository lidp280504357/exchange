# 托管方回调的来源白名单（ADR-0011，审查 B3），由 api.conf 的回调 location 引用。
# 每行一个 `allow <IP 或网段>;`，填托管方登记的回调出口地址（Cloudflare 之后的真实地址，
# nginx 按 CF-Connecting-IP 还原）。没有任何 allow 时回调路径全部拒绝（403）。
# 测试服的模拟网关在内网直接调网关（UDUN_CALLBACK_URL=http://api-gateway:8080/...），不经 nginx。
# 接真网关时：在这里加托管方的地址，同时把 wallet-service 的 UDUN_CALLBACK_ALLOWED_IPS 设成同样的地址；
# 托管方不给地址时写 `allow all;`、UDUN_CALLBACK_ALLOWED_IPS 留空（只靠签名，来源记进 custody_callbacks.remote_ips，
# 真回调来过几笔后从那里取地址再收紧，见 docs/runbook/custody.md）。

# 2026-10-03（真网关联调步骤 3，协调会话批准）：优盾没有公布回调出口地址，先不限来源。wallet-service 接模拟网关时
# 它自己的来源名单（容器网段）仍挡住公网回调；接真网关后只靠签名把关，真回调来过几笔后按 remote_ips 收紧这一行。
allow all;
