# 手机站 m.astras.vip（web/apps/m 的构建产物，PWA）。桌面访问页面时回 PC 站（$to_pc_site）。
include /etc/nginx/snippets/api.conf;
root /usr/share/nginx/sites/m;

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location ~ ^/[^/]+\.(?:ico|svg|png|txt|xml|json)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location / {
    if ($to_pc_site) {
        return 302 https://astras.vip$request_uri;
    }
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
