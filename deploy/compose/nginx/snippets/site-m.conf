# 手机站 m.astras.vip（web/apps/m 的构建产物，PWA）。桌面访问页面时回 PC 站（$to_pc_site）。
include /etc/nginx/snippets/api.conf;
root /usr/share/nginx/sites/m;

# 构建产物在 /static/（vite build.assetsDir）：/assets/* 是资产页面的路由（/assets/deposit 等），走下面的 SPA 回退。
location ^~ /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# PWA 清单按平台资料动态生成（设计 2026-10-04 §4.1：名称、图标、主题色由后台改）：经网关取 instrument-service；
# 上游不可用时退回构建产物里的静态清单（@static_manifest），安装与图标照常。
location = /manifest.webmanifest {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @static_manifest;
}

location @static_manifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files /manifest.webmanifest =404;
}

location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location ~ ^/[^/]+\.(?:ico|svg|png|txt|xml|json)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location / {
    if ($to_pc_site) {
        return 302 https://astras.vip$request_uri;
    }
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
