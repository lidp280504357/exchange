# 用户站的 API 与 WebSocket：PC 站与手机站都把 /v1/ 与 /v1/ws 转给网关，各站对 API 同源，不需要 CORS。
# 用 docker 内置 DNS 按请求解析上游：api-gateway 尚未部署时返回 502，而不是让 nginx 启动失败。
resolver 127.0.0.11 valid=10s ipv6=off;

location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
}

location /v1/ws {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}

# 模拟网关的第二个商户 UDUNMOCK（ADR-0017，只服务端到端的隐藏测试资产）只在容器网络里经 api-gateway 回调，
# 公网来的一律 403（不分大小写；须在下面的通用回调路径之前，正则 location 按先后匹配）。
location ~* ^/v1/wallet/callbacks/udunmock {
    return 403;
}

# 托管方回调只收白名单里的来源（custody-callback-allow.conf，空即全部拒绝，`allow all;` 即不限来源）；
# wallet-service 按 UDUN_CALLBACK_ALLOWED_IPS 再查一次（空即不查），并验签、查时间戳、按托管方的单号与状态去重。
# 每个来源每秒 10 个、可突发 50 个，超过 429（托管方会重发）。
# 不分大小写、覆盖每个托管方的路径（按解码、合并斜杠后的地址匹配，优先于下面的 /v1/），
# 大写的 /v1/wallet/callbacks/UDUN 也走这里；wallet-service 另外只认小写。
location ~* ^/v1/wallet/callbacks/ {
    limit_req zone=custody_callbacks burst=50 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/custody-callback-allow.conf;
    deny all;
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# 头像上传（POST /v1/user/avatar，multipart，图片不超过 5 MB，设计 2026-10-07 头像与用户名 §1.7）：请求体放宽到 8m，
# 其余 /v1/ 仍是默认的 1m。
location = /v1/user/avatar {
    client_max_body_size 8m;
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /v1/ {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
