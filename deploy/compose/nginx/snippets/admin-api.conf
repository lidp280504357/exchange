# 管理后台 API：nginx 直接转发 admin-service，不经用户网关（§5.12）。会话 Cookie 限定 Path=/admin/。
location /admin/v1/ {
    set $admin http://admin-service:8093;
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}

# App 下载的分片上传（设计 2026-10-07 §7 #5）：一片 10 MiB，只有这条路由放宽到 16m（nginx 收完整片再转给
# admin-service）。
location ~ "^/admin/v1/platform/apps/(ANDROID|IOS)/uploads/[0-9a-f-]{36}/parts/[0-9]{1,3}$" {
    set $admin http://admin-service:8093;
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 16m;
    add_header Cache-Control "no-store" always;
}

# 正文可能较长的文章，和带图标（base64，原图最多 200 KB）的资产资料：请求体放宽到 512k。
location ~ ^/admin/v1/(articles|assets/[A-Za-z0-9]+/profile)(/|$) {
    set $admin http://admin-service:8093;
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 512k;
    add_header Cache-Control "no-store" always;
}
