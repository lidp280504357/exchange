# 用户上传的头像（设计 2026-10-07 头像与用户名 §1.3）：user-service 写到服务器 infra/uploads/avatars/<用户 ID>/，
# nginx 只读直出，三个站点同一路径。文件名随机、换头像即换地址，所以按不可变缓存 30 天；只认 .webp，别的一律 404。
location ^~ /uploads/avatars/ {
    root /usr/share/nginx;
    types { image/webp webp; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
    location ~ "^/uploads/avatars/[0-9a-f-]{36}/[A-Za-z0-9_-]+\.webp$" {
        try_files $uri =404;
    }
    return 404;
}
