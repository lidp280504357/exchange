# PC 站 astras.vip（web/apps/pc 的构建产物）。带哈希的资源永久缓存；index.html 与 SPA 回退每次向源站确认，
# 否则浏览器可能缓存旧页面、去引用部署时已删除的资源。手机访问页面时去手机站（$to_mobile_site）。
include /etc/nginx/snippets/api.conf;
root /usr/share/nginx/sites/pc;

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# API 参考（apps/pc 构建时由 api/openapi 生成）
location = /docs {
    return 301 /docs/;
}
location ^~ /docs/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
}

# 设计系统目录（packages/ui 的 Storybook 静态构建）
location = /storybook {
    return 301 /storybook/;
}
location ^~ /storybook/ {
    root /usr/share/nginx/sites;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /storybook/index.html;
}

# 旧版 H5（阶段 1–3，新页面完成前保留在 /h5/，不分流）
location = /h5 {
    return 301 /h5/;
}
location ^~ /h5/assets/ {
    root /usr/share/nginx/sites;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location ^~ /h5/ {
    root /usr/share/nginx/sites;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /h5/index.html;
}

# 旧管理后台（新后台在 admin.astras.vip 完成前保留在 /admin/）。
# 需要 IP 白名单时在服务器上建 snippets/admin-access.local.conf（allow ...; deny all;），这里与后台域名都会包含。
location ^~ /admin/v1/ {
    include /etc/nginx/snippets/admin-access*.conf;
    set $admin http://admin-service:8093;
    proxy_pass $admin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}
location = /admin {
    return 301 /admin/;
}
location ^~ /admin/assets/ {
    include /etc/nginx/snippets/admin-access*.conf;
    root /usr/share/nginx/console;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location ^~ /admin/ {
    include /etc/nginx/snippets/admin-access*.conf;
    root /usr/share/nginx/console;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri $uri/ /admin/index.html;
}

# 根目录下的静态文件（图标、manifest、robots.txt）不分流
location ~ ^/[^/]+\.(?:ico|svg|png|webmanifest|txt|xml|json)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location / {
    if ($to_mobile_site) {
        return 302 https://m.astras.vip$request_uri;
    }
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
