# PC 站 astras.vip（web/apps/pc 的构建产物）。带哈希的资源永久缓存；index.html 与 SPA 回退每次向源站确认，
# 否则浏览器可能缓存旧页面、去引用部署时已删除的资源。手机访问页面时去手机站（$to_mobile_site）。
include /etc/nginx/snippets/api.conf;
include /etc/nginx/snippets/downloads.conf;
include /etc/nginx/snippets/uploads.conf;
root /usr/share/nginx/sites/pc;

# 构建产物在 /static/（vite build.assetsDir）：/assets/* 是资产页面的路由（/assets/deposit 等），走下面的 SPA 回退。
location ^~ /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# API 参考（apps/pc 构建时由 api/openapi 生成）
location = /docs {
    return 301 /docs/;
}
location ^~ /docs/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
}

# 设计系统目录（packages/ui 的 Storybook 静态构建）
location = /storybook {
    return 301 /storybook/;
}
location ^~ /storybook/ {
    root /usr/share/nginx/sites;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /storybook/index.html;
}

# 旧版 H5（阶段 1–3）已由手机站取代（阶段 4 B3）：旧书签回到首页，手机再按 UA 分流到 m.astras.vip
location ~ ^/h5(/|$) {
    return 301 /;
}

# 旧管理后台（阶段 2 至 4 B4 的 /admin/）已由 admin.astras.vip 取代（阶段 4 B5）：旧书签与深链接跳到新后台同一路径
location ~ ^/admin(?:/(.*))?$ {
    return 301 https://admin.astras.vip/$1$is_args$args;
}

# 根目录下的静态文件（图标、manifest、robots.txt）不分流
location ~ ^/[^/]+\.(?:ico|svg|png|webmanifest|txt|xml|json)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location / {
    if ($to_mobile_site) {
        return 302 https://m.astras.vip$request_uri;
    }
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
