# App 下载（设计 2026-10-07 App 下载页 §2.4、§7 #4/#10）：后台上传的安装包、iOS 安装清单与配置描述文件，
# admin-service 写入 infra/downloads（挂到 /usr/share/nginx/files/downloads，只读），三个站点同一目录。
# 只认 <平台>/<文件 ID>.<扩展名>（UUID 命名，平台目录对应扩展名），其余 /downloads/ 下的路径（目录、写入中的
# 临时文件 .xxx.tmp）一律 404，不分流到手机站。
location /downloads/ {
    return 404;
}

location ~ "^/downloads/android/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.apk$" {
    root /usr/share/nginx/files;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 1h;
    try_files $uri =404;
}

location ~ "^/downloads/ios/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.ipa$" {
    root /usr/share/nginx/files;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    expires 1h;
    try_files $uri =404;
}

# OTA 安装清单：iOS 每次安装都来读，不缓存
location ~ "^/downloads/ios/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.plist$" {
    root /usr/share/nginx/files;
    types { }
    default_type application/xml;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ~ "^/downloads/ios/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.mobileconfig$" {
    root /usr/share/nginx/files;
    types { }
    default_type application/x-apple-aspen-config;
    add_header X-Content-Type-Options "nosniff" always;
    expires 1h;
    try_files $uri =404;
}
