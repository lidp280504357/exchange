# 管理后台 admin.astras.vip（web/apps/admin 的构建产物，浅色主题）：整个站点受访问限制——服务器上的
# snippets/admin-access.local.conf（allow ...; deny all;）在这里生效；登录还要密码与身份验证器验证码。
# 不被搜索引擎收录、不允许嵌入框架、只连本站。
include /etc/nginx/snippets/admin-access*.conf;
root /usr/share/nginx/sites/admin;

add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
}

resolver 127.0.0.11 valid=10s ipv6=off;
include /etc/nginx/snippets/admin-api.conf;

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
}
