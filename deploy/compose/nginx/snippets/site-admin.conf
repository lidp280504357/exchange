# 管理后台 admin.astras.vip（web/apps/admin 的构建产物，浅色主题）。访问限制的挂接点：服务器上的
# snippets/admin-access.local.conf（allow ...; deny all;）在这里对整站生效（用户 2026-09-30 决定暂不设）；
# 登录要密码，身份验证器验证码由开关 admin.login_without_totp 控制。不被搜索引擎收录、不允许嵌入框架、只连本站。
include /etc/nginx/snippets/admin-access*.conf;
root /usr/share/nginx/sites/admin;

add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
}

resolver 127.0.0.11 valid=10s ipv6=off;
include /etc/nginx/snippets/admin-api.conf;

# 资产图标与平台图片（公开、带版本号）从用户 API 取，后台的图标与资料预览在 CSP（img-src 'self'）下同源。
location ~ ^/v1/(?:market/assets/[A-Za-z0-9]+/logo|platform/images/[a-z_]+)$ {
    set $api http://api-gateway:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
}
