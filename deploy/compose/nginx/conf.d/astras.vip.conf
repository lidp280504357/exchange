# 三个站点（ADR-0012）：astras.vip（PC 站）、m.astras.vip（手机站）、admin.astras.vip（管理后台）。
# Cloudflare 代理 -> 本 nginx（Cloudflare 源站证书覆盖 astras.vip 与 *.astras.vip）-> 各站静态文件与内部服务。
# 真实客户端 IP 由 00-cloudflare-real-ip.conf（update-cloudflare-ips.sh 生成）提供。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 托管方回调按来源限速（api.conf 的回调 location）：真网关的回调来自公网，签名不对的照样要 wallet-service 验一次。
limit_req_zone $binary_remote_addr zone=custody_callbacks:1m rate=10r/s;

# 设备分流：手机打开 PC 站的页面时去手机站，桌面打开手机站时回 PC 站，路径不变；页脚的"切换到电脑版 / 手机版"
# 写 site_pref Cookie（Domain=.astras.vip），有它就按它来。平板按桌面算（iPadOS 与安卓平板的 UA 不带 Mobile）。
map $http_user_agent $ua_mobile {
    default 0;
    "~*(iphone|ipod|android.+mobile|windows phone|iemobile|opera mini|blackberry|webos)" 1;
}
map "$ua_mobile:$cookie_site_pref" $to_mobile_site {
    default 0;
    "1:"    1;
    "1:m"   1;
}
map "$ua_mobile:$cookie_site_pref" $to_pc_site {
    default 0;
    "0:"    1;
    "0:pc"  1;
}

# 压缩文本资源（brotli 由 Cloudflare 边缘做）
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

# 80：Cloudflare 若处于 Flexible 模式会以 HTTP 回源，此时 X-Forwarded-Proto 为 https，直接服务，
# 避免与 301 形成重定向循环；其他情况跳转 https。
server {
    listen 80;
    server_name astras.vip;
    if ($http_x_forwarded_proto != "https") {
        return 301 https://astras.vip$request_uri;
    }
    include /etc/nginx/snippets/site-pc.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name astras.vip;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/site-pc.conf;
}

server {
    listen 80;
    server_name m.astras.vip;
    if ($http_x_forwarded_proto != "https") {
        return 301 https://m.astras.vip$request_uri;
    }
    include /etc/nginx/snippets/site-m.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name m.astras.vip;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/site-m.conf;
}

server {
    listen 80;
    server_name admin.astras.vip;
    if ($http_x_forwarded_proto != "https") {
        return 301 https://admin.astras.vip$request_uri;
    }
    include /etc/nginx/snippets/site-admin.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.astras.vip;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/site-admin.conf;
}

# 直接用 IP 访问或未知 Host：拒绝
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    return 444;
}
