# astras.vip：Cloudflare 代理 -> 本 nginx（Cloudflare 源站证书）-> 内部服务
# 真实客户端 IP 由 00-cloudflare-real-ip.conf（update-cloudflare-ips.sh 生成）提供。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80：Cloudflare 若处于 Flexible 模式会以 HTTP 回源，此时 X-Forwarded-Proto 为 https，直接服务，
# 避免与 301 形成重定向循环；其他情况跳转 https。
server {
    listen 80;
    server_name astras.vip;
    if ($http_x_forwarded_proto != "https") {
        return 301 https://astras.vip$request_uri;
    }
    include /etc/nginx/snippets/site-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name astras.vip;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    include /etc/nginx/snippets/site-locations.conf;
}

# 直接用 IP 访问或未知 Host：拒绝
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    return 444;
}
