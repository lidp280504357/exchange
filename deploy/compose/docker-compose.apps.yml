# 应用服务，与 docker-compose.yml 合并使用（同一 compose 项目、同一 exchange 网络）：
#   sudo docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build --wait
# 由 deploy/server-update.sh 执行。镜像在服务器上从源码构建（EXCHANGE_SRC，默认 ../src
# 即 /opt/exchange/src），所有服务共用一个镜像 exchange-app，按 command 选择二进制。
# 密钥与基础设施地址来自同目录的 apps.env（权限 600，不入库）；服务间地址用容器名。
# 端口约定见 docs/runbook/server-deploy.md；只有 nginx 对外，其余端口不发布。
# stop_grace_period 必须大于 SHUTDOWN_TIMEOUT（默认 10s），否则优雅退出会被 SIGKILL 打断。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# 服务里写 environment 会覆盖整个映射，所以公共变量用锚点合并
x-env: &base-env
  GOMEMLIMIT: 160MiB

x-app: &app
  image: exchange-app:latest
  build:
    context: ${EXCHANGE_SRC:-../src}
    dockerfile: deploy/docker/Dockerfile
    args:
      VERSION: ${APP_VERSION:-unknown}
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - path: apps.env
      required: false
  environment: *base-env
  stop_grace_period: 15s
  mem_limit: 192m
  networks: [exchange]

x-health: &health
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

services:
  # A WebSocket connection costs the gateway about 60 KiB (load test,
  # docs/runbook/testing.md): 512 MiB holds the 5,000 of the phase 2 target
  # with room for the rest of its work.
  api-gateway:
    <<: *app
    command: ["/app/api-gateway"]
    mem_limit: 512m
    environment:
      <<: *base-env
      GOMEMLIMIT: 440MiB
      # The desktop app's WebView origins (tauri://localhost; Windows:
      # http(s)://tauri.localhost) call the API with bearer tokens, no
      # cookies (docs/runbook/desktop.md).
      CORS_ORIGINS: tauri://localhost,http://tauri.localhost,https://tauri.localhost
      WS_ORIGINS: astras.vip,localhost:5173,localhost,tauri.localhost
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
      LEDGER_SERVICE_URL: http://ledger-service:8085
      TRADING_SERVICE_URL: http://spot-trading-service:8088
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      WALLET_SERVICE_URL: http://wallet-service:8092
    depends_on:
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      auth-service: {condition: service_started}
      user-service: {condition: service_started}
      notification-service: {condition: service_started}
      instrument-service: {condition: service_started}
      ledger-service: {condition: service_started}
      spot-trading-service: {condition: service_started}
      market-data-service: {condition: service_started}
      wallet-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/readyz"]

  auth-service:
    <<: *app
    command: ["/app/auth-service"]
    # Argon2id 每次计算占 64 MiB，PASSWORD_HASH_CONCURRENCY 默认 2
    mem_limit: 384m
    environment:
      <<: *base-env
      GOMEMLIMIT: 320MiB
      NOTIFICATION_GRPC_ADDR: notification-service:9183
      USER_GRPC_ADDR: user-service:9182
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      notification-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9081/readyz"]

  user-service:
    <<: *app
    command: ["/app/user-service"]
    environment:
      <<: *base-env
      # auth-service 与 user-service 互相调用，gRPC 连接按需建立，不写 depends_on 以免成环
      AUTH_GRPC_ADDR: auth-service:9181
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9082/readyz"]

  notification-service:
    <<: *app
    command: ["/app/notification-service"]
    environment:
      <<: *base-env
      USER_GRPC_ADDR: user-service:9182
      AUTH_GRPC_ADDR: auth-service:9181
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9083/readyz"]

  instrument-service:
    <<: *app
    command: ["/app/instrument-service"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9084/readyz"]

  ledger-service:
    <<: *app
    command: ["/app/ledger-service"]
    environment:
      <<: *base-env
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9085/readyz"]

  spot-trading-service:
    <<: *app
    command: ["/app/spot-trading-service"]
    environment:
      <<: *base-env
      LEDGER_GRPC_ADDR: ledger-service:9185
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      # MARKET_MAKER_USER_IDS (zero fees) comes from apps.env.
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      ledger-service: {condition: service_started}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9088/readyz"]

  risk-service:
    <<: *app
    command: ["/app/risk-service"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9086/readyz"]

  market-data-service:
    <<: *app
    command: ["/app/market-data-service"]
    environment:
      <<: *base-env
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      # Reference prices while market.reference_feed is on (Binance public
      # data: test environments only, §11.9).
      REFERENCE_SYMBOLS: BTC-USDT,ETH-USDT
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      instrument-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]

  # Deposit addresses, the deposit scanner and the wallet operations (§5.10,
  # §11.5): WALLET_XPUB (the deposit account's xpub from `signer xpub`),
  # ALCHEMY_SEPOLIA_HTTPS_URL and ETH_CHAIN_ID come from apps.env. It holds
  # no private key (ADR-0003): transactions are signed by the signer.
  wallet-service:
    <<: *app
    command: ["/app/wallet-service"]
    environment:
      <<: *base-env
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      LEDGER_GRPC_ADDR: ledger-service:9185
      SIGNER_GRPC_ADDR: signer:9193
      AUTH_GRPC_ADDR: auth-service:9181
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      WALLET_NETWORK: ETH-SEPOLIA
      # Test environment: new withdrawal addresses cool off for a minute
      # (production: 24 hours); the price of the limits falls back to this
      # without a fresh reference.
      WALLET_WHITELIST_COOLDOWN: 1m
      WALLET_FALLBACK_PRICES: ETH:3000
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
      ledger-service: {condition: service_started}
      auth-service: {condition: service_started}
      signer: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9092/readyz"]

  # The signer (ADR-0003), the only holder of the wallet keys. The keystore
  # and SIGNER_PASSPHRASE live in /opt/exchange/infra/signer (700, owner
  # uid 10001, see docs/runbook/wallet.md), never in apps.env; opening the
  # keystore takes 256 MiB for scrypt once at start.
  signer:
    <<: *app
    command: ["/app/signer", "serve"]
    mem_limit: 384m
    env_file:
      - path: apps.env
        required: false
      - path: signer/signer.env
        required: true
    volumes:
      - ./signer:/keystore:ro
    environment:
      <<: *base-env
      GOMEMLIMIT: 330MiB
      SIGNER_KEYSTORE: /keystore/keystore.json
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/readyz"]

  # The admin console's API (§5.12), reached through nginx at /admin/v1 and
  # never through the gateway; the console itself is static files
  # (web/admin) served by nginx at /admin/. ADMIN_SECRET_KEY seals the
  # administrators' authenticator secrets and lives in admin/admin.env
  # (600, see docs/runbook/admin.md), not in apps.env. Administrators are
  # created with exchangectl in this container. One Argon2id hash (64 MiB)
  # at a time.
  admin-service:
    <<: *app
    command: ["/app/admin-service"]
    mem_limit: 320m
    env_file:
      - path: apps.env
        required: false
      - path: admin/admin.env
        required: true
    environment:
      <<: *base-env
      GOMEMLIMIT: 240MiB
      PASSWORD_HASH_CONCURRENCY: "1"
      AUTH_GRPC_ADDR: auth-service:9181
      USER_GRPC_ADDR: user-service:9182
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      LEDGER_GRPC_ADDR: ledger-service:9185
      WALLET_SERVICE_URL: http://wallet-service:8092
      TRADING_SERVICE_URL: http://spot-trading-service:8088
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      auth-service: {condition: service_started}
      user-service: {condition: service_started}
      instrument-service: {condition: service_started}
      ledger-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9094/readyz"]

  # The platform market maker (§11.10): quotes the symbols below while
  # market.maker allows them; its account MARKET_MAKER_USER_ID comes from
  # apps.env.
  market-maker:
    <<: *app
    command: ["/app/market-maker"]
    environment:
      <<: *base-env
      MARKET_MAKER_SYMBOLS: BTC-USDT
      TRADING_SERVICE_URL: http://spot-trading-service:8088
      LEDGER_SERVICE_URL: http://ledger-service:8085
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
    depends_on:
      postgres: {condition: service_healthy}
      spot-trading-service: {condition: service_started}
      market-data-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/readyz"]

  # One active engine (it holds a database lease); a second instance would
  # wait as a standby (ADR-0002).
  matching-engine:
    <<: *app
    command: ["/app/matching-engine"]
    mem_limit: 256m
    environment:
      <<: *base-env
      GOMEMLIMIT: 200MiB
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9089/readyz"]

  analytics-consumer:
    <<: *app
    command: ["/app/analytics-consumer"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9087/readyz"]
