# 应用服务，与 docker-compose.yml 合并使用（同一 compose 项目、同一 exchange 网络）：
#   sudo docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build --wait
# 由 deploy/server-update.sh 执行。镜像在服务器上从源码构建（EXCHANGE_SRC，默认 ../src
# 即 /opt/exchange/src），所有服务共用一个镜像 exchange-app，按 command 选择二进制。
# 密钥与基础设施地址来自同目录的 apps.env（权限 600，不入库）；服务间地址用容器名。
# 端口约定见 docs/runbook/server-deploy.md；只有 nginx 对外，其余端口不发布。
# stop_grace_period 必须大于 SHUTDOWN_TIMEOUT（默认 10s），否则优雅退出会被 SIGKILL 打断。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# 服务里写 environment 会覆盖整个映射，所以公共变量用锚点合并
x-env: &base-env
  GOMEMLIMIT: 160MiB
  # Published outbox rows: six hours here (the disk is small; a day of HOUSE
  # and market-sim trades is ~0.4 GB of ledger outbox), seven days by default.
  OUTBOX_RETENTION: 6h

x-app: &app
  image: exchange-app:latest
  build:
    context: ${EXCHANGE_SRC:-../src}
    dockerfile: deploy/docker/Dockerfile
    args:
      VERSION: ${APP_VERSION:-unknown}
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - path: apps.env
      required: false
  environment: *base-env
  stop_grace_period: 15s
  mem_limit: 192m
  networks: [exchange]

x-health: &health
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

services:
  # A WebSocket connection costs the gateway about 60 KiB (load test,
  # docs/runbook/testing.md): 512 MiB holds the 5,000 of the phase 2 target
  # with room for the rest of its work.
  api-gateway:
    <<: *app
    command: ["/app/api-gateway"]
    mem_limit: 512m
    environment:
      <<: *base-env
      GOMEMLIMIT: 440MiB
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
      LEDGER_SERVICE_URL: http://ledger-service:8085
      TRADING_SERVICE_URL: http://spot-trading-service:8088
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      WALLET_SERVICE_URL: http://wallet-service:8092
      DERIVATIVES_SERVICE_URL: http://derivatives-service:8095
      MARGIN_SERVICE_URL: http://margin-service:8099
    depends_on:
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      auth-service: {condition: service_started}
      user-service: {condition: service_started}
      notification-service: {condition: service_started}
      instrument-service: {condition: service_started}
      ledger-service: {condition: service_started}
      spot-trading-service: {condition: service_started}
      market-data-service: {condition: service_started}
      wallet-service: {condition: service_started}
      derivatives-service: {condition: service_started}
      margin-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9080/readyz"]

  auth-service:
    <<: *app
    command: ["/app/auth-service"]
    # Argon2id 每次计算占 64 MiB，PASSWORD_HASH_CONCURRENCY 默认 2
    mem_limit: 384m
    environment:
      <<: *base-env
      GOMEMLIMIT: 320MiB
      NOTIFICATION_GRPC_ADDR: notification-service:9183
      USER_GRPC_ADDR: user-service:9182
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      notification-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9081/readyz"]

  user-service:
    <<: *app
    command: ["/app/user-service"]
    environment:
      <<: *base-env
      # auth-service 与 user-service 互相调用，gRPC 连接按需建立，不写 depends_on 以免成环
      AUTH_GRPC_ADDR: auth-service:9181
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9082/readyz"]

  notification-service:
    <<: *app
    command: ["/app/notification-service"]
    environment:
      <<: *base-env
      USER_GRPC_ADDR: user-service:9182
      AUTH_GRPC_ADDR: auth-service:9181
      # The exchange's name in the messages, from the platform profile.
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9083/readyz"]

  instrument-service:
    <<: *app
    command: ["/app/instrument-service"]
    environment:
      <<: *base-env
      # The welcome credits the platform profile shows, read every minute.
      LEDGER_SERVICE_URL: http://ledger-service:8085
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9084/readyz"]

  ledger-service:
    <<: *app
    command: ["/app/ledger-service"]
    environment:
      <<: *base-env
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      # Transfers out of FUTURES leave the cross positions' losses covered.
      DERIVATIVES_GRPC_ADDR: derivatives-service:9195
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9085/readyz"]

  spot-trading-service:
    <<: *app
    command: ["/app/spot-trading-service"]
    environment:
      <<: *base-env
      LEDGER_GRPC_ADDR: ledger-service:9185
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      # Orders on margin accounts only (margin.enabled); the client dials lazily.
      MARGIN_GRPC_ADDR: margin-service:9199
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      # MARKET_MAKER_USER_IDS (zero fees: the simulated market's bots) comes from apps.env.
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      ledger-service: {condition: service_started}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9088/readyz"]

  # Perpetual contracts (implementation plan §7.3 task 5): orders, positions
  # and margin; the contract engine is derivatives-engine.
  derivatives-service:
    <<: *app
    command: ["/app/derivatives-service"]
    environment:
      <<: *base-env
      LEDGER_GRPC_ADDR: ledger-service:9185
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      # MARKET_MAKER_USER_IDS (zero fees: the simulated market's bots) comes from apps.env.
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      ledger-service: {condition: service_started}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9095/readyz"]

  # Margin trading (design 2026-10-06): one process; the hourly interest
  # holds a database lease, so a second instance would wait to charge it.
  margin-service:
    <<: *app
    command: ["/app/margin-service"]
    environment:
      <<: *base-env
      LEDGER_GRPC_ADDR: ledger-service:9185
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      ledger-service: {condition: service_started}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
      market-data-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9099/readyz"]

  risk-service:
    <<: *app
    command: ["/app/risk-service"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9086/readyz"]

  market-data-service:
    <<: *app
    command: ["/app/market-data-service"]
    environment:
      <<: *base-env
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      # Reference market data while market.reference_feed is on (Binance
      # public data: test environments only, §11.9, ADR-0010), for the
      # pairs whose reference_symbol is set (deploy/instruments/test.json).
      # The prices are also the contracts' index sources: Binance alone,
      # so one source is enough here (§11.7 asks for 2).
      INDEX_MIN_SOURCES: "1"
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      instrument-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]

  # Deposit addresses, the deposit scanner and the wallet operations (§5.10,
  # §11.5): WALLET_XPUB (the deposit account's xpub from `signer xpub`),
  # ALCHEMY_SEPOLIA_HTTPS_URL and ETH_CHAIN_ID come from apps.env. It holds
  # no private key (ADR-0003): transactions are signed by the signer.
  wallet-service:
    <<: *app
    command: ["/app/wallet-service"]
    environment:
      <<: *base-env
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      USER_GRPC_ADDR: user-service:9182
      LEDGER_GRPC_ADDR: ledger-service:9185
      SIGNER_GRPC_ADDR: signer:9193
      AUTH_GRPC_ADDR: auth-service:9181
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      WALLET_NETWORK: ETH-SEPOLIA
      # Test environment: new withdrawal addresses cool off for a minute
      # (production: 24 hours); the price of the limits falls back to this
      # without a fresh reference.
      WALLET_WHITELIST_COOLDOWN: 1m
      # TUSD, the end-to-end tests' hidden asset (ADR-0017), has no pair.
      WALLET_FALLBACK_PRICES: ETH:3000,BTC:100000,TUSD:1
      # How much may be missing at the custody checks before an asset's
      # withdrawals are suspended: about the custodian's fee granularity.
      WALLET_SHORTFALL_STOP: USDT=1,BTC=0.0001,ETH=0.001,TUSD=1
      # The stand-in's second merchant (ADR-0017): only the end-to-end
      # tests' hidden asset, on udun-mock whatever UDUN points at. Its
      # merchant and key (UDUNMOCK_MERCHANT_ID, UDUNMOCK_API_KEY) are in
      # apps.env.
      UDUNMOCK_GATEWAY_URL: http://udun-mock:8097
      UDUNMOCK_CALLBACK_URL: http://api-gateway:8080/v1/wallet/callbacks/udunmock
      UDUNMOCK_CALLBACK_ALLOWED_IPS: 172.18.0.0/16
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      instrument-service: {condition: service_started}
      user-service: {condition: service_started}
      ledger-service: {condition: service_started}
      auth-service: {condition: service_started}
      signer: {condition: service_started}
      udun-mock: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9092/readyz"]

  # The test environment's stand-in for the Udun custody wallet's gateway
  # (ADR-0011, docs/runbook/custody.md): wallet-service reaches it at
  # UDUN_GATEWAY_URL=http://udun-mock:8097 until UDUN is the real gateway,
  # and as its second merchant UDUNMOCK always (ADR-0017); it calls back
  # through the gateway (the address and withdrawal's callback URL). It
  # takes UDUNMOCK_MERCHANT_ID and UDUNMOCK_API_KEY from apps.env (never
  # UDUN_*) and keeps its addresses, balances and pending callbacks in
  # ./udun-mock (owner uid 10001).
  udun-mock:
    <<: *app
    command: ["/app/udun-mock", "serve"]
    mem_limit: 96m
    volumes:
      - ./udun-mock:/data
    environment:
      <<: *base-env
      GOMEMLIMIT: 64MiB
      UDUN_MOCK_STATE: /data/state.json
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9097/readyz"]

  # The signer (ADR-0003), the only holder of the wallet keys. The keystore
  # and SIGNER_PASSPHRASE live in /opt/exchange/infra/signer (700, owner
  # uid 10001, see docs/runbook/wallet.md), never in apps.env; opening the
  # keystore takes 256 MiB for scrypt once at start.
  signer:
    <<: *app
    command: ["/app/signer", "serve"]
    mem_limit: 384m
    env_file:
      - path: apps.env
        required: false
      - path: signer/signer.env
        required: true
    volumes:
      - ./signer:/keystore:ro
    environment:
      <<: *base-env
      GOMEMLIMIT: 330MiB
      SIGNER_KEYSTORE: /keystore/keystore.json
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/readyz"]

  # The admin console's API (§5.12), reached through nginx at /admin/v1 of
  # admin.astras.vip and never through the gateway; the console itself is
  # static files (web/apps/admin) of the same domain. ADMIN_SECRET_KEY seals the
  # administrators' authenticator secrets and lives in admin/admin.env
  # (600, see docs/runbook/admin.md), not in apps.env. Administrators are
  # created with exchangectl in this container. One Argon2id hash (64 MiB)
  # at a time.
  admin-service:
    <<: *app
    command: ["/app/admin-service"]
    mem_limit: 320m
    env_file:
      - path: apps.env
        required: false
      - path: admin/admin.env
        required: true
      # Signs its calls to market-sim's management API (key "admin").
      - path: sim/admin.env
        required: false
    environment:
      <<: *base-env
      GOMEMLIMIT: 240MiB
      PASSWORD_HASH_CONCURRENCY: "1"
      AUTH_GRPC_ADDR: auth-service:9181
      USER_GRPC_ADDR: user-service:9182
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      LEDGER_GRPC_ADDR: ledger-service:9185
      RISK_GRPC_ADDR: risk-service:9186
      WALLET_SERVICE_URL: http://wallet-service:8092
      TRADING_SERVICE_URL: http://spot-trading-service:8088
      DERIVATIVES_SERVICE_URL: http://derivatives-service:8095
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      MARKET_SIM_URL: http://market-sim:8098
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
      LEDGER_SERVICE_URL: http://ledger-service:8085
      # The test server only: the e2e's changes of trading parameters wait
      # a minute; without it an ADMIN cannot set less than 10 minutes.
      ADMIN_CHANGE_DELAY_FLOOR: 60s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      auth-service: {condition: service_started}
      user-service: {condition: service_started}
      instrument-service: {condition: service_started}
      ledger-service: {condition: service_started}
      risk-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9094/readyz"]

  # HOUSE's virtual liquidity (ADR-0015): reference books for the engines
  # from the public books, HOUSE's inventory and its caps (HOUSE_*_CAP,
  # defaults in cmd/market-maker). HOUSE_USER_ID comes from apps.env.
  # Every order trades against HOUSE here (user decision 2026-10-02), so its
  # caps are well above the design's (§8.6) and scripts/ops/house.sh seeds
  # it to match: a pair's position (its inventory included) up to 2,000,000
  # USDT, all spot positions 20,000,000, a contract's 5,000,000.
  market-maker:
    <<: *app
    command: ["/app/market-maker"]
    environment:
      <<: *base-env
      HOUSE_SYMBOL_CAP: "2000000"
      HOUSE_TOTAL_CAP: "20000000"
      HOUSE_CONTRACT_CAP: "5000000"
      LEDGER_GRPC_ADDR: ledger-service:9185
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
      DERIVATIVES_SERVICE_URL: http://derivatives-service:8095
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      ledger-service: {condition: service_started}
      market-data-service: {condition: service_started}
      derivatives-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/readyz"]

  # The simulated market of the platform coin (ASTRA design §4): its bots
  # are ordinary users trading ASTRA-USDT through the trading service and
  # the ledger. One instance holds a database lease; sim.enabled switches
  # the bots on. Management API on 8098 (internal only).
  # The management API's changes are signed (ASTRA design §6.2), one key
  # per caller, made by the deploy script on its first run: sim/sim.env
  # (SIM_API_SECRET, exchangectl in this container) and sim/admin.env
  # (SIM_ADMIN_API_SECRET, admin-service too: the only caller that names
  # an approver).
  market-sim:
    <<: *app
    command: ["/app/market-sim"]
    env_file:
      - path: apps.env
        required: false
      - path: sim/sim.env
        required: false
      - path: sim/admin.env
        required: false
    environment:
      <<: *base-env
      TRADING_SERVICE_URL: http://spot-trading-service:8088
      LEDGER_SERVICE_URL: http://ledger-service:8085
      MARKET_DATA_SERVICE_URL: http://market-data-service:8090
      INSTRUMENT_SERVICE_URL: http://instrument-service:8084
      INSTRUMENT_GRPC_ADDR: instrument-service:9184
      DERIVATIVES_SERVICE_URL: http://derivatives-service:8095
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      spot-trading-service: {condition: service_started}
      derivatives-service: {condition: service_started}
      ledger-service: {condition: service_started}
      market-data-service: {condition: service_started}
      instrument-service: {condition: service_started}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9098/readyz"]

  # One active engine (it holds a database lease); a second instance would
  # wait as a standby (ADR-0002). Reference books of some 90 pairs
  # (ADR-0015) add up to ~220 WAL entries a second (2026-10-02: 5.8 GB for
  # two to three hours): keep half an hour. Recovery needs only what
  # follows the latest snapshot (every 1000 entries, seconds).
  matching-engine:
    <<: *app
    command: ["/app/matching-engine"]
    mem_limit: 256m
    environment:
      <<: *base-env
      GOMEMLIMIT: 200MiB
      MATCHING_WAL_RETENTION: 30m
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    # Replaying the WAL and catching up on the reference books after a long
    # stop takes minutes, /readyz saying "starting" meanwhile: ten minutes
    # before failed checks count (docs/runbook/matching.md).
    healthcheck:
      <<: *health
      start_period: 10m
      start_interval: 5s
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9089/readyz"]

  # The perpetual contracts' matching shard (implementation plan §7.3 task
  # 2): the same engine on derivatives.order.commands and
  # derivatives.order.references, schema deriv_matching, its own lease and
  # consumer group.
  derivatives-engine:
    <<: *app
    command: ["/app/matching-engine"]
    mem_limit: 256m
    environment:
      <<: *base-env
      GOMEMLIMIT: 200MiB
      MATCHING_SHARD: derivatives
      MATCHING_WAL_RETENTION: 2h
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    healthcheck:
      <<: *health
      start_period: 10m
      start_interval: 5s
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9096/readyz"]

  analytics-consumer:
    <<: *app
    command: ["/app/analytics-consumer"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9087/readyz"]
