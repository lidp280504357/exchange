name: exchange-infra

# 容器日志轮转，避免 json-file 日志占满 28 GB 磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [exchange]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >-
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [exchange]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.16
    restart: unless-stopped
    logging: *default-logging
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://${PUBLIC_IP}:9092
      - --schema-registry-addr
      - 0.0.0.0:8081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      # Without a cap Seastar takes memory as it goes and never gives it
      # back: 3.4 to 4.3 GB of the test server's 7.8 on 2026-10-02, the
      # swap full and the host unresponsive during builds. 2 GB holds the
      # 93 partitions (topic_memory_per_partition 4 MiB allows 512); the
      # container's limit below leaves Seastar's own overhead room.
      - --memory
      - 2G
      - --overprovisioned
      - --default-log-level=info
    ports:
      - "9092:9092"
      - "8081:8081"
      - "9644:9644"
    mem_limit: 2560m
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls 127.0.0.1:9644 | grep -q Healthy"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [exchange]

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Sized for the shared test server: fewer system logs, capped memory.
      - ./clickhouse/config.d/small-server.xml:/etc/clickhouse-server/config.d/small-server.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [exchange]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    # 每条代理的 WebSocket 占两个连接（客户端与上游）；nginx.conf 放宽了 worker_connections
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 三个站点与 Storybook（web/ 的构建产物，deploy/server-update.sh 写入 nginx/sites/{pc,m,admin,storybook}）
      - ./nginx/sites:/usr/share/nginx/sites:ro
      # 后台上传的 App 安装包（admin-service 写入，三个站点的 /downloads/，设计 2026-10-07 App 下载页）
      - ./downloads:/usr/share/nginx/files/downloads:ro
      # 用户上传的头像（user-service 写入，nginx/snippets/uploads.conf 直出）
      - ./uploads/avatars:/usr/share/nginx/uploads/avatars:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header 'Host: astras.vip' http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [exchange]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  exchange:
    driver: bridge
