# Scrape configuration for the services' ops ports on the compose network
# (ports in docs/runbook/server-deploy.md), for a Prometheus or Grafana
# Alloy agent run next to the apps. Not deployed yet: Grafana Cloud is
# deferred. One job per service, so alerts group by job.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api-gateway
    static_configs: [{targets: ["api-gateway:9080"]}]
  - job_name: auth-service
    static_configs: [{targets: ["auth-service:9081"]}]
  - job_name: user-service
    static_configs: [{targets: ["user-service:9082"]}]
  - job_name: notification-service
    static_configs: [{targets: ["notification-service:9083"]}]
  - job_name: instrument-service
    static_configs: [{targets: ["instrument-service:9084"]}]
  - job_name: ledger-service
    static_configs: [{targets: ["ledger-service:9085"]}]
  - job_name: risk-service
    static_configs: [{targets: ["risk-service:9086"]}]
  - job_name: analytics-consumer
    static_configs: [{targets: ["analytics-consumer:9087"]}]
  - job_name: spot-trading-service
    static_configs: [{targets: ["spot-trading-service:9088"]}]
  - job_name: matching-engine
    static_configs: [{targets: ["matching-engine:9089"]}]
  - job_name: derivatives-engine
    static_configs: [{targets: ["derivatives-engine:9096"]}]
  - job_name: derivatives-service
    static_configs: [{targets: ["derivatives-service:9095"]}]
  - job_name: market-data-service
    static_configs: [{targets: ["market-data-service:9090"]}]
  - job_name: market-maker
    static_configs: [{targets: ["market-maker:9091"]}]
  - job_name: market-sim
    static_configs: [{targets: ["market-sim:9098"]}]
  - job_name: wallet-service
    static_configs: [{targets: ["wallet-service:9092"]}]
  - job_name: signer
    static_configs: [{targets: ["signer:9093"]}]
  - job_name: admin-service
    static_configs: [{targets: ["admin-service:9094"]}]
  - job_name: margin-service
    static_configs: [{targets: ["margin-service:9099"]}]
  # The host itself (disk, memory): a node exporter beside the agent, not
  # on the compose network (HostDiskLow, HostDiskCritical; review C56),
  # run with --collector.textfile.directory=/opt/exchange/infra/metrics:
  # the daily retention writes its last success there (RetentionRunStale,
  # RetentionMetricAbsent; B201; the deploy makes the directory). Not
  # running yet, as the agent.
  - job_name: node
    static_configs: [{targets: ["host.docker.internal:9100"]}]
