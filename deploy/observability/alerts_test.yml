# promtool test rules alerts_test.yml: the alerts that guard money and
# events fire when they should, and stay quiet otherwise.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ledger_reconcile_mismatches{job="ledger-service", check="JOURNAL_BALANCED"}'
        values: '0 0 2 2'
      - series: 'ledger_reconcile_mismatches{job="ledger-service", check="ACCOUNT_MATCHES_LINES"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerReconciliationMismatch
        exp_alerts: []
      - eval_time: 3m
        alertname: LedgerReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, job: ledger-service, check: JOURNAL_BALANCED}
            exp_annotations:
              summary: ledger reconciliation check JOURNAL_BALANCED found 2 mismatches
              runbook: docs/runbook/ledger.md

  - interval: 1m
    input_series:
      - series: 'ledger_trades_failed_total{job="ledger-service"}'
        values: '0 0 0 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: TradeSettlementRefused
        exp_alerts: []
      - eval_time: 4m
        alertname: TradeSettlementRefused
        exp_alerts:
          - exp_labels: {severity: critical, job: ledger-service}
            exp_annotations:
              summary: the ledger refused 1 trades in 15 minutes; they wait as FAILED (exchangectl ledger trades --failed)
              runbook: docs/runbook/ledger.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_records_total{job="ledger-service", group="ledger-service", topic="user.events", result="dlq"}'
        values: '0 0 0 1 1'
      - series: 'kafka_consumer_records_total{job="ledger-service", group="ledger-service", topic="user.events", result="ok"}'
        values: '0 5 10 15 20'
    alert_rule_test:
      - eval_time: 2m
        alertname: EventsDeadLettered
        exp_alerts: []
      - eval_time: 4m
        alertname: EventsDeadLettered
        exp_alerts:
          - exp_labels: {severity: warning, job: ledger-service, group: ledger-service, topic: user.events}
            exp_annotations:
              summary: ledger-service parked events of user.events in the dead-letter topic
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="notification-service", group="notification-service", topic="auth.events", partition="0"}'
        values: '5000x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConsumerLagHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: ConsumerLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: notification-service, group: notification-service, topic: auth.events}
            exp_annotations:
              summary: notification-service is 5000 records behind on auth.events
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{job="api-gateway", method="GET", route="/v1/time", status="200"}'
        values: '0+100x15'
      - series: 'http_server_requests_total{job="api-gateway", method="GET", route="/v1/time", status="502"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HighHTTPErrorRate
        exp_alerts:
          - exp_labels: {severity: critical, job: api-gateway}
            exp_annotations:
              summary: "api-gateway: 9.091% of requests fail with 5xx"
              runbook: docs/runbook/observability.md

  - interval: 1m
    input_series:
      - series: 'wallet_scan_lag_blocks{job="wallet-service", network="ETH-SEPOLIA"}'
        values: '2x5 80x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: WalletScanLagging
        exp_alerts: []
      - eval_time: 17m
        alertname: WalletScanLagging
        exp_alerts:
          - exp_labels: {severity: warning, network: ETH-SEPOLIA}
            exp_annotations:
              summary: the deposit scanner of ETH-SEPOLIA is 80 blocks behind the chain; deposits are late
              runbook: docs/runbook/wallet.md

  - interval: 1m
    input_series:
      - series: 'wallet_chain_shortfall{job="wallet-service", network="ETH-SEPOLIA", asset="ETH"}'
        values: '-0.01x10 0.002x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: WalletChainShortfall
        exp_alerts: []
      - eval_time: 27m
        alertname: WalletChainShortfall
        exp_alerts:
          - exp_labels: {severity: critical, network: ETH-SEPOLIA, asset: ETH}
            exp_annotations:
              summary: the ETH-SEPOLIA wallets hold 0.002 ETH less than the ledger expects (invariant 4)
              runbook: docs/runbook/wallet.md
