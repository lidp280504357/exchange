# promtool test rules alerts_test.yml: the alerts that guard money and
# events fire when they should, and stay quiet otherwise.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ledger_reconcile_mismatches{job="ledger-service", check="JOURNAL_BALANCED"}'
        values: '0 0 2 2'
      - series: 'ledger_reconcile_mismatches{job="ledger-service", check="ACCOUNT_MATCHES_LINES"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerReconciliationMismatch
        exp_alerts: []
      - eval_time: 3m
        alertname: LedgerReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, job: ledger-service, check: JOURNAL_BALANCED}
            exp_annotations:
              summary: ledger reconciliation check JOURNAL_BALANCED found 2 mismatches
              runbook: docs/runbook/ledger.md

  - interval: 1m
    input_series:
      - series: 'ledger_trades_failed_total{job="ledger-service"}'
        values: '0 0 0 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: TradeSettlementRefused
        exp_alerts: []
      - eval_time: 4m
        alertname: TradeSettlementRefused
        exp_alerts:
          - exp_labels: {severity: critical, job: ledger-service}
            exp_annotations:
              summary: the ledger refused 1 trades in 15 minutes; they wait as FAILED (exchangectl ledger trades --failed)
              runbook: docs/runbook/ledger.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_records_total{job="ledger-service", group="ledger-service", topic="user.events", result="dlq"}'
        values: '0 0 0 1 1'
      - series: 'kafka_consumer_records_total{job="ledger-service", group="ledger-service", topic="user.events", result="ok"}'
        values: '0 5 10 15 20'
    alert_rule_test:
      - eval_time: 2m
        alertname: EventsDeadLettered
        exp_alerts: []
      - eval_time: 4m
        alertname: EventsDeadLettered
        exp_alerts:
          - exp_labels: {severity: warning, job: ledger-service, group: ledger-service, topic: user.events}
            exp_annotations:
              summary: ledger-service parked events of user.events in the dead-letter topic
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="notification-service", group="notification-service", topic="auth.events", partition="0"}'
        values: '5000x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConsumerLagHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: ConsumerLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: notification-service, group: notification-service, topic: auth.events}
            exp_annotations:
              summary: notification-service is 5000 records behind on auth.events
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{job="api-gateway", method="GET", route="/v1/time", status="200"}'
        values: '0+100x15'
      - series: 'http_server_requests_total{job="api-gateway", method="GET", route="/v1/time", status="502"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HighHTTPErrorRate
        exp_alerts:
          - exp_labels: {severity: critical, job: api-gateway}
            exp_annotations:
              summary: "api-gateway: 9.091% of requests fail with 5xx"
              runbook: docs/runbook/observability.md

  - interval: 1m
    input_series:
      - series: 'wallet_scan_lag_blocks{job="wallet-service", network="ETH-SEPOLIA"}'
        values: '2x5 80x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: WalletScanLagging
        exp_alerts: []
      - eval_time: 17m
        alertname: WalletScanLagging
        exp_alerts:
          - exp_labels: {severity: warning, network: ETH-SEPOLIA}
            exp_annotations:
              summary: the deposit scanner of ETH-SEPOLIA is 80 blocks behind the chain; deposits are late
              runbook: docs/runbook/wallet.md

  - interval: 1m
    input_series:
      - series: 'wallet_chain_shortfall{job="wallet-service", network="ETH-SEPOLIA", asset="ETH"}'
        values: '-0.01x10 0.002x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: WalletChainShortfall
        exp_alerts: []
      - eval_time: 27m
        alertname: WalletChainShortfall
        exp_alerts:
          - exp_labels: {severity: critical, network: ETH-SEPOLIA, asset: ETH}
            exp_annotations:
              summary: the ETH-SEPOLIA wallets hold 0.002 ETH less than the ledger expects (invariant 4)
              runbook: docs/runbook/wallet.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_shortfall{job="wallet-service", provider="UDUN", asset="USDT"}'
        values: '0x10 12.5x20'
      - series: 'wallet_custody_submitted_oldest_seconds{job="wallet-service", provider="UDUN"}'
        values: '86000 86400 86460'
    alert_rule_test:
      - eval_time: 20m
        alertname: CustodyShortfall
        exp_alerts: []
      - eval_time: 26m
        alertname: CustodyShortfall
        exp_alerts:
          - exp_labels: {severity: critical, provider: UDUN, asset: USDT}
            exp_annotations:
              summary: "the custodian UDUN and the platform's wallets hold 12.5 USDT less than the ledger expects (invariant 4)"
              runbook: docs/runbook/custody.md
      - eval_time: 1m
        alertname: CustodyWithdrawalStuck
        exp_alerts: []
      - eval_time: 2m
        alertname: CustodyWithdrawalStuck
        exp_alerts:
          - exp_labels: {severity: warning, provider: UDUN}
            exp_annotations:
              summary: "a withdrawal has been with the custodian UDUN for more than 24 hours without its outcome; check it in the custodian's console"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'market_contract_degraded{job="market-data-service", symbol="BTC-USDT-PERP"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: ContractDegraded
        exp_alerts: []
      - eval_time: 2m
        alertname: ContractDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: market-data-service, symbol: BTC-USDT-PERP}
            exp_annotations:
              summary: "BTC-USDT-PERP has had no mark price for 10 seconds (index sources missing): contract trading is reduce-only"
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'derivatives_reconcile_mismatches{job="derivatives-service", check="PNL_CLEARING_MATCHES_POSITIONS"}'
        values: '0 1 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: DerivativesReconciliationMismatch
        exp_alerts: []
      - eval_time: 1m
        alertname: DerivativesReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, job: derivatives-service, check: PNL_CLEARING_MATCHES_POSITIONS}
            exp_annotations:
              summary: derivatives reconciliation check PNL_CLEARING_MATCHES_POSITIONS found 1 mismatches
              runbook: docs/runbook/derivatives.md

  - interval: 1m
    input_series:
      - series: 'market_feed_halted_pairs{job="market-data-service"}'
        values: '0 0 2 2'
    alert_rule_test:
      - eval_time: 1m
        alertname: MarketFeedHalted
        exp_alerts: []
      - eval_time: 2m
        alertname: MarketFeedHalted
        exp_alerts:
          - exp_labels: {severity: critical, job: market-data-service}
            exp_annotations:
              summary: 2 pairs are halted because the reference feed has been lost for 5 minutes (market.halt_on_feed_loss)
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'market_house_inventory{job="market-maker", asset="BTC", backed="true"}'
        values: '0.2 0.1 -0.05 -0.05'
      - series: 'market_house_inventory{job="market-maker", asset="SOL", backed="false"}'
        values: '-5 -5 -5 -5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HouseInventoryNegative
        exp_alerts: []
      - eval_time: 2m
        alertname: HouseInventoryNegative
        exp_alerts:
          - exp_labels: {severity: critical, job: market-maker, asset: BTC}
            exp_annotations:
              summary: "HOUSE holds -0.05 BTC: it sold more of a withdrawable asset than it had"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_house_room{job="market-maker", symbol="BTC-USDT", side="sell"}'
        values: '0x15'
      - series: 'market_house_room{job="market-maker", symbol="BTC-USDT", side="buy"}'
        values: '2x15'
      - series: 'market_house_active{job="market-maker", symbol="BTC-USDT"}'
        values: '1x15'
      - series: 'market_house_room{job="market-maker", symbol="ETH-USDT", side="sell"}'
        values: '0x15'
      - series: 'market_house_active{job="market-maker", symbol="ETH-USDT"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: HouseRoomExhausted
        exp_alerts: []
      - eval_time: 12m
        alertname: HouseRoomExhausted
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker, symbol: BTC-USDT, side: sell}
            exp_annotations:
              summary: "HOUSE can no longer sell on BTC-USDT: its inventory or a cap is used up"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_house_contract_exposure_usdt{job="market-maker", instance="a"}'
        values: '150000x3 250000x10'
      - series: 'market_house_contract_equity_usdt{job="market-maker", instance="a"}'
        values: '20000x13'
      - series: 'market_house_contract_max_leverage{job="market-maker", instance="a"}'
        values: '10x13'
    alert_rule_test:
      - eval_time: 3m
        alertname: HouseContractOverLeveraged
        exp_alerts: []
      - eval_time: 10m
        alertname: HouseContractOverLeveraged
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker}
            exp_annotations:
              summary: "HOUSE's contract positions are worth 250000 USDT, more than HOUSE_CONTRACT_LEVERAGE times its contract equity: it only reduces them until the equity is topped up"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_house_contract_equity_usdt{job="market-maker", instance="a"}'
        values: '5000 -1200 -1200 -1200'
    alert_rule_test:
      - eval_time: 1m
        alertname: HouseContractEquityGone
        exp_alerts: []
      - eval_time: 3m
        alertname: HouseContractEquityGone
        exp_alerts:
          - exp_labels: {severity: critical, job: market-maker}
            exp_annotations:
              summary: "HOUSE's contract equity is -1200 USDT: it is never liquidated, so its losses now come out of the insurance fund"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_reference_book_age_seconds{job="market-data-service", symbol="SOL-USDT"}'
        values: '0.2 -1 -1 -1 -1 -1'
      - series: 'market_reference_book_age_seconds{job="market-data-service", symbol="BTC-USDT"}'
        values: '0.1 0.3 0.2 0.1 0.4 0.2'
    alert_rule_test:
      - eval_time: 2m
        alertname: ReferenceBookStale
        exp_alerts: []
      - eval_time: 4m
        alertname: ReferenceBookStale
        exp_alerts:
          - exp_labels: {severity: warning, job: market-data-service, symbol: SOL-USDT}
            exp_annotations:
              summary: "the reference book of SOL-USDT is out of sync or unchanged for 30 seconds; HOUSE offers nothing there"
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_callbacks_rejected_total{job="wallet-service", instance="w"}'
        values: '0x10 3x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: CustodyCallbacksRejected
        exp_alerts: []
      - eval_time: 12m
        alertname: CustodyCallbacksRejected
        exp_alerts:
          - exp_labels: {severity: warning, instance: w}
            exp_annotations:
              summary: "3 custodian callbacks were refused in 15 minutes (signature, age or form): forged, or UDUN_API_KEY differs from the custodian's and deposits go uncredited"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'market_sim_running{job="market-sim", instance="s"}'
        values: '1x10'
      - series: 'market_sim_references_fresh{job="market-sim", instance="s"}'
        values: '1 1 0x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: MarketSimReferencesStale
        exp_alerts: []
      - eval_time: 9m
        alertname: MarketSimReferencesStale
        exp_alerts:
          - exp_labels: {severity: warning, job: market-sim}
            exp_annotations:
              summary: "the simulated market has had no fresh BTC and ETH reference prices for 5 minutes: the platform coin's price no longer follows the market"
              runbook: docs/runbook/market-sim.md
