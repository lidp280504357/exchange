# promtool test rules alerts_test.yml: the alerts that guard money and
# events fire when they should, and stay quiet otherwise.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ledger_reconcile_mismatches{job="ledger-service", check="JOURNAL_BALANCED"}'
        values: '0 0 2 2'
      - series: 'ledger_reconcile_mismatches{job="ledger-service", check="ACCOUNT_MATCHES_LINES"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerReconciliationMismatch
        exp_alerts: []
      - eval_time: 3m
        alertname: LedgerReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, job: ledger-service, check: JOURNAL_BALANCED}
            exp_annotations:
              summary: ledger reconciliation check JOURNAL_BALANCED found 2 mismatches
              runbook: docs/runbook/ledger.md

  - interval: 1m
    input_series:
      - series: 'ledger_trades_failed_total{job="ledger-service"}'
        values: '0 0 0 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: TradeSettlementRefused
        exp_alerts: []
      - eval_time: 4m
        alertname: TradeSettlementRefused
        exp_alerts:
          - exp_labels: {severity: critical, job: ledger-service}
            exp_annotations:
              summary: the ledger refused 1 trades in 15 minutes; they wait as FAILED (exchangectl ledger trades --failed)
              runbook: docs/runbook/ledger.md

  - interval: 1m
    input_series:
      - series: 'trading_orders_pending_freeze_oldest_seconds{job="spot-trading-service"}'
        values: '0 0 400 460 520 580 640 700 760 820'
    alert_rule_test:
      - eval_time: 3m
        alertname: TradingOrdersPendingFreeze
        exp_alerts: []
      - eval_time: 8m
        alertname: TradingOrdersPendingFreeze
        exp_alerts:
          - exp_labels: {severity: warning, job: spot-trading-service}
            exp_annotations:
              summary: an order has waited 760 seconds for its freeze (ledger or margin-service unreachable?); recovery takes the 100 oldest each pass
              runbook: docs/runbook/trading.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_records_total{job="ledger-service", group="ledger-service", topic="user.events", result="dlq"}'
        values: '0 0 0 1 1'
      - series: 'kafka_consumer_records_total{job="ledger-service", group="ledger-service", topic="user.events", result="ok"}'
        values: '0 5 10 15 20'
    alert_rule_test:
      - eval_time: 2m
        alertname: EventsDeadLettered
        exp_alerts: []
      - eval_time: 4m
        alertname: EventsDeadLettered
        exp_alerts:
          - exp_labels: {severity: warning, job: ledger-service, group: ledger-service, topic: user.events}
            exp_annotations:
              summary: ledger-service parked events of user.events in the dead-letter topic
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_assigned_partitions{job="matching-engine", group="matching-engine"}'
        values: '6x5 0x10'
      - series: 'kafka_consumer_last_poll_timestamp_seconds{job="analytics-consumer", group="analytics-consumer"}'
        values: '0+60x5 300x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: KafkaConsumerUnassigned
        exp_alerts: []
      - eval_time: 12m
        alertname: KafkaConsumerUnassigned
        exp_alerts:
          - exp_labels: {severity: critical, job: matching-engine, group: matching-engine}
            exp_annotations:
              summary: "matching-engine has held no partitions for 5 minutes: it is out of its group and consumes nothing"
              runbook: docs/runbook/events.md
      - eval_time: 6m
        alertname: KafkaConsumerStalled
        exp_alerts: []
      - eval_time: 12m
        alertname: KafkaConsumerStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: analytics-consumer, group: analytics-consumer}
            exp_annotations:
              summary: "analytics-consumer has not polled for more than 3 minutes: its handler is stuck or failing"
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'kafka_consumer_lag{job="notification-service", group="notification-service", topic="auth.events", partition="0"}'
        values: '5000x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: ConsumerLagHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: ConsumerLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: notification-service, group: notification-service, topic: auth.events}
            exp_annotations:
              summary: notification-service is 5000 records behind on auth.events
              runbook: docs/runbook/events.md

  - interval: 1m
    input_series:
      - series: 'http_server_requests_total{job="api-gateway", method="GET", route="/v1/time", status="200"}'
        values: '0+100x15'
      - series: 'http_server_requests_total{job="api-gateway", method="GET", route="/v1/time", status="502"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HighHTTPErrorRate
        exp_alerts:
          - exp_labels: {severity: critical, job: api-gateway}
            exp_annotations:
              summary: "api-gateway: 9.091% of requests fail with 5xx"
              runbook: docs/runbook/observability.md

  - interval: 1m
    input_series:
      - series: 'wallet_scan_lag_blocks{job="wallet-service", network="ETH-SEPOLIA"}'
        values: '2x5 80x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: WalletScanLagging
        exp_alerts: []
      - eval_time: 17m
        alertname: WalletScanLagging
        exp_alerts:
          - exp_labels: {severity: warning, network: ETH-SEPOLIA}
            exp_annotations:
              summary: the deposit scanner of ETH-SEPOLIA is 80 blocks behind the chain; deposits are late
              runbook: docs/runbook/wallet.md

  - interval: 1m
    input_series:
      - series: 'wallet_chain_shortfall{job="wallet-service", network="ETH-SEPOLIA", asset="ETH"}'
        values: '-0.01x10 0.002x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: WalletChainShortfall
        exp_alerts: []
      - eval_time: 27m
        alertname: WalletChainShortfall
        exp_alerts:
          - exp_labels: {severity: critical, network: ETH-SEPOLIA, asset: ETH}
            exp_annotations:
              summary: the ETH-SEPOLIA wallets hold 0.002 ETH less than the ledger expects (invariant 4)
              runbook: docs/runbook/wallet.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_shortfall{job="wallet-service", provider="UDUN", asset="USDT"}'
        values: '0x10 12.5x20'
      - series: 'wallet_custody_submitted_oldest_seconds{job="wallet-service", provider="UDUN"}'
        values: '86000 86400 86460'
      - series: 'wallet_custody_not_compared{job="wallet-service", provider="UDUN", asset="BTC"}'
        values: '0x5 1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CustodyNotCompared
        exp_alerts: []
      - eval_time: 36m
        alertname: CustodyNotCompared
        exp_alerts:
          - exp_labels: {severity: warning, provider: UDUN, asset: BTC}
            exp_annotations:
              summary: "BTC with the custodian UDUN has not been compared with the ledger for 30 minutes (invariant 4 unknown)"
              runbook: docs/runbook/custody.md
      - eval_time: 20m
        alertname: CustodyShortfall
        exp_alerts: []
      - eval_time: 26m
        alertname: CustodyShortfall
        exp_alerts:
          - exp_labels: {severity: critical, provider: UDUN, asset: USDT}
            exp_annotations:
              summary: "the custodian UDUN and the platform's wallets hold 12.5 USDT less than the ledger expects (invariant 4)"
              runbook: docs/runbook/custody.md
      - eval_time: 1m
        alertname: CustodyWithdrawalStuck
        exp_alerts: []
      - eval_time: 2m
        alertname: CustodyWithdrawalStuck
        exp_alerts:
          - exp_labels: {severity: warning, provider: UDUN}
            exp_annotations:
              summary: "a withdrawal has been with the custodian UDUN for more than 24 hours without its outcome; check it in the custodian's console"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'market_contract_degraded{job="market-data-service", symbol="BTC-USDT-PERP"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: ContractDegraded
        exp_alerts: []
      - eval_time: 2m
        alertname: ContractDegraded
        exp_alerts:
          - exp_labels: {severity: critical, job: market-data-service, symbol: BTC-USDT-PERP}
            exp_annotations:
              summary: "BTC-USDT-PERP has had no mark price for 10 seconds (index sources missing): contract trading is reduce-only"
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'market_mark_source_degraded{job="market-data-service", symbol="BTC-USDT-PERP"}'
        values: '0 1 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: MarkPriceSourceDegraded
        exp_alerts: []
      - eval_time: 1m
        alertname: MarkPriceSourceDegraded
        exp_alerts:
          - exp_labels: {severity: warning, job: market-data-service, symbol: BTC-USDT-PERP}
            exp_annotations:
              summary: "BTC-USDT-PERP follows the reference market's mark price (market.reference_mark) but it has been stale for 10 seconds: the self-computed prices stand in, trading goes on"
              runbook: docs/runbook/market-data.md
      - eval_time: 2m
        alertname: MarkPriceSourceDegraded
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'margin_reconcile_mismatches{job="margin-service", check="LOANS_MATCH_LEDGER"}'
        values: '0 2 2'
    alert_rule_test:
      - eval_time: 0m
        alertname: MarginReconciliationMismatch
        exp_alerts: []
      - eval_time: 1m
        alertname: MarginReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, job: margin-service, check: LOANS_MATCH_LEDGER}
            exp_annotations:
              summary: "margin reconciliation check LOANS_MATCH_LEDGER found 2 mismatches (the ledger's debts against margin-service's loans and pools)"
              runbook: docs/runbook/margin.md

  - interval: 1m
    input_series:
      # Passes every second up to 3 minutes after the epoch, then none.
      - series: 'margin_monitor_last_pass_timestamp_seconds{job="margin-service"}'
        values: '60 120 180 180 180 180 180 180'
    alert_rule_test:
      - eval_time: 3m
        alertname: MarginMonitorStalled
        exp_alerts: []
      - eval_time: 6m
        alertname: MarginMonitorStalled
        exp_alerts:
          - exp_labels: {severity: critical, job: margin-service}
            exp_annotations:
              summary: "the margin level monitor has not finished a pass for over a minute: no warnings, no liquidations (ledger or database down?)"
              runbook: docs/runbook/margin.md

  - interval: 1m
    input_series:
      - series: 'margin_liquidations_shortfall{job="margin-service"}'
        values: '0 1 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: InsuranceFundShort
        exp_alerts: []
      - eval_time: 1m
        alertname: InsuranceFundShort
        exp_alerts:
          - exp_labels: {severity: critical, job: margin-service}
            exp_annotations:
              summary: "1 margin liquidations wait for the insurance fund to hold the asset they must cover; fund it (exchangectl ledger insurance-fund --asset ...), the next attempt goes on"
              runbook: docs/runbook/margin.md

  - interval: 5m
    input_series:
      - series: 'margin_liquidation_oldest_seconds{job="margin-service"}'
        values: '0 300 600 900'
    alert_rule_test:
      - eval_time: 10m
        alertname: MarginLiquidationStuck
        exp_alerts: []
      - eval_time: 15m
        alertname: MarginLiquidationStuck
        exp_alerts:
          - exp_labels: {severity: critical, job: margin-service}
            exp_annotations:
              summary: "a margin liquidation has run for 900 seconds (exchangectl margin liquidations shows the step it waits at and why)"
              runbook: docs/runbook/margin.md

  - interval: 1m
    input_series:
      # An account at its liquidation level with margin.liquidation off...
      - series: 'margin_liquidations_due_total{job="margin-service"}'
        values: '0 0 1 1 1'
      - series: 'margin_liquidations_total{job="margin-service", trigger="AUTO"}'
        values: '0 0 0 0 0'
      # ...and one the monitor liquidated.
      - series: 'margin_liquidations_due_total{job="margin-service-on"}'
        values: '0 0 1 1 1'
      - series: 'margin_liquidations_total{job="margin-service-on", trigger="AUTO"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: MarginLiquidationDue
        exp_alerts: []
      - eval_time: 3m
        alertname: MarginLiquidationDue
        exp_alerts:
          - exp_labels: {severity: warning, job: margin-service}
            exp_annotations:
              summary: "margin accounts reached their liquidation level in the last 10 minutes and were not liquidated (margin.liquidation off for their users): they stay WARNED; liquidate them by hand (an approved request in the console, or exchangectl margin liquidate) or watch them"
              runbook: docs/runbook/margin.md

  - interval: 10m
    input_series:
      # An hour finished at 60 s after the epoch; none after it.
      - series: 'margin_interest_last_run_timestamp_seconds{job="margin-service"}'
        values: '60x20'
      # A service that never finished an hour since it started.
      - series: 'margin_interest_last_run_timestamp_seconds{job="margin-service-new"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 1h
        alertname: MarginInterestStalled
        exp_alerts: []
      - eval_time: 2h10m
        alertname: MarginInterestStalled
        exp_alerts:
          - exp_labels: {severity: warning, job: margin-service}
            exp_annotations:
              summary: "no hour of margin interest finished for 2 hours (ledger down, or an asset with a borrow or repayment stuck PENDING?)"
              runbook: docs/runbook/margin.md

  - interval: 1m
    input_series:
      - series: 'derivatives_reconcile_mismatches{job="derivatives-service", check="PNL_CLEARING_MATCHES_POSITIONS"}'
        values: '0 1 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: DerivativesReconciliationMismatch
        exp_alerts: []
      - eval_time: 1m
        alertname: DerivativesReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, job: derivatives-service, check: PNL_CLEARING_MATCHES_POSITIONS}
            exp_annotations:
              summary: derivatives reconciliation check PNL_CLEARING_MATCHES_POSITIONS found 1 mismatches
              runbook: docs/runbook/derivatives.md

  - interval: 1m
    input_series:
      - series: 'market_feed_halted_pairs{job="market-data-service"}'
        values: '0 0 2 2'
    alert_rule_test:
      - eval_time: 1m
        alertname: MarketFeedHalted
        exp_alerts: []
      - eval_time: 2m
        alertname: MarketFeedHalted
        exp_alerts:
          - exp_labels: {severity: critical, job: market-data-service}
            exp_annotations:
              summary: 2 pairs are halted because the reference feed has been lost for 5 minutes (market.halt_on_feed_loss)
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'market_house_inventory{job="market-maker", asset="BTC", backed="true"}'
        values: '0.2 0.1 -0.05 -0.05'
      - series: 'market_house_inventory{job="market-maker", asset="SOL", backed="false"}'
        values: '-5 -5 -5 -5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HouseInventoryNegative
        exp_alerts: []
      - eval_time: 2m
        alertname: HouseInventoryNegative
        exp_alerts:
          - exp_labels: {severity: critical, job: market-maker, asset: BTC}
            exp_annotations:
              summary: "HOUSE holds -0.05 BTC: it sold more of a withdrawable asset than it had"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_house_room{job="market-maker", symbol="BTC-USDT", side="sell"}'
        values: '0x15'
      - series: 'market_house_room{job="market-maker", symbol="BTC-USDT", side="buy"}'
        values: '2x15'
      - series: 'market_house_active{job="market-maker", symbol="BTC-USDT"}'
        values: '1x15'
      - series: 'market_house_room{job="market-maker", symbol="ETH-USDT", side="sell"}'
        values: '0x15'
      - series: 'market_house_active{job="market-maker", symbol="ETH-USDT"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: HouseRoomExhausted
        exp_alerts: []
      - eval_time: 12m
        alertname: HouseRoomExhausted
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker, symbol: BTC-USDT, side: sell}
            exp_annotations:
              summary: "HOUSE can no longer sell on BTC-USDT: its inventory or a cap is used up"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_house_contract_exposure_usdt{job="market-maker", instance="a"}'
        values: '150000x3 250000x10'
      - series: 'market_house_contract_equity_usdt{job="market-maker", instance="a"}'
        values: '20000x13'
      - series: 'market_house_contract_max_leverage{job="market-maker", instance="a"}'
        values: '10x13'
    alert_rule_test:
      - eval_time: 3m
        alertname: HouseContractOverLeveraged
        exp_alerts: []
      - eval_time: 10m
        alertname: HouseContractOverLeveraged
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker}
            exp_annotations:
              summary: "HOUSE's contract positions are worth 250000 USDT, more than HOUSE_CONTRACT_LEVERAGE times its contract equity: it only reduces them until the equity is topped up"
              runbook: docs/runbook/market-maker.md

  # Not a number until market-maker has read HOUSE's contract account:
  # not "equity gone".
  - interval: 1m
    input_series:
      - series: 'market_house_contract_equity_usdt{job="market-maker", instance="b"}'
        values: 'NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 4m
        alertname: HouseContractEquityGone
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'market_house_contract_equity_usdt{job="market-maker", instance="a"}'
        values: '5000 -1200 -1200 -1200'
    alert_rule_test:
      - eval_time: 1m
        alertname: HouseContractEquityGone
        exp_alerts: []
      - eval_time: 3m
        alertname: HouseContractEquityGone
        exp_alerts:
          - exp_labels: {severity: critical, job: market-maker}
            exp_annotations:
              summary: "HOUSE's contract equity is -1200 USDT: it is never liquidated, so its losses now come out of the insurance fund"
              runbook: docs/runbook/market-maker.md

  # HOUSE's BTC account: 0.5 BTC (25,000 USD) may carry 250,000 USD of
  # positions at 10x; from 3m they are worth 260,000. Its ETH account is
  # fine throughout.
  - interval: 1m
    input_series:
      - series: 'market_house_coin_contract_exposure_usdt{job="market-maker", instance="a", asset="BTC"}'
        values: '200000x2 260000x10'
      - series: 'market_house_coin_contract_equity_usdt{job="market-maker", instance="a", asset="BTC"}'
        values: '25000x12'
      - series: 'market_house_coin_contract_exposure_usdt{job="market-maker", instance="a", asset="ETH"}'
        values: '1000x12'
      - series: 'market_house_coin_contract_equity_usdt{job="market-maker", instance="a", asset="ETH"}'
        values: '500000x12'
      - series: 'market_house_contract_max_leverage{job="market-maker", instance="a"}'
        values: '10x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: HouseCoinContractOverLeveraged
        exp_alerts: []
      - eval_time: 10m
        alertname: HouseCoinContractOverLeveraged
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker, asset: BTC}
            exp_annotations:
              summary: "HOUSE's positions settled in BTC are worth 260000 USD, more than HOUSE_CONTRACT_LEVERAGE times that account's equity: it only reduces them until the account is topped up"
              runbook: docs/runbook/market-maker.md

  # HOUSE's BTC positions with no USD value (no BTC price): unwatched,
  # alerted after 10 minutes; ETH's account is valued.
  - interval: 1m
    input_series:
      - series: 'market_house_coin_contract_exposure_usdt{job="market-maker", instance="a", asset="BTC"}'
        values: '30000x14'
      - series: 'market_house_coin_contract_exposure_usdt{job="market-maker", instance="a", asset="ETH"}'
        values: '1000x14'
      - series: 'market_house_coin_contract_equity_usdt{job="market-maker", instance="a", asset="ETH"}'
        values: '500000x14'
    alert_rule_test:
      - eval_time: 5m
        alertname: HouseCoinContractUnpriced
        exp_alerts: []
      - eval_time: 12m
        alertname: HouseCoinContractUnpriced
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker, asset: BTC}
            exp_annotations:
              summary: "HOUSE holds positions settled in BTC but the coin has no reference price: HOUSE offers nothing more there and its leverage there goes unwatched"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_house_coin_contract_equity{job="market-maker", instance="a", asset="BTC"}'
        values: '6 -0.01 -0.01 -0.01'
      - series: 'market_house_coin_contract_equity{job="market-maker", instance="a", asset="ETH"}'
        values: '200 200 200 200'
    alert_rule_test:
      - eval_time: 1m
        alertname: HouseCoinContractEquityGone
        exp_alerts: []
      - eval_time: 3m
        alertname: HouseCoinContractEquityGone
        exp_alerts:
          - exp_labels: {severity: critical, job: market-maker, asset: BTC}
            exp_annotations:
              summary: "HOUSE's BTC contract equity is -0.01 BTC: its losses there now come out of that coin's insurance fund"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_overlay_factor{job="market-data-service", instance="a", symbol="BTC-USDT"}'
        values: '1.16x14'
      - series: 'market_overlay_factor{job="market-data-service", instance="a", symbol="ETH-USDT"}'
        values: '0.9x5'
    alert_rule_test:
      - eval_time: 10m
        alertname: MarketOverlayStuck
        exp_alerts: []
      - eval_time: 12m
        alertname: MarketOverlayStuck
        exp_alerts:
          - exp_labels: {severity: critical, job: market-data-service, symbol: BTC-USDT}
            exp_annotations:
              summary: "BTC-USDT has carried a price event's factor of 1.16 for 11 minutes: end the event, or clear it on market-data (DELETE /internal/market/overlay/BTC-USDT)"
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'market_house_caps_signing_key{job="market-maker", instance="a", key="ops"}'
        values: '1x14'
      - series: 'market_house_caps_signing_key{job="market-maker", instance="a", key="admin"}'
        values: '0x14'
    alert_rule_test:
      - eval_time: 5m
        alertname: HouseCapsSigningKeyMissing
        exp_alerts: []
      - eval_time: 12m
        alertname: HouseCapsSigningKeyMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: market-maker, key: admin}
            exp_annotations:
              summary: "market-maker has no usable admin key for HOUSE's caps: changes signed with it are refused (house/caps.env, house/admin.env)"
              runbook: docs/runbook/market-maker.md

  - interval: 1m
    input_series:
      - series: 'market_reference_book_age_seconds{job="market-data-service", symbol="SOL-USDT"}'
        values: '0.2 -1 -1 -1 -1 -1'
      - series: 'market_reference_book_age_seconds{job="market-data-service", symbol="BTC-USDT"}'
        values: '0.1 0.3 0.2 0.1 0.4 0.2'
    alert_rule_test:
      - eval_time: 2m
        alertname: ReferenceBookStale
        exp_alerts: []
      - eval_time: 4m
        alertname: ReferenceBookStale
        exp_alerts:
          - exp_labels: {severity: warning, job: market-data-service, symbol: SOL-USDT}
            exp_annotations:
              summary: "the reference book of SOL-USDT is out of sync or unchanged for 30 seconds; HOUSE offers nothing there"
              runbook: docs/runbook/market-data.md

  # Binance's futures statistics: USDⓈ-M reads succeed until 10m, then
  # only fail; COIN-M reads keep succeeding beside a few failures.
  - interval: 1m
    input_series:
      - series: 'market_futures_stats_requests_total{job="market-data-service", instance="m", margin="usdm", metric="basis", result="ok"}'
        values: '0+10x10 100x40'
      - series: 'market_futures_stats_requests_total{job="market-data-service", instance="m", margin="usdm", metric="basis", result="error"}'
        values: '0x10 1+2x40'
      - series: 'market_futures_stats_requests_total{job="market-data-service", instance="m", margin="coinm", metric="basis", result="ok"}'
        values: '0+10x50'
      - series: 'market_futures_stats_requests_total{job="market-data-service", instance="m", margin="coinm", metric="basis", result="error"}'
        values: '0+1x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: FuturesDataFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: FuturesDataFailing
        exp_alerts:
          - exp_labels: {severity: warning, job: market-data-service, margin: usdm}
            exp_annotations:
              summary: "every read of Binance's futures statistics (usdm) has failed for 15 minutes (rate limit, network or Binance); the contracts' data panel stops updating"
              runbook: docs/runbook/market-data.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_callbacks_rejected_total{job="wallet-service", instance="w"}'
        values: '0x10 3x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: CustodyCallbacksRejected
        exp_alerts: []
      - eval_time: 12m
        alertname: CustodyCallbacksRejected
        exp_alerts:
          - exp_labels: {severity: warning, instance: w}
            exp_annotations:
              summary: "3 custodian callbacks were refused in 15 minutes (signature, age or form): forged, or UDUN_API_KEY differs from the custodian's and deposits go uncredited"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'market_sim_running{job="market-sim", instance="s"}'
        values: '1x10'
      - series: 'market_sim_references_fresh{job="market-sim", instance="s"}'
        values: '1 1 0x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: MarketSimReferencesStale
        exp_alerts: []
      - eval_time: 9m
        alertname: MarketSimReferencesStale
        exp_alerts:
          - exp_labels: {severity: warning, job: market-sim}
            exp_annotations:
              summary: "the simulated market has had no fresh BTC and ETH reference prices for 5 minutes: the platform coin's price no longer follows the market"
              runbook: docs/runbook/market-sim.md

  - interval: 1m
    input_series:
      - series: 'market_sim_band_deadlocks_total{job="market-sim", instance="s"}'
        values: '0x5 1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: MarketSimBandDeadlock
        exp_alerts: []
      - eval_time: 8m
        alertname: MarketSimBandDeadlock
        exp_alerts:
          - exp_labels: {severity: warning, job: market-sim}
            exp_annotations:
              summary: "the platform coin's market was locked (three minutes without a trade, or every level refused for the price band); market-sim rebased its price at the band's anchor"
              runbook: docs/runbook/market-sim.md

  - interval: 1m
    input_series:
      - series: 'market_sim_target_at_risk{job="market-sim", instance="s"}'
        values: '0 0 1 1 1'
      - series: 'market_sim_targets_total{job="market-sim", instance="s", result="MISSED"}'
        values: '0x5 1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: MarketSimTargetAtRisk
        exp_alerts: []
      - eval_time: 4m
        alertname: MarketSimTargetAtRisk
        exp_alerts:
          - exp_labels: {severity: warning, job: market-sim}
            exp_annotations:
              summary: "the platform coin's threshold target cannot reach its level in time even at the minute guard's pace (BTC and ETH pushed the price away): lengthen it or cancel it, or it ends MISSED"
              runbook: docs/runbook/market-sim.md
      - eval_time: 4m
        alertname: MarketSimTargetMissed
        exp_alerts: []
      - eval_time: 8m
        alertname: MarketSimTargetMissed
        exp_alerts:
          - exp_labels: {severity: warning, job: market-sim}
            exp_annotations:
              summary: "a threshold target of the platform coin ended MISSED: its window ended before the price crossed its level (a last push of the minute guard was made)"
              runbook: docs/runbook/market-sim.md

  - interval: 1m
    input_series:
      - series: 'market_sim_heartbeat_age_seconds{job="market-data-service", instance="d", symbol="ASTRA-USDT"}'
        values: '5 5 5 70 130'
    alert_rule_test:
      - eval_time: 2m
        alertname: MarketSimHeartbeatLost
        exp_alerts: []
      - eval_time: 3m
        alertname: MarketSimHeartbeatLost
        exp_alerts:
          - exp_labels: {severity: critical, symbol: ASTRA-USDT}
            exp_annotations:
              summary: "the simulated market of ASTRA-USDT has been silent for over a minute: market-sim is down or stuck; with sim.halt_on_loss the pair and its perpetual are halted until it is back"
              runbook: docs/runbook/market-sim.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_withdrawal_contradictions_total{job="wallet-service", instance="w"}'
        values: '0x4 1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: CustodyWithdrawalContradiction
        exp_alerts: []
      - eval_time: 7m
        alertname: CustodyWithdrawalContradiction
        exp_alerts:
          - exp_labels: {severity: critical, job: wallet-service}
            exp_annotations:
              summary: "the custodian contradicted a finished withdrawal (sent after it failed and was released, or failed after it was confirmed): money may have left twice or not at all; nothing was reversed, check the callback in the console's custody page"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_fees_held{job="wallet-service", provider="UDUN"}'
        values: '0 0 2 2 0'
      - series: 'wallet_custody_fees_unbooked{job="wallet-service", provider="UDUN"}'
        values: '1.2x70'
    alert_rule_test:
      - eval_time: 1m
        alertname: CustodyFeesHeld
        exp_alerts: []
      - eval_time: 2m
        alertname: CustodyFeesHeld
        exp_alerts:
          - exp_labels: {severity: warning, provider: UDUN}
            exp_annotations:
              summary: "2 of UDUN's fees wait for a person (beyond belief, or a token whose fee unit nobody confirmed): book or write off each (exchangectl wallet custody-fees)"
              runbook: docs/runbook/custody.md
      - eval_time: 4m
        alertname: CustodyFeesHeld
        exp_alerts: []
      - eval_time: 59m
        alertname: CustodyFeesUnbooked
        exp_alerts: []
      - eval_time: 61m
        alertname: CustodyFeesUnbooked
        exp_alerts:
          - exp_labels: {severity: warning, provider: UDUN}
            exp_annotations:
              summary: "1.2 of the custodian's fees wait for GAS_SUPPLY funds (exchangectl ledger gas-supply moves fee revenue there)"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_withdrawals_uncertain{job="wallet-service", provider="UDUN"}'
        values: '0 1 1 1 1 1 1 1 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: CustodyWithdrawalsUncertain
        exp_alerts: []
      - eval_time: 6m
        alertname: CustodyWithdrawalsUncertain
        exp_alerts:
          - exp_labels: {severity: critical, provider: UDUN}
            exp_annotations:
              summary: "1 withdrawals with UDUN have an unknown outcome (a retry refused, or 30 minutes of hand-overs unanswered); their funds stay frozen until its callback, or ask it and run exchangectl wallet custody-resolve"
              runbook: docs/runbook/custody.md
      - eval_time: 8m
        alertname: CustodyWithdrawalsUncertain
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'wallet_withdrawals_suspended{job="wallet-service", provider="UDUN", asset="USDT"}'
        values: '0 1 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: WalletWithdrawalsSuspended
        exp_alerts: []
      - eval_time: 1m
        alertname: WalletWithdrawalsSuspended
        exp_alerts:
          - exp_labels: {severity: critical, asset: USDT}
            exp_annotations:
              summary: "withdrawals of USDT are suspended (funds missing on two custody checks, or an operator): find the cause, then exchangectl wallet withdrawals-resume"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'wallet_deposits_unmatched_total{job="wallet-service", reason="unknown_address"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CustodyDepositUnmatched
        exp_alerts: []
      - eval_time: 3m
        alertname: CustodyDepositUnmatched
        exp_alerts:
          - exp_labels: {severity: warning, reason: unknown_address}
            exp_annotations:
              summary: "a custodian's deposit no user's address takes (unknown_address): unknown_address is booked to UNCLAIMED_DEPOSIT as a deposit of nobody, credit it to its user or dismiss it in the console; unknown_coin is not booked, find the coin's network"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'wallet_custody_deposits_unbookable{job="wallet-service", provider="UDUN"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CustodyDepositUnbookable
        exp_alerts: []
      - eval_time: 31m
        alertname: CustodyDepositUnbookable
        exp_alerts:
          - exp_labels: {severity: warning, provider: UDUN}
            exp_annotations:
              summary: "UDUN: a deposit of nobody the ledger will not book to UNCLAIMED_DEPOSIT; it is tried again hourly at most, the error is in wallet-service's log (deposit ... of nobody)"
              runbook: docs/runbook/custody.md

  - interval: 1m
    input_series:
      - series: 'wallet_withdrawals_suspended_waiting{job="wallet-service", provider="UDUN", asset="USDT"}'
        values: '2x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: WalletWithdrawalsWaitingOnSuspension
        exp_alerts: []
      - eval_time: 31m
        alertname: WalletWithdrawalsWaitingOnSuspension
        exp_alerts:
          - exp_labels: {severity: warning, asset: USDT}
            exp_annotations:
              summary: "2 approved withdrawals of USDT have waited 30 minutes on its suspension: users are waiting; lift it once the cause is found, or reject them"
              runbook: docs/runbook/custody.md
