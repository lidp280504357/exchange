# Prometheus alerting rules for the metrics the services export on their
# ops ports (requirements §12.2; docs/runbook/observability.md). Nothing
# scrapes them yet: Grafana Cloud is deferred. prometheus.yml next to this
# file names one scrape job per service, so "job" identifies the service.
# Checked in CI with promtool (syntax and alerts_test.yml).
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} does not answer on its ops port"
          runbook: docs/runbook/server-deploy.md

      - alert: HighHTTPErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_total{status=~"5.."}[5m]))
            / sum by (job) (rate(http_server_requests_total[5m])) > 0.02
          and sum by (job) (rate(http_server_requests_total[5m])) > 0.1
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of requests fail with 5xx"
          runbook: docs/runbook/observability.md

      - alert: HighHTTPLatency
        expr: |
          histogram_quantile(0.99, sum by (job, le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: p99 latency {{ $value | humanizeDuration }}"

      - alert: GRPCServerErrors
        expr: |
          sum by (job, method) (rate(grpc_server_handled_total{code=~"Unknown|Internal|Unavailable|DeadlineExceeded|DataLoss"}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} {{ $labels.method }} returns server errors"

  - name: events
    rules:
      - alert: EventsDeadLettered
        expr: sum by (job, group, topic) (increase(kafka_consumer_records_total{result="dlq"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.group }} parked events of {{ $labels.topic }} in the dead-letter topic"
          runbook: docs/runbook/events.md

      - alert: ConsumerLagHigh
        expr: max by (job, group, topic) (kafka_consumer_lag) > 1000
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.group }} is {{ $value }} records behind on {{ $labels.topic }}"
          runbook: docs/runbook/events.md

      # A batch consumer put out of its group and not let back in holds no
      # partitions: lag may not show it (the group's offsets stand still
      # while nothing new arrives), the service is not ready.
      - alert: KafkaConsumerUnassigned
        expr: max by (job, group) (kafka_consumer_assigned_partitions) == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.group }} has held no partitions for 5 minutes: it is out of its group and consumes nothing"
          runbook: docs/runbook/events.md

      # A batch consumer comes back from a poll at least every 30 seconds;
      # it stops when its handler keeps failing on the sink.
      - alert: KafkaConsumerStalled
        expr: time() - max by (job, group) (kafka_consumer_last_poll_timestamp_seconds) > 180
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.group }} has not polled for more than 3 minutes: its handler is stuck or failing"
          runbook: docs/runbook/events.md

      - alert: OutboxBacklog
        expr: max by (job) (outbox_pending) > 100
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }}: {{ $value }} events wait in the outbox"
          runbook: docs/runbook/events.md

      - alert: OutboxPublishFailing
        expr: sum by (job) (rate(outbox_publish_failures_total[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} cannot publish its outbox (Redpanda down?)"
          runbook: docs/runbook/events.md

  - name: consistency
    rules:
      - alert: LedgerReconciliationMismatch
        expr: sum by (job, check) (ledger_reconcile_mismatches) > 0
        labels: {severity: critical}
        annotations:
          summary: "ledger reconciliation check {{ $labels.check }} found {{ $value }} mismatches"
          runbook: docs/runbook/ledger.md

      - alert: TradeSettlementRefused
        expr: sum by (job) (increase(ledger_trades_failed_total[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "the ledger refused {{ $value }} trades in 15 minutes; they wait as FAILED (exchangectl ledger trades --failed)"
          runbook: docs/runbook/ledger.md

      - alert: DerivativesReconciliationMismatch
        expr: sum by (job, check) (derivatives_reconcile_mismatches) > 0
        labels: {severity: critical}
        annotations:
          summary: "derivatives reconciliation check {{ $labels.check }} found {{ $value }} mismatches"
          runbook: docs/runbook/derivatives.md

      - alert: DerivativesSettlementParked
        expr: sum by (job) (increase(derivatives_settlements_parked_total[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "the ledger refused {{ $value }} contract settlements in 15 minutes (insurance fund short?); they wait in pending_settlements"
          runbook: docs/runbook/derivatives.md

      - alert: LedgerReconciliationStopped
        expr: increase(ledger_reconcile_runs_total[3h]) == 0
        labels: {severity: warning}
        annotations:
          summary: "no ledger reconciliation completed for 3 hours"
          runbook: docs/runbook/ledger.md

      - alert: MarketReferenceStale
        expr: max by (job, symbol) (market_reference_age_seconds) > 30
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "the reference price of {{ $labels.symbol }} is {{ $value }} seconds old; index and mark prices go without it"
          runbook: docs/runbook/market-data.md

      - alert: MarketFeedHalted
        expr: max by (job) (market_feed_halted_pairs) > 0
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} pairs are halted because the reference feed has been lost for 5 minutes (market.halt_on_feed_loss)"
          runbook: docs/runbook/market-data.md

      # HOUSE's virtual liquidity (ADR-0013, ADR-0015).
      - alert: ReferenceBookStale
        expr: max by (job, symbol) (market_reference_book_age_seconds) > 30 or min by (job, symbol) (market_reference_book_age_seconds) < 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "the reference book of {{ $labels.symbol }} is out of sync or unchanged for 30 seconds; HOUSE offers nothing there"
          runbook: docs/runbook/market-data.md

      - alert: HouseInventoryNegative
        expr: min by (job, asset) (market_house_inventory{backed="true"}) < 0
        labels: {severity: critical}
        annotations:
          summary: "HOUSE holds {{ $value }} {{ $labels.asset }}: it sold more of a withdrawable asset than it had"
          runbook: docs/runbook/market-maker.md

      - alert: HouseRoomExhausted
        expr: max by (job, symbol, side) (market_house_room) == 0 and on (job, symbol) max by (job, symbol) (market_house_active) == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "HOUSE can no longer {{ $labels.side }} on {{ $labels.symbol }}: its inventory or a cap is used up"
          runbook: docs/runbook/market-maker.md

      - alert: HouseContractOverLeveraged
        expr: max by (job) (market_house_contract_exposure_usdt) > max by (job) (market_house_contract_equity_usdt * market_house_contract_max_leverage)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "HOUSE's contract positions are worth {{ $value }} USDT, more than HOUSE_CONTRACT_LEVERAGE times its contract equity: it only reduces them until the equity is topped up"
          runbook: docs/runbook/market-maker.md

      - alert: HouseContractEquityGone
        expr: max by (job) (market_house_contract_equity_usdt) <= 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "HOUSE's contract equity is {{ $value }} USDT: it is never liquidated, so its losses now come out of the insurance fund"
          runbook: docs/runbook/market-maker.md

      - alert: MarketSimFailing
        expr: sum by (job) (increase(market_sim_errors_total[10m])) > 100
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} of the simulated market's requests failed in 10 minutes: the platform coin's book may thin out"
          runbook: docs/runbook/market-sim.md

      - alert: MarketSimReferencesStale
        expr: max by (job) (market_sim_running) == 1 and max by (job) (market_sim_references_fresh) == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "the simulated market has had no fresh BTC and ETH reference prices for 5 minutes: the platform coin's price no longer follows the market"
          runbook: docs/runbook/market-sim.md

      - alert: CustodyWithdrawalContradiction
        expr: sum by (job) (increase(wallet_custody_withdrawal_contradictions_total[15m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "the custodian contradicted a finished withdrawal (sent after it failed and was released, or failed after it was confirmed): money may have left twice or not at all; nothing was reversed, check the callback in the console's custody page"
          runbook: docs/runbook/custody.md

      - alert: MarketSimHeartbeatLost
        expr: max by (symbol) (market_sim_heartbeat_age_seconds) > 60
        labels: {severity: critical}
        annotations:
          summary: "the simulated market of {{ $labels.symbol }} has been silent for over a minute: market-sim is down or stuck; with sim.halt_on_loss the pair and its perpetual are halted until it is back"
          runbook: docs/runbook/market-sim.md

      - alert: MarketSimBandDeadlock
        expr: sum by (job) (increase(market_sim_band_deadlocks_total[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "the platform coin's market was locked (three minutes without a trade, or every level refused for the price band); market-sim rebased its price at the band's anchor"
          runbook: docs/runbook/market-sim.md

      - alert: HousePublishFailing
        expr: sum by (job) (increase(market_house_publish_failures_total[5m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} rounds of HOUSE's reference books could not be published in 5 minutes; the engines drop books older than 5 seconds"
          runbook: docs/runbook/market-maker.md

      - alert: ContractDegraded
        expr: max by (job, symbol) (market_contract_degraded) == 1
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.symbol }} has had no mark price for 10 seconds (index sources missing): contract trading is reduce-only"
          runbook: docs/runbook/market-data.md

      - alert: ContractIndexSourceMissing
        expr: min by (job, symbol) (market_index_sources) < 1 and max by (job, symbol) (market_contract_degraded) == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.symbol }} has no usable index source; it degrades if none comes back"
          runbook: docs/runbook/market-data.md

      - alert: WalletScanLagging
        expr: max by (network) (wallet_scan_lag_blocks) > 50
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "the deposit scanner of {{ $labels.network }} is {{ $value }} blocks behind the chain; deposits are late"
          runbook: docs/runbook/wallet.md

      - alert: WalletScanStalled
        expr: time() - max by (network) (wallet_scan_last_success_timestamp_seconds) > 600
        labels: {severity: warning}
        annotations:
          summary: "no deposit scan of {{ $labels.network }} completed for 10 minutes (RPC endpoint, lease or database)"
          runbook: docs/runbook/wallet.md

      - alert: WalletDepositsHeld
        expr: max by (network) (wallet_deposits_held) > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} confirmed deposits on {{ $labels.network }} wait because their asset takes no deposits"
          runbook: docs/runbook/wallet.md

      - alert: WalletChainShortfall
        expr: max by (network, asset) (wallet_chain_shortfall) > 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "the {{ $labels.network }} wallets hold {{ $value }} {{ $labels.asset }} less than the ledger expects (invariant 4)"
          runbook: docs/runbook/wallet.md

      - alert: WalletHotWalletLow
        expr: min by (network, asset) (wallet_hot_wallet_balance) < 0.005
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "the {{ $labels.network }} hot wallet holds only {{ $value }} {{ $labels.asset }}; sweep deposits or fund it"
          runbook: docs/runbook/wallet.md

      - alert: WalletHotWalletHigh
        expr: max by (network, asset) (wallet_hot_wallet_balance) > 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "the {{ $labels.network }} hot wallet holds {{ $value }} {{ $labels.asset }}; move the surplus to cold storage"
          runbook: docs/runbook/wallet.md

      - alert: WalletChainFeesUnbooked
        expr: max by (network) (wallet_chain_fees_unbooked) > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} of gas paid on {{ $labels.network }} waits for GAS_SUPPLY funds (exchangectl wallet fund)"
          runbook: docs/runbook/wallet.md

      - alert: WalletWithdrawalsWaiting
        expr: max by (network) (wallet_withdrawals_waiting) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} approved withdrawals on {{ $labels.network }} wait for the hot wallet or for fees within the cap"
          runbook: docs/runbook/wallet.md

      - alert: CustodyShortfall
        expr: max by (provider, asset) (wallet_custody_shortfall) > 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "the custodian {{ $labels.provider }} and the platform's wallets hold {{ $value }} {{ $labels.asset }} less than the ledger expects (invariant 4)"
          runbook: docs/runbook/custody.md

      # An asset left out of the check has no shortfall to alert on: the
      # custodian reported no balance of it, or one in the coin's smallest
      # unit. Left so for half an hour, nobody knows whether funds are
      # missing.
      - alert: CustodyNotCompared
        expr: max by (provider, asset) (wallet_custody_not_compared) == 1
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.asset }} with the custodian {{ $labels.provider }} has not been compared with the ledger for 30 minutes (invariant 4 unknown)"
          runbook: docs/runbook/custody.md

      - alert: CustodyUnreachable
        expr: max by (provider) (wallet_custody_up) == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "the custodian {{ $labels.provider }} does not answer: no deposit addresses, withdrawals wait"
          runbook: docs/runbook/custody.md

      - alert: CustodyWithdrawalStuck
        expr: max by (provider) (wallet_custody_submitted_oldest_seconds) > 86400
        labels: {severity: warning}
        annotations:
          summary: "a withdrawal has been with the custodian {{ $labels.provider }} for more than 24 hours without its outcome; check it in the custodian's console"
          runbook: docs/runbook/custody.md

      - alert: CustodyCallbacksNeedAttention
        expr: max by (provider) (wallet_custody_callbacks_attention) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} callbacks of {{ $labels.provider }} failed or match nothing; look at them in the admin console (custodian page)"
          runbook: docs/runbook/custody.md

      - alert: CustodyWithdrawalsUncertain
        expr: max by (provider) (wallet_custody_withdrawals_uncertain) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} withdrawals with {{ $labels.provider }} have an unknown outcome (a retry refused, or 30 minutes of hand-overs unanswered); their funds stay frozen until its callback, or ask it and run exchangectl wallet custody-resolve"
          runbook: docs/runbook/custody.md

      - alert: WalletWithdrawalsSuspended
        expr: max by (asset) (wallet_withdrawals_suspended) > 0
        labels: {severity: critical}
        annotations:
          summary: "withdrawals of {{ $labels.asset }} are suspended (funds missing on two custody checks, or an operator): find the cause, then exchangectl wallet withdrawals-resume"
          runbook: docs/runbook/custody.md

      - alert: CustodyFeesHeld
        expr: max by (provider) (wallet_custody_fees_held) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} of {{ $labels.provider }}'s fees wait for a person (beyond belief, or a token whose fee unit nobody confirmed): book or write off each (exchangectl wallet custody-fees)"
          runbook: docs/runbook/custody.md

      - alert: CustodyCallbacksRejected
        expr: max by (instance) (increase(wallet_custody_callbacks_rejected_total[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} custodian callbacks were refused in 15 minutes (signature, age or form): forged, or UDUN_API_KEY differs from the custodian's and deposits go uncredited"
          runbook: docs/runbook/custody.md

      - alert: CustodyDepositDiscrepancy
        expr: max by (instance) (increase(wallet_custody_deposit_discrepancies_total[1h])) > 0
        labels: {severity: critical}
        annotations:
          summary: "the custodian's callback disagrees with a deposit an administrator backfilled (address, asset or amount); nothing was booked again: check it in the admin console (deposits needing a decision)"
          runbook: docs/runbook/custody.md

      - alert: CustodyFeesUnbooked
        expr: max by (provider) (wallet_custody_fees_unbooked) > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} of the custodian's fees wait for GAS_SUPPLY funds (exchangectl ledger gas-supply moves fee revenue there)"
          runbook: docs/runbook/custody.md

      - alert: AnalyticsMissingEvents
        expr: max by (topic) (analytics_reconcile_missing) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} events of {{ $labels.topic }} are in the outbox but not in ClickHouse"

      - alert: AnalyticsReconciliationStale
        expr: time() - analytics_reconcile_last_success_timestamp_seconds > 7200
        labels: {severity: warning}
        annotations:
          summary: "the ClickHouse reconciliation has not succeeded for 2 hours"

      - alert: FeatureFlagsStale
        expr: time() - flags_last_refresh_timestamp_seconds > 300
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} has not refreshed its feature flags for 5 minutes"
          runbook: docs/runbook/feature-flags.md

  - name: identity-and-notifications
    rules:
      - alert: SMSVolumeNearLimit
        # 75% of SMS_HOURLY_LIMIT (200): sending pauses at the limit.
        expr: sum(increase(auth_otp_requests_total{channel="SMS", outcome="queued"}[1h])) > 150
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} SMS codes in the last hour"
          runbook: docs/runbook/otp.md

      - alert: OTPCaptchaRejections
        expr: sum(increase(auth_otp_requests_total{outcome="captcha_rejected"}[10m])) > 50
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} OTP requests failed human verification in 10 minutes (abuse?)"
          runbook: docs/runbook/otp.md

      - alert: OTPVerificationFailures
        expr: |
          sum(rate(auth_otp_verifications_total{outcome!="verified"}[15m]))
            / sum(rate(auth_otp_verifications_total[15m])) > 0.5
          and sum(increase(auth_otp_verifications_total[15m])) > 20
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "most OTP checks fail ({{ $value | humanizePercentage }}): guessing, or codes not arriving"
          runbook: docs/runbook/otp.md

      - alert: NotificationProviderCircuitOpen
        expr: max by (provider) (notify_provider_circuit_open) == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "notification provider {{ $labels.provider }} is switched off after repeated failures"
          runbook: docs/runbook/otp.md

      - alert: NotificationsFailed
        expr: sum by (channel) (increase(notify_deliveries_failed_total[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} {{ $labels.channel }} notifications failed on every provider"
          runbook: docs/runbook/otp.md
