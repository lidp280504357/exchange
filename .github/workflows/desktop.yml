# The desktop app (desktop/, Tauri 2): run by hand from the Actions tab.
# Builds the installers of each platform from the current H5 and uploads
# them as artifacts. Unsigned: macOS asks to confirm the first start (right
# click, Open) and Windows SmartScreen warns. macOS minutes count ten times
# on private repositories.
name: desktop

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (JSON list: macos-latest, windows-latest, ubuntu-22.04)"
        default: '["macos-latest", "windows-latest", "ubuntu-22.04"]'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
