name: image

# The application image, built here and pushed to GHCR so that the test
# server pulls it rather than building it: building there, beside two
# dozen running services, ran its 7.8 GB short (2026-10-02).
# deploy/server-update.sh pulls ghcr.io/<owner>/exchange-app:<commit> when
# the server is logged in to ghcr.io (docs/runbook/server-deploy.md) and
# builds locally otherwise, or when this build has not finished in time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}

jobs:
  app:
    name: exchange-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          echo "version=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/exchange-app" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The full commit names the image (the server asks for git rev-parse
      # HEAD); the short one is the version the services report. The
      # runner has the memory to link four binaries at a time.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GO_BUILD_P=4
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keep the last five versions, enough to roll back: storage of a
      # private package counts against the free tier's quota. Needs the
      # repository to have the package's Admin role (it does when this
      # workflow created it).
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: exchange-app
          package-type: container
          min-versions-to-keep: 5
