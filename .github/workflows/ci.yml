name: ci

# A push of documents alone (docs/, the top-level Markdown) runs nothing:
# the deploy chain takes the commit's code from the last run.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: read

# On main every push runs to its end: three sessions push every few
# minutes, and cancelling left main without a green run for an hour (review
# tick 2026-10-06 05:21, B89). A pull request's newer push replaces its
# older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (fmt, vet, lint, test, vuln)
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_DSN: postgres://exchange:exchange@localhost:5432/exchange_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_KAFKA_BROKERS: localhost:9092
      TEST_SCHEMA_REGISTRY_URL: http://localhost:8081
      TEST_CLICKHOUSE_ADDR: localhost:9000
      TEST_CLICKHOUSE_USER: exchange
      TEST_CLICKHOUSE_PASSWORD: exchange
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # buf breaking compares with the previous commit
      # The newest patch release, as the app images build with golang:1.27-alpine:
      # go.mod's "go 1.27.0" is the oldest Go that builds the module, and govulncheck
      # judges the standard library of the Go that runs it.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      # 集成测试的依赖（internal/platform/testenv）：拉取镜像会重试，失败原因写进注解
      - name: start the test infrastructure
        run: bash scripts/ci/services.sh
      - name: buf lint and generated code
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf lint
          buf generate
          git diff --exit-code -- api/gen || { echo "::error::run 'task proto' and commit api/gen"; exit 1; }
      - name: buf breaking
        # Pull requests are compared with their base, pushes with the previous commit.
        run: |
          against=".git#ref=HEAD~1"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            against=".git#ref=FETCH_HEAD"
          fi
          buf breaking --against "$against"
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          if [ -n "$(gofumpt -l .)" ]; then gofumpt -l .; echo "::error::run 'task fmt'"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: module path
        run: bash scripts/ci/module-path.sh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # Unlike `task ci`, this runs the integration tests too (the TEST_* variables above).
      - name: go test
        id: test
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: govulncheck
        id: vuln
        run: |
          set -o pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee "$RUNNER_TEMP/govulncheck.log"
      # The logs need a signed-in user with access; the annotations of a public
      # repository do not. Name what failed there.
      - name: name the failures
        if: failure() && (steps.test.outcome == 'failure' || steps.vuln.outcome == 'failure')
        run: |
          note() { # TITLE FILE: the file's lines as one error annotation
            [ -s "$2" ] || return 0
            echo "::error title=$1::$(head -c 4000 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          }
          if [ -f "$RUNNER_TEMP/go-test.log" ]; then
            # Failed tests and packages, their messages, races, panics and compile errors.
            grep -E -e '^(--- FAIL|FAIL|panic:)' -e '_test\.go:[0-9]+:' -e 'DATA RACE|race detected' \
              -e '^[^ ]+\.go:[0-9]+:[0-9]+: ' "$RUNNER_TEMP/go-test.log" | head -60 > "$RUNNER_TEMP/test-failures.txt" || true
            note "go test" "$RUNNER_TEMP/test-failures.txt"
          fi
          if [ -f "$RUNNER_TEMP/govulncheck.log" ]; then
            awk '/^Vulnerability #/ { print; getline; print; next } /Found in:|Fixed in:/' "$RUNNER_TEMP/govulncheck.log" > "$RUNNER_TEMP/vulns.txt"
            note "govulncheck" "$RUNNER_TEMP/vulns.txt"
          fi

  web:
    name: web (workspace types, lint, tests, build, Storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the contracts
        run: pnpm types && git diff --exit-code -- packages/core/src/api/gen admin/src/api/gen
      - name: no raw colours outside the tokens
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @exchange/ui build-storybook

  deploy-config:
    name: deploy config (shell, compose, nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shell syntax
        run: |
          bash -n deploy/server-update.sh deploy/redpanda/topics.sh deploy/compose/nginx/update-cloudflare-ips.sh
          for f in scripts/*.sh scripts/ci/*.sh scripts/e2e/*.sh scripts/e2e/lib/*.sh scripts/fault/*.sh; do bash -n "$f"; done
      - name: compose config
        run: |
          # The server-only env files of the signer and the admin console (never in the repository).
          mkdir -p deploy/compose/signer deploy/compose/admin
          touch deploy/compose/signer/signer.env deploy/compose/admin/admin.env
          docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example config --quiet
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml \
            --env-file deploy/compose/.env.example config --quiet
      - name: alert rules (promtool)
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/observability:/rules:ro" -w /rules --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0 "$@"; }
          promtool check config prometheus.yml
          promtool test rules alerts_test.yml
      # Base images from Google's mirror of Docker Hub, AWS ECR Public (the
      # Dockerfile's default) when the mirror fails: either throttles at times.
      - name: app image build
        run: |
          build() { docker build -f deploy/docker/Dockerfile --build-arg VERSION=${GITHUB_SHA::7} "$@" -t exchange-app:ci .; }
          build --build-arg GO_IMAGE=mirror.gcr.io/library/golang:1.27-alpine --build-arg RUNTIME_IMAGE=mirror.gcr.io/library/alpine:3.22 ||
            { echo "::warning title=app image build::mirror.gcr.io failed, building from public.ecr.aws"; build; }
      - name: nginx config test
        run: |
          tmp=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=astras.vip -keyout "$tmp/origin.key" -out "$tmp/origin.pem" >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/deploy/compose/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/compose/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/deploy/compose/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$tmp:/etc/nginx/ssl:ro" \
            nginx:1.29-alpine nginx -t
