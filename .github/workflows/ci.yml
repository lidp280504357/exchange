name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (fmt, vet, lint, test, vuln)
    runs-on: ubuntu-latest
    # 集成测试依赖（internal/platform/testenv）；镜像取自 ECR Public 避免 Docker Hub 限额
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: public.ecr.aws/docker/library/redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_USER: exchange
          CLICKHOUSE_PASSWORD: exchange
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_POSTGRES_DSN: postgres://exchange:exchange@localhost:5432/exchange_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_KAFKA_BROKERS: localhost:9092
      TEST_SCHEMA_REGISTRY_URL: http://localhost:8081
      TEST_CLICKHOUSE_ADDR: localhost:9000
      TEST_CLICKHOUSE_USER: exchange
      TEST_CLICKHOUSE_PASSWORD: exchange
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # buf breaking compares with the previous commit
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Redpanda 需要启动参数，GitHub services 不支持，改用 docker run
      - name: start redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 8081:8081 \
            docker.redpanda.com/redpandadata/redpanda:v24.3.16 redpanda start \
            --mode dev-container --smp 1 --overprovisioned \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092 \
            --schema-registry-addr 0.0.0.0:8081
          for i in $(seq 60); do docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && exit 0; sleep 2; done
          docker logs redpanda; exit 1
      - name: buf lint and generated code
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf lint
          buf generate
          git diff --exit-code -- api/gen || { echo "::error::run 'task proto' and commit api/gen"; exit 1; }
      - name: buf breaking
        # Pull requests are compared with their base, pushes with the previous commit.
        run: |
          against=".git#ref=HEAD~1"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            against=".git#ref=FETCH_HEAD"
          fi
          buf breaking --against "$against"
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          if [ -n "$(gofumpt -l .)" ]; then gofumpt -l .; echo "::error::run 'task fmt'"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: go test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: web (H5 types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/h5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/h5/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the OpenAPI contracts
        run: pnpm api:types && git diff --exit-code -- src/api/gen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  web-admin:
    name: web (admin console types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types match the admin contract
        run: pnpm api:types && git diff --exit-code -- src/api/gen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy-config:
    name: deploy config (shell, compose, nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: |
          bash -n deploy/server-update.sh deploy/redpanda/topics.sh deploy/compose/nginx/update-cloudflare-ips.sh
          for f in scripts/*.sh scripts/e2e/*.sh scripts/e2e/lib/*.sh scripts/fault/*.sh; do bash -n "$f"; done
      - name: compose config
        run: |
          # The server-only env files of the signer and the admin console (never in the repository).
          mkdir -p deploy/compose/signer deploy/compose/admin
          touch deploy/compose/signer/signer.env deploy/compose/admin/admin.env
          docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example config --quiet
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml \
            --env-file deploy/compose/.env.example config --quiet
      - name: alert rules (promtool)
        run: |
          promtool() { docker run --rm -v "$PWD/deploy/observability:/rules:ro" -w /rules --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0 "$@"; }
          promtool check config prometheus.yml
          promtool test rules alerts_test.yml
      - name: app image build
        run: docker build -f deploy/docker/Dockerfile --build-arg VERSION=${GITHUB_SHA::7} -t exchange-app:ci .
      - name: nginx config test
        run: |
          tmp=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=astras.vip -keyout "$tmp/origin.key" -out "$tmp/origin.pem" >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/deploy/compose/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/compose/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/deploy/compose/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$tmp:/etc/nginx/ssl:ro" \
            nginx:1.29-alpine nginx -t
