name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (fmt, vet, lint, test, vuln)
    runs-on: ubuntu-latest
    # 集成测试依赖（internal/platform/testenv）；镜像取自 ECR Public 避免 Docker Hub 限额
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exchange -d exchange_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: public.ecr.aws/docker/library/redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://exchange:exchange@localhost:5432/exchange_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          if [ -n "$(gofumpt -l .)" ]; then gofumpt -l .; echo "::error::run 'task fmt'"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: go test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  deploy-config:
    name: deploy config (shell, compose, nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: bash -n deploy/server-update.sh deploy/redpanda/topics.sh deploy/compose/nginx/update-cloudflare-ips.sh
      - name: compose config
        run: |
          docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env.example config --quiet
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml \
            --env-file deploy/compose/.env.example config --quiet
      - name: app image build
        run: docker build -f deploy/docker/Dockerfile --build-arg VERSION=${GITHUB_SHA::7} -t exchange-app:ci .
      - name: nginx config test
        run: |
          tmp=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=astras.vip -keyout "$tmp/origin.key" -out "$tmp/origin.pem" >/dev/null 2>&1
          docker run --rm \
            -v "$PWD/deploy/compose/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/deploy/compose/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/deploy/compose/nginx/html:/usr/share/nginx/html:ro" \
            -v "$tmp:/etc/nginx/ssl:ro" \
            nginx:1.29-alpine nginx -t
