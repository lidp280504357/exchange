# golangci-lint v2 配置。本地：task lint；CI 同一份配置。
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard          # errcheck、govet、ineffassign、staticcheck、unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - unparam
    - whitespace
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lidp280504357/exchange
