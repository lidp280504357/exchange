# golangci-lint v2 配置。本地：task lint；CI 同一份配置。
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard          # errcheck、govet、ineffassign、staticcheck、unused
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - unparam
    - whitespace
  settings:
    misspell:
      locale: US
    # ADR-0006：internal/<服务> 之间禁止互相 import；新服务加入时在这里补一组规则
    depguard:
      rules:
        admin:
          files: ["**/internal/admin/**"]
          deny:
            - pkg: github.com/lidp280504357/exchange/internal/analytics
              desc: services talk over gRPC and events only (ADR-0006)
            - pkg: github.com/lidp280504357/exchange/internal/auth
              desc: services talk over gRPC and events only (ADR-0006)
            - pkg: github.com/lidp280504357/exchange/internal/gateway
              desc: services talk over gRPC and events only (ADR-0006)
            - pkg: github.com/lidp280504357/exchange/internal/instrument
              desc: services talk over gRPC and events only (ADR-0006)
