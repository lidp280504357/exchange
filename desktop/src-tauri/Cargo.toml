[package]
name = "exchange-desktop"
version = "0.1.0"
description = "Exchange desktop app: the H5 in a Tauri 2 window"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "exchange_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The refresh token in the system's secure storage (requirements §6.6):
# Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
