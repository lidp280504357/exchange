openapi: 3.1.0
info:
  title: Exchange margin account list for the admin console and a test account's purge, internal API
  version: 0.2.0
  description: |
    margin-service's list of every user's margin accounts that the console
    narrows by account (L3 of the user-kind design 2026-10-09, §1 #8): the
    console's 「杠杆账户」 page and its warnings by margin level. The console
    shows people by default: it leaves the bots, test accounts and HOUSE
    out (their IDs from user-service, GET /internal/users/ids in
    users.yaml) or keeps only some accounts.

    The list has a GET, its filters in the query string, user_ids or
    exclude_user_ids among them (at most 1,000 accounts), and a POST
    .../list variant taking the same query string but the accounts in a
    JSON body (at most 5,000, review C76). Both read the accounts the same
    way (httpx.UserIDsOf, as wallet.yaml's lists): one of the two sets,
    UUIDs in any case, each counted once; an empty user_ids lists nothing,
    an absent or null one is no filter. Accounts named in a POST's query
    string, both sets, an ID that is no UUID or too many are 400. The
    accounts are narrowed in the database (= ANY / <> ALL) before they are
    valued and ordered.

    A test account's purge (§1 #9, L4b; exchangectl users purge) settles
    the account's margin accounts here: POST
    /internal/margin/users/{id}/settle.

    The service's other internal endpoints are in docs/runbook/margin.md.
    They are on the compose network only: the gateway does not route
    /internal, and a request carrying the caller's X-User-Id is not served.
servers:
  - url: http://margin-service:8099
tags:
  - name: lists
  - name: purge
paths:
  /internal/margin/accounts:
    get:
      operationId: listMarginAccounts
      summary: Margin accounts, the riskiest first
      description: |
        The lowest margin level first; those without liabilities last, by
        net assets; an account holding and owing nothing is left out. At
        most 5,000 accounts are valued; truncated says there are more.
      tags: [lists]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserIDs'
        - $ref: '#/components/parameters/ExcludeUserIDs'
      responses:
        '200':
          $ref: '#/components/responses/Accounts'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/margin/accounts/list:
    post:
      operationId: listMarginAccountsOfAccounts
      summary: Margin accounts, the accounts in the body
      tags: [lists]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Account'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Limit'
      requestBody:
        $ref: '#/components/requestBodies/Accounts'
      responses:
        '200':
          $ref: '#/components/responses/Accounts'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/margin/users/{id}/settle:
    post:
      operationId: settleUser
      summary: End a user's margin trading (a test account's purge)
      description: |
        The open orders of each of the user's margin accounts are canceled
        (spot-trading-service's POST /internal/orders/cancel); it waits up
        to 8 seconds for them to let go of what they held. Then each debt is
        repaid from what its account holds free of the asset, interest
        first, as an AUTO_REPAY repayment (key settle:<uuid>; a client's
        Idempotency-Key may not take that form); what is still owed comes
        back in remaining_debt: the purge moves the asset in from spot (or
        credits it) and calls again. Other assets the account holds are not
        sold.

        Calling it again cancels and repays what is open by then: once all
        is done, 0, [], [] and complete. A user without margin accounts gets
        the same answer: user-service is not asked whether it knows the
        user (a purge calls this for every test account; a 404 would read
        like a wrong path), so there is no 404 for an unknown user. A cancel
        the trading service refuses (4xx) is logged and the rest goes on:
        what those orders hold stays locked and its debt in remaining_debt.
        It takes a few seconds as a rule (8 at most waiting for the
        cancels): give the call 30 seconds or more. Each call is audited as
        margin.user_settled (target user:<id>; details the count, repaid,
        remaining_debt and complete), also one that failed midway (details
        error, the failure's code, and complete false).
      tags: [purge]
      parameters:
        - name: id
          in: path
          required: true
          description: The user; another spelling of a UUID is the same user.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor, reason]
              properties:
                actor:
                  type: string
                  description: Who purges (an operator's email, or the e2e scripts' name); the audit's actor.
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: What it did and what is still owed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settled'
        '400':
          description: The user is no UUID, or the actor or a reason of at least 3 characters is missing (COMMON_INVALID_ARGUMENT).
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        '404':
          description: The call came through the gateway (it carries a caller's X-User-Id).
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        '409':
          description: |
            MARGIN_FROZEN: one of the user's margin accounts is being
            liquidated (details status LIQUIDATING, account MARGIN_CROSS or
            MARGIN_ISOLATED:<pair>); the liquidation repays its debts. Call
            again once it is over.
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        '503':
          description: spot-trading-service or the ledger unreachable; nothing is lost, call again.
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
components:
  parameters:
    UserID:
      name: user_id
      in: query
      description: One user's accounts.
      schema:
        type: string
        format: uuid
    Account:
      name: account
      in: query
      schema:
        type: string
        enum: [MARGIN_CROSS, MARGIN_ISOLATED]
    Symbol:
      name: symbol
      in: query
      description: An isolated account's pair.
      schema:
        type: string
        examples: [BTC-USDT]
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [NORMAL, WARNED, LIQUIDATING, FROZEN]
    Limit:
      name: limit
      in: query
      description: 1 to 500, 500 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    UserIDs:
      name: user_ids
      in: query
      description: |
        Only these accounts (at most 1,000), comma-separated or repeated;
        present but empty lists nothing. Not with exclude_user_ids.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: true
    ExcludeUserIDs:
      name: exclude_user_ids
      in: query
      description: Past these accounts (at most 1,000), comma-separated or repeated. Not with user_ids.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: true
  requestBodies:
    Accounts:
      required: true
      description: '{} narrows nothing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accounts'
  responses:
    Accounts:
      description: The accounts; truncated when there are more.
      content:
        application/json:
          schema:
            type: object
            required: [items, truncated]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/MarginAccount'
              truncated:
                type: boolean
  schemas:
    Settled:
      type: object
      required: [canceled_orders, repaid, remaining_debt, complete]
      properties:
        complete:
          type: boolean
          description: Nothing owed any more (remaining_debt is empty).
        canceled_orders:
          type: integer
          description: Orders whose cancel this call asked for (not those on their way out before).
        repaid:
          type: array
          description: The repayments it made, by account and asset.
          items:
            type: object
            required: [account, symbol, asset, principal, interest]
            properties:
              account:
                type: string
                enum: [MARGIN_CROSS, MARGIN_ISOLATED]
              symbol:
                type: [string, 'null']
                description: An isolated account's pair.
              asset:
                type: string
              principal:
                type: string
              interest:
                type: string
        remaining_debt:
          type: array
          description: What is still owed (principal and interest), by account and asset.
          items:
            type: object
            required: [account, symbol, asset, amount]
            properties:
              account:
                type: string
                enum: [MARGIN_CROSS, MARGIN_ISOLATED]
              symbol:
                type: [string, 'null']
              asset:
                type: string
              amount:
                type: string
    Accounts:
      type: object
      additionalProperties: false
      description: One of the two, or neither.
      properties:
        user_ids:
          type: [array, 'null']
          maxItems: 5000
          description: Only these accounts; [] lists nothing, null or absent is no filter.
          items:
            type: string
            format: uuid
        exclude_user_ids:
          type: [array, 'null']
          maxItems: 5000
          description: Past these accounts.
          items:
            type: string
            format: uuid
    MarginAccount:
      type: object
      required: [user_id, account, symbol, leverage, status, margin_level, warn_level, liquidation_level, total_asset,
        total_liability, net_asset, liquidation_price, warned_at, frozen_by, frozen_reason, frozen_at, unpriced, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        account:
          type: string
          enum: [MARGIN_CROSS, MARGIN_ISOLATED]
        symbol:
          type: [string, 'null']
          description: An isolated account's pair.
        leverage:
          type: integer
        status:
          type: string
          enum: [NORMAL, WARNED, LIQUIDATING, FROZEN]
        margin_level:
          type: [string, 'null']
          description: Total assets / total liabilities at USDT prices; null without liabilities.
        warn_level:
          type: string
        liquidation_level:
          type: string
        total_asset:
          type: string
          description: USDT.
        total_liability:
          type: string
          description: USDT, borrowed and interest.
        net_asset:
          type: string
        liquidation_price:
          type: [string, 'null']
          description: An isolated account's, at the level its liquidation starts.
        warned_at:
          type: [string, 'null']
          format: date-time
        frozen_by:
          type: [string, 'null']
          description: Only while an administrator froze it.
        frozen_reason:
          type: [string, 'null']
        frozen_at:
          type: [string, 'null']
          format: date-time
        unpriced:
          type: array
          description: Assets it holds or owes whose price is stale or never was.
          items:
            type: string
        updated_at:
          type: string
          format: date-time
