openapi: 3.1.0
info:
  title: Exchange product lines, internal API
  version: 0.1.0
  description: |
    Design 2026-10-07 (product switches) §1 #3 and #5, batches K1a and K1b:
    what the console (admin-service, GET/PUT /admin/v1/products in
    api/admin/admin.yaml) asks the services that run the product lines.
    Spot trading (spot) is spot-trading-service's; the USDT-margined
    (usdt_m) and coin-margined (coin_m) contracts are derivatives-service's.
    The same two endpoints on both, with the same shapes. They are on the
    compose network only: the gateway does not route /internal, and a
    request carrying the caller's X-User-Id (one that came through it) is
    not served. Not part of the public API reference.

    Closing a line is the flag's change (product.spot, product.usdt_m,
    product.coin_m); cancel-open then cancels what the closed line no
    longer takes, and every 5 seconds while it stays closed each service
    also cancels such orders stored from 10 seconds before it closed on
    (audited as system:spot-trading-service or system:derivatives-service).
    HOUSE and the market-making accounts (MARKET_MAKER_USER_IDS: the
    simulated market's bots) keep quoting a closed line and are neither
    refused, canceled nor counted: every trade is against them, so positions
    close and liquidations fill.
servers:
  - url: http://spot-trading-service:8088
    description: spot
  - url: http://derivatives-service:8095
    description: usdt_m and coin_m
tags:
  - name: products
paths:
  /internal/products/{product}:
    parameters:
      - $ref: '#/components/parameters/Product'
    get:
      operationId: getProductLine
      summary: What closing a product line touches now
      description: |
        The line's switch and its counts, HOUSE's and the market-making
        accounts' left out. spot: open_orders are the active orders on spot
        and margin accounts (liquidation orders left out; margin
        repayments, which a closed line keeps, counted), open_positions the
        margin accounts that owe anything (counted at most every 15
        seconds). usdt_m, coin_m: open_orders are the open orders and the
        take-profits and stop-losses on the line's contracts,
        open_positions the open positions. An order asked to cancel counts
        until the engine confirms it.
      tags: [products]
      responses:
        '200':
          description: The line's counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLineCounts'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/products/{product}/cancel-open:
    parameters:
      - $ref: '#/components/parameters/Product'
    post:
      operationId: cancelProductLineOrders
      summary: Cancel what a closed product line no longer takes
      description: |
        Rereads the flag first and fails with COMMON_CONFLICT (409) while the
        line is open (derivatives-service: COMMON_UNAVAILABLE, 503, when the
        flags cannot be read). Then asks the engine to cancel, one user at a
        time, each order the closed line no longer takes, auditing each as
        admin.orders.canceled by actor with reason (target user:<id>,
        details with order_id, symbol and product; spot adds account_type,
        the contracts type) in the transaction that marks it; the engine's
        answers release the funds as for any cancel. Left alone: orders
        already asked to cancel, HOUSE's and the market-making accounts',
        the liquidation engine's (margin-service's liquidations on spot;
        liquidations, ADL and the console's closes on the contracts), and on
        spot the margin repayments (side_effect AUTO_REPAY bringing an asset
        the account owes), which a closed spot line takes. spot sweeps a
        second time a second later (orders on their way in as the line
        closed). Run again, it cancels what is left. The answer lists the
        orders it asked to cancel.
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor, reason]
              additionalProperties: false
              properties:
                actor:
                  type: string
                  description: Who closed the line (the console's administrator), the audit's actor.
                reason:
                  type: string
      responses:
        '202':
          description: The cancels asked for; the engine confirms them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOpenResult'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
components:
  parameters:
    Product:
      name: product
      in: path
      required: true
      description: spot at spot-trading-service; usdt_m or coin_m at derivatives-service.
      schema:
        type: string
        enum: [spot, usdt_m, coin_m]
  schemas:
    ProductLineCounts:
      type: object
      required: [product, closed, open_orders, open_positions]
      properties:
        product:
          type: string
          enum: [spot, usdt_m, coin_m]
        closed:
          type: boolean
          description: The service's copy of the flag (refreshed every 5 seconds).
        open_orders:
          type: integer
        open_positions:
          type: integer
    CancelOpenResult:
      type: object
      required: [canceled, orders]
      properties:
        canceled:
          type: integer
          description: How many orders it asked to cancel (orders' length).
        orders:
          type: array
          items:
            type: object
            required: [order_id, user_id, symbol, type]
            properties:
              order_id:
                type: string
                format: uuid
              user_id:
                type: string
                format: uuid
              symbol:
                type: string
              type:
                type: string
                enum: [ORDER, CONDITIONAL]
                description: CONDITIONAL is a take-profit or stop-loss (contracts only).
