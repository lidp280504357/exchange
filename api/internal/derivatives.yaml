openapi: 3.1.0
info:
  title: Exchange contract position lists for the admin console and a test account's purge, internal API
  version: 0.2.0
  description: |
    derivatives-service's two lists of every user's open positions that the
    console narrows by account (L3 of the user-kind design 2026-10-09, §1
    #8): all open positions (the console's 「仓位」 page) and those under
    watch (「接近强平」). The console shows people by default: it leaves the
    bots, test accounts and HOUSE out (their IDs from user-service, GET
    /internal/users/ids in users.yaml) or keeps only some accounts.

    Each list has a GET, its filters in the query string, user_ids or
    exclude_user_ids among them (at most 1,000 accounts), and a POST
    .../list variant taking the same query string but the accounts in a
    JSON body (at most 5,000, review C76): the console's sets of test
    accounts run to thousands. Both read the accounts the same way
    (httpx.UserIDsOf, as wallet-service's lists in wallet.yaml): one of the
    two sets, UUIDs in any case, each counted once; an empty user_ids lists
    nothing, an absent or null one is no filter. Accounts named in a POST's
    query string, both sets, an ID that is no UUID or too many are 400. The
    accounts are narrowed in the database (= ANY / <> ALL), before the
    order and the limit.

    A test account's purge (§1 #9, L4b; exchangectl users purge) first
    flattens the account's contract accounts here: POST
    /internal/derivatives/users/{id}/flatten.

    The service's other internal endpoints are in docs/runbook/derivatives.md.
    They are on the compose network only: the gateway does not route
    /internal, and a request carrying the caller's X-User-Id (one that came
    through it) is not served.
servers:
  - url: http://derivatives-service:8095
tags:
  - name: lists
  - name: purge
paths:
  /internal/derivatives/positions:
    get:
      operationId: listOpenPositions
      summary: Every user's open positions, riskiest first
      description: |
        By margin ratio (maintenance margin / (margin + unrealized result)),
        then by entry notional, HOUSE's last (its orders carry the highest
        leverage's margin: at zero result its ratio is about half). A cross
        position is measured on its own here; its account's warning counts
        for it.
      tags: [lists]
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Watch'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserIDs'
        - $ref: '#/components/parameters/ExcludeUserIDs'
      responses:
        '200':
          $ref: '#/components/responses/Positions'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/derivatives/positions/list:
    post:
      operationId: listOpenPositionsOfAccounts
      summary: Every user's open positions, the accounts in the body
      tags: [lists]
      parameters:
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Watch'
        - $ref: '#/components/parameters/Limit'
      requestBody:
        $ref: '#/components/requestBodies/Accounts'
      responses:
        '200':
          $ref: '#/components/responses/Positions'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/derivatives/risk:
    get:
      operationId: listPositionsUnderWatch
      summary: The open positions under watch, riskiest first
      description: |
        Taken over by the liquidation engine, warned (a cross account's
        warning counts for its cross positions), or with a margin ratio of at
        least half; HOUSE's never (the monitor does not liquidate it).
      tags: [lists]
      parameters:
        - $ref: '#/components/parameters/UserIDs'
        - $ref: '#/components/parameters/ExcludeUserIDs'
      responses:
        '200':
          $ref: '#/components/responses/Risk'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/derivatives/risk/list:
    post:
      operationId: listPositionsUnderWatchOfAccounts
      summary: The open positions under watch, the accounts in the body
      tags: [lists]
      requestBody:
        $ref: '#/components/requestBodies/Accounts'
      responses:
        '200':
          $ref: '#/components/responses/Risk'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
  /internal/derivatives/users/{id}/flatten:
    post:
      operationId: flattenUser
      summary: End what a user holds on their contract accounts (a test account's purge)
      description: |
        Under the user's lock their orders are canceled (their own and those
        of their take-profits and stop-losses; the liquidation engine's and
        the console's run their course) and their active take-profits and
        stop-losses end CANCELED with reason ADMIN, each audited as
        admin.orders.canceled (details order_id, symbol, type ORDER or
        CONDITIONAL) by actor with reason. Once the engine confirmed the
        cancels, every open position - both sides in hedge mode, every
        settlement asset (USDT and the coin-margined ones) - is closed with
        IOC limit orders of kind ADMIN, reduce-only in one-way mode, at the
        mark price moved by 0.5% against the position on the tick grid (the
        liquidation engine's price for a cross position), at most the
        contract's largest order each: only HOUSE takes them. Up to 3
        rounds, a second apart; what is still open comes back in remaining
        with the reason. Each wait for the engine lasts at most 8 seconds,
        so the answer may take about 40 seconds when the engine does not
        answer: give the call a minute or more.

        Calling it again cancels and closes what is open by then: once all
        is done, 0, 0, [], [] and complete. complete false means not done:
        call again later. A user who never traded contracts gets the same
        answer: user-service is not asked whether it knows the user (a
        purge calls this for every test account; a 404 would read like a
        wrong path), so there is no 404 for an unknown user. Each call is
        audited as derivatives.user_flattened (target user:<id>; details the
        counts, closed, remaining and complete), also one that failed midway
        (details error, the failure's code, and complete false: the cancels
        went out, some closes may have filled).
      tags: [purge]
      parameters:
        - name: id
          in: path
          required: true
          description: The user; another spelling of a UUID is the same user.
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/Purge'
      responses:
        '200':
          description: What it did and what it left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flattened'
        '400':
          description: The user is no UUID, or the actor or a reason of at least 3 characters is missing (COMMON_INVALID_ARGUMENT).
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        '404':
          description: The call came through the gateway (it carries a caller's X-User-Id).
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        '409':
          description: |
            DERIV_POSITION_LIQUIDATING: a position of the user's is under
            liquidation (details symbol, position_side) or their cross
            account in an asset is being liquidated (details settle_asset,
            liquidation_id); nothing was canceled. A liquidation takes
            seconds as a rule: call again.
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        '422':
          description: DERIV_HOUSE_NOT_CLOSED - HOUSE is not flattened.
          content:
            application/json:
              schema:
                $ref: '../openapi/common.yaml#/components/schemas/Error'
        default:
          $ref: '../openapi/common.yaml#/components/responses/Error'
components:
  parameters:
    Symbol:
      name: symbol
      in: query
      description: One contract's.
      schema:
        type: string
        examples: [BTC-USDT-PERP]
    UserID:
      name: user_id
      in: query
      description: |
        One user's (their positions read as theirs); a UUID, compared in its
        canonical form, so that another spelling of an excluded account does
        not get past exclude_user_ids (review C76).
      schema:
        type: string
        format: uuid
    Watch:
      name: watch
      in: query
      description: |
        The literal true keeps only the positions under watch, as
        /internal/derivatives/risk lists them; any other value, or none,
        lists them all.
      schema:
        type: string
        examples: ['true']
    Limit:
      name: limit
      in: query
      description: |
        At most this many: 200 when absent, not a number or 0 or less;
        past 1,000 it is 1,000.
      schema:
        type: integer
    UserIDs:
      name: user_ids
      in: query
      description: |
        Only these accounts (at most 1,000), comma-separated or repeated;
        present but empty lists nothing. Not with exclude_user_ids.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: true
    ExcludeUserIDs:
      name: exclude_user_ids
      in: query
      description: Past these accounts (at most 1,000), comma-separated or repeated. Not with user_ids.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: true
  requestBodies:
    Accounts:
      required: true
      description: '{} narrows nothing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accounts'
    Purge:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [actor, reason]
            properties:
              actor:
                type: string
                description: Who purges (an operator's email, or the e2e scripts' name); the audit's actor.
              reason:
                type: string
                minLength: 3
  responses:
    Positions:
      description: The positions; truncated when limit cut the list.
      content:
        application/json:
          schema:
            type: object
            required: [positions, truncated]
            properties:
              positions:
                type: array
                items:
                  $ref: '#/components/schemas/WatchedPosition'
              truncated:
                type: boolean
    Risk:
      description: The positions under watch.
      content:
        application/json:
          schema:
            type: object
            required: [positions]
            properties:
              positions:
                type: array
                items:
                  $ref: '#/components/schemas/WatchedPosition'
  schemas:
    Flattened:
      type: object
      required: [canceled_orders, canceled_conditionals, closed, remaining, complete]
      properties:
        complete:
          type: boolean
          description: Nothing left (remaining is empty); the purge goes on with the account.
        canceled_orders:
          type: integer
          description: Orders whose cancel this call asked for (not those on their way out before).
        canceled_conditionals:
          type: integer
          description: Take-profits and stop-losses it ended.
        closed:
          type: array
          description: What it closed, by contract and side.
          items:
            type: object
            required: [symbol, side, quantity, price]
            properties:
              symbol:
                type: string
                examples: [BTC-USDT-PERP]
              side:
                type: string
                enum: [LONG, SHORT]
                description: The position's direction (its side in hedge mode).
              quantity:
                type: string
                description: In the base asset; whole contracts on a coin-margined contract.
              price:
                type: string
                description: The average price of the closes, 8 decimals at most.
        remaining:
          type: array
          description: What it left open, by contract and side.
          items:
            type: object
            required: [symbol, side, quantity, reason]
            properties:
              symbol:
                type: string
              side:
                type: string
                enum: [LONG, SHORT]
              quantity:
                type: string
                description: |
                  What is open; "0" when the position is flat but an order on
                  it is still working (it may open it again).
              reason:
                type: string
                description: |
                  NOT_FILLED (HOUSE took nothing at the price, three rounds),
                  DERIV_POSITION_LIQUIDATING (a liquidation began during the
                  call: the liquidation engine has it),
                  DERIV_CLOSE_PENDING (an order still working when it gave
                  up - the engine slow, or a cancel it has not confirmed - or
                  the position changed meanwhile), or the code a close was
                  refused with (DERIV_MARK_PRICE_UNAVAILABLE,
                  INSTRUMENT_NOT_TRADING, ORDER_QUANTITY_OUT_OF_RANGE, ...).
                examples: [NOT_FILLED]
    Accounts:
      type: object
      additionalProperties: false
      description: One of the two, or neither.
      properties:
        user_ids:
          type: [array, 'null']
          maxItems: 5000
          description: Only these accounts; [] lists nothing, null or absent is no filter.
          items:
            type: string
            format: uuid
        exclude_user_ids:
          type: [array, 'null']
          maxItems: 5000
          description: Past these accounts.
          items:
            type: string
            format: uuid
    WatchedPosition:
      description: A user's position as the public API shows it, with its owner and liquidation state.
      allOf:
        - $ref: '../openapi/derivatives.yaml#/components/schemas/ContractPosition'
        - type: object
          required: [user_id, liquidating, liquidation_attempts, warned_at, margin_ratio, mark_fresh]
          properties:
            user_id:
              type: string
              format: uuid
            liquidating:
              type: boolean
              description: Taken over by the liquidation engine.
            liquidation_attempts:
              type: integer
              description: Liquidation orders placed so far; after 3 the rest is auto-deleveraged.
            warned_at:
              type: [string, 'null']
              format: date-time
              description: When it (or its cross account) was warned; null when it is not.
            margin_ratio:
              type: [string, 'null']
              description: Maintenance margin / (margin + unrealized result), 4 decimals; null without a margin balance or a maintenance margin.
            mark_fresh:
              type: boolean
              description: false while the mark price is stale; the figures stand still until it moves.
