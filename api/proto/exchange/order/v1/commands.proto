syntax = "proto3";

package exchange.order.v1;

import "exchange/order/v1/order.proto";

// Commands on order.commands, keyed by symbol: the matching engine's only
// input (requirements §5.7). The trading service writes them to its
// outbox in the transaction that accepts or cancels the order.

// PlaceOrder hands an accepted order, whose funds are frozen, to the
// engine.
message PlaceOrder {
  Order order = 1;
}

// CancelOrder asks the engine to cancel an order that is still open; the
// engine answers with OrderCanceled, or ignores an order it already
// finished.
message CancelOrder {
  string order_id = 1;
  string user_id = 2;
  string symbol = 3;
}
