syntax = "proto3";

package exchange.instrument.v1;

import "google/protobuf/timestamp.proto";

// InstrumentService serves the reference data other services rely on:
// assets with their networks, trading pairs and fee schedules
// (requirements §5.5). Decimal values are strings (ADR-0008). Public REST
// endpoints are in api/openapi/market.yaml; changes go through exchangectl
// (a file, the deploy's sync) and the admin console (the write RPCs).
service InstrumentService {
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetTradingPair(GetTradingPairRequest) returns (GetTradingPairResponse);
  rpc ListTradingPairs(ListTradingPairsRequest) returns (ListTradingPairsResponse);
  // SetPairStatus moves a pair (PREPARE -> TRADING <-> HALT ->
  // CANCEL_ONLY -> DELISTED) for an operator; the change is versioned.
  rpc SetPairStatus(SetPairStatusRequest) returns (SetPairStatusResponse);
  rpc GetContract(GetContractRequest) returns (GetContractResponse);
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  // SetContractStatus moves a perpetual contract along the same machine as
  // a pair; the change is versioned.
  rpc SetContractStatus(SetContractStatusRequest) returns (SetContractStatusResponse);
  // UpdateAssetProfile changes what the sites show of an asset for an
  // operator (ASTRA design §5.3): its display name, introductions, links
  // and logo. The asset code never changes; the history keeps the profile
  // before and after.
  rpc UpdateAssetProfile(UpdateAssetProfileRequest) returns (UpdateAssetProfileResponse);
  // ExportConfig returns the reference data in the shape of
  // deploy/instruments/<env>.json (fee_schedules, assets with their
  // networks, pairs, contracts), for the admin console to edit.
  rpc ExportConfig(ExportConfigRequest) returns (ExportConfigResponse);
  // ApplyConfig applies such a JSON document for the admin console (source
  // CONSOLE): missing items are created, changed ones versioned, statuses
  // left alone, nothing deleted; with dry_run nothing is changed. A later
  // file apply (the deploy's sync) keeps what the console changed last.
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
}

message ExportConfigRequest {}

message ExportConfigResponse {
  bytes config_json = 1;
}

message ApplyConfigRequest {
  // The document, unknown fields refused; only the items it names.
  bytes config_json = 1;
  bool dry_run = 2;
  string actor = 3;
  string reason = 4;
}

message ConfigChange {
  // FEE_SCHEDULE, ASSET, NETWORK, TRADING_PAIR or CONTRACT.
  string entity = 1;
  // The tier, asset code, ASSET/NETWORK or symbol.
  string key = 2;
  // CREATE or UPDATE.
  string action = 3;
  // The version after the change.
  int64 version = 4;
  // The item before (empty when created) and after, as JSON.
  bytes before_json = 5;
  bytes after_json = 6;
}

message ApplyConfigResponse {
  repeated ConfigChange changes = 1;
  int32 unchanged = 2;
}

message Asset {
  // Upper-case code, e.g. BTC, USDT.
  string asset_code = 1;
  string name = 2;
  // Smallest unit is 10^-decimals; amounts with more digits are rejected.
  int32 decimals = 3;
  bool deposit_enabled = 4;
  bool withdraw_enabled = 5;
  bool trading_enabled = 6;
  // Risk switch: blocks new exposure to the asset while set.
  bool risk_restricted = 7;
  repeated Network networks = 8;
  int64 version = 9;
  // Market-cap rank at listing; 0 when unranked.
  int32 rank = 10;
  // Sector tags in lower case, e.g. layer-1, defi, meme.
  repeated string categories = 11;
  AssetProfile profile = 12;
  // A test asset (ADR-0017): in no public list, without pairs or
  // contracts; its deposits and withdrawals are open only to users
  // eligible for TEST_ASSETS.
  bool hidden = 13;
}

// AssetProfile is what the sites show of an asset beyond its code.
message AssetProfile {
  // Replaces the asset's name on the sites when set.
  string display_name = 1;
  // Introductions by language: "zh-CN", "en".
  map<string, string> description = 2;
  // https URLs by kind: "website", "explorer", "whitepaper".
  map<string, string> links = 3;
  // The logo's type (image/png, image/svg+xml or image/webp) and bytes;
  // empty and 0 without a logo.
  string logo_mime = 4;
  int32 logo_size = 5;
  // The public logo URL path, with the version so that a new logo gets a
  // new URL; empty without a logo.
  string logo_url = 6;
  // Goes up with every change.
  int64 version = 7;
}

// Network is an asset on one chain.
message Network {
  string asset_code = 1;
  // e.g. ETH-SEPOLIA.
  string network = 2;
  // Chain identifier, e.g. the EVM chain ID "11155111".
  string chain = 3;
  // Token contract; empty for the chain's native coin.
  string contract_address = 4;
  int32 confirmations = 5;
  string min_deposit = 6;
  string min_withdraw = 7;
  // Fixed fee deducted from each withdrawal.
  string withdraw_fee = 8;
  bool memo_required = 9;
  bool deposit_enabled = 10;
  bool withdraw_enabled = 11;
  int64 version = 12;
  // Name users see, e.g. TRC20, BEP20, ERC20, Bitcoin.
  string display_name = 13;
  // Address format: EVM, TRON or BTC.
  string address_format = 14;
  // Typical minutes from the transfer to the credit.
  int32 eta_minutes = 15;
  // Block explorer links with a {tx} or {address} placeholder; empty when
  // the network has none.
  string explorer_tx_url = 16;
  string explorer_address_url = 17;
  // Who moves the network's funds (ADR-0011): empty for the platform's
  // own wallets (the signer and the block scanner), UDUN for the custody
  // wallet, UDUNMOCK for the test server's stand-in that serves hidden
  // test assets only (ADR-0017).
  string provider = 18;
  // The custodian's code of the coin, "mainCoinType:coinType" for UDUN
  // (e.g. 195:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t); empty without one.
  string provider_coin = 19;
}

message TradingPair {
  // BASE-QUOTE, e.g. BTC-USDT.
  string symbol = 1;
  string base_asset = 2;
  string quote_asset = 3;
  // Price step.
  string tick_size = 4;
  // Quantity step.
  string lot_size = 5;
  string min_quantity = 6;
  string max_quantity = 7;
  // Minimum price x quantity, in the quote asset.
  string min_notional = 8;
  // Largest allowed deviation of a limit price from the last trade, as a
  // fraction: "0.1" is 10%.
  string price_band = 9;
  string fee_tier = 10;
  // Rates of fee_tier, filled in for convenience.
  string maker_fee_rate = 11;
  string taker_fee_rate = 12;
  // PREPARE, TRADING, HALT, CANCEL_ONLY or DELISTED.
  string status = 13;
  int64 version = 14;
  // The reference market followed for display (ADR-0010), e.g. BTCUSDT;
  // empty when the pair shows only its own market data.
  string reference_symbol = 15;
  // Platform price = reference price x reference_multiplier (1000 for a
  // 1000PEPE pair, ADR-0014); quantities divide by it.
  string reference_multiplier = 16;
  google.protobuf.Timestamp listed_at = 17;
}

// RiskTier is one step of a contract's risk limit ladder (requirements
// §11.7): positions up to max_notional may use leverage up to
// max_leverage and need maintenance margin at mmr (liquidation fee
// included).
message RiskTier {
  string max_notional = 1;
  int32 max_leverage = 2;
  string mmr = 3;
}

// Contract is a linear perpetual future settled in its quote asset,
// e.g. BTC-USDT-PERP (requirements §5.8). Quantities are in the base
// asset; prices, margin, fees and PnL in the quote asset.
message Contract {
  string symbol = 1;
  // PERPETUAL.
  string type = 2;
  string base_asset = 3;
  string quote_asset = 4;
  // The spot market whose reference prices make the index, e.g. BTC-USDT.
  string index_symbol = 5;
  string tick_size = 6;
  string lot_size = 7;
  string min_quantity = 8;
  string max_quantity = 9;
  string min_notional = 10;
  // Largest allowed deviation of a limit price from the mark price.
  string price_band = 11;
  repeated RiskTier risk_tiers = 12;
  int32 funding_interval_hours = 13;
  // Interest rate per funding interval; funding_cap bounds the rate.
  string interest_rate = 14;
  string funding_cap = 15;
  // Notional the premium index prices on each side of the book.
  string impact_notional = 16;
  string fee_tier = 17;
  string maker_fee_rate = 18;
  string taker_fee_rate = 19;
  // PREPARE, TRADING, HALT, CANCEL_ONLY or DELISTED.
  string status = 20;
  int64 version = 21;
}

message FeeSchedule {
  string tier = 1;
  string maker_fee_rate = 2;
  string taker_fee_rate = 3;
  int64 version = 4;
}

message GetAssetRequest {
  string asset_code = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

message ListAssetsRequest {}

message ListAssetsResponse {
  repeated Asset assets = 1;
}

message GetTradingPairRequest {
  string symbol = 1;
}

message GetTradingPairResponse {
  TradingPair pair = 1;
}

message ListTradingPairsRequest {}

message ListTradingPairsResponse {
  repeated TradingPair pairs = 1;
}

message SetPairStatusRequest {
  string symbol = 1;
  string to_status = 2;
  string reason = 3;
  string actor = 4;
}

message SetPairStatusResponse {
  string from_status = 1;
}

// UpdateAssetProfileRequest replaces an asset's profile text; the logo
// changes only with logo (or clear_logo).
message UpdateAssetProfileRequest {
  string asset_code = 1;
  // 2-32 printable characters, or empty for the asset's name.
  string display_name = 2;
  // Up to 1,000 characters each.
  map<string, string> description = 3;
  map<string, string> links = 4;
  // A new logo: PNG, SVG (cleaned on upload) or WebP, square, at most
  // 200 KB, with its logo_mime. Empty keeps the logo.
  bytes logo = 5;
  string logo_mime = 6;
  // Removes the logo (the letter icon shows).
  bool clear_logo = 7;
  string actor = 8;
  string reason = 9;
}

message UpdateAssetProfileResponse {
  AssetProfile profile = 1;
}

message GetContractRequest {
  string symbol = 1;
}

message GetContractResponse {
  Contract contract = 1;
}

message ListContractsRequest {}

message ListContractsResponse {
  repeated Contract contracts = 1;
}

message SetContractStatusRequest {
  string symbol = 1;
  string to_status = 2;
  string reason = 3;
  string actor = 4;
}

message SetContractStatusResponse {
  string from_status = 1;
}
