syntax = "proto3";

package exchange.market.v1;

import "exchange/order/v1/order.proto";
import "google/protobuf/timestamp.proto";

// Market data (requirements §5.11, §7.3, §11.8; ADR-0010, ADR-0015), keyed
// by symbol. Amounts are decimal strings.
//
//   market.depth           The public books, from market-data-service:
//                          DepthSnapshot on (re)start and every few
//                          seconds, DepthUpdate in between (at most every
//                          100 ms). A symbol that shows the reference
//                          market (market.reference_depth) has Binance's
//                          book, the others the engine's, relayed.
//   market.depth.internal  DepthSnapshot of the engine's own book (at most
//                          every 100 ms when it changed, all books every
//                          10 s), for market-data-service, the admin
//                          console and reconciliation.
//   market.trades          TradesPrinted, the public trades, from
//                          market-data-service, chosen like the depth.
//   market.candle.events   CandleUpdated, CandleClosed, TickerUpdated, and
//                          for perpetual contracts MarkPriceUpdated,
//                          IndexPriceUpdated, FundingRateUpdated, from
//                          market-data-service.
//   market.liquidations    LiquidationOccurred, the reference market's
//                          forced orders on the contracts it follows
//                          (design 2026-10-06 §3.3, from batch G3b): kept
//                          a day, in ClickHouse futures_liquidations for 7.
//
// Depth and trades are derived state, kept one hour and not ingested into
// ClickHouse. The contracts' books use derivatives.market.depth and
// derivatives.market.depth.internal the same way; their public trades
// share market.trades.

// PriceLevel is the total resting quantity at one price.
message PriceLevel {
  string price = 1;
  string quantity = 2;
}

// DepthSnapshot is the top of a book, best prices first.
message DepthSnapshot {
  string symbol = 1;
  // The engine's event sequence of the book on the internal topics; on
  // the public ones the publisher's own sequence of the symbol's
  // messages, which only grows (it starts from the publisher's start
  // time), so a restart never looks like going back.
  int64 sequence = 2;
  repeated PriceLevel bids = 3;
  repeated PriceLevel asks = 4;
  google.protobuf.Timestamp taken_at = 5;
  // True when the book is the reference market's (Binance).
  bool reference = 6;
}

// DepthUpdate is how a public book changed since the message before it on
// the symbol's topic: the levels that changed, quantity "0" removing one.
// prev_sequence is that message's sequence; a consumer that did not see
// it keeps its book until the next DepthSnapshot.
message DepthUpdate {
  string symbol = 1;
  int64 sequence = 2;
  int64 prev_sequence = 3;
  repeated PriceLevel bids = 4;
  repeated PriceLevel asks = 5;
  google.protobuf.Timestamp taken_at = 6;
  bool reference = 7;
}

// TradesPrinted is a batch of a symbol's public trades, oldest first.
message TradesPrinted {
  string symbol = 1;
  repeated PublicTrade trades = 2;
  // True when they are the reference market's trades.
  bool reference = 3;
}

// PublicTrade is one trade as everyone may see it: no orders, no users.
message PublicTrade {
  // A UUID: the platform's trade ID, or one derived from the reference
  // market's trade ID.
  string trade_id = 1;
  // The platform's trade number, or the reference market's trade ID.
  uint64 trade_number = 2;
  string price = 3;
  string quantity = 4;
  string quote_quantity = 5;
  exchange.order.v1.Side taker_side = 6;
  google.protobuf.Timestamp executed_at = 7;
}

// Candle is one interval of a symbol's trades (§11.8). An interval without
// trades repeats the previous close with zero volume.
message Candle {
  string symbol = 1;
  // 1m 3m 5m 15m 30m 1h 2h 4h 6h 12h 1d 1w 1M, aligned to UTC.
  string interval = 2;
  google.protobuf.Timestamp open_time = 3;
  string open = 4;
  string high = 5;
  string low = 6;
  string close = 7;
  // Traded base quantity and quote amount.
  string volume = 8;
  string quote_volume = 9;
  int64 trade_count = 10;
  bool closed = 11;
}

// CandleUpdated is the open candle, pushed at most every 500 ms while it
// changes.
message CandleUpdated {
  Candle candle = 1;
}

// CandleClosed is a candle whose interval has ended.
message CandleClosed {
  Candle candle = 1;
}

// Ticker is the rolling 24-hour summary of a symbol (§11.8).
message Ticker {
  string symbol = 1;
  // The latest trade price; kept when no trade happened in the window.
  string last = 2;
  // The last trade price 24 hours ago.
  string open = 3;
  string high = 4;
  string low = 5;
  string volume = 6;
  string quote_volume = 7;
  int64 trade_count = 8;
  // (last - open) / open, as a fraction; empty without an open price.
  string change = 9;
  // Best bid and ask; empty when that side is empty.
  string bid = 10;
  string ask = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// TickerUpdated is pushed at most every 500 ms while the ticker changes.
message TickerUpdated {
  Ticker ticker = 1;
}

// Perpetual contract prices (§11.7), from market-data-service every second
// on market.candle.events. Prices have 8 decimals; rates are fractions per
// funding period, e.g. "0.0001" for 0.01%.

// MarkPriceUpdated is a contract's mark and index prices with its funding
// estimate, keyed by the contract (BTC-USDT-PERP).
message MarkPriceUpdated {
  string symbol = 1;
  // index x (1 + basis), the basis bounded to +-1%.
  string mark_price = 2;
  string index_price = 3;
  // The 30-second EMA of (mid - index) / index of the contract's book,
  // before the bound.
  string basis = 4;
  // The estimated rate of the period ending next_funding_time.
  string funding_rate = 5;
  google.protobuf.Timestamp next_funding_time = 6;
  google.protobuf.Timestamp computed_at = 7;
  // Where the prices come from: PLATFORM (computed here from the index
  // and the contract's book, as above) or BINANCE (the Binance contract's
  // mark price, index price and estimated rate while market.reference_mark
  // is on for the contract, design 2026-10-06 §3.1, from batch G3a; basis
  // is then (mark - index) / index). Empty reads as PLATFORM.
  string source = 8;
}

// IndexComponent is one source of an index price.
message IndexComponent {
  string source = 1;
  string price = 2;
  int32 weight = 3;
  // False for a source more than 3% away from the median of all.
  bool included = 4;
}

// IndexPriceUpdated is the weighted median of the sources' spot prices,
// keyed by the index's spot symbol (BTC-USDT).
message IndexPriceUpdated {
  string symbol = 1;
  string price = 2;
  repeated IndexComponent components = 3;
  google.protobuf.Timestamp computed_at = 4;
}

// FundingRateUpdated is a contract's funding rate, keyed by the contract:
// the running estimate while its period lasts (final false), then the
// settled rate once the period has ended (final true, once per period).
message FundingRateUpdated {
  string symbol = 1;
  string funding_rate = 2;
  // The period's average premium index and the interest rate in the rate.
  string premium = 3;
  string interest_rate = 4;
  // Premium index samples taken in the period (one a second).
  int64 samples = 5;
  // The end of the period, when it settles (00:00, 08:00, 16:00 UTC for
  // an 8-hour interval).
  google.protobuf.Timestamp funding_time = 6;
  bool final = 7;
  // The mark and index prices the period settled at; set when final.
  string mark_price = 8;
  string index_price = 9;
  // PLATFORM (the rate computed here, as above) or BINANCE (the Binance
  // contract's estimate, and its settled rate once final; premium and
  // samples are then empty and 0), design 2026-10-06 §3.1, from batch G3a.
  // Empty reads as PLATFORM.
  string source = 10;
}

// LiquidationOccurred is a forced (liquidation) order of the reference
// market on a contract that follows it, as Binance streams them (at most
// one a second per contract, design 2026-10-06 §3.3), keyed by the
// contract (BTC-USDT-PERP), on market.liquidations.
message LiquidationOccurred {
  string symbol = 1;
  // The forced order's side: SIDE_SELL closed a long, SIDE_BUY a short.
  exchange.order.v1.Side side = 2;
  // The order's price and the average price of its fills.
  string price = 3;
  string average_price = 4;
  // The order's quantity and what of it filled: in the base asset, or
  // whole contracts of an inverse contract.
  string quantity = 5;
  string filled_quantity = 6;
  // filled_quantity x average_price, or the contracts' USD value
  // (filled_quantity x contract_size) for an inverse contract.
  string value_usd = 7;
  // The order's status when streamed: FILLED or PARTIALLY_FILLED.
  string status = 8;
  google.protobuf.Timestamp traded_at = 9;
}
