syntax = "proto3";

package exchange.ledger.v1;

// LedgerService is the only way balances change (ADR-0001). Every write
// takes an idempotency key: repeating a call with the same key and the
// same content returns the first result, and the same key with other
// content fails with COMMON_IDEMPOTENCY_CONFLICT. Amounts are decimal
// strings (ADR-0008); insufficient funds fail with
// LEDGER_INSUFFICIENT_BALANCE.
service LedgerService {
  // Freeze moves an amount from available to frozen (ORDER_FREEZE,
  // WITHDRAW_FREEZE).
  rpc Freeze(FreezeRequest) returns (FreezeResponse);
  // Unfreeze moves an amount from frozen back to available (ORDER_UNFREEZE,
  // WITHDRAW_UNFREEZE).
  rpc Unfreeze(UnfreezeRequest) returns (UnfreezeResponse);
  // Transfer moves available funds between a user's SPOT and FUTURES
  // accounts (ACCOUNT_TRANSFER).
  rpc Transfer(TransferRequest) returns (TransferResponse);
  // GetBalances returns a user's balances.
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  // SettleWithdrawal books a broadcast withdrawal (WITHDRAW_SETTLE): the
  // frozen amount and fee leave the user's SPOT account, the amount to
  // WITHDRAWAL_PENDING (an on-chain outflow), the fee to FEE_REVENUE.
  rpc SettleWithdrawal(SettleWithdrawalRequest) returns (SettleWithdrawalResponse);
  // TransferInternal completes a withdrawal to another user's deposit
  // address inside the ledger (INTERNAL_TRANSFER): the payer's frozen
  // amount becomes the payee's available SPOT balance.
  rpc TransferInternal(TransferInternalRequest) returns (TransferInternalResponse);
  // BookChainFee books gas the platform paid on chain (WITHDRAW_SETTLE
  // from GAS_SUPPLY to WITHDRAWAL_PENDING).
  rpc BookChainFee(BookChainFeeRequest) returns (BookChainFeeResponse);
  // FundSystemAccount books a platform transfer into its own hot wallet
  // as a deposit to a system account (DEPOSIT_CREDIT from
  // DEPOSIT_PENDING), such as GAS_SUPPLY.
  rpc FundSystemAccount(FundSystemAccountRequest) returns (FundSystemAccountResponse);
  // GetSystemBalances returns the platform's system accounts in an asset.
  rpc GetSystemBalances(GetSystemBalancesRequest) returns (GetSystemBalancesResponse);
  // Adjust credits (or, negative, debits) a user's SPOT account against
  // ADJUSTMENT (MANUAL_ADJUSTMENT) with an audit event; the admin console
  // calls it once two people approved (§5.12). Needs
  // ledger.manual_adjustment.
  rpc Adjust(AdjustRequest) returns (AdjustResponse);
  // SettleFutures books one settlement step of a user's perpetual contract
  // trading on the FUTURES account (requirements §11.7): the moves in
  // order, one journal each, in one transaction. Moves that charge the
  // user (FEE, LOSS, FUNDING_PAY) take at most the balance and the limit:
  // the insurance fund pays the rest of a LOSS or FUNDING_PAY, the rest of
  // a FEE is waived, so a trade the engine executed always settles unless
  // the insurance fund is short too. Repeating a key returns the first
  // outcomes.
  rpc SettleFutures(SettleFuturesRequest) returns (SettleFuturesResponse);
  // FundInsurance adds simulated funds to INSURANCE_FUND against
  // ADJUSTMENT (INSURANCE_CONTRIBUTION) with an audit event; needs
  // ledger.manual_adjustment. Real funds come on chain
  // (FundSystemAccount).
  rpc FundInsurance(FundInsuranceRequest) returns (FundInsuranceResponse);
}

message FreezeRequest {
  string idempotency_key = 1;
  string user_id = 2;
  // SPOT or FUTURES.
  string account_type = 3;
  string asset = 4;
  string amount = 5;
  // ORDER_FREEZE or WITHDRAW_FREEZE.
  string entry_type = 6;
  // What the freeze is for, e.g. an order ID.
  string reference = 7;
}

message UnfreezeRequest {
  string idempotency_key = 1;
  string user_id = 2;
  string account_type = 3;
  string asset = 4;
  string amount = 5;
  // ORDER_UNFREEZE or WITHDRAW_UNFREEZE.
  string entry_type = 6;
  string reference = 7;
}

message TransferRequest {
  string idempotency_key = 1;
  string user_id = 2;
  string asset = 3;
  string amount = 4;
  string from_account_type = 5;
  string to_account_type = 6;
}

// Posting is the result of a write.
message Posting {
  string journal_id = 1;
  // True when the key had been used before and this is the first result.
  bool replayed = 2;
}

message FreezeResponse {
  Posting posting = 1;
}

message UnfreezeResponse {
  Posting posting = 1;
}

message TransferResponse {
  Posting posting = 1;
  string transfer_id = 2;
}

message Balance {
  string account_type = 1;
  string asset = 2;
  string available = 3;
  string frozen = 4;
}

message GetBalancesRequest {
  string user_id = 1;
  // Empty for every account type.
  string account_type = 2;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

message SettleWithdrawalRequest {
  string idempotency_key = 1;
  string user_id = 2;
  string asset = 3;
  // Sent on chain.
  string amount = 4;
  // Kept by the platform; may be zero.
  string fee = 5;
  // The withdrawal ID.
  string reference = 6;
}

message SettleWithdrawalResponse {
  Posting posting = 1;
}

message TransferInternalRequest {
  string idempotency_key = 1;
  string from_user_id = 2;
  string to_user_id = 3;
  string asset = 4;
  string amount = 5;
  // The withdrawal ID.
  string reference = 6;
}

message TransferInternalResponse {
  Posting posting = 1;
}

message BookChainFeeRequest {
  string idempotency_key = 1;
  string asset = 2;
  string amount = 3;
  // The transaction hash.
  string reference = 4;
}

message BookChainFeeResponse {
  Posting posting = 1;
}

message FundSystemAccountRequest {
  string idempotency_key = 1;
  // GAS_SUPPLY, INSURANCE_FUND or MARKET_MAKER.
  string account_type = 2;
  string asset = 3;
  string amount = 4;
  // The funding transaction hash.
  string reference = 5;
}

message FundSystemAccountResponse {
  Posting posting = 1;
}

message GetSystemBalancesRequest {
  // The asset; empty for every asset.
  string asset = 1;
}

message GetSystemBalancesResponse {
  repeated Balance balances = 1;
}

message AdjustRequest {
  string idempotency_key = 1;
  string user_id = 2;
  string asset = 3;
  string amount = 4;
  string reason = 5;
  string actor = 6;
}

message AdjustResponse {
  Posting posting = 1;
}

// FuturesMove is one step of a futures settlement. Amounts are positive.
message FuturesMove {
  // UNFREEZE: the user's frozen to available (reservations, released
  //   margin). FREEZE: available to frozen (margin added).
  // FEE: the user to FEE_REVENUE.
  // PROFIT: PNL_CLEARING to the user. LOSS: the user to PNL_CLEARING.
  // FUNDING_PAY: the user to FUNDING_CLEARING. FUNDING_RECEIVE: back.
  // INSURANCE: the user to INSURANCE_FUND (what a liquidation leaves).
  string type = 1;
  string amount = 2;
  // AVAILABLE (default) or FROZEN: the user's balance the move takes from
  // or gives to.
  string balance_kind = 3;
  // FEE, LOSS, FUNDING_PAY: the most the user pays, e.g. an isolated
  // position's margin; empty for no bound but the balance.
  string limit = 4;
  // FREEZE: freeze what the available balance allows.
  bool partial = 5;
  // PROFIT, LOSS: LIQUIDATION_SETTLE or ADL_SETTLE instead of REALIZED_PNL.
  string entry_type = 6;
}

message SettleFuturesRequest {
  // The journals are keyed futures:<key>:<move index>.
  string idempotency_key = 1;
  string user_id = 2;
  // The settlement asset, USDT.
  string asset = 3;
  // What is settled, e.g. "BTC-USDT-PERP trade <id>"; the journals' memo.
  string reference = 4;
  repeated FuturesMove moves = 5;
}

// FuturesOutcome is what one move did.
message FuturesOutcome {
  // Empty when nothing moved.
  string journal_id = 1;
  // What the user's balance received (positive) or gave (negative).
  string user_amount = 2;
  // What the insurance fund paid of a LOSS or FUNDING_PAY.
  string insurance_amount = 3;
  // What was not charged of a FEE or not frozen of a FREEZE.
  string waived_amount = 4;
}

message SettleFuturesResponse {
  // One per move, in order.
  repeated FuturesOutcome outcomes = 1;
  bool replayed = 2;
}

message FundInsuranceRequest {
  string idempotency_key = 1;
  string asset = 2;
  string amount = 3;
  string reason = 4;
  string actor = 5;
}

message FundInsuranceResponse {
  Posting posting = 1;
}
