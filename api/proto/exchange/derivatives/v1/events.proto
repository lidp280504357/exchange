syntax = "proto3";

package exchange.derivatives.v1;

import "google/protobuf/timestamp.proto";

// Events of derivatives-service (requirements §8.1), keyed by user_id.
// Amounts are decimal strings in the contract's settlement asset
// (settle_asset: USDT for a linear contract, the base asset for an
// inverse one, design 2026-10-06 §2.5); quantities in the base asset, or
// whole contracts of an inverse contract (contract_size USD each). Events
// from before the inverse contracts leave settle_asset and contract_size
// empty: read them as USDT and a linear contract.
//
//   derivatives.position.events     PositionOpened, PositionChanged,
//                                   PositionClosed, MarginAdjusted,
//                                   LeverageChanged, FundingPaid, FillSettled
//   derivatives.liquidation.events  LiquidationWarning, LiquidationStarted,
//                                   LiquidationFilled, AdlExecuted
//
// Order acceptance and rejection go on derivatives.order.events with the
// engine's order events, as exchange.order.v1 messages.

// Position is a snapshot of a position after a change.
message Position {
  string position_id = 1;
  string user_id = 2;
  string symbol = 3;
  // BOTH in one-way mode; LONG or SHORT in hedge mode.
  string position_side = 4;
  // Signed: positive long, negative short, 0 when flat.
  string quantity = 5;
  // entry_cost / |quantity|; empty when flat.
  string entry_price = 6;
  // The open quantity at its entry prices; closing takes its share.
  string entry_cost = 7;
  // Frozen for the position in the FUTURES account.
  string margin = 8;
  // CROSS or ISOLATED.
  string margin_mode = 9;
  int32 leverage = 10;
  // Since the position opened.
  string realized_pnl = 11;
  // Funding received (positive) or paid.
  string funding = 12;
  int64 version = 13;
  // The asset margin, PnL and funding are in, and an inverse contract's
  // face value in USD ("0" or empty for a linear one); from batch G1.
  string settle_asset = 14;
  string contract_size = 15;
}

// PositionOpened: a fill opened a position that was flat.
message PositionOpened {
  Position position = 1;
  string trade_id = 2;
}

// PositionChanged: a fill added to or reduced a position, or turned it
// around (reason INCREASE, REDUCE or FLIP).
message PositionChanged {
  Position position = 1;
  string trade_id = 2;
  string reason = 3;
}

// PositionClosed: a fill closed the position.
message PositionClosed {
  Position position = 1;
  string trade_id = 2;
}

// MarginAdjusted: margin added to (positive) or taken from an isolated
// position, or re-sized with the leverage of a cross one.
message MarginAdjusted {
  Position position = 1;
  string amount = 2;
}

// LeverageChanged: the user's leverage on a contract.
message LeverageChanged {
  string user_id = 1;
  string symbol = 2;
  int32 leverage = 3;
}

// FundingPaid: a position paid (negative amount) or received funding at
// a settlement (§11.7).
message FundingPaid {
  Position position = 1;
  google.protobuf.Timestamp funding_time = 2;
  string funding_rate = 3;
  string mark_price = 4;
  string amount = 5;
}

// FillSettled is one side of a contract trade as its owner sees it, once
// settled.
message FillSettled {
  string trade_id = 1;
  string order_id = 2;
  string user_id = 3;
  string symbol = 4;
  // BUY or SELL.
  string side = 5;
  string position_side = 6;
  bool maker = 7;
  string price = 8;
  string quantity = 9;
  // Of the quantity, what closed a position.
  string closed_quantity = 10;
  string fee = 11;
  string realized_pnl = 12;
  bool liquidation = 13;
  google.protobuf.Timestamp executed_at = 14;
  // The asset fee and realized_pnl are in, and an inverse contract's face
  // value in USD ("0" or empty for a linear one); from batch G1.
  string settle_asset = 15;
  string contract_size = 16;
}

// Liquidations (§11.7) on derivatives.liquidation.events, keyed by user_id.

// LiquidationWarning: a position's (isolated) or the cross positions'
// margin balance is at most 1.2 times the maintenance margin.
message LiquidationWarning {
  string user_id = 1;
  // The contract of an isolated position; empty for the cross account.
  string symbol = 2;
  string position_side = 3;
  bool cross = 4;
  string margin_balance = 5;
  string maintenance_margin = 6;
  google.protobuf.Timestamp at = 7;
  // The asset of the margin balance: the cross account's or the
  // position's settlement asset; from batch G1.
  string settle_asset = 8;
  // LONG or SHORT: the isolated position's direction, which position_side
  // (BOTH in one-way mode) does not tell; empty for the cross account
  // (review FS, C49).
  string direction = 9;
}

// LiquidationStarted: the liquidation engine took a position over (its
// orders are canceled, it closes it from now on).
message LiquidationStarted {
  Position position = 1;
  bool cross = 2;
  string mark_price = 3;
  // The price the isolated position's margin runs out at.
  string bankruptcy_price = 4;
  string margin_balance = 5;
  string maintenance_margin = 6;
}

// LiquidationFilled: a liquidation order (or an auto-deleveraging) closed
// part of a taken-over position.
message LiquidationFilled {
  string user_id = 1;
  string symbol = 2;
  string position_side = 3;
  string trade_id = 4;
  string price = 5;
  string quantity = 6;
  string realized_pnl = 7;
  // What the insurance fund paid of the loss.
  string insurance_paid = 8;
  bool adl = 9;
  // The asset realized_pnl and insurance_paid are in; from batch G1.
  string settle_asset = 10;
  // LONG or SHORT: the direction of the position the fill closed (C49).
  string direction = 11;
}

// AdlExecuted: an auto-deleveraging closed part of a counterparty's
// position at the liquidated position's price.
message AdlExecuted {
  string user_id = 1;
  string symbol = 2;
  string position_side = 3;
  string trade_id = 4;
  string price = 5;
  string quantity = 6;
  string realized_pnl = 7;
  // The asset realized_pnl is in; from batch G1.
  string settle_asset = 8;
  // A coin-margined contract's face value in USD, quantity being whole
  // contracts; empty for a linear one, as on FillSettled (review FG,
  // B133: the notices name the unit).
  string contract_size = 9;
  // LONG or SHORT: the direction of the position deleveraged, which
  // position_side (BOTH in one-way mode) does not tell (review FS, C49).
  string direction = 10;
}

// CrossLiquidationCompleted: a cross account's liquidation is over, its
// cross positions closed and settled, and what it left went to the
// insurance fund as the liquidation clearance fee, as Binance does
// (coin-margined design 2026-10-06 §0, C68): the account is at zero. One
// per liquidation; a loss beyond the account fell on the fund.
message CrossLiquidationCompleted {
  string liquidation_id = 1;
  string user_id = 2;
  // The cross account's settlement asset, the fee's.
  string settle_asset = 3;
  // What went to the insurance fund, "0" when the liquidation left nothing.
  string clearance_fee = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}
