syntax = "proto3";

package exchange.user.v1;

import "google/protobuf/timestamp.proto";

// UserService owns profiles, account status and eligibility
// (requirements §5.4). Public REST endpoints are in api/openapi/user.yaml.
service UserService {
  // CreateUser creates the profile of a newly registered user. It is
  // idempotent on user_id, so auth-service may retry it.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // GetUser returns a profile, including its account status.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // CheckEligibility decides whether a user may use a feature now.
  rpc CheckEligibility(CheckEligibilityRequest) returns (CheckEligibilityResponse);
  // ChangeStatus moves an account to another status for an operator, with
  // a reason code and an audit event.
  rpc ChangeStatus(ChangeStatusRequest) returns (ChangeStatusResponse);
  // ListUsers pages through accounts for the admin console, newest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // UserStats counts accounts for the admin console's overview.
  rpc UserStats(UserStatsRequest) returns (UserStatsResponse);
  // GetUserHistory returns an account's status changes (newest first) and
  // the document versions it accepted, for the admin console.
  rpc GetUserHistory(GetUserHistoryRequest) returns (GetUserHistoryResponse);
}

message GetUserHistoryRequest {
  string user_id = 1;
}

message StatusChange {
  string from_status = 1;
  string to_status = 2;
  // An upper-case code, e.g. SUSPICIOUS_LOGIN, RISK_RULE, REVIEW_CLEARED.
  string reason_code = 3;
  // An administrator's email, cli:<os user> or system:<service>.
  string actor = 4;
  google.protobuf.Timestamp at = 5;
}

message Consent {
  // TERMS or RISK_DISCLOSURE.
  string document = 1;
  string version = 2;
  google.protobuf.Timestamp accepted_at = 3;
}

message GetUserHistoryResponse {
  repeated StatusChange status_changes = 1;
  repeated Consent consents = 2;
}

message User {
  string id = 1;
  // ACTIVE, RISK_REVIEW, FROZEN or CLOSED.
  string status = 2;
  // ISO 3166-1 alpha-2.
  string region = 3;
  string language = 4;
  string timezone = 5;
  int32 kyc_level = 6;
  // Shown in every mail we send so phishing mails stand out; empty until
  // the user sets one.
  string anti_phishing_code = 7;
  // When the account was created.
  google.protobuf.Timestamp created_at = 8;
}

message CreateUserRequest {
  string user_id = 1;
  string region = 2;
  string language = 3;
  string timezone = 4;
  // Versions of the documents the user accepted at registration.
  string terms_version = 5;
  string risk_disclosure_version = 6;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message CheckEligibilityRequest {
  string user_id = 1;
  // SPOT_TRADE, DERIVATIVES_TRADE, DEPOSIT, WITHDRAW, TRANSFER,
  // MARGIN_TRADE (margin trading, behind margin.enabled), or TEST_ASSETS
  // (the hidden test assets' deposits and withdrawals, ADR-0017).
  string feature = 2;
  // Optional dimensions for feature flags.
  string asset = 3;
  string symbol = 4;
}

message CheckEligibilityResponse {
  bool allowed = 1;
  // Why not: USER_RISK_REVIEW, USER_FROZEN, USER_CLOSED,
  // USER_REGION_NOT_ALLOWED or USER_NOT_ELIGIBLE (feature switched off).
  string reason_code = 2;
}


message ChangeStatusRequest {
  string user_id = 1;
  // ACTIVE, RISK_REVIEW, FROZEN or CLOSED.
  string to_status = 2;
  // An upper-case code such as SUSPICIOUS_LOGIN.
  string reason_code = 3;
  string actor = 4;
  string note = 5;
}

message ChangeStatusResponse {
  string from_status = 1;
  string to_status = 2;
}

message ListUsersRequest {
  // Only accounts in this status (ACTIVE, RISK_REVIEW, FROZEN, CLOSED);
  // empty for all.
  string status = 1;
  // Only accounts of this region (ISO 3166-1 alpha-2); empty for all.
  string region = 2;
  // Accounts created from this time on (unset: no bound) and before
  // created_before (unset: no bound).
  google.protobuf.Timestamp created_from = 3;
  google.protobuf.Timestamp created_before = 4;
  // The previous page's next_cursor; empty for the newest.
  string cursor = 5;
  // At most this many (1 to 200; default 50).
  int32 limit = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message UserStatsRequest {
  // Accounts created from this time on are also counted apart.
  google.protobuf.Timestamp since = 1;
  // New accounts per UTC day for the last days (today included; 0 to 90).
  int32 days = 2;
}

message UserStatsResponse {
  int64 total = 1;
  int64 created_since = 2;
  repeated DayCount days = 3;
}

// DayCount is a number of accounts created on one UTC day.
message DayCount {
  // YYYY-MM-DD.
  string day = 1;
  int64 count = 2;
}
