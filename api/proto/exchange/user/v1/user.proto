syntax = "proto3";

package exchange.user.v1;

import "google/protobuf/timestamp.proto";

// UserService owns profiles, account status and eligibility
// (requirements §5.4). Public REST endpoints are in api/openapi/user.yaml.
service UserService {
  // CreateUser creates the profile of a newly registered user. It is
  // idempotent on user_id, so auth-service may retry it.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // GetUser returns a profile, including its account status.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // CheckEligibility decides whether a user may use a feature now.
  rpc CheckEligibility(CheckEligibilityRequest) returns (CheckEligibilityResponse);
  // ChangeStatus moves an account to another status for an operator, with
  // a reason code and an audit event.
  rpc ChangeStatus(ChangeStatusRequest) returns (ChangeStatusResponse);
}

message User {
  string id = 1;
  // ACTIVE, RISK_REVIEW, FROZEN or CLOSED.
  string status = 2;
  // ISO 3166-1 alpha-2.
  string region = 3;
  string language = 4;
  string timezone = 5;
  int32 kyc_level = 6;
  // Shown in every mail we send so phishing mails stand out; empty until
  // the user sets one.
  string anti_phishing_code = 7;
  // When the account was created.
  google.protobuf.Timestamp created_at = 8;
}

message CreateUserRequest {
  string user_id = 1;
  string region = 2;
  string language = 3;
  string timezone = 4;
  // Versions of the documents the user accepted at registration.
  string terms_version = 5;
  string risk_disclosure_version = 6;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message CheckEligibilityRequest {
  string user_id = 1;
  // SPOT_TRADE, DERIVATIVES_TRADE, DEPOSIT, WITHDRAW or TRANSFER.
  string feature = 2;
  // Optional dimensions for feature flags.
  string asset = 3;
  string symbol = 4;
}

message CheckEligibilityResponse {
  bool allowed = 1;
  // Why not: USER_RISK_REVIEW, USER_FROZEN, USER_CLOSED,
  // USER_REGION_NOT_ALLOWED or USER_NOT_ELIGIBLE (feature switched off).
  string reason_code = 2;
}


message ChangeStatusRequest {
  string user_id = 1;
  // ACTIVE, RISK_REVIEW, FROZEN or CLOSED.
  string to_status = 2;
  // An upper-case code such as SUSPICIOUS_LOGIN.
  string reason_code = 3;
  string actor = 4;
  string note = 5;
}

message ChangeStatusResponse {
  string from_status = 1;
  string to_status = 2;
}
