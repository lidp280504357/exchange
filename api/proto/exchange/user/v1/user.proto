syntax = "proto3";

package exchange.user.v1;

import "google/protobuf/timestamp.proto";

// UserService owns profiles, account status and eligibility
// (requirements §5.4). Public REST endpoints are in api/openapi/user.yaml.
service UserService {
  // CreateUser creates the profile of a newly registered user. It is
  // idempotent on user_id, so auth-service may retry it.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // GetUser returns a profile, including its account status.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // FindUsername returns the account a username belongs to, whatever its
  // case (B167: the admin console's lookup, through auth-service's
  // FindUser); NOT_FOUND without one.
  rpc FindUsername(FindUsernameRequest) returns (FindUsernameResponse);
  // CheckEligibility decides whether a user may use a feature now.
  rpc CheckEligibility(CheckEligibilityRequest) returns (CheckEligibilityResponse);
  // ChangeStatus moves an account to another status for an operator, with
  // a reason code and an audit event.
  rpc ChangeStatus(ChangeStatusRequest) returns (ChangeStatusResponse);
  // ListUsers pages through accounts for the admin console, newest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // UserStats counts accounts for the admin console's overview.
  rpc UserStats(UserStatsRequest) returns (UserStatsResponse);
  // GetUserHistory returns an account's status changes (newest first) and
  // the document versions it accepted, for the admin console.
  rpc GetUserHistory(GetUserHistoryRequest) returns (GetUserHistoryResponse);
  // ResetUsername gives an account a new drawn username (user_ and 8
  // lowercase letters or digits) for an operator, a moderation step
  // (design 2026-10-07, avatars and usernames §1.6): the user is told in
  // the app (ProfileReset), and the 7-day wait does not start.
  rpc ResetUsername(ResetUsernameRequest) returns (ResetUsernameResponse);
  // ResetAvatar takes an account back to the default avatar for an
  // operator, its files deleted; the user is told in the app when there
  // was one.
  rpc ResetAvatar(ResetAvatarRequest) returns (ResetAvatarResponse);
}

message ResetUsernameRequest {
  string user_id = 1;
  // The administrator's email (audited by admin-service too).
  string actor = 2;
  string reason = 3;
}

message ResetUsernameResponse {
  User user = 1;
  // The username before.
  string previous = 2;
}

message ResetAvatarRequest {
  string user_id = 1;
  string actor = 2;
  string reason = 3;
}

message ResetAvatarResponse {
  User user = 1;
  // Whether there was an uploaded avatar to remove.
  bool removed = 2;
}

message GetUserHistoryRequest {
  string user_id = 1;
}

message StatusChange {
  string from_status = 1;
  string to_status = 2;
  // An upper-case code, e.g. SUSPICIOUS_LOGIN, RISK_RULE, REVIEW_CLEARED.
  string reason_code = 3;
  // An administrator's email, cli:<os user> or system:<service>.
  string actor = 4;
  google.protobuf.Timestamp at = 5;
}

message Consent {
  // TERMS or RISK_DISCLOSURE.
  string document = 1;
  string version = 2;
  google.protobuf.Timestamp accepted_at = 3;
}

message GetUserHistoryResponse {
  repeated StatusChange status_changes = 1;
  repeated Consent consents = 2;
}

message User {
  string id = 1;
  // ACTIVE, RISK_REVIEW, FROZEN or CLOSED.
  string status = 2;
  // ISO 3166-1 alpha-2.
  string region = 3;
  string language = 4;
  string timezone = 5;
  int32 kyc_level = 6;
  // Shown in every mail we send so phishing mails stand out; empty until
  // the user sets one.
  string anti_phishing_code = 7;
  // When the account was created.
  google.protobuf.Timestamp created_at = 8;
  // The username (design 2026-10-07, avatars and usernames), and when the
  // user last changed it (unset while it is the one drawn).
  string username = 9;
  google.protobuf.Timestamp username_changed_at = 10;
  // The uploaded avatar's paths on the sites, 256 and 64 pixels; empty for
  // the default.
  string avatar_url = 11;
  string avatar_thumb_url = 12;
  // HUMAN (a person, every sign-up), BOT (the simulated market's bots),
  // TEST (the end-to-end scripts' accounts) or SYSTEM (HOUSE and the
  // like): L0, what the console shows and filters by; nothing else reads
  // it. Operators and scripts set it (exchangectl users kind, PUT
  // /internal/users/{id}/kind: api/internal/users.yaml), not the console.
  string kind = 13;
  // When a closed test account was cleared out (L4: exchangectl users
  // purge); unset for the others.
  google.protobuf.Timestamp purged_at = 14;
  // The purge leaves this test account alone (L4: exchangectl users
  // exempt; the end-to-end scripts' standing accounts).
  bool purge_exempt = 15;
}


message CreateUserRequest {
  string user_id = 1;
  string region = 2;
  string language = 3;
  string timezone = 4;
  // Versions of the documents the user accepted at registration.
  string terms_version = 5;
  string risk_disclosure_version = 6;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message FindUsernameRequest {
  string username = 1;
}

message FindUsernameResponse {
  string user_id = 1;
}

message CheckEligibilityRequest {
  string user_id = 1;
  // SPOT_TRADE, DERIVATIVES_TRADE, DEPOSIT, WITHDRAW, TRANSFER,
  // MARGIN_TRADE (margin trading, behind margin.enabled), or TEST_ASSETS
  // (the hidden test assets' deposits and withdrawals, ADR-0017).
  string feature = 2;
  // Optional dimensions for feature flags.
  string asset = 3;
  string symbol = 4;
}

message CheckEligibilityResponse {
  bool allowed = 1;
  // Why not: USER_RISK_REVIEW, USER_FROZEN, USER_CLOSED,
  // USER_REGION_NOT_ALLOWED or USER_NOT_ELIGIBLE (feature switched off).
  string reason_code = 2;
}


message ChangeStatusRequest {
  string user_id = 1;
  // ACTIVE, RISK_REVIEW, FROZEN or CLOSED.
  string to_status = 2;
  // An upper-case code such as SUSPICIOUS_LOGIN.
  string reason_code = 3;
  string actor = 4;
  string note = 5;
}

message ChangeStatusResponse {
  string from_status = 1;
  string to_status = 2;
}

message ListUsersRequest {
  // Only accounts in this status (ACTIVE, RISK_REVIEW, FROZEN, CLOSED);
  // empty for all.
  string status = 1;
  // Only accounts of this region (ISO 3166-1 alpha-2); empty for all.
  string region = 2;
  // Accounts created from this time on (unset: no bound) and before
  // created_before (unset: no bound).
  google.protobuf.Timestamp created_from = 3;
  google.protobuf.Timestamp created_before = 4;
  // The previous page's next_cursor; empty for the newest.
  string cursor = 5;
  // At most this many (1 to 200; default 50).
  int32 limit = 6;
  // A keyword (B167): only accounts whose username contains it, whatever
  // the case, or that are among user_ids; empty for all (user_ids then
  // unused).
  string q = 7;
  // The accounts another service matched on the same keyword, listed with
  // the username matches: auth-service's SearchUsers, the email addresses
  // and phone numbers that contain it. At most 500.
  repeated string user_ids = 8;
  // Only accounts of these kinds (HUMAN, BOT, TEST, SYSTEM; L0); empty for
  // all.
  repeated string kinds = 9;
  // Purged accounts (L4) are left out unless this is set.
  bool include_purged = 10;
}

message ListUsersResponse {
  repeated User users = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message UserStatsRequest {
  // Accounts created from this time on are also counted apart.
  google.protobuf.Timestamp since = 1;
  // New accounts per UTC day for the last days (today included; 0 to 90).
  int32 days = 2;
  // Only accounts of these kinds count, in every figure (B185: the
  // console's trend follows its users list's kind filter); HUMAN, BOT,
  // TEST, SYSTEM as in ListUsersRequest.kinds; none for every kind.
  repeated string kinds = 3;
}

message UserStatsResponse {
  int64 total = 1;
  int64 created_since = 2;
  repeated DayCount days = 3;
  // The same two counts for each kind (L0), in the order HUMAN, BOT, TEST,
  // SYSTEM; total and created_since are their sums. Purged accounts (L4)
  // count nowhere.
  repeated KindCount by_kind = 4;
}

// KindCount is the accounts of one kind.
message KindCount {
  string kind = 1;
  int64 total = 2;
  int64 created_since = 3;
}

// DayCount is a number of accounts created on one UTC day.
message DayCount {
  // YYYY-MM-DD.
  string day = 1;
  int64 count = 2;
}
