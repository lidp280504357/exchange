syntax = "proto3";

package exchange.trade.v1;

import "exchange/order/v1/order.proto";

// Events on trade.events, keyed by symbol (requirements §8.1): the
// settlement input (§11.1 step 7). Amounts are decimal strings.

// TradeExecuted is one fill between a resting (maker) and an incoming
// (taker) order, at the maker's price.
message TradeExecuted {
  string trade_id = 1;
  string symbol = 2;
  string base_asset = 3;
  string quote_asset = 4;
  int64 sequence = 5;
  string price = 6;
  string quantity = 7;
  // price x quantity, exact in the quote asset (pairs are configured so).
  string quote_quantity = 8;
  exchange.order.v1.Side taker_side = 9;
  string buyer_order_id = 10;
  string buyer_user_id = 11;
  string seller_order_id = 12;
  string seller_user_id = 13;
  // True when the buyer is the maker.
  bool buyer_is_maker = 14;
  // Fees (§11.3): the buyer pays in base, the seller in quote, each at
  // the rate of their role, rounded up to the asset's decimals.
  string buyer_fee = 15;
  string seller_fee = 16;
  // What the buyer's order froze per unit: its limit price, empty for a
  // market buy; settlement releases the difference to price at once.
  string buyer_limit_price = 17;
  // The symbol's trades counted from 1, so consumers can tell a missing
  // trade (settlement reconciliation, public trade IDs). Trades from
  // before this field carry 0.
  uint64 trade_number = 18;
  // The side HOUSE took when the trade was against its reference
  // liquidity (ADR-0015): SIDE_BUY when HOUSE bought. HOUSE has no order
  // (its order ID is empty) and pays no fee; the ledger books its side on
  // the system account MARKET_MAKER (HOUSE_TRADE_SETTLE). Unspecified for
  // a trade between users.
  exchange.order.v1.Side house_side = 19;
  // The accounts the buyer's and seller's orders trade from
  // (Order.account_type: SPOT, MARGIN_CROSS, MARGIN_ISOLATED of symbol;
  // empty reads as SPOT) and their side effects (Order.side_effect), so the
  // ledger settles each side on its account and, for AUTO_REPAY, repays
  // the debt in the same entry (margin design 2026-10-06, from batch E2).
  // Empty for HOUSE's side.
  string buyer_account_type = 20;
  string seller_account_type = 21;
  string buyer_side_effect = 22;
  string seller_side_effect = 23;
}
