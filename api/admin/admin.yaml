          type: string
          description: The custodian's code, mainCoinType:coinType.
          examples: ['195:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t']
        symbol:
          type: string
        decimals:
          type: integer
        balance:
          type: [string, 'null']
          description: What the custodian holds, as it reports it.
        token:
          type: boolean
        networks:
          type: array
          description: The asset and network rows that use the coin; empty for a coin no network uses.
          items:
            type: object
            required: [asset, network]
            properties:
              asset:
                type: string
              network:
                type: string
    ChainCheck:
      type: object
      required: [holder, asset, held, expected, elsewhere, in_flight, unbooked, shortfall, addresses, checked_at]
      description: |
        Invariant 4 for one holder of an asset: shortfall = expected −
        held − elsewhere − in_flight − unbooked; above zero the holders
        miss funds.
      properties:
        holder:
          type: string
          description: UDUN for the custodian, the network (e.g. ETH-SEPOLIA) for the platform's own wallets.
        asset:
          type: string
        held:
          $ref: '#/components/schemas/Decimal'
        expected:
          $ref: '#/components/schemas/Decimal'
        elsewhere:
          $ref: '#/components/schemas/Decimal'
        in_flight:
          $ref: '#/components/schemas/Decimal'
        unbooked:
          $ref: '#/components/schemas/Decimal'
        shortfall:
          $ref: '#/components/schemas/Decimal'
        addresses:
          type: integer
        checked_at:
          type: string
          format: date-time
    CustodyCallback:
      type: object
      required: [id, provider, trade_id, kind, status, business_id, coin, address, amount, tx_hash, signature_ok, result, detail,
        attempts, received_at, processed_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        trade_id:
          type: string
        kind:
          type: string
          enum: ['', DEPOSIT, WITHDRAWAL]
        status:
          type: [integer, 'null']
          description: The custodian's status (0 review, 1 approved, 2 refused, 3 success, 4 failed).
        business_id:
          type: string
          description: The withdrawal ID of a withdrawal.
        coin:
          type: string
        address:
          type: string
        amount:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        tx_hash:
          type: string
        signature_ok:
          type: boolean
        result:
          type: string
          enum: [RECEIVED, APPLIED, IGNORED, UNMATCHED, REJECTED, FAILED, DISCREPANCY]
        detail:
          type: string
        attempts:
          type: integer
        received_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time
        raw:
          type: string
          description: The request as received (one callback only).
