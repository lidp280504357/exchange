                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/candles:
    get:
      operationId: candleReport
      summary: Candles of a symbol from the trades read model, newest first
      description: Intervals are aligned to the epoch in UTC. Needs reports.read.
