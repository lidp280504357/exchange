        Needs reports.read.
      tags: [reports, derivatives]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DerivativesDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/open-interest:
    get:
      operationId: openInterestReport
      summary: Each contract's open positions from the positions read model
      description: |
        The latest position snapshots (derivatives_positions); a few
        seconds behind derivatives-service. Needs reports.read.
      tags: [reports, derivatives]
      responses:
        '200':
          description: The contracts with open positions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenInterest'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/users:
    get:
      operationId: usersReport
      summary: The users' activity per day, week or month (UTC), oldest first
      description: |
        Per bucket: the accounts registered and signed in (the auth
        events), those trading (either side of a spot trade, or a
        contract fill) and those with a deposit credited, each counted
        once; total is every account registered by the bucket's end.
        HOUSE and the simulated market's bots are left out (partial names
        "bots" when market-sim could not say which they are). Every bucket
        of the period comes, empty ones too. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items, partial]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsersBucket'
                  partial:
                    type: array
                    items:
                      type: string
                      enum: [bots]
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/house-pnl:
    get:
      operationId: housePnLReport
      summary: HOUSE's result per day, week or month (UTC) in USDT, oldest first
      description: |
        Spot (ADR-0013, ADR-0015): HOUSE's trading valued day by day, the
        quote it got less paid plus the base it holds from trading at each
        pair's last price that day, in USDT at the last price of the quote
        asset's USDT pair; spot_pnl is its change over the bucket and
        spot_result its level since HOUSE began, at the bucket's end. A
        pair without a price when one is needed is left out of every day
        (unpriced). Contracts: the realized results of HOUSE's fills less
        their fees, and the funding it got (negative when it paid). total
        sums the three; cumulative runs over the period. Needs
        reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items, unpriced]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HousePnLBucket'
                  unpriced:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts:
    get:
      operationId: listContractStates
      summary: Each perpetual contract's status, reduce-only state, mark price and open interest
      description: |
        Live from derivatives-service. A contract goes reduce-only by
        itself when its index or mark price fails (requirements §11.7:
        risk.events SystemDegraded); only a person lifts it. Needs
        derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The contracts.
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractState'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/status:
    post:
      operationId: setContractStatus
      summary: Move a perpetual contract to another status
      description: |
        The same transitions as trading pairs (PREPARE → TRADING ⇄ HALT;
        TRADING or HALT → CANCEL_ONLY → DELISTED) and the same guard: a
        halt at once (200), any other move confirmed from its preview and
        waiting (202); instrument-service records it. Needs
        instruments.trading (ADMIN).
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Halted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '202':
          description: The change confirmed, waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/status/preview:
    post:
      operationId: previewContractStatus
      summary: What moving a perpetual contract to another status does
      description: As POST /admin/v1/instruments/pairs/{symbol}/status/preview. Needs instruments.trading.
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
      responses:
        '200':
          description: The move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/lift-reduce-only:
    post:
      operationId: liftReduceOnly
      summary: End a contract's reduce-only once its prices are sound again
      description: |
        lifted is false when the contract was not reduce-only. Check the
        mark price first: a contract whose mark is still stale degrades
        again within seconds. Needs derivatives.write.
      tags: [derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                required: [symbol, lifted]
                properties:
                  symbol:
                    type: string
                  lifted:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/risk:
    get:
      operationId: listRiskPositions
      summary: Positions warned, taken over by the liquidation engine or close to it
      description: |
        Live from derivatives-service: positions taken over, warned
        (margin balance at most 1.2 × maintenance margin) or with a margin
        ratio of at least 0.5, riskiest first. Cross positions are
        measured on their own here. Needs derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskPosition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/liquidations:
    get:
      operationId: listLiquidations
      summary: Liquidation steps, newest first
      description: From the ClickHouse read model derivatives_liquidations. Needs derivatives.read.
      tags: [derivatives]
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: kind
          in: query
          description: Empty for all.
          schema:
            type: string
            enum: [WARNING, STARTED, FILLED, ADL]
        - name: symbol
          in: query
          description: One contract (BTC-USDT-PERP).
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of steps.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LiquidationStep'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/positions:
    get:
      operationId: listPositions
      summary: Every user's open contract positions, riskiest first
      description: |
        From derivatives-service, valued at the mark price: highest margin
        ratio (maintenance margin / margin balance) first, then the
        largest; HOUSE's positions come last. Cross positions are measured
        on their own; their liquidation price is on the user's page, and
        they count as warned when their cross account is. mark_fresh says
        whether the mark price is fresh. At most `limit` (500) positions;
        `truncated` says there are more. Needs derivatives.read.
      tags: [derivatives]
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - name: watch
          in: query
          description: true for the positions under watch only (warned, their cross account warned, taken over, margin ratio ≥ 0.5); never HOUSE's.
          schema:
            type: string
            enum: ['true']
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions, truncated, house_user_id]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskPosition'
                  truncated:
                    type: boolean
                  house_user_id:
                    type: [string, 'null']
                    description: HOUSE's account on the contracts (its positions are the counterparty of users').
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-fund:
    get:
      operationId: getInsuranceFund
      summary: The insurance fund's balance
      description: |
        The ledger's INSURANCE_FUND system account, with PNL_CLEARING (the
        open positions' unsettled results, which may be negative). Needs
        derivatives.read.
      tags: [derivatives]
      parameters:
        - name: asset
          in: query
          schema:
            type: string
            default: USDT
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceFund'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-fund/contributions:
    post:
      operationId: requestInsuranceFunding
      summary: Contribute simulated funds to the insurance fund
      description: |
        Creates a PENDING INSURANCE_FUND request for another administrator
        with ledger.adjust.approve, or with `direct` carries it out at once
        when single-person mode and its limits allow (as POST
        /admin/v1/users/{id}/adjustments does for an adjustment); booking
        it (ledger FundInsurance, INSURANCE_CONTRIBUTION from ADJUSTMENT)
        needs the flag ledger.manual_adjustment. Needs
        ledger.adjust.request.
      tags: [derivatives, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                asset:
                  type: string
                  default: USDT
                amount:
                  description: Positive.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                direct:
                  type: boolean
                  default: false
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/house:
    get:
      operationId: getHouse
      summary: HOUSE's book (virtual liquidity, ADR-0013 and ADR-0015)
      description: |
        HOUSE's spot inventory (the ledger's MARKET_MAKER accounts) valued
        at the last prices, what it traded per pair (the trades read model)
        and its result at those prices, and its perpetual contract
        positions (the account HOUSE_USER_ID). Internal assets go below
        zero when HOUSE sold them short. A part that cannot be read is left
        empty and named in `partial`. Needs reports.read.
      tags: [reports]
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/health:
    get:
      operationId: getHealth
      summary: Every service's readiness
      description: |
        Asks each service's ops endpoint (/readyz) within 2 seconds; with
        details=true also reads its metrics (its version, its Kafka
        consumers' lag and the records they parked in a DLQ since it
        started) and the reference feed's state: the system health page.
        Needs reports.read.
      tags: [reports]
      parameters:
        - name: details
          in: query
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: The services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceHealth'
                  feed:
                    description: With details; left out when market-data-service could not be asked.
                    $ref: '#/components/schemas/FeedStatus'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/system-balances:
    get:
      operationId: getSystemBalances
      summary: The platform's system accounts
      description: |
        FEE_REVENUE, INSURANCE_FUND, MARKET_MAKER (HOUSE), PNL_CLEARING,
        ADJUSTMENT, DEPOSIT_PENDING and the rest, in one asset or all.
        Needs reports.read.
      tags: [ledger]
      parameters:
        - name: asset
          in: query
          description: One asset; every asset when empty.
          schema:
            type: string
      responses:
        '200':
          description: The accounts by type and asset.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      required: [account_type, asset, available, frozen]
                      properties:
                        account_type:
                          type: string
                        asset:
                          type: string
                        available:
                          $ref: '#/components/schemas/Decimal'
                        frozen:
                          $ref: '#/components/schemas/Decimal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/reconciliation:
    get:
      operationId: getReconciliation
      summary: The ledger's invariant checks
      description: |
        The latest run of every check of the ledger's reconciliation (hourly,
        requirements §11.4) and the last 50 runs that found mismatches, with
        the first ten mismatches of each. Needs reports.read.
      tags: [ledger]
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [latest, failures]
                properties:
                  latest:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
                  failures:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody:
    get:
      operationId: getCustody
      summary: The custody wallet (ADR-0011)
      description: |
        The custodian's coins with their balances as it reports them now,
        matched to the networks that use them; the latest chain check of
        each holder and asset (the custodian and the platform's own
        wallets: held, expected by the ledger, held elsewhere, on its way
        out, unbooked fees, shortfall); the withdrawals with the custodian;
        and how many callbacks need a person. Without a configured
        custodian `configured` is false; an unreachable one leaves `coins`
        empty and says why in `error`. One custodian at a time (`provider`;
        its own checks and the platform wallets'). Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: provider
          in: query
          description: |
            The custodian: UDUN (the default) or UDUNMOCK, the stand-in that
            serves only the hidden test asset (ADR-0017).
          schema:
            type: string
            enum: [UDUN, UDUNMOCK]
      responses:
        '200':
          description: The custody wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyOverview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks:
    get:
      operationId: listCustodyCallbacks
      summary: The custodians' callbacks, newest first
      description: Every callback as received, with its signature check and outcome; one custodian's when `provider` is given. Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: provider
          in: query
          description: |
            The custodian: UDUN (the default) or UDUNMOCK, the stand-in that
            serves only the hidden test asset (ADR-0017).
          schema:
            type: string
            enum: [UDUN, UDUNMOCK]
        - name: result
          in: query
          description: One outcome; every outcome when empty.
          schema:
            type: string
            enum: [RECEIVED, APPLIED, IGNORED, UNMATCHED, REJECTED, FAILED, DISCREPANCY]
        - name: kind
          in: query
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAWAL]
        - name: q
          in: query
          description: A trade ID, withdrawal ID (businessId), transaction hash or address.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of callbacks.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyCallback'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks/{id}:
    get:
      operationId: getCustodyCallback
      summary: One callback with the request as received
      description: Needs withdrawals.read.
      tags: [custody]
      parameters:
        - $ref: '#/components/parameters/CallbackID'
      responses:
        '200':
          description: The callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyCallback'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks/{id}/replay:
    post:
      operationId: replayCustodyCallback
      summary: Apply a stored callback again
      description: |
        For a verified callback that FAILED, stayed UNMATCHED or RECEIVED:
        its signature is checked again (not its age) and it is applied as
        if it had just arrived, which is harmless for one already applied.
        Audited. Needs withdrawals.review.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/CallbackID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The callback after the replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyCallback'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/fees:
    get:
      operationId: listCustodyFees
      summary: The custodians' withdrawal fees, newest first
      description: |
        A custodian's fee on a withdrawal is booked from GAS_SUPPLY as it
        comes (BOOKABLE; journal_id null while GAS_SUPPLY is short), or
        held for a person (HELD: its unit on the network is not confirmed,
        or it looks wrong) who books or writes it off (C6). One
        custodian's when `provider` is given. Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: provider
          in: query
          description: The custodian (UDUN, UDUNMOCK); every custodian's when empty.
          schema:
            type: string
            enum: [UDUN, UDUNMOCK]
        - name: status
          in: query
          description: One status; every status when empty.
          schema:
            type: string
            enum: [HELD, BOOKABLE, WRITTEN_OFF]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of fees.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyFee'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/fees/{withdrawal_id}/book:
    post:
      operationId: bookCustodyFee
      summary: Book a held fee from GAS_SUPPLY
      description: |
        As the custodian reported it, or in the asset and amount found
        charged (the platform must hold that asset with the custodian on
        the withdrawal's network, at most its decimals; else 400: write it
        off). wallet-service records the decision and audits it as
        wallet.custody.fee.book with the administrator as the actor, as
        exchangectl wallet custody-fee does; its processor books it within
        a round. As charged is at most 5 times what was reported: by
        amount in the reported asset, by worth in USDT at the last prices
        in another (422 ADMIN_FEE_ABOVE_REPORTED; ADMIN_FEE_UNPRICED when
        one of the two has no fresh price): more is booked with exchangectl
        wallet custody-fee (review ㉖). As charged, a fee not among the
        held ones is refused (409 ADMIN_FEE_NOT_HELD, review ㉗). A fee that waits for no one
        (booked, written off) is 409 WALLET_CUSTODY_FEE_NOT_HELD (details
        status), one another decision took first 409
        WALLET_CUSTODY_FEE_CHANGED; a withdrawal without a custodian's fee
        404 WALLET_CUSTODY_FEE_NOT_FOUND. Needs ledger.adjust.approve.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/FeeWithdrawalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                asset:
                  type: string
                  description: The asset it was charged in; the reported one when absent.
                amount:
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The fee as decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyFee'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/fees/{withdrawal_id}/write-off:
    post:
      operationId: writeOffCustodyFee
      summary: Write a held fee off
      description: |
        For a fee not taken from the coin balances the platform holds, or
        reported in another unit: nothing is booked. Also a BOOKABLE one
        still waiting for GAS_SUPPLY. Audited by wallet-service as
        wallet.custody.fee.write_off. 409 WALLET_CUSTODY_FEE_NOT_HELD or
        _CHANGED when it waits for no one, 404 WALLET_CUSTODY_FEE_NOT_FOUND
        without a fee. Needs ledger.adjust.approve.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/FeeWithdrawalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The fee as decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyFee'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/assets:
    get:
      operationId: listMarginAssets
      summary: The margin assets' parameters, with what is lent of each now
      description: |
        Draft (design 2026-10-06 §4.1, §8; E0 contract §8 asset_params).
        Every asset that can be borrowed or counts as collateral, with its
        parameters (margin-service's, seeded from margin.json), what users
        owe of it now (HOUSE's lending, −Σ the users' debt rows) and the
        rate the next hour's interest takes. Needs instruments.read.
      tags: [margin]
      responses:
        '200':
          description: The assets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginAsset'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/assets/{asset}:
    parameters:
      - name: asset
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Z0-9]{2,12}$'
    put:
      operationId: setMarginAsset
      summary: Change an asset's margin parameters
      description: |
        Draft (design §8). Needs instruments.trading (ADMIN: the trading
        parameters); admin-service asks margin-service to change it. What
        only stops new borrowing applies at once: 200, audited as
        admin.margin.asset_changed with the fields before and after
        (borrowing switched off, a lower pool or user cap; the loans stay).
        Anything else waits for a second ADMIN with instruments.trading in
        either approval mode: 202 with a MARGIN_PARAMS request, escalation
        MARGIN_RISK (the interest model and its rates; the haircut and
        collateral switched either way, which move every holder's margin
        level; borrowing switched on, a higher cap). A request mixing both
        waits whole. expected_version is the version read: 409
        MARGIN_PARAMS_CHANGED when it moved, then and when the request is
        approved. A change of the asset waiting already: 409
        ADMIN_MARGIN_CHANGE_PENDING (details approval_id). A request lapses
        a day after it was asked for. 400 unless haircut is 0 to 1,
        user_cap at most pool_cap, the rates at least 0 and the floating
        curve rising (base_rate ≤ kink_rate ≤ max_rate, kink above 0 and
        under 1).
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarginAssetParams'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Applied at once (it only stops new borrowing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAsset'
        '202':
          description: Waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/settings:
    get:
      operationId: getMarginSettings
      summary: The cross account's terms and the liquidation fee
      description: |
        Draft (design §4.2, §4.4, §8; E0 contract §8 settings). The cross
        account's leverage and thresholds, the liquidation fee, and the
        thresholds a pair without its own takes by its leverage. Needs
        instruments.read.
      tags: [margin]
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setMarginSettings
      summary: Change the cross account's terms or the liquidation fee
      description: |
        Draft (design §8). Needs instruments.trading; every change waits
        for a second ADMIN with it, in either approval mode: 202 with a
        MARGIN_PARAMS request, escalation MARGIN_RISK (a threshold moved
        either way liquidates or spares accounts at once, a leverage
        changes what may be borrowed). 400 unless the cross leverage is 3
        or 5, its liquidation_level above 1 and under its warn_level, and
        liquidation_fee_rate 0 to 0.1. expected_version, a change waiting
        already and the lapse as for an asset. Audited as
        admin.margin.settings_changed once applied.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarginSettingsParams'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/pairs:
    get:
      operationId: listMarginPairs
      summary: The pairs margin trades on, with their isolated terms
      description: |
        Draft (design §4.2, §8; E0 contract §8 pair_params). The pairs
        whose two assets are both margin assets: whether each takes
        isolated accounts, its isolated leverage and thresholds (its own,
        or its leverage's), and the isolated accounts on it. The cross
        account trades all of them on its own terms. Needs
        instruments.read.
      tags: [margin]
      responses:
        '200':
          description: The pairs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginPair'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/pairs/{symbol}:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    put:
      operationId: setMarginPair
      summary: Change a pair's isolated terms
      description: |
        Draft (design §8). Needs instruments.trading. Switching isolated
        accounts off applies at once (200: no new isolated account on the
        pair, those open stay; audited as admin.margin.pair_changed).
        Anything else waits for a second ADMIN with it, in either approval
        mode (202 with a MARGIN_PARAMS request, escalation MARGIN_RISK):
        the leverage and the thresholds (null for the leverage's), which
        the pair's accounts take at once, and switching isolated accounts
        on. 400 unless liquidation_level is above 1 and under warn_level.
        expected_version, a change waiting already and the lapse as for an
        asset.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarginPairParams'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Applied at once (isolated accounts switched off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginPair'
        '202':
          description: Waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts:
    get:
      operationId: listMarginAccounts
      summary: Margin accounts, riskiest first
      description: |
        Draft (design §2, §8). From margin-service, valued as it values
        them (§2): the lowest margin level (total assets ÷ total
        liabilities) first, the accounts without liabilities last, by net
        assets. Accounts that hold or owe nothing are left out. At most
        `limit`; truncated says there are more. Needs derivatives.read.
      tags: [margin]
      parameters:
        - name: status
          in: query
          description: Empty for all.
          schema:
            $ref: '#/components/schemas/MarginAccountStatus'
        - name: account
          in: query
          schema:
            $ref: '#/components/schemas/MarginAccountType'
        - name: symbol
          in: query
          description: One pair's isolated accounts (BTC-USDT).
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginAccount'
                  truncated:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    get:
      operationId: getMarginAccount
      summary: A margin account with its balances and debts, loans, interest and liquidations
      description: |
        Draft (design §8). The account as listed; each asset it holds or
        owes, with its worth; its loans by asset; the latest 50 borrows and
        repayments; the latest 50 interest charges; the latest 20
        liquidations. Needs derivatives.read.
      tags: [margin]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccountDetail'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}/freeze:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    post:
      operationId: freezeMarginAccount
      summary: Freeze a margin account
      description: |
        Draft (design §8). Cancels its open orders; no orders, borrowing
        or transfers out until it is unfrozen (status FROZEN). Interest
        goes on, and the system still liquidates it at the liquidation
        line. Needs derivatives.write; one administrator, at once; audited
        as admin.margin.account_frozen. Frozen already: 409 MARGIN_FROZEN.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The account, frozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccount'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    post:
      operationId: unfreezeMarginAccount
      summary: Unfreeze a margin account an administrator froze
      description: |
        Draft (design §8). Needs derivatives.write; one administrator, at
        once; audited as admin.margin.account_unfrozen. Not frozen by an
        administrator (a liquidation's freeze ends with it): 409
        ADMIN_MARGIN_NOT_FROZEN.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The account, unfrozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccount'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}/liquidate:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    post:
      operationId: liquidateMarginAccount
      summary: Ask for a margin account's liquidation (a second administrator approves)
      description: |
        Draft (design §4.5, §8). Liquidates the account as the system does
        at the liquidation line, whatever its margin level: frozen, its
        orders canceled, its assets sold to HOUSE at the market to repay
        its debts, the fee to the insurance fund (INSURANCE_FUND), a
        shortfall from it. Needs derivatives.write; always waits for a
        second administrator with it, in either approval mode (202 with a
        MARGIN_LIQUIDATE request, escalation MARGIN_RISK); approved, it
        starts at once and the request's result names the liquidation.
        Nothing owed: 409 ADMIN_MARGIN_NOTHING_OWED; a liquidation under
        way: 409 MARGIN_FROZEN; a request for the account waiting already:
        409 ADMIN_MARGIN_CHANGE_PENDING (details approval_id).
      tags: [margin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Waits for a second administrator.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/liquidations:
    get:
      operationId: listMarginLiquidations
      summary: Margin liquidations, newest first
      description: |
        Draft (design §8). From the ClickHouse read model
        margin_liquidations: one row a liquidation, at the liquidation
        line or approved by hand, with the debts it repaid, what stayed,
        its fee to the insurance fund and any shortfall the fund covered.
        Needs reports.read.
      tags: [margin]
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: account
          in: query
          schema:
            $ref: '#/components/schemas/MarginAccountType'
        - name: symbol
          in: query
          description: One pair's isolated accounts (BTC-USDT).
          schema:
            type: string
        - name: trigger
          in: query
          schema:
            type: string
            enum: [AUTO, MANUAL]
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of liquidations.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginLiquidation'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/interest:
    get:
      operationId: marginInterestReport
      summary: Margin interest per day, week or month (UTC) and asset, oldest first
      description: |
        Draft (design §4.3, §8). From the ClickHouse read model
        margin_interest: per bucket and asset, the interest charged
        (MARGIN_INTEREST, income at accrual) and repaid, what users owe at
        the bucket's end, the average principal and hourly rate, and the
        accounts charged; in the asset, and in USDT at the bucket's last
        price (null without one). Needs reports.read.
      tags: [margin]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
        - name: asset
          in: query
          description: One asset; all when absent.
          schema:
            type: string
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginInterestBucket'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: admin_session
    csrf:
      type: apiKey
      in: header
      name: X-Admin-CSRF
      description: The value "1" on every request other than GET; a cross-site form cannot set it.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Every request that moves money carries one (C5.5 ⑥): the console makes a key per operation and sends it again with
        each retry. The first request with a key makes the operation (its approval, hold, closing order or message takes
        its ID from the key); the same request again answers with what it made, finishing a fund operation whose outcome
        was unknown; the key with another request fails with 409 COMMON_IDEMPOTENCY_CONFLICT. Keys are each
        administrator's own and kept 24 hours. Missing or longer than 128 characters: 400.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FeeWithdrawalID:
      name: withdrawal_id
      in: path
      required: true
      description: The withdrawal the custodian charged the fee on.
      schema:
        type: string
        format: uuid
    CallbackID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The previous page's next_cursor; omitted for the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      description: From this time on (RFC 3339).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Before this time (RFC 3339).
      schema:
        type: string
        format: date-time
    UserFilter:
      name: user_id
      in: query
      schema:
        type: string
        format: uuid
    Accounts:
      name: accounts
      in: query
      description: >-
        Keeps the simulated market's bots (bots) or everyone else (users); all when absent. Needs market-sim's list of
        bots (503 COMMON_UNAVAILABLE without it); without the filter the rows are only marked, and stay unmarked while
        market-sim does not answer.
      schema:
        type: string
        enum: [bots, users]
    Days:
      name: days
      in: query
      description: Days back, today included.
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 7
    ReportFrom:
      name: from
      in: query
      description: |
        The period's first day (UTC), instead of days; to defaults to
        today. At most a year by day, three years by week or month.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: The period's last day (UTC), included; needs from.
      schema:
        type: string
        format: date
    ReportBucket:
      name: bucket
      in: query
      description: The rows' span; a row's day is its bucket's first (a week starts on Monday).
      schema:
        type: string
        enum: [day, week, month]
        default: day
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Contract:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        examples: [BTC-USDT-PERP]
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        examples: [BTC-USDT]
    ChangeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MarginUserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MarginAccountKey:
      name: account
      in: path
      required: true
      description: MARGIN_CROSS, or MARGIN_ISOLATED:<symbol> for an isolated account (design 2026-10-06 §2).
      schema:
        type: string
        pattern: '^(MARGIN_CROSS|MARGIN_ISOLATED:[A-Z0-9]{2,12}-[A-Z0-9]{2,12})$'
        examples: [MARGIN_CROSS, 'MARGIN_ISOLATED:BTC-USDT']
  responses:
    Error:
      $ref: '../openapi/common.yaml#/components/responses/Error'
  schemas:
    House:
      type: object
      required: [assets, pairs, contracts, totals, partial]
      properties:
        assets:
          type: array
          items:
            type: object
            required: [asset, backed, balance, price, value_usdt]
            properties:
              asset:
                type: string
              backed:
                type: boolean
                description: The asset has deposits or withdrawals; HOUSE must hold it to sell it.
              balance:
                $ref: '#/components/schemas/Decimal'
              price:
                description: USDT per unit (the last price of its USDT pair); null without one.
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
              value_usdt:
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
        pairs:
          type: array
          items:
            type: object
            required: [symbol, trades, bought_base, sold_base, paid_quote, got_quote, last_at, net_base, net_quote, price, pnl_usdt]
            properties:
              symbol:
                type: string
              trades:
                type: integer
              bought_base:
                $ref: '#/components/schemas/Decimal'
              sold_base:
                $ref: '#/components/schemas/Decimal'
              paid_quote:
                $ref: '#/components/schemas/Decimal'
              got_quote:
                $ref: '#/components/schemas/Decimal'
              last_at:
                type: string
                format: date-time
              net_base:
                description: Bought less sold.
                $ref: '#/components/schemas/Decimal'
              net_quote:
                description: Got less paid.
                $ref: '#/components/schemas/Decimal'
              price:
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
              pnl_usdt:
                description: net_base at the last price plus net_quote (USDT pairs); null without a price.
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
        contracts:
          type: array
          description: HOUSE's open positions as derivatives-service renders a user's positions.
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          required: [inventory_usdt, backed_usdt, internal_usdt, pnl_usdt]
          properties:
            inventory_usdt:
              $ref: '#/components/schemas/Decimal'
            backed_usdt:
              $ref: '#/components/schemas/Decimal'
            internal_usdt:
              description: Below zero while HOUSE is short on internal assets.
              $ref: '#/components/schemas/Decimal'
            pnl_usdt:
              $ref: '#/components/schemas/Decimal'
        partial:
          type: array
          items:
            type: string
            enum: [prices, assets, inventory, trades, contracts]
    ServiceHealth:
      type: object
      required: [service, ready, latency_ms]
      properties:
        service:
          type: string
        ready:
          type: boolean
        latency_ms:
          type: integer
        error:
          type: string
        version:
          type: string
          description: With details; the commit the service was built from.
        kafka_lag:
          type: integer
          description: With details, for a service with Kafka consumers; records behind, summed over its consumers.
        dlq:
          type: integer
          description: With details, for a service with Kafka consumers; records parked in a DLQ since it started.
        config_present:
          type: object
          additionalProperties:
            type: boolean
          description: With details, whether the third parties the service uses are configured (exchange_config_present{item}), never their values.
    ReconciliationRun:
      type: object
      required: [check, started_at, mismatches, details]
      properties:
        check:
          type: string
          examples: [JOURNAL_BALANCED]
        started_at:
          type: string
          format: date-time
        mismatches:
          type: integer
        details:
          type: array
          description: The first ten mismatches.
          items:
            type: object
            required: [key, detail]
            properties:
              key:
                type: string
              detail:
                type: string
    NextCursor:
      type: [string, 'null']
      description: Pass as cursor for the next page; null on the last.
    UserSummary:
      type: object
      required: [id, status, region, language, kyc_level, created_at, tags]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
        region:
          type: string
        language:
          type: string
        timezone:
          type: string
          description: An IANA zone; empty for the browser's.
        kyc_level:
          type: integer
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          description: The console's tags on the account.
          items:
            type: string
    Note:
      type: object
      required: [id, body, admin_id, admin_email, created_at]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        admin_id:
          type: string
          format: uuid
        admin_email:
          type: string
        created_at:
          type: string
          format: date-time
    Order:
      type: object
      required: [order_id, client_order_id, user_id, symbol, side, type, time_in_force, price, quantity, quote_amount, status,
        filled_quantity, filled_quote, reason, created_at, updated_at, bot]
      properties:
        order_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        user_id:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL, '']
          description: Empty for an order the trading service refused before it was accepted (its rejection carries no side or type).
        type:
          type: string
          examples: [LIMIT, MARKET]
        time_in_force:
          type: string
        price:
          $ref: '#/components/schemas/NullableDecimal'
        quantity:
          $ref: '#/components/schemas/NullableDecimal'
        quote_amount:
          $ref: '#/components/schemas/NullableDecimal'
        status:
          type: string
        filled_quantity:
          $ref: '#/components/schemas/Decimal'
        filled_quote:
          $ref: '#/components/schemas/Decimal'
        reason:
          type: string
          description: Why it was canceled or rejected; empty otherwise.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        bot:
          type: boolean
          description: A simulated market's bot placed it (false while market-sim does not answer).
    Trade:
      type: object
      required: [trade_id, symbol, trade_number, price, quantity, quote_quantity, taker_side, buyer_user_id, buyer_order_id,
        seller_user_id, seller_order_id, buyer_is_maker, buyer_fee, seller_fee, executed_at, buyer_bot, seller_bot]
      properties:
        trade_id:
          type: string
          format: uuid
        symbol:
          type: string
        trade_number:
          type: integer
          format: int64
        price:
          $ref: '#/components/schemas/Decimal'
        quantity:
          $ref: '#/components/schemas/Decimal'
        quote_quantity:
          $ref: '#/components/schemas/Decimal'
        taker_side:
          type: string
          enum: [BUY, SELL]
        buyer_user_id:
          type: string
        buyer_order_id:
          type: string
        seller_user_id:
          type: string
        seller_order_id:
          type: string
        buyer_is_maker:
          type: boolean
        buyer_fee:
          $ref: '#/components/schemas/Decimal'
        seller_fee:
          $ref: '#/components/schemas/Decimal'
        executed_at:
          type: string
          format: date-time
        house_side:
          type: string
          enum: ['', BUY, SELL]
          description: The side HOUSE took (its virtual liquidity, ADR-0015); empty between users.
        buyer_bot:
          type: boolean
          description: The buyer is a simulated market's bot (false while market-sim does not answer).
        seller_bot:
          type: boolean
          description: The seller is a simulated market's bot.
    Deposit:
      type: object
      required: [deposit_id, user_id, asset, network, kind, address, tx_hash, amount, status, unclaimed, reason, confirmations,
        required_confirmations, updated_at]
      properties:
        deposit_id:
          type: string
          format: uuid
        user_id:
          type: string
          description: Empty for a deposit to no known address.
        asset:
          type: string
        network:
          type: string
        kind:
          type: string
          examples: [CHAIN, INTERNAL]
        address:
          type: string
        tx_hash:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        status:
          type: string
        unclaimed:
          type: boolean
        reason:
          type: string
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        updated_at:
          type: string
          format: date-time
    FeedStatus:
      type: object
      description: The reference feed (market-data-service).
      required: [state, received_at, followed, halted]
      properties:
        state:
          type: string
          enum: [OFF, OK, DELAYED, DOWN]
        received_at:
          type: [string, 'null']
          format: date-time
        followed:
          type: array
          items:
            type: string
        halted:
          type: array
          description: Pairs halted because the feed was lost (market.halt_on_feed_loss).
          items:
            type: object
            required: [symbol, halted_at]
            properties:
              symbol:
                type: string
              halted_at:
                type: string
                format: date-time
    Dashboard:
      type: object
      required: [users, trading, wallet, risk, feed, series, partial]
      properties:
        users:
          type: object
          required: [total, new_24h]
          properties:
            total:
              type: integer
              format: int64
            new_24h:
              type: integer
              format: int64
        trading:
          type: object
          required: [trades_24h, active_traders_24h, turnover_24h]
          properties:
            trades_24h:
              type: integer
              format: int64
            active_traders_24h:
              type: integer
              format: int64
            turnover_24h:
              type: array
              items:
                type: object
                required: [quote_asset, amount]
                properties:
                  quote_asset:
                    type: string
                  amount:
                    $ref: '#/components/schemas/Decimal'
        wallet:
          type: object
          required: [pending_deposits, pending_withdrawals]
          properties:
            pending_deposits:
              type: integer
              format: int64
              description: Deposits detected or confirming.
            pending_withdrawals:
              type: integer
              format: int64
              description: Withdrawals waiting for review.
        risk:
          type: object
          required: [events_24h]
          properties:
            events_24h:
              type: integer
              format: int64
        feed:
          description: The reference feed; null when market-data-service could not be asked.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FeedStatus'
        series:
          type: array
          description: One per UTC day, oldest first.
          items:
            type: object
            required: [day, new_users, trades, turnover_usdt]
            properties:
              day:
                type: string
                format: date
              new_users:
                type: integer
                format: int64
              trades:
                type: integer
                format: int64
              turnover_usdt:
                $ref: '#/components/schemas/Decimal'
        partial:
          type: array
          description: The parts that could not be read (users, activity, feed).
          items:
            type: string
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['12.5']
    SimParams:
      type: object
      description: The model's and the bots' settings by name (numbers; docs/runbook/market-sim.md「设置」).
      additionalProperties:
        type: number
    SimStatus:
      type: object
      required: [symbol, enabled, running, target_price, last_price, references_fresh, params, version, guards, bots, events, perp,
        perp_running, anchor_price, price_band, quote_center, walking, band_distance, last_trade_at, watchdog, at]
      properties:
        symbol:
          type: string
        enabled:
          type: boolean
        running:
          type: boolean
        target_price:
          type: [string, 'null']
        last_price:
          type: [string, 'null']
        references_fresh:
          type: boolean
        params:
          $ref: '#/components/schemas/SimParams'
        version:
          type: integer
        guards:
          type: object
          additionalProperties:
            type: integer
        bots:
          type: array
          items:
            $ref: '#/components/schemas/SimBot'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SimEvent'
        perp:
          type: string
          description: The perpetual on the coin; empty without one.
        perp_running:
          type: boolean
        anchor_price:
          type: [string, 'null']
        price_band:
          type: string
        quote_center:
          type: [string, 'null']
        walking:
          type: boolean
        band_distance:
          type: [number, 'null']
          description: The target's distance from the anchor in bands (within ±1 inside the band).
        last_trade_at:
          type: [string, 'null']
          format: date-time
        watchdog:
          type: object
          required: [fired, last_at]
          properties:
            fired:
              type: integer
            last_at:
              type: [string, 'null']
              format: date-time
        at:
          type: [string, 'null']
          format: date-time
    SimBot:
      type: object
      required: [user_id, role, label, enabled, balances_known, usdt, coin, perp_position, futures_usdt, error, error_at, retry_at]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [MAKER, TAKER, TREND, EXECUTOR]
        label:
          type: string
        enabled:
          type: boolean
        balances_known:
          type: boolean
        usdt:
          type: string
        coin:
          type: string
        perp_position:
          type: string
        futures_usdt:
          type: string
        error:
          type: string
        error_at:
          type: [string, 'null']
          format: date-time
        retry_at:
          type: [string, 'null']
          format: date-time
    SimEvent:
      type: object
      required: [id, type, size, price, mu, factor, duration_seconds, hold_seconds, starts_at, status, created_by, approved_by, reason,
        created_at, started_at, ended_at, from_price, ended_by]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [JUMP, TARGET, TREND, VOLATILITY, PAUSE, HALT, REANCHOR, SPIKE]
        size:
          type: number
        price:
          type: [string, 'null']
        mu:
          type: number
        factor:
          type: number
        duration_seconds:
          type: integer
        hold_seconds:
          type: integer
        starts_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, RUNNING, DONE, CANCELED]
        created_by:
          type: string
        approved_by:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        from_price:
          type: [string, 'null']
        ended_by:
          type: string
        direction:
          type: [string, 'null']
          description: A TARGET's side of its level (ABOVE, BELOW; ASTRA A6); empty or null otherwise.
        then:
          type: [string, 'null']
          description: What a TARGET does once crossed (FOLLOW, HOLD).
        result:
          type: [string, 'null']
          description: How a TARGET ended (HIT, MISSED, CANCELED); empty while running.
        crossed_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        closing_at:
          type: [string, 'null']
          format: date-time
          description: When a TARGET's closing window starts (its last 10%, at least a minute); no spike starts in it.
        hold_until:
          type: [string, 'null']
          format: date-time
        parent_id:
          type: [string, 'null']
          description: A SPIKE's TARGET.
        width_seconds:
          type: [integer, 'null']
          description: A SPIKE's width.
        spikes:
          type: array
          description: A TARGET's spikes, made with it (in the answer to its creation only).
          items:
            $ref: '#/components/schemas/SimEvent'
    SimEventWrite:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [JUMP, TARGET, TREND, VOLATILITY, PAUSE, HALT, REANCHOR, SPIKE]
        size:
          type: number
          description: JUMP's move (0.1 is +10%); a SPIKE's, a share of the planned price (at most 0.05 alone, 0.10 approved).
        price:
          type: string
          description: TARGET's level.
        mu:
          type: number
          description: TREND's drift a day.
        factor:
          type: number
          description: VOLATILITY's factor.
        duration_seconds:
          type: integer
          minimum: 0
        hold_seconds:
          type: integer
          minimum: 0
          description: A TARGET held this long at its level once crossed (then HOLD; at most a day).
        starts_at:
          type: string
          format: date-time
          description: At most 24 hours ahead (else 400 ADMIN_SIM_TOO_FAR_AHEAD); a time already past is now, kept in the audit and the request as asked_starts_at.
        direction:
          type: string
          enum: [ABOVE, BELOW]
          description: A TARGET's side of its level (ASTRA A6); inferred from the current target when absent.
        then:
          type: string
          enum: [FOLLOW, HOLD]
          description: What a TARGET does once crossed; FOLLOW when absent.
        spikes:
          type: array
          description: Spikes a TARGET plans, each becoming its own SPIKE event (all or nothing).
          items:
            $ref: '#/components/schemas/SimSpikeWrite'
        width_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: A SPIKE's width; 20 when absent.
    SimSpikeWrite:
      type: object
      required: [at, size]
      properties:
        at:
          type: string
          format: date-time
        size:
          type: number
          description: A share of the planned price, e.g. -0.04.
        width_seconds:
          type: integer
          minimum: 1
          maximum: 60
    SimPlanPoint:
      type: object
      required: [at, plan, low, high]
      properties:
        at:
          type: string
          format: date-time
        plan:
          type: [string, number]
        low:
          type: [string, number]
        high:
          type: [string, number]
    SimPlan:
      type: object
      required: [event_id, points]
      properties:
        event_id:
          type: string
        direction:
          type: [string, 'null']
        level:
          type: [string, number, 'null']
        from_price:
          type: [string, number, 'null']
        starts_at:
          type: [string, 'null']
          format: date-time
        closing_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        hold_until:
          type: [string, 'null']
          format: date-time
        status:
          type: [string, 'null']
          description: The target's status (SCHEDULED, RUNNING, DONE, CANCELED).
        points:
          type: array
          items:
            $ref: '#/components/schemas/SimPlanPoint'
        spikes:
          type: array
          items:
            $ref: '#/components/schemas/SimEvent'
        now:
          type: [object, 'null']
          description: Where the target is against the plan, while it runs.
          properties:
            at:
              type: string
              format: date-time
            target:
              type: [string, number, 'null']
            plan:
              type: [string, number, 'null']
            low:
              type: [string, number, 'null']
            high:
              type: [string, number, 'null']
            deviation:
              type: [number, 'null']
              description: ln(target/plan).
            at_risk:
              type: boolean
            crossed_at:
              type: [string, 'null']
              format: date-time
            result:
              type: [string, 'null']
    SimTargetPreview:
      type: object
      required: [feasible, min_duration_seconds, move, needs_approval, points]
      properties:
        now:
          type: string
          format: date-time
          description: The server's time, which the form takes its spikes' times from (review 29; a browser's clock may be off).
        direction:
          type: [string, 'null']
          description: The side of the level, as asked or inferred from the current target (ABOVE, BELOW).
        feasible:
          type: boolean
        min_duration_seconds:
          type: integer
          description: The shortest window in which the level is reachable from the current target.
        move:
          type: number
          description: The planned move, |ln(level/current target)|.
        needs_approval:
          type: boolean
          description: "Beyond one operator's share (30% alone, 50% an hour): a second administrator approves it."
        points:
          type: array
          items:
            $ref: '#/components/schemas/SimPlanPoint'
    SimSample:
      type: object
      required: [at, target_price, last_price]
      properties:
        at:
          type: string
          format: date-time
        target_price:
          type: string
        last_price:
          type: [string, 'null']
    SimImpact:
      type: object
      description: derivatives-service's price impact (the margin monitor's rules at the target), with the sides open now.
      required: [symbol, target_price, positions, longs, shorts, liquidated, notional, accounts, insurance_cost, unmeasured, examples]
      properties:
        symbol:
          type: string
        target_price:
          $ref: '#/components/schemas/Decimal'
        positions:
          type: integer
          description: The open positions, HOUSE's apart.
        longs:
          type: [integer, 'null']
          description: The open longs; null when the positions cannot all be read.
        shorts:
          type: [integer, 'null']
        liquidated:
          type: integer
          description: The positions the monitor would take over at the target that it does not now (a cross account whole).
        notional:
          $ref: '#/components/schemas/Decimal'
        accounts:
          type: integer
        insurance_cost:
          description: What the liquidated lack beyond their margin at the target, for the insurance fund.
          $ref: '#/components/schemas/Decimal'
        unmeasured:
          type: integer
          description: The positions left out for want of a fresh mark price now.
        examples:
          type: array
          description: The largest of the liquidated, 20 at most.
          items:
            type: object
            required: [user_id, symbol, position_side, cross, notional, margin_balance, maintenance_before, maintenance_after]
            properties:
              user_id:
                type: string
              symbol:
                type: string
              position_side:
                type: string
              cross:
                type: boolean
              notional:
                type: string
              margin_balance:
                type: string
              maintenance_before:
                type: string
              maintenance_after:
                type: string
    SimPreview:
      type: object
      required: [expires_at, expired, target_price, expected_price, move, requested_move, impact]
      properties:
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        target_price:
          $ref: '#/components/schemas/NullableDecimal'
        expected_price:
          $ref: '#/components/schemas/NullableDecimal'
        move:
          type: [number, 'null']
          description: expected_price ÷ target_price − 1, now.
        requested_move:
          type: [string, 'null']
          description: The move market-sim measured when it was asked for.
        impact:
          oneOf:
            - $ref: '#/components/schemas/SimImpact'
            - type: 'null'
        spike_impacts:
          type: array
          description: |
            A target's spikes (A6, review 29): what its worst spike each way
            would do to the perpetual, measured where the mark goes at the
            tip (about half the spike, from the lower of the target now and
            the level down, from the higher up). Empty for anything else.
          items:
            type: object
            required: [price, impact]
            properties:
              price:
                $ref: '#/components/schemas/Decimal'
              impact:
                $ref: '#/components/schemas/SimImpact'
    SimHolding:
      type: object
      required: [amount, holders]
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        holders:
          type: integer
          description: How many accounts hold some.
    SimToken:
      type: object
      required: [asset, price, bots, users, platform, issued, top, at]
      properties:
        asset:
          type: string
          examples: [ASTRA]
        price:
          description: The pair's last trade as market-sim reads it; null before the first.
          $ref: '#/components/schemas/NullableDecimal'
        bots:
          $ref: '#/components/schemas/SimHolding'
        users:
          description: Every other user (HOUSE included, when it holds the coin).
          $ref: '#/components/schemas/SimHolding'
        platform:
          type: array
          description: The system accounts holding some (fees and the like), ADJUSTMENT apart.
          items:
            type: object
            required: [account_type, amount]
            properties:
              account_type:
                type: string
                examples: [FEE_REVENUE]
              amount:
                $ref: '#/components/schemas/Decimal'
        issued:
          description: What manual adjustments issued (the ADJUSTMENT account's debit); the bots, users and platform hold it all.
          $ref: '#/components/schemas/Decimal'
        top:
          type: array
          description: The largest holders, largest first (20 at most).
          items:
            type: object
            required: [user_id, amount]
            properties:
              user_id:
                type: string
                format: uuid
              amount:
                $ref: '#/components/schemas/Decimal'
        at:
          type: string
          format: date-time
    AssetProfile:
      type: object
      required: [display_name, description, links, logo_mime, logo_size, logo_url, version]
      properties:
        display_name:
          type: string
          description: Replaces the asset's name on the sites when set.
        description:
          type: object
          description: Introductions by language (zh-CN, en), up to 1,000 characters each.
          additionalProperties:
            type: string
        links:
          type: object
          description: https URLs by kind (website, explorer, whitepaper).
          additionalProperties:
            type: string
        logo_mime:
          type: string
          description: image/png, image/svg+xml or image/webp; empty without a logo.
        logo_size:
          type: integer
        logo_url:
          type: string
          description: The logo's path with its version (/v1/market/assets/{code}/logo?v=...); empty without one.
        version:
          type: integer
    AssetProfileWrite:
      type: object
      required: [display_name, description, links]
      properties:
        display_name:
          type: string
          maxLength: 32
        description:
          type: object
          additionalProperties:
            type: string
        links:
          type: object
          additionalProperties:
            type: string
        logo:
          type: string
          description: A new logo, base64.
        logo_mime:
          type: string
          enum: [image/png, image/svg+xml, image/webp]
        clear_logo:
          type: boolean
    PlatformTexts:
      description: A text by language; zh-CN stands in for a language without one.
      type: object
      required: [zh-CN, en]
      properties:
        zh-CN:
          type: string
        en:
          type: string
    WelcomeCredit:
      type: object
      required: [asset, amount]
      properties:
        asset:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
    WelcomeCreditsSetting:
      type: object
      required: [credits, flag_enabled, version, updated_by, updated_at]
      properties:
        credits:
          type: array
          items:
            $ref: '#/components/schemas/WelcomeCredit'
        flag_enabled:
          type: boolean
          description: ledger.welcome_credit, the master switch (both must hold for a grant).
        version:
          type: integer
          format: int64
        updated_by:
          type: string
          description: '"system:WELCOME_FUNDS" for the first value taken from the environment.'
        updated_at:
          type: [string, 'null']
          format: date-time
    PlatformProfileAdmin:
      description: The platform's profile (as api/openapi/platform.yaml's PlatformProfile) and who last changed it.
      type: object
      required: [name, short_name, domain, theme_color, brand_color, images, footer, contact, social, default_locale, test_mode, registration,
        welcome_credits, version, updated_at, updated_by]
      properties:
        name:
          type: string
        short_name:
          type: string
        domain:
          type: string
          description: The PC site's host name (the mobile site m.<domain>, the console admin.<domain>); empty until set.
        theme_color:
          type: string
        brand_color:
          type: string
        images:
          type: object
          required: [logo_light, logo_dark, favicon, apple_touch_icon]
          properties:
            logo_light:
              type: [string, 'null']
            logo_dark:
              type: [string, 'null']
            favicon:
              type: [string, 'null']
            apple_touch_icon:
              type: [string, 'null']
        footer:
          type: object
          required: [copyright, compliance]
          properties:
            copyright:
              $ref: '#/components/schemas/PlatformTexts'
            compliance:
              $ref: '#/components/schemas/PlatformTexts'
        contact:
          type: object
          required: [email, support_url]
          properties:
            email:
              type: string
            support_url:
              type: [string, 'null']
        social:
          type: array
          items:
            type: object
            required: [kind, url]
            properties:
              kind:
                type: string
              url:
                type: string
        default_locale:
          type: string
          enum: [zh-CN, en]
        test_mode:
          type: object
          description: >-
            The exchange in test mode (the learning mode until 2026-10-04; off when live, design §4.3). While enabled the
            sites show the content marked TEST or BOTH (FORMAL or BOTH when off), "测试模式" badges and, when banner is
            true, text in a banner at the top. text is required only while enabled and banner.
          required: [enabled, banner, text]
          properties:
            enabled:
              type: boolean
            banner:
              type: boolean
              description: Show the banner while test mode is on.
            text:
              $ref: '#/components/schemas/PlatformTexts'
        registration:
          type: object
          required: [status, closed_text]
          properties:
            status:
              type: string
              enum: [OPEN, CLOSED]
            closed_text:
              $ref: '#/components/schemas/PlatformTexts'
        welcome_credits:
          type: array
          description: The ledger's, read within the last minute (change them at /admin/v1/platform/welcome-credits).
          items:
            type: object
            required: [asset, amount]
            properties:
              asset:
                type: string
              amount:
                type: string
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          description: The actor of the last change ("admin:<email>", "system:migration").
    PlatformProfileWrite:
      type: object
      required: [name, short_name, domain, theme_color, brand_color, footer, contact, social, default_locale, test_mode, registration,
        expected_version]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
        short_name:
          type: string
          minLength: 2
          maxLength: 12
        domain:
          type: string
          description: The PC site's host name (a.b, lower case, at most 253), or empty.
        theme_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
        brand_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
        footer:
          type: object
          required: [copyright, compliance]
          properties:
            copyright:
              $ref: '#/components/schemas/PlatformTexts'
            compliance:
              $ref: '#/components/schemas/PlatformTexts'
        contact:
          type: object
          required: [email, support_url]
          properties:
            email:
              type: string
              description: An e-mail address, or empty.
            support_url:
              type: [string, 'null']
              description: An https URL of at most 300 characters.
        social:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind, url]
            properties:
              kind:
                type: string
                enum: [x, telegram, discord, youtube, facebook, instagram, linkedin, reddit, medium, github, tiktok, weibo]
              url:
                type: string
                description: An https URL of at most 300 characters.
        default_locale:
          type: string
          enum: [zh-CN, en]
        test_mode:
          type: object
          description: >-
            The exchange in test mode (the learning mode until 2026-10-04; off when live, design §4.3). While enabled the
            sites show the content marked TEST or BOTH (FORMAL or BOTH when off), "测试模式" badges and, when banner is
            true, text in a banner at the top. text is required only while enabled and banner.
          required: [enabled, banner, text]
          properties:
            enabled:
              type: boolean
            banner:
              type: boolean
              description: Show the banner while test mode is on.
            text:
              $ref: '#/components/schemas/PlatformTexts'
        registration:
          type: object
          required: [status, closed_text]
          properties:
            status:
              type: string
              enum: [OPEN, CLOSED]
            closed_text:
              $ref: '#/components/schemas/PlatformTexts'
        expected_version:
          type: integer
          format: int64
    LaunchItem:
      type: object
      required: [key, status, value]
      properties:
        key:
          type: string
          enum: [welcome_credits, test_mode, registration, admin_totp, two_person, test_assets, custodian, withdraw, brand, coin_profile, legal,
            third_party, admins, domain, house, margin]
        status:
          type: string
          enum: [OK, FAIL, PENDING, UNKNOWN]
        value:
          type: object
          additionalProperties: true
          description: What it is now, by item (a flag's enabled and rules, the credits, the custodian's gateway host, the administrators...).
    LaunchChecklist:
      type: object
      required: [ready, items, checked_at]
      properties:
        ready:
          type: boolean
          description: Every item is OK.
        items:
          type: array
          items:
            $ref: '#/components/schemas/LaunchItem'
        checked_at:
          type: string
          format: date-time
    Reason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
    Transition:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    LocalizedText:
      type: object
      description: By locale; zh-CN required, en optional.
      required: [zh-CN]
      properties:
        zh-CN:
          type: string
        en:
          type: string
    ArticleText:
      type: object
      required: [locale, title, summary, body]
      properties:
        locale:
          type: string
          enum: [zh-CN, en]
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        body:
          type: string
          description: Markdown.
    ArticleWrite:
      type: object
      required: [slug, category, pinned, order, texts]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        modes:
          $ref: '#/components/schemas/ArticleModes'
        category:
          type: string
          description: Announcements notice or product; help account, funds, trading, futures or faq (others allowed).
        pinned:
          type: boolean
        order:
          type: integer
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ArticleText'
    ArticleModes:
      type: string
      enum: [TEST, FORMAL, BOTH]
      description: >-
        Which of the exchange's modes the article is for (design 2026-10-04 §4.4): the sites show TEST and BOTH in
        test mode, FORMAL and BOTH when live. BOTH when a draft leaves it out; an edit without it keeps the article's
        own. A body may also hold :::test … ::: and :::formal … ::: blocks, which the sites show in that mode only.
    ContentArticle:
      type: object
      required: [id, section, slug, modes, category, pinned, order, status, publish_at, version, updated_by, created_at, updated_at, texts]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          enum: [ANNOUNCEMENT, HELP, LEGAL, HOME]
        slug:
          type: string
        modes:
          $ref: '#/components/schemas/ArticleModes'
        category:
          type: string
        pinned:
          type: boolean
        order:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        publish_at:
          type: [string, 'null']
          format: date-time
          description: A published article shows from then on (later than now when scheduled).
        version:
          type: integer
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ArticleText'
    Broadcast:
      type: object
      required: [id, audience, users, title, body, link, email, status, recipients, read, created_by, created_at, finished_at, failures,
        last_error, retry_at]
      properties:
        id:
          type: string
          format: uuid
        audience:
          type: string
          enum: [ALL, USERS]
          description: Everyone, or named users (one, or a tag's when sent).
        users:
          type: integer
          description: The named users; 0 for everyone.
        title:
          $ref: '#/components/schemas/LocalizedText'
        body:
          $ref: '#/components/schemas/LocalizedText'
        link:
          type: string
        email:
          type: boolean
        status:
          type: string
          enum: [SENDING, SENT, FAILED]
          description: FAILED after ten failed rounds in a row; an operator resumes it (C5.5 ⑫).
        recipients:
          type: integer
          description: Users who have it.
        read:
          type: integer
          description: Of them, those who read it.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        failures:
          type: integer
          description: Rounds failed in a row (each waits longer, 3 seconds doubling to 10 minutes).
        last_error:
          type: string
          description: The last failed round's error; empty after a round that worked.
        retry_at:
          type: [string, 'null']
          format: date-time
          description: When the next round may run after a failure.
    StatusRequest:
      type: object
      required: [to, reason]
      properties:
        to:
          type: string
          enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
        reason:
          type: string
          minLength: 3
        confirmation:
          type: string
          description: The preview's confirmation.token; a halt needs none.
    StatusResult:
      type: object
      required: [from, to, change]
      properties:
        from:
          type: string
        to:
          type: string
        change:
          description: The change waiting; null for a halt, done at once.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/InstrumentChange'
    Confirmation:
      type: object
      description: Binds the confirming call to the preview an ADMIN saw (sealed, valid 10 minutes).
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    StatusPreview:
      type: object
      required: [symbol, from, to, immediate, confirmation, delay_seconds, two_person]
      properties:
        symbol:
          type: string
        from:
          type: string
        to:
          type: string
        immediate:
          type: boolean
          description: A halt, at once and without confirmation.
        confirmation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
          description: How long the change will wait once confirmed (or approved); 0 for a halt.
        two_person:
          type: boolean
          description: A second ADMIN must approve it first (admin.two_person_approval).
        open_orders:
          type: [integer, 'null']
          description: >-
            The orders resting on the pair or contract (the read model, seconds behind; null when it cannot be read). A halt leaves
            them on the book and their owners may cancel them.
    ParamChange:
      type: object
      description: A trading parameter a change moves (JSON values as stored; null for none).
      required: [entity, key, field, before, after]
      properties:
        entity:
          type: string
          enum: [FEE_SCHEDULE, TRADING_PAIR, CONTRACT]
        key:
          type: string
        field:
          type: string
          enum: [maker_fee_rate, taker_fee_rate, fee_tier, reference_symbol, reference_multiplier, risk_tiers, status]
        before: {}
        after: {}
    TierImpact:
      type: object
      description: |
        What a contract's new risk ladder would do to its open positions at
        the mark prices (HOUSE aside): positions the margin monitor would
        take over that it does not now (a cross account whole) with their
        notional and accounts, those newly warned, those above the risk
        limit of their leverage (they stay but cannot grow), those without
        a fresh mark price; the largest examples.
      required: [symbol, positions, liquidated, notional, accounts, warned, over_limit, unmeasured, examples]
      properties:
        symbol:
          type: string
        positions:
          type: integer
        liquidated:
          type: integer
        notional:
          $ref: '#/components/schemas/Decimal'
        accounts:
          type: integer
        warned:
          type: integer
        over_limit:
          type: integer
        unmeasured:
          type: integer
        examples:
          type: array
          items:
            type: object
            required: [user_id, symbol, position_side, cross, notional, margin_balance, maintenance_before, maintenance_after]
            properties:
              user_id:
                type: string
                format: uuid
              symbol:
                type: string
              position_side:
                type: string
              cross:
                type: boolean
              notional:
                $ref: '#/components/schemas/Decimal'
              margin_balance:
                $ref: '#/components/schemas/Decimal'
              maintenance_before:
                $ref: '#/components/schemas/Decimal'
              maintenance_after:
                $ref: '#/components/schemas/Decimal'
    ChangeGuard:
      type: object
      description: What a preview says of a document's trading parameters.
      required: [params, impacts, confirmation, delay_seconds, two_person]
      properties:
        params:
          type: array
          description: The trading parameters it moves; none means it applies at once.
          items:
            $ref: '#/components/schemas/ParamChange'
        impacts:
          type: array
          items:
            $ref: '#/components/schemas/TierImpact'
        confirmation:
          description: Null without trading parameters, for a caller without instruments.trading, or while a ladder's impact cannot be measured (warning IMPACT_UNKNOWN).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
        two_person:
          type: boolean
    InstrumentChange:
      type: object
      description: A change of trading parameters an ADMIN confirmed (design 2026-10-02 §2 item 6).
      required: [id, kind, target, status, reason, summary, requested_by, requested_by_email, approved_by_email, approved_at,
        closed_by_email, closed_at, effective_at, applied_at, applying_at, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CONFIG, PAIR_STATUS, CONTRACT_STATUS]
        target:
          type: string
          examples: [instruments, pair:BTC-USDT, contract:BTC-USDT-PERP]
        status:
          type: string
          enum: [PENDING_APPROVAL, SCHEDULED, APPLIED, CANCELED, REJECTED, FAILED]
        reason:
          type: string
        summary:
          type: object
          description: What the confirmation showed.
          required: [params, impacts, items]
          properties:
            fingerprint:
              type: string
            from:
              type: string
              description: A status change's status when confirmed.
            params:
              type: array
              items:
                $ref: '#/components/schemas/ParamChange'
            impacts:
              type: array
              items:
                $ref: '#/components/schemas/TierImpact'
            items:
              type: array
              description: A document's items, created or updated.
              items:
                type: object
                required: [entity, key, action, version]
                properties:
                  entity:
                    type: string
                  key:
                    type: string
                  action:
                    type: string
                  version:
                    type: integer
        requested_by:
          type: string
          format: uuid
        requested_by_email:
          type: string
        approved_by_email:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
        closed_by_email:
          type: [string, 'null']
          description: Who canceled or rejected it.
        closed_at:
          type: [string, 'null']
          format: date-time
        effective_at:
          type: [string, 'null']
          format: date-time
          description: When it takes (or took) effect; null while it waits for approval or after it was closed unscheduled.
        applied_at:
          type: [string, 'null']
          format: date-time
        applying_at:
          type: [string, 'null']
          format: date-time
          description: >-
            An apply round has it (C5.5 ⑩): until its outcome is recorded it may have taken effect, so it is not canceled
            (ADMIN_CHANGE_APPLYING). A round whose call was answered by no one leaves it claimed, and a later one finds it in
            effect (result ends with "(in effect already)") or applies it.
        result:
          type: string
          description: >-
            What applying it did, why it failed, or why it waits (a service down; ADMIN_IMPACT_GREW fails a ladder that would
            liquidate more positions when due than its confirmation showed).
        created_at:
          type: string
          format: date-time
    Admin:
      type: object
      required: [id, email, name, role, permissions, must_change_password]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        must_change_password:
          type: boolean
          description: >-
            The password was generated for them (exchangectl admin create): only GET /admin/v1/me, POST /admin/v1/me/password
            and POST /admin/v1/logout are open until they change it (ADMIN_PASSWORD_CHANGE_REQUIRED, C5.5 ⑪).
    AdminRole:
      type: string
      enum: [ADMIN, OPERATOR, FINANCE, AUDITOR]
    Permission:
      type: string
      enum: [users.read, users.status, orders.cancel, instruments.read, instruments.write, flags.read, flags.write,
        withdrawals.read, withdrawals.review, ledger.adjust.request, ledger.adjust.approve, audit.read, reports.read,
        derivatives.read, derivatives.write, settings.write, users.notes, users.security, users.contacts, ledger.hold,
        deposits.review, admins.manage, instruments.trading, content.write, notices.send, sim.control, withdrawals.resume,
        audit.export]
    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    ManagedAdmin:
      description: An administrator as the administrators page lists them.
      allOf:
        - $ref: '#/components/schemas/Admin'
        - type: object
          required: [status, failed_attempts, locked_until, last_login_at, created_at, sessions]
          properties:
            status:
              type: string
              enum: [ACTIVE, DISABLED]
            failed_attempts:
              type: integer
              description: Failed sign-ins since the last success; five lock the account for 15 minutes.
            locked_until:
              type: [string, 'null']
              format: date-time
            last_login_at:
              type: [string, 'null']
              format: date-time
            created_at:
              type: string
              format: date-time
            sessions:
              type: integer
              description: Live sessions.
    AdminSetup:
      type: object
      description: A one-time setup link, shown once to whoever created or reset the account to hand over (C5.5 ⑪).
      required: [setup]
      properties:
        admin:
          $ref: '#/components/schemas/ManagedAdmin'
          description: On a create, the new administrator.
        setup:
          type: object
          required: [token, kind, expires_at]
          properties:
            token:
              type: string
              description: The console's setup page takes it as /setup#token=...
            kind:
              type: string
              enum: [CREATE, PASSWORD, TOTP]
            expires_at:
              type: string
              format: date-time
    AdminSession:
      type: object
      required: [ip, user_agent, created_at, last_seen_at, expires_at]
      properties:
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Settings:
      type: object
      required: [two_person_approval, single_max_usdt, daily_max_usdt, withdrawal_max_usdt, change_delay_seconds, change_delay_floor_seconds,
        daily_used_usdt, updated_by, updated_at]
      properties:
        two_person_approval:
          type: boolean
          description: Fund operations need a second administrator (the flag admin.two_person_approval).
        change_delay_seconds:
          type: integer
          description: How long a confirmed change of trading parameters waits before it takes effect (up to 86400, 300 by default), never below change_delay_floor_seconds.
        change_delay_floor_seconds:
          type: integer
          description: >-
            The least change_delay_seconds may be set to: admin-service's ADMIN_CHANGE_DELAY_FLOOR, 600 by default (one ADMIN alone
            cannot cut the wait to a minute, C5.5 ⑩).
        single_max_usdt:
          description: In single-person mode, one fund operation is worth at most this much.
          $ref: '#/components/schemas/Decimal'
        daily_max_usdt:
          description: In single-person mode, an administrator's fund operations of the last 24 hours sum to at most this much.
          $ref: '#/components/schemas/Decimal'
        withdrawal_max_usdt:
          description: In single-person mode, one approval completes a withdrawal worth at most this much, however many reviewers it needs.
          $ref: '#/components/schemas/Decimal'
        daily_used_usdt:
          description: The caller's single-person fund operations of the last 24 hours (pending ones included).
          $ref: '#/components/schemas/Decimal'
        updated_by:
          type: string
          description: Who last changed the limits; empty for the defaults.
        updated_at:
          type: [string, 'null']
          format: date-time
    Todo:
      type: object
      required: [withdrawals, approvals, identity_requests, deposits, instrument_changes, partial]
      properties:
        instrument_changes:
          type: integer
          description: Changes of trading parameters waiting for a second ADMIN or their time (with instruments.trading).
        withdrawals:
          type: integer
          description: Withdrawals in review (with withdrawals.read; counted up to 200).
        approvals:
          type: integer
          description: Fund operations waiting for a decision (with ledger.adjust.request or ledger.adjust.approve).
        identity_requests:
          type: integer
          description: Identity rebind requests waiting for a decision (with users.security; counted up to 200).
        deposits:
          type: integer
          description: Deposits waiting for a decision (with deposits.review; counted up to 200).
        partial:
          type: array
          items:
            type: string
            enum: [withdrawals, identity_requests, deposits]
    Identity:
      type: object
      required: [kind, value, verified_at, created_at]
      properties:
        kind:
          type: string
          enum: [EMAIL, PHONE]
        value:
          type: string
          description: Masked except from POST /admin/v1/users/{id}/contacts/reveal.
        verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    Security:
      type: object
      required: [identities, totp, password_changed_at, last_login_at, locked_seconds, sessions, devices, pending_identity_requests]
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        totp:
          type: object
          required: [status, activated_at, changed_at]
          properties:
            status:
              type: string
              enum: [ACTIVE, PENDING, NONE]
              description: PENDING is set up but never confirmed.
            activated_at:
              type: [string, 'null']
              format: date-time
            changed_at:
              type: [string, 'null']
              format: date-time
              description: The app's latest removal, by the user or an administrator; withdrawals wait for review for a day after it.
        password_changed_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        locked_seconds:
          type: integer
          description: How long password sign-in stays locked after repeated failures; 0 when it is not.
        sessions:
          type: array
          items:
            type: object
            required: [id, device_id, client_type, user_agent, ip, created_at, last_seen_at]
            properties:
              id:
                type: string
                format: uuid
              device_id:
                type: string
              client_type:
                type: string
              user_agent:
                type: string
              ip:
                type: string
                description: Masked (203.0.113.*).
              created_at:
                type: [string, 'null']
                format: date-time
              last_seen_at:
                type: [string, 'null']
                format: date-time
        devices:
          type: array
          items:
            type: object
            required: [device_id, first_seen_at, last_seen_at]
            properties:
              device_id:
                type: string
              first_seen_at:
                type: [string, 'null']
                format: date-time
              last_seen_at:
                type: [string, 'null']
                format: date-time
        pending_identity_requests:
          type: integer
    LoginEntry:
      type: object
      required: [id, method, result, identity_mask, device_id, user_agent, ip, new_device, created_at]
      properties:
        id:
          type: integer
        method:
          type: string
          description: PASSWORD, OTP, LOGIN_CHALLENGE or REGISTER.
        result:
          type: string
          description: SUCCESS or a failure code.
        identity_mask:
          type: string
        device_id:
          type: string
        user_agent:
          type: string
        ip:
          type: string
          description: Masked.
        new_device:
          type: boolean
        created_at:
          type: [string, 'null']
          format: date-time
    StatusChange:
      type: object
      required: [from_status, to_status, reason_code, actor, at]
      properties:
        from_status:
          type: string
        to_status:
          type: string
        reason_code:
          type: string
        actor:
          type: string
          description: An administrator's email, cli:<os user> or a service.
        at:
          type: [string, 'null']
          format: date-time
    Consent:
      type: object
      required: [document, version, accepted_at]
      properties:
        document:
          type: string
          description: TERMS or RISK_DISCLOSURE.
        version:
          type: string
        accepted_at:
          type: [string, 'null']
          format: date-time
    Assessment:
      type: object
      required: [id, source_event_type, score, action, hits, enforced, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_event_type:
          type: string
          description: The auth event assessed, e.g. auth.LoginSucceeded.
        score:
          type: integer
          minimum: 0
          maximum: 100
        action:
          type: string
          enum: [NONE, STEP_UP, REVIEW, REJECT]
        hits:
          type: array
