          required: [enabled, banner, text]
          properties:
            enabled:
              type: boolean
            banner:
              type: boolean
              description: Show the banner while test mode is on.
            text:
              $ref: '#/components/schemas/PlatformTexts'
        registration:
          type: object
          required: [status, closed_text]
          properties:
            status:
              type: string
              enum: [OPEN, CLOSED]
            closed_text:
              $ref: '#/components/schemas/PlatformTexts'
        welcome_credits:
          type: array
          description: The ledger's, read within the last minute (change them at /admin/v1/platform/welcome-credits).
          items:
            type: object
            required: [asset, amount]
            properties:
              asset:
                type: string
              amount:
                type: string
        version:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          description: The actor of the last change ("admin:<email>", "system:migration").
    PlatformProfileWrite:
      type: object
      required: [name, short_name, domain, theme_color, brand_color, footer, contact, social, default_locale, test_mode, registration,
        expected_version]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
        short_name:
          type: string
          minLength: 2
          maxLength: 12
        domain:
          type: string
          description: The PC site's host name (a.b, lower case, at most 253), or empty.
        theme_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
        brand_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
        footer:
          type: object
          required: [copyright, compliance]
          properties:
            copyright:
              $ref: '#/components/schemas/PlatformTexts'
            compliance:
              $ref: '#/components/schemas/PlatformTexts'
        contact:
          type: object
          required: [email, support_url]
          properties:
            email:
              type: string
              description: An e-mail address, or empty.
            support_url:
              type: [string, 'null']
              description: An https URL of at most 300 characters.
        social:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind, url]
            properties:
              kind:
                type: string
                enum: [x, telegram, discord, youtube, facebook, instagram, linkedin, reddit, medium, github, tiktok, weibo]
              url:
                type: string
                description: An https URL of at most 300 characters.
        default_locale:
          type: string
          enum: [zh-CN, zh-TW, en]
        test_mode:
          type: object
          description: >-
            The exchange in test mode (the learning mode until 2026-10-04; off when live, design §4.3). While enabled the
            sites show the content marked TEST or BOTH (FORMAL or BOTH when off), "测试模式" badges and, when banner is
            true, text in a banner at the top. text is required only while enabled and banner.
          required: [enabled, banner, text]
          properties:
            enabled:
              type: boolean
            banner:
              type: boolean
              description: Show the banner while test mode is on.
            text:
              $ref: '#/components/schemas/PlatformTexts'
        registration:
          type: object
          required: [status, closed_text]
          properties:
            status:
              type: string
              enum: [OPEN, CLOSED]
            closed_text:
              $ref: '#/components/schemas/PlatformTexts'
        expected_version:
          type: integer
          format: int64
    LaunchItem:
      type: object
      required: [key, status, value]
      properties:
        key:
          type: string
          enum: [welcome_credits, test_mode, registration, admin_totp, two_person, test_assets, custodian, withdraw, brand, coin_profile, legal,
            third_party, admins, domain, house, margin, insurance, coin_m, app_downloads, products]
          description: |
            products (product switches design 2026-10-07 §1 #5, K0): for
            information, OK whatever is open (value: spot, usdt_m and coin_m,
            each its enabled and closed_at).
            insurance (coin-margined design 2026-10-06 §2.7): the insurance
            fund of the settlement asset of every contract in TRADING holds
            something (value: balances by asset, contracts by asset, short:
            the assets without); coin_m: derivatives.coin_m off, or on by
            rules, never for everyone (value: flag, enabled, rules);
            app_downloads (App download design 2026-10-07 §5, H4): for
            information, OK whatever is offered (value: android and ios,
            each LINK, FILE or null for nothing offered; entry_visible,
            the download entries' switch, since H5).
        status:
          type: string
          enum: [OK, FAIL, PENDING, UNKNOWN]
        value:
          type: object
          additionalProperties: true
          description: What it is now, by item (a flag's enabled and rules, the credits, the custodian's gateway host, the administrators...).
    ProductName:
      type: string
      enum: [spot, usdt_m, coin_m]
      description: A product line (design 2026-10-07, product switches); its flag is product.<name>.
    ProductState:
      type: object
      required: [product, enabled, flag, version, open_orders, open_positions]
      properties:
        product:
          $ref: '#/components/schemas/ProductName'
        enabled:
          type: boolean
        flag:
          type: string
          examples: [product.spot]
        version:
          type: integer
          description: The flag's version, 0 while it is not stored (open).
        switched_at:
          type: [string, 'null']
          format: date-time
          description: When it was last switched; null while never.
        switched_by:
          type: [string, 'null']
          description: Who switched it last (an administrator's actor, or the seed's migration); null while never.
        closed_at:
          type: [string, 'null']
          format: date-time
          description: When it was closed, while it is; null while open.
        open_orders:
          type: [integer, 'null']
          description: |
            The open orders as the line's service counts them: spot, the
            active orders on spot and margin accounts (liquidation orders
            left out; margin repayments, which a closed spot line keeps and
            its cancel leaves, counted); the contracts, the open orders and
            the take-profits and stop-losses. An order asked to cancel counts
            until the engine confirms it. Null when it could not be read.
        open_positions:
          type: [integer, 'null']
          description: What stays open when it closes - the contracts' open positions; spot, the margin accounts that owe anything (counted at most every 15 seconds). Null when it could not be read.
    Products:
      type: object
      required: [products, partial]
      properties:
        products:
          type: array
          description: spot, usdt_m and coin_m, in that order.
          items:
            $ref: '#/components/schemas/ProductState'
        partial:
          type: array
          description: The lines whose counts could not be read.
          items:
            $ref: '#/components/schemas/ProductName'
    SpotReduceOnly:
      type: object
      description: Spot's last closure and the contracts it left reduce-only (A92).
      required: [closed_at, opened_at, contracts]
      properties:
        closed_at:
          type: [string, 'null']
          format: date-time
          description: When spot was last closed; null while it is closed or never was.
        opened_at:
          type: [string, 'null']
          format: date-time
          description: When it opened again after that; null as closed_at.
        contracts:
          type: array
          items:
            type: object
            required: [symbol, reason, since]
            properties:
              symbol:
                type: string
                examples: [ASTRA-USDT-PERP]
              reason:
                type: string
                description: Why it went reduce-only, e.g. MARK_PRICE_STALE.
              since:
                type: string
                format: date-time
    ContractLift:
      type: object
      description: How lifting one contract's reduce-only went.
      required: [symbol, lifted, error]
      properties:
        symbol:
          type: string
        lifted:
          type: boolean
          description: False when it was not reduce-only any more, or the lift failed.
        error:
          type: [string, 'null']
          description: The service's code and message when the lift failed.
    ProductCancel:
      type: object
      description: |
        How canceling a closed line's open orders through its service went
        (A85). The line stays closed whatever it says; closing it again
        cancels what is left.
      required: [status, canceled, failed_users, reason, error]
      properties:
        status:
          type: string
          enum: [DONE, UNAVAILABLE, FAILED]
          description: |
            DONE: the service canceled what the closed line no longer takes.
            UNAVAILABLE: the service has no endpoint for it yet. FAILED: see
            reason.
        canceled:
          type: integer
          description: The orders the service said it canceled (with FAILED, those before it failed, when it said so).
        failed_users:
          type: integer
          description: With reason PARTIAL, the users whose orders the service could not cancel (a lock it could not take); 0 otherwise.
        reason:
          type: [string, 'null']
          enum: [TIMEOUT, UNREACHABLE, PARTIAL, REFUSED, null]
          description: |
            Why it FAILED (A87): TIMEOUT, no answer within 15 seconds or the
            request gone before it (the service may still be canceling);
            UNREACHABLE, the service could not be reached; PARTIAL, it
            canceled for every user but failed_users (503 with details
            canceled and failed_users); REFUSED, it answered another error.
            Null unless FAILED.
        error:
          type: [string, 'null']
          description: >-
            With PARTIAL and REFUSED, the service's error code and message, also in the audit's cancel_error (never an
            internal address: the failure in full is in admin-service's log only, A88); null otherwise.
    LaunchChecklist:
      type: object
      required: [ready, items, checked_at]
      properties:
        ready:
          type: boolean
          description: Every item is OK.
        items:
          type: array
          items:
            $ref: '#/components/schemas/LaunchItem'
        checked_at:
          type: string
          format: date-time
    Reason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
    Transition:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    LocalizedText:
      type: object
      description: >-
        By locale; zh-CN required, zh-TW and en optional (a reader of a language without both its title and body gets
        the Simplified; G7b).
      required: [zh-CN]
      properties:
        zh-CN:
          type: string
        zh-TW:
          type: string
        en:
          type: string
    ArticleText:
      type: object
      required: [locale, title, summary, body]
      properties:
        locale:
          type: string
          enum: [zh-CN, zh-TW, en]
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        body:
          type: string
          description: Markdown.
    ArticleWrite:
      type: object
      required: [slug, category, pinned, order, texts]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        modes:
          $ref: '#/components/schemas/ArticleModes'
        category:
          type: string
          description: Announcements notice or product; help account, funds, trading, futures or faq (others allowed).
        pinned:
          type: boolean
        order:
          type: integer
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ArticleText'
    ArticleModes:
      type: string
      enum: [TEST, FORMAL, BOTH]
      description: >-
        Which of the exchange's modes the article is for (design 2026-10-04 §4.4): the sites show TEST and BOTH in
        test mode, FORMAL and BOTH when live. BOTH when a draft leaves it out; an edit without it keeps the article's
        own. A body may also hold :::test … ::: and :::formal … ::: blocks, which the sites show in that mode only.
    ContentArticle:
      type: object
      required: [id, section, slug, modes, category, pinned, order, status, publish_at, version, updated_by, created_at, updated_at, texts]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          enum: [ANNOUNCEMENT, HELP, LEGAL, HOME]
        slug:
          type: string
        modes:
          $ref: '#/components/schemas/ArticleModes'
        category:
          type: string
        pinned:
          type: boolean
        order:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        publish_at:
          type: [string, 'null']
          format: date-time
          description: A published article shows from then on (later than now when scheduled).
        version:
          type: integer
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ArticleText'
    Broadcast:
      type: object
      required: [id, audience, users, title, body, link, email, status, recipients, read, created_by, created_at, finished_at, failures,
        last_error, retry_at]
      properties:
        id:
          type: string
          format: uuid
        audience:
          type: string
          enum: [ALL, USERS]
          description: Everyone, or named users (one, or a tag's when sent).
        users:
          type: integer
          description: The named users; 0 for everyone.
        title:
          $ref: '#/components/schemas/LocalizedText'
        body:
          $ref: '#/components/schemas/LocalizedText'
        link:
          type: string
        email:
          type: boolean
        status:
          type: string
          enum: [SENDING, SENT, FAILED]
          description: FAILED after ten failed rounds in a row; an operator resumes it (C5.5 ⑫).
        recipients:
          type: integer
          description: Users who have it.
        read:
          type: integer
          description: Of them, those who read it.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        failures:
          type: integer
          description: Rounds failed in a row (each waits longer, 3 seconds doubling to 10 minutes).
        last_error:
          type: string
          description: The last failed round's error; empty after a round that worked.
        retry_at:
          type: [string, 'null']
          format: date-time
          description: When the next round may run after a failure.
    StatusRequest:
      type: object
      required: [to, reason]
      properties:
        to:
          type: string
          enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
        reason:
          type: string
          minLength: 3
        confirmation:
          type: string
          description: The preview's confirmation.token; a halt needs none.
    StatusResult:
      type: object
      required: [from, to, change]
      properties:
        from:
          type: string
        to:
          type: string
        change:
          description: The change waiting; null for a halt, done at once.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/InstrumentChange'
    Confirmation:
      type: object
      description: Binds the confirming call to the preview an ADMIN saw (sealed, valid 10 minutes).
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    StatusPreview:
      type: object
      required: [symbol, from, to, immediate, confirmation, delay_seconds, two_person]
      properties:
        symbol:
          type: string
        from:
          type: string
        to:
          type: string
        immediate:
          type: boolean
          description: A halt, at once and without confirmation.
        confirmation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
          description: How long the change will wait once confirmed (or approved); 0 for a halt.
        two_person:
          type: boolean
          description: A second ADMIN must approve it first (admin.two_person_approval).
        open_orders:
          type: [integer, 'null']
          description: >-
            The orders resting on the pair or contract (the read model, seconds behind; null when it cannot be read). A halt leaves
            them on the book and their owners may cancel them.
    CoinContractMove:
      type: object
      description: One of a coin's contracts as a change moves it.
      required: [symbol, margin_type, from, to]
      properties:
        symbol:
          type: string
        margin_type:
          type: string
          enum: [USDT, COIN]
        from:
          type: string
        to:
          type: string
    CoinStatusPreview:
      type: object
      required: [coin, to, contracts, staying, confirmation, delay_seconds, two_person]
      properties:
        coin:
          type: string
        to:
          type: string
          enum: [CANCEL_ONLY, TRADING]
        contracts:
          type: array
          description: The contracts that move, by symbol.
          items:
            $ref: '#/components/schemas/CoinContractMove'
        staying:
          type: array
          description: The coin's other contracts (not delisted), where they are (from and to alike).
          items:
            $ref: '#/components/schemas/CoinContractMove'
        confirmation:
          $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
          description: How long the change will wait once confirmed (or approved).
        two_person:
          type: boolean
          description: A second ADMIN must approve it first (admin.two_person_approval).
    CoinStatusRequest:
      type: object
      required: [to, reason, confirmation]
      properties:
        to:
          type: string
          enum: [CANCEL_ONLY, TRADING]
        reason:
          type: string
          minLength: 3
        confirmation:
          type: string
          description: The preview's confirmation.token.
    CoinStatusResult:
      type: object
      required: [coin, to, contracts, change]
      properties:
        coin:
          type: string
        to:
          type: string
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/CoinContractMove'
        change:
          $ref: '#/components/schemas/InstrumentChange'
    ParamChange:
      type: object
      description: A trading parameter a change moves (JSON values as stored; null for none).
      required: [entity, key, field, before, after]
      properties:
        entity:
          type: string
          enum: [FEE_SCHEDULE, TRADING_PAIR, CONTRACT]
        key:
          type: string
        field:
          type: string
          enum: [maker_fee_rate, taker_fee_rate, fee_tier, reference_symbol, reference_multiplier, risk_tiers, status]
        before: {}
        after: {}
    TierImpact:
      type: object
      description: |
        What a contract's new risk ladder would do to its open positions at
        the mark prices (HOUSE aside): positions the margin monitor would
        take over that it does not now (a cross account whole) with their
        notional and accounts, those newly warned, those above the risk
        limit of their leverage (they stay but cannot grow), those without
        a fresh mark price; the largest examples.
      required: [symbol, positions, liquidated, notional, accounts, warned, over_limit, unmeasured, examples]
      properties:
        symbol:
          type: string
        positions:
          type: integer
        liquidated:
          type: integer
        notional:
          $ref: '#/components/schemas/Decimal'
        accounts:
          type: integer
        warned:
          type: integer
        over_limit:
          type: integer
        unmeasured:
          type: integer
        examples:
          type: array
          items:
            type: object
            required: [user_id, symbol, position_side, cross, notional, margin_balance, maintenance_before, maintenance_after]
            properties:
              user_id:
                type: string
                format: uuid
              symbol:
                type: string
              position_side:
                type: string
              cross:
                type: boolean
              notional:
                $ref: '#/components/schemas/Decimal'
              margin_balance:
                $ref: '#/components/schemas/Decimal'
              maintenance_before:
                $ref: '#/components/schemas/Decimal'
              maintenance_after:
                $ref: '#/components/schemas/Decimal'
    ChangeGuard:
      type: object
      description: What a preview says of a document's trading parameters.
      required: [params, impacts, confirmation, delay_seconds, two_person]
      properties:
        params:
          type: array
          description: The trading parameters it moves; none means it applies at once.
          items:
            $ref: '#/components/schemas/ParamChange'
        impacts:
          type: array
          items:
            $ref: '#/components/schemas/TierImpact'
        confirmation:
          description: Null without trading parameters, for a caller without instruments.trading, or while a ladder's impact cannot be measured (warning IMPACT_UNKNOWN).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
        two_person:
          type: boolean
    InstrumentChange:
      type: object
      description: A change of trading parameters an ADMIN confirmed (design 2026-10-02 §2 item 6).
      required: [id, kind, target, status, reason, summary, requested_by, requested_by_email, approved_by_email, approved_at,
        closed_by_email, closed_at, effective_at, applied_at, applying_at, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CONFIG, PAIR_STATUS, CONTRACT_STATUS, COIN_CONTRACTS_STATUS]
          description: COIN_CONTRACTS_STATUS closes or reopens a coin's contracts at once (its params list each contract's move).
        target:
          type: string
          examples: [instruments, pair:BTC-USDT, contract:BTC-USDT-PERP, coin:BTC]
        status:
          type: string
          enum: [PENDING_APPROVAL, SCHEDULED, APPLIED, CANCELED, REJECTED, FAILED]
        reason:
          type: string
        summary:
          type: object
          description: What the confirmation showed.
          required: [params, impacts, items]
          properties:
            fingerprint:
              type: string
            from:
              type: string
              description: A status change's status when confirmed.
            params:
              type: array
              items:
                $ref: '#/components/schemas/ParamChange'
            impacts:
              type: array
              items:
                $ref: '#/components/schemas/TierImpact'
            items:
              type: array
              description: A document's items, created or updated.
              items:
                type: object
                required: [entity, key, action, version]
                properties:
                  entity:
                    type: string
                  key:
                    type: string
                  action:
                    type: string
                  version:
                    type: integer
        requested_by:
          type: string
          format: uuid
        requested_by_email:
          type: string
        approved_by_email:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
        closed_by_email:
          type: [string, 'null']
          description: Who canceled or rejected it.
        closed_at:
          type: [string, 'null']
          format: date-time
        effective_at:
          type: [string, 'null']
          format: date-time
          description: When it takes (or took) effect; null while it waits for approval or after it was closed unscheduled.
        applied_at:
          type: [string, 'null']
          format: date-time
        applying_at:
          type: [string, 'null']
          format: date-time
          description: >-
            An apply round has it (C5.5 ⑩): until its outcome is recorded it may have taken effect, so it is not canceled
            (ADMIN_CHANGE_APPLYING). A round whose call was answered by no one leaves it claimed, and a later one finds it in
            effect (result ends with "(in effect already)") or applies it.
        result:
          type: string
          description: >-
            What applying it did, why it failed, or why it waits (a service down; ADMIN_IMPACT_GREW fails a ladder that would
            liquidate more positions when due than its confirmation showed).
        created_at:
          type: string
          format: date-time
    Admin:
      type: object
      required: [id, email, name, role, permissions, must_change_password]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        must_change_password:
          type: boolean
          description: >-
            The password was generated for them (exchangectl admin create): only GET /admin/v1/me, POST /admin/v1/me/password
            and POST /admin/v1/logout are open until they change it (ADMIN_PASSWORD_CHANGE_REQUIRED, C5.5 ⑪).
    AdminRole:
      type: string
      enum: [ADMIN, OPERATOR, FINANCE, AUDITOR]
    Permission:
      type: string
      enum: [users.read, users.status, orders.cancel, instruments.read, instruments.write, flags.read, flags.write,
        withdrawals.read, withdrawals.review, ledger.adjust.request, ledger.adjust.approve, audit.read, reports.read,
        derivatives.read, derivatives.write, settings.write, users.notes, users.security, users.contacts, ledger.hold,
        deposits.review, admins.manage, instruments.trading, content.write, notices.send, sim.control, withdrawals.resume,
        audit.export]
    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    ManagedAdmin:
      description: An administrator as the administrators page lists them.
      allOf:
        - $ref: '#/components/schemas/Admin'
        - type: object
          required: [status, failed_attempts, locked_until, last_login_at, created_at, sessions]
          properties:
            status:
              type: string
              enum: [ACTIVE, DISABLED]
            failed_attempts:
              type: integer
              description: Failed sign-ins since the last success; five lock the account for 15 minutes.
            locked_until:
              type: [string, 'null']
              format: date-time
            last_login_at:
              type: [string, 'null']
              format: date-time
            created_at:
              type: string
              format: date-time
            sessions:
              type: integer
              description: Live sessions.
    AdminSetup:
      type: object
      description: A one-time setup link, shown once to whoever created or reset the account to hand over (C5.5 ⑪).
      required: [setup]
      properties:
        admin:
          $ref: '#/components/schemas/ManagedAdmin'
          description: On a create, the new administrator.
        setup:
          type: object
          required: [token, kind, expires_at]
          properties:
            token:
              type: string
              description: The console's setup page takes it as /setup#token=...
            kind:
              type: string
              enum: [CREATE, PASSWORD, TOTP]
            expires_at:
              type: string
              format: date-time
    AdminSession:
      type: object
      required: [ip, user_agent, created_at, last_seen_at, expires_at]
      properties:
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Settings:
      type: object
      required: [two_person_approval, single_max_usdt, daily_max_usdt, withdrawal_max_usdt, change_delay_seconds, change_delay_floor_seconds,
        daily_used_usdt, updated_by, updated_at]
      properties:
        two_person_approval:
          type: boolean
          description: Fund operations need a second administrator (the flag admin.two_person_approval).
        change_delay_seconds:
          type: integer
          description: How long a confirmed change of trading parameters waits before it takes effect (up to 86400, 300 by default), never below change_delay_floor_seconds.
        change_delay_floor_seconds:
          type: integer
          description: >-
            The least change_delay_seconds may be set to: admin-service's ADMIN_CHANGE_DELAY_FLOOR, 600 by default (one ADMIN alone
            cannot cut the wait to a minute, C5.5 ⑩).
        single_max_usdt:
          description: In single-person mode, one fund operation is worth at most this much.
          $ref: '#/components/schemas/Decimal'
        daily_max_usdt:
          description: In single-person mode, an administrator's fund operations of the last 24 hours sum to at most this much.
          $ref: '#/components/schemas/Decimal'
        withdrawal_max_usdt:
          description: In single-person mode, one approval completes a withdrawal worth at most this much, however many reviewers it needs.
          $ref: '#/components/schemas/Decimal'
        daily_used_usdt:
          description: The caller's single-person fund operations of the last 24 hours (pending ones included).
          $ref: '#/components/schemas/Decimal'
        updated_by:
          type: string
          description: Who last changed the limits; empty for the defaults.
        updated_at:
          type: [string, 'null']
          format: date-time
    Todo:
      type: object
      required: [withdrawals, approvals, identity_requests, deposits, instrument_changes, partial]
      properties:
        instrument_changes:
          type: integer
          description: Changes of trading parameters waiting for a second ADMIN or their time (with instruments.trading).
        withdrawals:
          type: integer
          description: Withdrawals in review (with withdrawals.read; counted up to 200).
        approvals:
          type: integer
          description: Fund operations waiting for a decision (with ledger.adjust.request or ledger.adjust.approve).
        identity_requests:
          type: integer
          description: Identity rebind requests waiting for a decision (with users.security; counted up to 200).
        deposits:
          type: integer
          description: Deposits waiting for a decision (with deposits.review; counted up to 200).
        partial:
          type: array
          items:
            type: string
            enum: [withdrawals, identity_requests, deposits]
    Identity:
      type: object
      required: [kind, value, verified_at, created_at]
      properties:
        kind:
          type: string
          enum: [EMAIL, PHONE]
        value:
          type: string
          description: Masked except from POST /admin/v1/users/{id}/contacts/reveal.
        verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    Security:
      type: object
      required: [identities, totp, password_changed_at, last_login_at, locked_seconds, sessions, devices, pending_identity_requests]
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        totp:
          type: object
          required: [status, activated_at, changed_at]
          properties:
            status:
              type: string
              enum: [ACTIVE, PENDING, NONE]
              description: PENDING is set up but never confirmed.
            activated_at:
              type: [string, 'null']
              format: date-time
            changed_at:
              type: [string, 'null']
              format: date-time
              description: The app's latest removal, by the user or an administrator; withdrawals wait for review for a day after it.
        password_changed_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        locked_seconds:
          type: integer
          description: How long password sign-in stays locked after repeated failures; 0 when it is not.
        sessions:
          type: array
          items:
            type: object
            required: [id, device_id, client_type, user_agent, ip, created_at, last_seen_at]
            properties:
              id:
                type: string
                format: uuid
              device_id:
                type: string
              client_type:
                type: string
              user_agent:
                type: string
              ip:
                type: string
                description: Masked (203.0.113.*).
              created_at:
                type: [string, 'null']
                format: date-time
              last_seen_at:
                type: [string, 'null']
                format: date-time
        devices:
          type: array
          items:
            type: object
            required: [device_id, first_seen_at, last_seen_at]
            properties:
              device_id:
                type: string
              first_seen_at:
                type: [string, 'null']
                format: date-time
              last_seen_at:
                type: [string, 'null']
                format: date-time
        pending_identity_requests:
          type: integer
    LoginEntry:
      type: object
      required: [id, method, result, identity_mask, device_id, user_agent, ip, new_device, created_at]
      properties:
        id:
          type: integer
        method:
          type: string
          description: PASSWORD, OTP, LOGIN_CHALLENGE or REGISTER.
        result:
          type: string
          description: SUCCESS or a failure code.
        identity_mask:
          type: string
        device_id:
          type: string
        user_agent:
          type: string
        ip:
          type: string
          description: Masked.
        new_device:
          type: boolean
        created_at:
          type: [string, 'null']
          format: date-time
    StatusChange:
      type: object
      required: [from_status, to_status, reason_code, actor, at]
      properties:
        from_status:
          type: string
        to_status:
          type: string
        reason_code:
          type: string
        actor:
          type: string
          description: An administrator's email, cli:<os user> or a service.
        at:
          type: [string, 'null']
          format: date-time
    Consent:
      type: object
      required: [document, version, accepted_at]
      properties:
        document:
          type: string
          description: TERMS or RISK_DISCLOSURE.
        version:
          type: string
        accepted_at:
          type: [string, 'null']
          format: date-time
    Assessment:
      type: object
      required: [id, source_event_type, score, action, hits, enforced, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_event_type:
          type: string
          description: The auth event assessed, e.g. auth.LoginSucceeded.
        score:
          type: integer
          minimum: 0
          maximum: 100
        action:
          type: string
          enum: [NONE, STEP_UP, REVIEW, REJECT]
        hits:
          type: array
          items:
            type: object
            required: [rule, score, detail]
            properties:
              rule:
                type: string
              score:
                type: integer
              detail:
                type: string
        enforced:
          type: boolean
          description: Whether the action was carried out (risk.enforce).
        created_at:
          type: [string, 'null']
          format: date-time
    ValuedBalance:
      type: object
      required: [account_type, asset, available, frozen, total, value_usdt]
      properties:
        account_type:
          type: string
          enum: [SPOT, FUTURES]
        asset:
          type: string
        available:
          $ref: '#/components/schemas/Decimal'
        frozen:
          $ref: '#/components/schemas/Decimal'
        total:
          $ref: '#/components/schemas/Decimal'
        value_usdt:
          description: The total at the asset's USDT pair's last price; null without one.
          $ref: '#/components/schemas/NullableDecimal'
    Hold:
      type: object
      description: An administrator's hold on part of a user's SPOT balance (ADMIN_FREEZE until released with ADMIN_UNFREEZE).
      required: [id, account_type, asset, amount, reason, actor, journal_id, created_at, active, released_at, released_by, release_reason,
        release_journal_id]
      properties:
        id:
          type: string
          format: uuid
        account_type:
          type: string
          enum: [SPOT]
        asset:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        reason:
          type: string
        actor:
          type: string
          description: The administrator who placed it.
        journal_id:
          type: string
          format: uuid
        created_at:
          type: [string, 'null']
          format: date-time
        active:
          type: boolean
        released_at:
          type: [string, 'null']
          format: date-time
        released_by:
          type: string
        release_reason:
          type: string
        release_journal_id:
          type: [string, 'null']
    ServiceOrder:
      type: object
      description: An order as the service that holds it renders it.
      required: [order_id, status]
      additionalProperties: true
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
    ContractOrder:
      type: object
      description: A contract order as derivatives-service renders it.
      required: [order_id, client_order_id, symbol, side, position_side, type, price, quantity, reduce_only, status, filled_quantity,
        cancel_requested, created_at]
      additionalProperties: true
      properties:
        order_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        position_side:
          type: string
          enum: [BOTH, LONG, SHORT]
        type:
          type: string
          enum: [LIMIT, MARKET]
        price:
          $ref: '#/components/schemas/Decimal'
        quantity:
          $ref: '#/components/schemas/Decimal'
        reduce_only:
          type: boolean
        status:
          type: string
        filled_quantity:
          $ref: '#/components/schemas/Decimal'
        cancel_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
        settle_asset:
          type: string
          description: The asset its margin and fee are in; a coin-margined contract's quantities are whole contracts. Missing
            reads as USDT.
    UserPosition:
      type: object
      description: A contract position as derivatives-service renders it.
      required: [position_id, symbol, position_side, quantity, entry_price, mark_price, unrealized_pnl, margin, margin_mode, leverage,
        liquidation_price]
      additionalProperties: true
      properties:
        position_id:
          type: string
          format: uuid
        symbol:
          type: string
        position_side:
          type: string
          enum: [BOTH, LONG, SHORT]
        quantity:
          description: Signed, positive long.
          $ref: '#/components/schemas/Decimal'
        entry_price:
          $ref: '#/components/schemas/Decimal'
        mark_price:
          $ref: '#/components/schemas/NullableDecimal'
        unrealized_pnl:
          $ref: '#/components/schemas/NullableDecimal'
        margin:
          $ref: '#/components/schemas/Decimal'
        margin_mode:
          type: string
          enum: [CROSS, ISOLATED]
        leverage:
          type: integer
        liquidation_price:
          $ref: '#/components/schemas/NullableDecimal'
        settle_asset:
          type: string
          description: The asset its margin, results and funding are in (USDT, or the coin of a coin-margined contract); missing on
            positions from before the coin-margined contracts, USDT.
        contracts:
          description: A coin-margined position's whole contracts (signed, as quantity); null on a linear one.
          $ref: '#/components/schemas/NullableDecimal'
        value_coin:
          description: A coin-margined position's value in its coin at the mark price (null without one or on a linear one).
          $ref: '#/components/schemas/NullableDecimal'
        value_usd:
          description: Its value in USD (a coin-margined one's contracts at their face value).
          $ref: '#/components/schemas/NullableDecimal'
    IdentityRequest:
      type: object
      required: [id, user_id, kind, new_value, current_value, status, created_at, decided_at, decided_by, reason]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [EMAIL, PHONE]
        new_value:
          type: string
          description: Masked.
        current_value:
          type: string
          description: Masked; empty when the identity is gone.
        status:
          type: string
          enum: [PENDING_REVIEW, APPROVED, REJECTED]
        created_at:
          type: [string, 'null']
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by:
          type: string
        reason:
          type: string
    UserView:
      type: object
      required: [user, balances]
      properties:
        user:
          type: object
          required: [id, status, region, language, kyc_level, created_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
            region:
              type: string
            language:
              type: string
            kyc_level:
              type: integer
            created_at:
              type: string
              format: date-time
        balances:
          type: array
          items:
            type: object
            required: [account_type, asset, available, frozen]
            properties:
              account_type:
                type: string
                examples: [SPOT]
              asset:
                type: string
              available:
                $ref: '#/components/schemas/Decimal'
              frozen:
                $ref: '#/components/schemas/Decimal'
    Withdrawal:
      type: object
      required: [id, asset, network, address, amount, fee, internal, status, risk_reasons, approvals_required, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: In lists only.
        asset:
          type: string
        network:
          type: string
        address:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        fee:
          $ref: '#/components/schemas/Decimal'
        internal:
          type: boolean
        custody:
          type: boolean
          description: The custodian sends it (ADR-0011).
        status:
          type: string
        provider_status:
          type: string
          description: |
            In lists only: the custodian's last word on it (SUBMITTED until
            it acknowledges, ACCEPTED, REVIEW, APPROVED, REJECTED, SUCCESS,
            FAILED); empty when the platform sends it.
        submitted_at:
          type: [string, 'null']
          format: date-time
        risk_score:
          type: integer
          description: In lists only.
        risk_reasons:
          type: array
          items:
            type: string
            examples: [NEW_ACCOUNT, NEW_DEVICE, SECURITY_CHANGE, NEW_ADDRESS, LARGE_AMOUNT, DAILY_SHARE]
        value_usdt:
          $ref: '#/components/schemas/Decimal'
        approvals_required:
          type: integer
        approvals:
          type: array
          description: Reviewers so far (in lists only).
          items:
            type: string
        reject_reason:
          type: [string, 'null']
        tx_hash:
          type: [string, 'null']
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        created_at:
          type: string
          format: date-time
        approved_at:
          type: [string, 'null']
        broadcast_at:
          type: [string, 'null']
        confirmed_at:
          type: [string, 'null']
        held_at:
          type: [string, 'null']
          format: date-time
          description: Set while a reviewer has it on hold (held_by, with hold_note).
        held_by:
          type: string
        hold_note:
          type: string
        suspended_at:
          type: string
          format: date-time
          description: >-
            Only in a review's answer: the asset's withdrawals are suspended since then (funds missing on two custody
            checks, or an operator), so an approved one waits until an ADMIN resumes them (C5.5 ⑯).
        suspension_reason:
          type: string
          description: Only in a review's answer, with suspended_at.
    WithdrawalSuspension:
      type: object
      description: An asset whose withdrawals are suspended (wallet-service, C5.5 ⑯).
      required: [asset, shortfall, reason, suspended_by, suspended_at]
      properties:
        asset:
          type: string
          examples: [USDT]
        shortfall:
          $ref: '#/components/schemas/Decimal'
          description: What the custody checks found missing (0 for an operator's suspension).
        reason:
          type: string
        suspended_by:
          type: string
          description: wallet-service for the custody checks, else who suspended it.
        suspended_at:
          type: string
          format: date-time
    WithdrawalDetail:
      type: object
      required: [withdrawal, address_book, used_today_usdt, used_month_usdt]
      properties:
        withdrawal:
          $ref: '#/components/schemas/Withdrawal'
        address_book:
          description: The address in the user's address book; null when it was deleted.
          oneOf:
            - type: object
              required: [label, created_at, usable_at]
              properties:
                label:
                  type: string
                created_at:
                  type: string
                  format: date-time
                usable_at:
                  type: string
                  format: date-time
                  description: The end of its cooling-off period.
            - type: 'null'
        used_today_usdt:
          description: The user's withdrawals' worth today (UTC), refused ones left out.
          $ref: '#/components/schemas/Decimal'
        used_month_usdt:
          description: The same this month.
          $ref: '#/components/schemas/Decimal'
    ReviewDeposit:
      type: object
      description: A deposit as wallet-service has it, with the admin console's decisions on it.
      required: [id, user_id, kind, asset, network, address, tx_hash, amount, status, unclaimed, reason, trade_id, confirmations,
        required_confirmations, journal_id, detected_at, confirmed_at, credited_at, source, entered_by, callback_at, discrepancy, attention,
        resolution, resolved_by, resolved_at, resolution_note, release_journal_id]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CHAIN, INTERNAL]
        asset:
          type: [string, 'null']
          description: Null for a token no asset is configured for.
        network:
          type: string
        address:
          type: string
        tx_hash:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        status:
          type: string
          enum: [DETECTED, CONFIRMING, CONFIRMED, CREDITED, ORPHANED, REJECTED]
        unclaimed:
          type: boolean
          description: Booked to UNCLAIMED_DEPOSIT instead of the user.
        reason:
          type: [string, 'null']
          enum: [BELOW_MINIMUM, ACCOUNT_CLOSED, NOT_ELIGIBLE, UNSUPPORTED_TOKEN, UNKNOWN_ADDRESS, null]
          description: UNKNOWN_ADDRESS for a deposit of nobody (user_id the nil UUID, B7a).
        trade_id:
          type: [string, 'null']
          description: The custodian's trade (UDUN:<tradeId>).
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        journal_id:
          type: [string, 'null']
        detected_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, 'null']
        credited_at:
          type: [string, 'null']
        source:
          type: string
          enum: [AUTO, MANUAL]
          description: MANUAL for an administrator's backfill of a lost callback.
        entered_by:
          type: string
        callback_at:
          type: [string, 'null']
          description: When the custodian's own callback matched a backfill.
        discrepancy:
          type: string
          description: What in the custodian's callback disagreed with a backfill.
        attention:
          type: boolean
          description: Waits for an administrator's decision.
        resolution:
          type: string
          enum: ['', CREDITED, DISMISSED]
        resolved_by:
          type: string
        resolved_at:
          type: [string, 'null']
        resolution_note:
          type: string
        release_journal_id:
          type: [string, 'null']
        address_owner:
          type: [string, 'null']
          description: >-
            For a deposit of nobody, the user its address belongs to now, or belonged to before it was retired
            (address_owner_retired): a hint for crediting it (POST /admin/v1/deposits/{id}/assign), never its owner.
        address_owner_retired:
          type: boolean
    InstrumentConfig:
      type: object
      description: The reference data in the shape of deploy/instruments/<env>.json.
      required: [fee_schedules, assets, pairs, contracts]
      properties:
        fee_schedules:
          type: array
          items:
            $ref: '#/components/schemas/FeeScheduleConfig'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetConfig'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/PairConfig'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractConfig'
    InstrumentConfigPatch:
      type: object
      description: Some items to create or change, each whole; the others are left alone.
      properties:
        fee_schedules:
          type: array
          items:
            $ref: '#/components/schemas/FeeScheduleConfig'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetConfig'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/PairConfig'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractConfig'
    FeeScheduleConfig:
      type: object
      required: [tier, maker_fee_rate, taker_fee_rate]
      properties:
        tier:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        maker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        taker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        version:
          type: integer
    AssetConfig:
      type: object
      required: [asset_code, name, decimals, deposit_enabled, withdraw_enabled, trading_enabled, risk_restricted]
      properties:
        asset_code:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
        name:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          description: Fixed once set.
        deposit_enabled:
          type: boolean
        withdraw_enabled:
          type: boolean
        trading_enabled:
          type: boolean
        risk_restricted:
          type: boolean
        rank:
          type: integer
        categories:
          type: array
          items:
            type: string
        version:
          type: integer
        networks:
          type: array
          description: The networks to create or change; the others are left alone.
          items:
            $ref: '#/components/schemas/NetworkConfig'
    NetworkConfig:
      type: object
      required: [network, chain, contract_address, confirmations, min_deposit, min_withdraw, withdraw_fee, memo_required, deposit_enabled,
        withdraw_enabled]
      properties:
        asset_code:
          type: string
        network:
          type: string
        chain:
          type: string
        contract_address:
          type: string
        confirmations:
          type: integer
        min_deposit:
          $ref: '#/components/schemas/Decimal'
        min_withdraw:
          $ref: '#/components/schemas/Decimal'
        withdraw_fee:
          $ref: '#/components/schemas/Decimal'
        memo_required:
          type: boolean
        deposit_enabled:
          type: boolean
        withdraw_enabled:
          type: boolean
        display_name:
          type: string
        address_format:
          type: string
          enum: [EVM, TRON, BTC]
        eta_minutes:
          type: integer
        explorer_tx_url:
          type: string
        explorer_address_url:
          type: string
        provider:
          type: string
          description: Empty for the platform's own wallet, UDUN for the custodian.
        provider_coin:
          type: string
        version:
          type: integer
    PairConfig:
      type: object
      required: [symbol, base_asset, quote_asset, tick_size, lot_size, min_quantity, max_quantity, min_notional, price_band, fee_tier, status,
        reference_multiplier]
      properties:
        symbol:
          type: string
        base_asset:
          type: string
        quote_asset:
          type: string
        tick_size:
          $ref: '#/components/schemas/Decimal'
        lot_size:
          $ref: '#/components/schemas/Decimal'
        min_quantity:
          $ref: '#/components/schemas/Decimal'
        max_quantity:
          $ref: '#/components/schemas/Decimal'
        min_notional:
          $ref: '#/components/schemas/Decimal'
        price_band:
          $ref: '#/components/schemas/Decimal'
        fee_tier:
          type: string
        status:
          type: string
          enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
          description: Only when the pair is created (PREPARE when empty); later through the status endpoint.
        reference_symbol:
          type: string
          description: The reference market's symbol (BTCUSDT); empty for none.
        reference_multiplier:
          $ref: '#/components/schemas/Decimal'
        listed_at:
          type: string
          format: date-time
        version:
          type: integer
    ContractConfig:
      type: object
      required: [symbol, type, base_asset, quote_asset, index_symbol, tick_size, lot_size, min_quantity, max_quantity, min_notional,
        price_band, risk_tiers, funding_interval_hours, interest_rate, funding_cap, impact_notional, fee_tier, status]
      properties:
        symbol:
          type: string
        type:
          type: string
          enum: [PERPETUAL]
        base_asset:
          type: string
        quote_asset:
          type: string
        index_symbol:
          type: string
          description: The BASE-QUOTE spot pair whose price is the index.
        tick_size:
          $ref: '#/components/schemas/Decimal'
        lot_size:
          $ref: '#/components/schemas/Decimal'
        min_quantity:
          $ref: '#/components/schemas/Decimal'
        max_quantity:
          $ref: '#/components/schemas/Decimal'
        min_notional:
          $ref: '#/components/schemas/Decimal'
        price_band:
          $ref: '#/components/schemas/Decimal'
        risk_tiers:
          type: array
          description: 1-20 tiers, growing notionals, falling leverage (1-125), mmr below 1/leverage.
          items:
            $ref: '#/components/schemas/RiskTier'
        funding_interval_hours:
          type: integer
        interest_rate:
          $ref: '#/components/schemas/Decimal'
        funding_cap:
          $ref: '#/components/schemas/Decimal'
        impact_notional:
          $ref: '#/components/schemas/Decimal'
        fee_tier:
          type: string
        status:
          type: string
          enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
        version:
          type: integer
        margin_type:
          type: string
          enum: [USDT, COIN]
          description: USDT (linear, the default) or COIN (inverse, quoted in USD, settled in the base asset); fixed once listed (G0).
        settle_asset:
          type: string
          description: The asset amounts are in; a risk tier's max_notional is in it (coins of an inverse contract).
        contract_size:
          $ref: '#/components/schemas/Decimal'
          description: An inverse contract's face value in USD; quantities are whole contracts.
        reference_symbol:
          type: string
          description: The Binance contract it follows (BTCUSDT, BTCUSD_PERP); may change.
    RiskTier:
      type: object
      required: [max_notional, max_leverage, mmr]
      properties:
        max_notional:
          $ref: '#/components/schemas/Decimal'
        max_leverage:
          type: integer
        mmr:
          $ref: '#/components/schemas/Decimal'
    ConfigResult:
      type: object
      required: [changes, unchanged, warnings]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [entity, key, action, version, before, after]
            properties:
              entity:
                type: string
                enum: [FEE_SCHEDULE, ASSET, NETWORK, TRADING_PAIR, CONTRACT]
              key:
                type: string
                description: The tier, asset code, ASSET/NETWORK or symbol.
              action:
                type: string
                enum: [CREATE, UPDATE]
              version:
                type: integer
              before:
                type: [object, 'null']
                description: The item before; null when created.
              after:
                type: object
        unchanged:
          type: integer
        warnings:
          type: array
          items:
            type: object
            required: [code, symbol, detail]
            properties:
              code:
                type: string
                enum: [REFERENCE_UNCHECKED, HOUSE_NOT_LISTED, HOUSE_QUOTES, NO_INDEX_REFERENCE, NO_FUTURES, STREAMS_RECONNECT, IMPACT_UNKNOWN,
                  IMPACT_UNMEASURED, STATUS_IGNORED]
                description: |
                  REFERENCE_UNCHECKED: the reference market could not be asked (detail: the symbol);
                  HOUSE_NOT_LISTED: HOUSE quotes it only once on the flag's symbol list (detail: the flag);
                  HOUSE_QUOTES: HOUSE will quote it on the reference market's book (on the flag's symbol list, detail: the flag);
                  NO_INDEX_REFERENCE: the contract's index pair (detail) follows no reference market;
                  NO_FUTURES: no futures on the reference symbol (detail), so HOUSE gives the contract no book;
                  STREAMS_RECONNECT: the reference streams reconnect, books empty for about 20 seconds;
                  IMPACT_UNKNOWN: a new risk ladder (symbol) could not be measured against the open positions, so it cannot be confirmed now;
                  IMPACT_UNMEASURED: some of the contract's positions (detail: how many) have no fresh mark price or were too many to
                  measure in time, so the ladder cannot be confirmed now;
                  STATUS_IGNORED: the document gives an existing pair or contract another status (detail) than it has: a document never
                  moves one, a status change does.
              symbol:
                type: string
              detail:
                type: string
