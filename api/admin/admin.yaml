            last_at:
              type: [string, 'null']
              format: date-time
    CustodyCoin:
      type: object
      required: [coin, symbol, decimals, balance, token, networks]
      properties:
        coin:
          type: string
          description: The custodian's code, mainCoinType:coinType.
          examples: ['195:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t']
        symbol:
          type: string
        decimals:
          type: integer
        balance:
          type: [string, 'null']
          description: What the custodian holds, as it reports it.
        token:
          type: boolean
        networks:
          type: array
          description: The asset and network rows that use the coin; empty for a coin no network uses.
          items:
            type: object
            required: [asset, network]
            properties:
              asset:
                type: string
              network:
                type: string
    ChainCheck:
      type: object
      required: [holder, asset, held, expected, elsewhere, in_flight, unbooked, shortfall, addresses, checked_at]
      description: |
        Invariant 4 for one holder of an asset: shortfall = expected −
        held − elsewhere − in_flight − unbooked; above zero the holders
        miss funds.
      properties:
        holder:
          type: string
          description: The custodian (UDUN, UDUNMOCK), or the network (e.g. ETH-SEPOLIA) for the platform's own wallets.
        asset:
          type: string
        held:
          $ref: '#/components/schemas/Decimal'
        expected:
          $ref: '#/components/schemas/Decimal'
        elsewhere:
          $ref: '#/components/schemas/Decimal'
        in_flight:
          $ref: '#/components/schemas/Decimal'
        unbooked:
          $ref: '#/components/schemas/Decimal'
        shortfall:
          $ref: '#/components/schemas/Decimal'
        baseline:
          description: |
            Simulated deposits of the custodian's stand-in, taken out of
            expected when the real gateway replaced it: they are at no
            custodian (zero before the switch).
          $ref: '#/components/schemas/Decimal'
        addresses:
          type: integer
        checked_at:
          type: string
          format: date-time
    CustodyFee:
      type: object
      required: [withdrawal_id, tx_hash, asset, network, amount, unit, status, hold_reason, journal_id, created_at, booked_at,
        written_off_at, resolved_by, resolution]
      properties:
        withdrawal_id:
          type: string
          format: uuid
        provider:
          type: string
          description: The custodian that charged it.
        tx_hash:
          type: string
          description: The custodian and its trade, which key the fee.
        asset:
          type: string
        network:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        unit:
          type: [string, 'null']
          enum: [SELF, MAIN, OUTSIDE, null]
          description: How the custodian counts its fee on the network, as a person confirmed it; null while nobody did.
        status:
          type: string
          enum: [HELD, BOOKABLE, WRITTEN_OFF]
        hold_reason:
          type: string
        journal_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        booked_at:
          type: [string, 'null']
          format: date-time
        written_off_at:
          type: [string, 'null']
          format: date-time
        resolved_by:
          type: string
          description: Who booked or wrote it off (an administrator's email, or exchangectl's operator).
        resolution:
          type: string
          description: Their reason.
    CustodyCallback:
      type: object
      required: [id, provider, trade_id, kind, status, business_id, coin, address, amount, tx_hash, signature_ok, result, detail,
        attempts, received_at, processed_at]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        trade_id:
          type: string
        kind:
          type: string
          enum: ['', DEPOSIT, WITHDRAWAL]
        status:
          type: [integer, 'null']
          description: The custodian's status (0 review, 1 approved, 2 refused, 3 success, 4 failed).
        business_id:
          type: string
          description: The withdrawal ID of a withdrawal.
        coin:
          type: string
        address:
          type: string
        amount:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        tx_hash:
          type: string
        signature_ok:
          type: boolean
        result:
          type: string
          enum: [RECEIVED, APPLIED, IGNORED, UNMATCHED, REJECTED, FAILED, DISCREPANCY]
        detail:
          type: string
        attempts:
          type: integer
        received_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time
        remote_ips:
          type: array
          description: The addresses it came from, the latest 8 (a repeat from a new address is added).
          items:
            type: string
        raw:
          type: string
          description: The request as received (one callback only).
    MarginAccountType:
      type: string
      enum: [MARGIN_CROSS, MARGIN_ISOLATED]
      description: As api/openapi/margin.yaml; an isolated account is one per pair (symbol).
    MarginAssetParams:
      type: object
      description: >-
        An asset's margin terms (design 2026-10-06 §4.1), named as margin-service's asset_terms. Rates are fractions an
        hour (0.00001 is 0.0010%/h); the floating curve rises in a straight line from float_base with nothing lent to
        float_kink_rate at the utilization float_kink, then to float_max_rate with the whole pool lent (utilization =
        lent ÷ pool_cap, on the hour).
      required: [borrowable, collateral, haircut, pool_cap, user_cap, interest_model, fixed_rate, float_base, float_kink,
        float_kink_rate, float_max_rate]
      properties:
        borrowable:
          type: boolean
          description: Users may borrow it.
        collateral:
          type: boolean
          description: It counts in an account's total assets, times the haircut; off, an account holds it at no worth.
        haircut:
          description: Above 0 and at most 1; the asset's worth counts times it in total assets (1 for USDT, 0.95 for BTC and ETH, 0.7 for ASTRA).
          $ref: '#/components/schemas/Decimal'
        pool_cap:
          description: HOUSE's simulated supply of it (the pool), in the asset; what is lent never exceeds it.
          $ref: '#/components/schemas/Decimal'
        user_cap:
          description: The most one user may owe of it (principal), in the asset; 10% of the pool by default.
          $ref: '#/components/schemas/Decimal'
        interest_model:
          type: string
          enum: [FIXED, FLOATING]
        fixed_rate:
          description: The FIXED model's hourly rate (0.00001 is about 8.76% a year).
          $ref: '#/components/schemas/Decimal'
        float_base:
          $ref: '#/components/schemas/Decimal'
        float_kink:
          description: Above 0 and under 1.
          $ref: '#/components/schemas/Decimal'
        float_kink_rate:
          $ref: '#/components/schemas/Decimal'
        float_max_rate:
          $ref: '#/components/schemas/Decimal'
    MarginAsset:
      description: An asset's margin terms with what is lent of it now.
      allOf:
        - $ref: '#/components/schemas/MarginAssetParams'
        - type: object
          required: [asset, lent, pool_available, utilization, hourly_rate, rate_hour, interest_owed, borrowers, version, updated_by,
            updated_at, pending_approval_id]
          properties:
            asset:
              type: string
              examples: [USDT]
            lent:
              description: What users owe of it now (principal), −Σ the users' debt rows.
              $ref: '#/components/schemas/Decimal'
            pool_available:
              description: pool_cap less lent, never below 0.
              $ref: '#/components/schemas/Decimal'
            utilization:
              description: lent ÷ pool_cap, 0 to 1 (1 with a cap of 0).
              $ref: '#/components/schemas/Decimal'
            hourly_rate:
              description: The rate of the hour rate_hour (the fixed rate, or the floating one at that hour's utilization).
              $ref: '#/components/schemas/Decimal'
            rate_hour:
              type: string
              format: date-time
            interest_owed:
              description: The interest users owe of it, charged and not repaid.
              $ref: '#/components/schemas/Decimal'
            borrowers:
              type: integer
              description: The accounts that owe it.
            version:
              type: integer
              format: int64
            updated_by:
              type: string
              description: >-
                The email margin-service recorded from X-Admin-Id when the terms last changed (a two-person change's
                requester; the approver is in the request); empty for the seed (deploy/instruments/margin.json).
            updated_at:
              type: string
              format: date-time
            pending_approval_id:
              type: [string, 'null']
              format: uuid
              description: A change of it waiting for a second ADMIN (one at a time).
    MarginLeverage:
      type: integer
      enum: [3, 5, 10]
      description: An isolated leverage (design §4.2; margin-service checks the set).
    MarginLevels:
      type: object
      description: >-
        Margin level thresholds (total assets ÷ total liabilities, design §2, §4.4): under warn_level the user is
        warned, at liquidation_level the account is liquidated (two readings in a row, §4.5).
      required: [warn_level, liquidation_level]
      properties:
        warn_level:
          $ref: '#/components/schemas/Decimal'
        liquidation_level:
          $ref: '#/components/schemas/Decimal'
    MarginFee:
      type: object
      required: [liquidation_fee]
      properties:
        liquidation_fee:
          description: The fraction of a liquidation's traded value that goes to the insurance fund (0.02), 0 to 0.1.
          $ref: '#/components/schemas/Decimal'
    MarginCrossTerms:
      description: The cross account's terms (margin-service's cross_terms; design §4.4, 3x with 1.30 and 1.10, 5x with 1.20 and 1.10).
      allOf:
        - type: object
          required: [leverage]
          properties:
            leverage:
              type: integer
              enum: [3, 5]
        - $ref: '#/components/schemas/MarginLevels'
        - $ref: '#/components/schemas/MarginFee'
    MarginSettingsParams:
      type: object
      required: [cross]
      properties:
        cross:
          $ref: '#/components/schemas/MarginCrossTerms'
    MarginSettings:
      description: The cross account's terms, the design's thresholds by isolated leverage, and who last changed the terms.
      allOf:
        - $ref: '#/components/schemas/MarginSettingsParams'
        - type: object
          required: [isolated_defaults, version, updated_by, updated_at, pending_approval_id]
          properties:
            isolated_defaults:
              type: array
              description: >-
                The design's thresholds by isolated leverage (3x 1.25/1.15, 5x 1.20/1.10, 10x 1.10/1.05), which the
                console offers when a pair's leverage changes; a pair keeps its own.
              items:
                allOf:
                  - type: object
                    required: [leverage]
                    properties:
                      leverage:
                        $ref: '#/components/schemas/MarginLeverage'
                  - $ref: '#/components/schemas/MarginLevels'
            version:
              type: integer
              format: int64
            updated_by:
              type: string
              description: The email margin-service recorded from X-Admin-Id, as for an asset; empty for the seed.
            updated_at:
              type: string
              format: date-time
            pending_approval_id:
              type: [string, 'null']
              format: uuid
              description: A change waiting for a second ADMIN (one at a time).
    MarginPairParams:
      description: A pair's isolated terms (margin-service's pair_terms).
      allOf:
        - type: object
          required: [isolated, leverage]
          properties:
            isolated:
              type: boolean
              description: The pair takes isolated accounts.
            leverage:
              $ref: '#/components/schemas/MarginLeverage'
        - $ref: '#/components/schemas/MarginLevels'
        - $ref: '#/components/schemas/MarginFee'
    MarginPair:
      description: >-
        A pair's isolated terms with its isolated accounts. Its leverage (design §4.2): 10 for BTC-USDT and ETH-USDT, 5
        for the other main pairs, 3 for ASTRA-USDT and the pairs quoted in BTC.
      allOf:
        - $ref: '#/components/schemas/MarginPairParams'
        - type: object
          required: [symbol, base, quote, accounts, version, updated_by, updated_at, pending_approval_id]
          properties:
            symbol:
              type: string
              examples: [BTC-USDT]
            base:
              type: string
              description: The base asset (margin-service's pair_terms.base_asset).
            quote:
              type: string
              description: The quote asset (pair_terms.quote_asset).
            accounts:
              type: integer
              description: The isolated accounts on it that hold or owe anything.
            version:
              type: integer
              format: int64
            updated_by:
              type: string
              description: The email margin-service recorded from X-Admin-Id, as for an asset; empty for the seed.
            updated_at:
              type: string
              format: date-time
            pending_approval_id:
              type: [string, 'null']
              format: uuid
    MarginAccountStatus:
      type: string
      enum: [NORMAL, WARNED, LIQUIDATING, FROZEN]
      description: As api/openapi/margin.yaml - WARNED under the warning level, LIQUIDATING from the trigger to the end, FROZEN by an operator.
    MarginAccount:
      type: object
      description: A margin account as the console lists it (api/openapi/margin.yaml's MarginAccount without its balances, with its holder and freeze).
      required: [user_id, account, symbol, leverage, status, margin_level, warn_level, liquidation_level, total_asset, total_liability,
        net_asset, liquidation_price, warned_at, frozen_by, frozen_reason, frozen_at, unpriced, updated_at, pending_approval_id]
      properties:
        user_id:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/MarginAccountType'
        symbol:
          type: [string, 'null']
          description: An isolated account's pair; null for the cross account.
        leverage:
          type: integer
        status:
          $ref: '#/components/schemas/MarginAccountStatus'
        margin_level:
          description: total_asset ÷ total_liability; null without debts (the sites show 999).
          $ref: '#/components/schemas/NullableDecimal'
        warn_level:
          description: Its thresholds (the cross account's, or its pair's).
          $ref: '#/components/schemas/Decimal'
        liquidation_level:
          $ref: '#/components/schemas/Decimal'
        total_asset:
          description: In USDT, each collateral asset after its haircut.
          $ref: '#/components/schemas/Decimal'
        total_liability:
          description: Principal and interest owed, in USDT.
          $ref: '#/components/schemas/Decimal'
        net_asset:
          description: total_asset less total_liability; negative is a shortfall.
          $ref: '#/components/schemas/Decimal'
        liquidation_price:
          description: An isolated account's estimate of the base price at which it is liquidated; null for the cross account and without debts.
          $ref: '#/components/schemas/NullableDecimal'
        warned_at:
          type: [string, 'null']
          format: date-time
          description: When it last went under the warning level; null above it.
        frozen_by:
          type: [string, 'null']
          description: The email margin-service recorded from X-Admin-Id when an administrator froze it; null unless one did.
        frozen_reason:
          type: string
          description: The freeze's reason; empty unless an administrator froze it (margin-service's column, NOT NULL DEFAULT '').
        frozen_at:
          type: [string, 'null']
          format: date-time
        unpriced:
          type: array
          description: >-
            The assets it holds or owes without a fresh price (design §2, E0 decision ④): a debt takes the last known
            price; an account with an asset never priced is not liquidated but may not borrow, transfer out or open orders.
          items:
            type: string
        updated_at:
          type: string
          format: date-time
        pending_approval_id:
          type: [string, 'null']
          format: uuid
          description: A liquidation by hand waiting for a second administrator (one at a time).
    MarginBalance:
      type: object
      description: An asset a margin account holds or owes (api/openapi/margin.yaml's MarginBalance with its worth).
      required: [asset, free, locked, borrowed, interest, net, price_usdt, asset_usdt, liability_usdt, haircut, hourly_rate]
      properties:
        asset:
          type: string
        free:
          $ref: '#/components/schemas/Decimal'
        locked:
          description: Frozen by open orders.
          $ref: '#/components/schemas/Decimal'
        borrowed:
          description: Principal owed.
          $ref: '#/components/schemas/Decimal'
        interest:
          description: Interest owed.
          $ref: '#/components/schemas/Decimal'
        net:
          description: free + locked − borrowed − interest.
          $ref: '#/components/schemas/Decimal'
        price_usdt:
          description: The asset's price now; null without a fresh one.
          $ref: '#/components/schemas/NullableDecimal'
        asset_usdt:
          description: (free + locked) × price × haircut; 0 when it is not collateral.
          $ref: '#/components/schemas/NullableDecimal'
        liability_usdt:
          description: (borrowed + interest) × price.
          $ref: '#/components/schemas/NullableDecimal'
        haircut:
          $ref: '#/components/schemas/Decimal'
        hourly_rate:
          description: The rate of what it owes this hour.
          $ref: '#/components/schemas/Decimal'
    MarginLoan:
      type: object
      description: What an account owes of an asset (api/openapi/margin.yaml's MarginLoan).
      required: [asset, principal, interest, interest_model, hourly_rate, opened_at, updated_at]
      properties:
        asset:
          type: string
        principal:
          $ref: '#/components/schemas/Decimal'
        interest:
          $ref: '#/components/schemas/Decimal'
        interest_model:
          type: string
          enum: [FIXED, FLOATING]
        hourly_rate:
          $ref: '#/components/schemas/Decimal'
        opened_at:
          type: [string, 'null']
          format: date-time
          description: When it last went from owing nothing to owing something; null when margin-service does not know.
        updated_at:
          type: string
          format: date-time
    MarginLoanChange:
      type: object
      description: A borrow, a repayment or an interest charge (margin-service's one view of its borrows, repays and interest charges).
      required: [id, asset, kind, status, amount, principal_part, interest_part, reason, order_id, liquidation_id, journal_key,
        created_at]
      properties:
        id:
          type: string
          format: uuid
        asset:
          type: string
        kind:
          type: string
          enum: [BORROW, REPAY, INTEREST]
        status:
          type: string
          enum: [PENDING, DONE, FAILED]
          description: PENDING until the ledger booked it (DONE) or refused it (FAILED, a borrow or repayment only).
        amount:
          description: Borrowed, repaid in all, or charged.
          $ref: '#/components/schemas/Decimal'
        principal_part:
          description: A borrow's amount; of a repayment, the principal it repaid (interest is repaid first, design §4.3); 0 for a charge.
          $ref: '#/components/schemas/Decimal'
        interest_part:
          description: Of a repayment, the interest it repaid; a charge's amount; 0 for a borrow.
          $ref: '#/components/schemas/Decimal'
        reason:
          type: [string, 'null']
          enum: [USER, AUTO_BORROW, AUTO_REPAY, LIQUIDATION, null]
          description: >-
            What made a borrow or repayment - the user, an order's side effect (AUTO_BORROW, AUTO_REPAY) or a
            liquidation; null for an interest charge.
        order_id:
          type: [string, 'null']
          format: uuid
        liquidation_id:
          type: [string, 'null']
          format: uuid
        journal_key:
          type: string
          description: >-
            The ledger journal's idempotency key: margin:margin-borrow:<id>:0 for a borrow (:1 its first hour's
            interest), margin:margin-repay:<id>:0 for a repayment, trade-repay:<trade>:<buyer|seller> for an order's
            AUTO_REPAY, margin-interest:<asset>:<unix hour> for an hour's charge (then :<n> for the hour's n-th journal).
          examples: ['margin-interest:BTC:1759708800']
        created_at:
          type: string
          format: date-time
    MarginInterestCharge:
      type: object
      description: An hour's interest on an asset an account owes (design §4.3; api/openapi/margin.yaml's MarginInterest).
      required: [interest_id, asset, principal, interest_model, hourly_rate, interest, hour, status, journal_key]
      properties:
        interest_id:
          type: string
          format: uuid
        asset:
          type: string
        principal:
          description: The principal the hour was charged on.
          $ref: '#/components/schemas/Decimal'
        interest_model:
          type: string
          enum: [FIXED, FLOATING]
        hourly_rate:
          $ref: '#/components/schemas/Decimal'
        interest:
          description: principal × hourly_rate, rounded up to the asset's precision.
          $ref: '#/components/schemas/Decimal'
        hour:
          type: string
          format: date-time
          description: The hour charged (a borrow's first hour at the time of borrowing).
        status:
          type: string
          enum: [PENDING, DONE]
        journal_key:
          type: string
          description: >-
            The ledger journal's idempotency key: margin-interest:<asset>:<unix hour> (then :<n> for the hour's n-th
            journal), or margin:margin-borrow:<id>:1 for a borrow's first hour; empty while PENDING.
          examples: ['margin-interest:BTC:1759708800']
    MarginAmount:
      type: object
      required: [asset, amount]
      properties:
        asset:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
    MarginLiquidation:
      type: object
      description: >-
        A margin account's liquidation (design §4.5; api/openapi/margin.yaml's MarginLiquidation with its holder, its
        trigger and what stayed), as the read model merges its two events: a row seen completed only has null start
        fields (margin_level, total_asset, total_liability, started_at), and one from before ClickHouse 00010 a null
        trigger and approval_id.
      required: [liquidation_id, user_id, account, symbol, trigger, approval_id, status, margin_level, total_asset, total_liability,
        repaid, remaining, fee, insurance_covered, started_at, completed_at]
      properties:
        liquidation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/MarginAccountType'
        symbol:
          type: [string, 'null']
        trigger:
          type: [string, 'null']
          enum: [AUTO, MANUAL, null]
          description: At the liquidation line, or approved by hand (approval_id); null when the read model does not know.
        approval_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [STARTED, SHORTFALL, COMPLETED]
          description: >-
            SHORTFALL (an account's detail only, margin-service's) while the insurance fund lacks an asset to cover what
            the account could not repay: the debt stays owed until the fund has it and the next attempt goes on.
        step:
          type: string
          description: An account's detail only - margin-service's step of the liquidation.
        note:
          type: string
          description: An account's detail only - margin-service's note on the step (why it waits).
        margin_level:
          description: The margin level that triggered it (by hand, the level when approved); null when not known.
          $ref: '#/components/schemas/NullableDecimal'
        total_asset:
          description: Total assets at its start, in USDT.
          $ref: '#/components/schemas/NullableDecimal'
        total_liability:
          description: Total liabilities at its start, in USDT.
          $ref: '#/components/schemas/NullableDecimal'
        repaid:
          type: array
          description: Debts repaid, per asset (principal and interest).
          items:
            $ref: '#/components/schemas/MarginAmount'
        remaining:
          type: array
          description: What stayed in the account, per asset.
          items:
            $ref: '#/components/schemas/MarginAmount'
        fee:
          description: The liquidation fee in USDT, to the insurance fund; null until it completed.
          $ref: '#/components/schemas/NullableDecimal'
        insurance_covered:
          description: In USDT, what the insurance fund paid of debts the assets did not cover; 0 without a shortfall, null until it completed.
          $ref: '#/components/schemas/NullableDecimal'
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    MarginAccountDetail:
      description: A margin account with its balances and debts, loans, loan changes, interest and liquidations.
      allOf:
        - $ref: '#/components/schemas/MarginAccount'
        - type: object
          required: [balances, loans, loan_changes, interest, liquidations]
          properties:
            balances:
              type: array
              items:
                $ref: '#/components/schemas/MarginBalance'
            loans:
              type: array
              items:
                $ref: '#/components/schemas/MarginLoan'
            loan_changes:
              type: array
              description: The latest 50, newest first.
              items:
                $ref: '#/components/schemas/MarginLoanChange'
            interest:
              type: array
              description: The latest 50 charges, newest first.
              items:
                $ref: '#/components/schemas/MarginInterestCharge'
            liquidations:
              type: array
              description: The latest 20, newest first (margin-service's own, with step and note).
              items:
                $ref: '#/components/schemas/MarginLiquidation'
    MarginInterestBucket:
      type: object
      required: [day, asset, charged, repaid, owed, principal_avg, hourly_rate_avg, accounts, charged_usdt, repaid_usdt]
      properties:
        day:
          type: string
          format: date
          description: The bucket's first day.
        asset:
          type: string
        charged:
