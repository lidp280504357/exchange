        brand_color:
          type: string
        images:
          type: object
          required: [logo_light, logo_dark, favicon, apple_touch_icon]
          properties:
            logo_light:
              type: [string, 'null']
            logo_dark:
              type: [string, 'null']
            favicon:
              type: [string, 'null']
            apple_touch_icon:
              type: [string, 'null']
        footer:
          type: object
          required: [copyright, compliance]
          properties:
            copyright:
              $ref: '#/components/schemas/PlatformTexts'
            compliance:
              $ref: '#/components/schemas/PlatformTexts'
        contact:
          type: object
          required: [email, support_url]
          properties:
            email:
              type: string
            support_url:
              type: [string, 'null']
        social:
          type: array
          items:
            type: object
            required: [kind, url]
            properties:
              kind:
                type: string
              url:
                type: string
        default_locale:
          type: string
          enum: [zh-CN, zh-TW, en]
        test_mode:
          type: object
          description: >-
            The exchange in test mode (the learning mode until 2026-10-04; off when live, design §4.3). While enabled the
