      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        trade_id:
          type: string
        kind:
          type: string
          enum: ['', DEPOSIT, WITHDRAWAL]
        status:
          type: [integer, 'null']
          description: The custodian's status (0 review, 1 approved, 2 refused, 3 success, 4 failed).
        business_id:
          type: string
          description: The withdrawal ID of a withdrawal.
        coin:
          type: string
        address:
          type: string
        amount:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        tx_hash:
          type: string
        signature_ok:
          type: boolean
        result:
          type: string
          enum: [RECEIVED, APPLIED, IGNORED, UNMATCHED, REJECTED, FAILED, DISCREPANCY]
        detail:
          type: string
        attempts:
          type: integer
        received_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time
        raw:
          type: string
          description: The request as received (one callback only).
