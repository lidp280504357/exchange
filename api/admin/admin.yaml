openapi: 3.1.0
info:
  title: Exchange admin console API
  version: 0.1.0
  description: |
    The admin console's API (requirements §5.12), served by admin-service
    under /admin/v1 behind nginx; the user gateway never routes here, and
    this contract stays out of the public API reference.

    Administrators are created by an ADMIN on the administrators page
    (POST /admin/v1/admins), or with `exchangectl admin create` when no
    ADMIN can sign in (no sign-up). Signing in takes the password and a code of the
    authenticator app bound at creation; each code works once, and five
    failures lock the account for 15 minutes. The feature flag
    admin.login_without_totp switches the code off (test environments):
    the password alone signs in, and GET /admin/v1/login-options tells the
    sign-in page not to ask for it. The session is an HttpOnly,
    Secure, SameSite=Strict cookie `admin_session` scoped to /admin/; it
    ends after 8 hours, or after an hour without a request. Every request
    other than GET must carry the header `X-Admin-CSRF: 1`.

    Roles grant permissions: ADMIN (everything, and alone the console's
    settings, the administrators and the trading parameters: statuses,
    fee rates, risk ladders, reference symbols), OPERATOR (accounts,
    orders, the rest of the reference data and new pairs and contracts,
    lifting a contract's reduce-only, feature flags other than the
    console's own), FINANCE (withdrawal reviews, ledger adjustments,
    insurance fund contributions), AUDITOR (read-only). Everyone may read,
    including the reports from the ClickHouse read models. A call
    outside the role fails with ADMIN_FORBIDDEN. Every change is audited
    (audit.events → ClickHouse audit_logs) with the administrator's email
    as the actor; changes also carry a reason of at least 3 characters.

    Fund operations (manual ledger adjustments and insurance fund
    contributions) are approved by a second administrator while the flag
    admin.two_person_approval is on. Off (single-person mode, the test
    server), an administrator carries one out alone when asked to
    (`direct`, and always from a user's page) if it is worth at most the
    single-operation limit and keeps their operations of the last 24 hours
    within the daily limit (GET /admin/v1/settings; 100,000 and 500,000
    USDT by default); anything larger, or of unknown worth, still waits
    for a second administrator. The ledger books each operation once with
    the idempotency key approval:<id>.

    Lists page with an opaque cursor: an answer's `next_cursor` (null on
    the last page) is passed back as `cursor` for the next; `limit` is
    1 to 200 (50 by default) unless an endpoint says otherwise. Orders,
    trades, deposits and the overview come from the ClickHouse read
    models, a few seconds behind the services.

    The margin endpoints (tag margin, design 2026-10-06 §8, batch E5)
    follow api/openapi/margin.yaml and margin-service's tables (its field
    names). admin-service reads and changes margin-service's terms and
    accounts through margin-service's internal API (/internal/margin/* on
    its HTTP port, on the compose network only: neither the gateway nor
    nginx routes it, and a request carrying a user's X-User-Id is
    refused); a change names its administrator in X-Admin-Id, their email,
    which margin-service records as the terms' updated_by and an
    account's frozen_by. The liquidations and the interest report come
    from the ClickHouse read models.
servers:
  - url: https://admin.astras.vip
security:
  - session: []
tags:
  - name: session
  - name: admins
  - name: users
  - name: withdrawals
  - name: instruments
  - name: flags
  - name: ledger
  - name: audit
  - name: reports
  - name: derivatives
  - name: content
  - name: custody
  - name: sim
  - name: platform
  - name: margin
paths:
  /admin/v1/login-options:
    get:
      operationId: loginOptions
      summary: What signing in asks for
      description: |
        Whether the sign-in page asks for the authenticator code: true
        unless the feature flag admin.login_without_totp is on. Needs no
        session.
      tags: [session]
      security: []
      responses:
        '200':
          description: The sign-in options.
          content:
            application/json:
              schema:
                type: object
                required: [totp_required]
                properties:
                  totp_required:
                    type: boolean
  /admin/v1/login:
    post:
      operationId: login
      summary: Sign in with password and authenticator code
      description: |
        Sets the session cookie. Fails with ADMIN_LOGIN_FAILED for a wrong
        email, password or code (or a code used before), ADMIN_LOCKED
        after five failures in a row (15 minutes), and COMMON_RATE_LIMITED
        beyond 10 attempts a minute from one IP. The code may be left out
        while the flag admin.login_without_totp is on; it is then not
        checked.
      tags: [session]
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Required unless GET /admin/v1/login-options says otherwise.
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: admin_session=...; Path=/admin/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                required: [admin, expires_at]
                properties:
                  admin:
                    $ref: '#/components/schemas/Admin'
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/logout:
    post:
      operationId: logout
      summary: End the session
      tags: [session]
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/me:
    get:
      operationId: me
      summary: The signed-in administrator and their permissions
      tags: [session]
      responses:
        '200':
          description: The administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/me/password:
    post:
      operationId: changeOwnPassword
      summary: Change one's own password
      description: |
        The current password proves it is them (ADMIN_PASSWORD_WRONG); the
        new one has at least 12 characters. Their other sessions end.
        Audited as admin.password_changed. Open to an administrator who
        must change their password first (must_change_password); nothing
        else is (ADMIN_PASSWORD_CHANGE_REQUIRED, C5.5 ⑪).
      tags: [session]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        '204':
          description: Changed.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/me/totp/start:
    post:
      operationId: startOwnTOTP
      summary: A new authenticator for oneself, to bind
      description: |
        The current password and, while sign-in asks for codes, the current
        authenticator's code prove it is them (ADMIN_PASSWORD_WRONG,
        ADMIN_TOTP_CODE_WRONG). Answers with a new secret and its otpauth
        URI (no-store); the old authenticator signs in until POST
        /admin/v1/me/totp binds the new one, within 10 minutes. This and
        the other two of one's own credentials take 10 requests in 15
        minutes per administrator (COMMON_RATE_LIMITED).
      tags: [session]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                totp_code:
                  type: string
                  description: The current authenticator's code; left out while admin.login_without_totp is on.
      responses:
        '200':
          description: The new authenticator.
          content:
            application/json:
              schema:
                type: object
                required: [totp_secret, totp_uri]
                properties:
                  totp_secret:
                    type: string
                  totp_uri:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/me/totp:
    post:
      operationId: confirmOwnTOTP
      summary: Bind the new authenticator with its code
      description: |
        A wrong code is ADMIN_TOTP_CODE_WRONG; nothing waiting (or late)
        COMMON_CONFLICT. Their other sessions end. Audited as
        admin.totp_changed.
      tags: [session]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '204':
          description: Bound.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/setup/inspect:
    post:
      operationId: inspectAdminSetup
      summary: What a one-time setup link sets up
      description: |
        No session: the token is the proof (ADMIN_SETUP_INVALID when it is
        unknown, used or expired). Answers with the account and, when the
        link binds an authenticator, its secret and otpauth URI (no-store).
        Throttled with the sign-in.
      tags: [session]
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: The setup.
          content:
            application/json:
              schema:
                type: object
                required: [email, name, kind, expires_at, sets_password, totp_secret, totp_uri]
                properties:
                  email:
                    type: string
                  name:
                    type: string
                  kind:
                    type: string
                    enum: [CREATE, PASSWORD, TOTP]
                  expires_at:
                    type: string
                    format: date-time
                  sets_password:
                    type: boolean
                  totp_secret:
                    type: [string, 'null']
                  totp_uri:
                    type: [string, 'null']
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/setup:
    post:
      operationId: completeAdminSetup
      summary: Set what a one-time setup link sets up
      description: |
        The password (at least 12 characters) when the link sets one, the
        authenticator's current code when it binds one
        (ADMIN_TOTP_CODE_WRONG). The link is spent; the administrator then
        signs in as usual. Audited as admin.setup_completed in their name,
        with the address it came from. Throttled with the sign-in.
      tags: [session]
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                password:
                  type: string
                totp_code:
                  type: string
      responses:
        '204':
          description: Set up.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/roles:
    get:
      operationId: listRoles
      summary: Every role with its permissions
      description: Any administrator reads them.
      tags: [admins]
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolePermissions'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins:
    get:
      operationId: listAdmins
      summary: The administrators
      description: Every administrator, with their live sessions. Needs admins.manage.
      tags: [admins]
      responses:
        '200':
          description: The administrators.
          content:
            application/json:
              schema:
                type: object
                required: [admins]
                properties:
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedAdmin'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAdmin
      summary: Create an administrator
      description: |
        Answers with the administrator and a one-time setup link's token
        (a day), shown this once: the answer is not cached (Cache-Control:
        no-store), and the token is neither logged nor audited. Its holder
        sets the password and binds the authenticator (POST
        /admin/v1/setup): whoever created the account never knows what
        signs it in (C5.5 ⑪). Audited as admin.created. Needs
        admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role, reason]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
                role:
                  $ref: '#/components/schemas/AdminRole'
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The administrator and their setup link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetup'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/status:
    post:
      operationId: setAdminStatus
      summary: Disable or enable an administrator
      description: |
        Disabling ends their sessions at once; enabling also lifts a lock
        after failed sign-ins. Nobody changes their own account here
        (ADMIN_SELF), and an active ADMIN always remains
        (ADMIN_LAST_ADMIN). Audited as admin.disabled or admin.enabled.
        Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/role:
    post:
      operationId: setAdminRole
      summary: Change an administrator's role
      description: |
        Takes effect on their next request. Not one's own (ADMIN_SELF), nor
        the last active ADMIN's (ADMIN_LAST_ADMIN). Audited as
        admin.role_changed. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role:
                  $ref: '#/components/schemas/AdminRole'
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/password-reset:
    post:
      operationId: resetAdminPassword
      summary: Reset an administrator's password
      description: |
        The old password stops working and their sessions end; answers
        with a one-time setup link's token (a day, no-store, never logged
        or audited) whose holder sets a new one (C5.5 ⑪). Not one's own
        (ADMIN_SELF). Audited as admin.password_reset. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The setup link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetup'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/totp-reset:
    post:
      operationId: resetAdminTOTP
      summary: Reset an administrator's authenticator
      description: |
        The old authenticator stops working and their sessions end;
        answers with a one-time setup link's token (a day, no-store, never
        logged or audited) whose holder binds a new one (C5.5 ⑪). Not
        one's own (ADMIN_SELF). Audited as admin.totp_reset. Needs
        admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The setup link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSetup'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/sessions:
    get:
      operationId: adminSessions
      summary: An administrator's live sessions
      description: At most 50, the latest first. Needs admins.manage.
      tags: [admins]
      parameters:
        - $ref: '#/components/parameters/AdminID'
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSession'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/sessions/revoke:
    post:
      operationId: revokeAdminSessions
      summary: End every session of an administrator
      description: |
        Not one's own (ADMIN_SELF; signing out ends one's session).
        Audited as admin.sessions_revoked. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: The sessions ended.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/settings:
    get:
      operationId: getSettings
      summary: The console's settings
      description: |
        Whether fund operations need a second administrator (the flag
        admin.two_person_approval) and the single-person limits, with the
        caller's single-person total of the last 24 hours. Every
        administrator may read them.
      tags: [session]
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSettings
      summary: Change the console's settings
      description: |
        Changes the fields given: the limits and the delay of trading
        parameters' changes (audited as admin.settings.changed) and
        two-person approval (switches the flag
        admin.two_person_approval, audited by the flags; the other
        instances follow within 5 seconds). The daily limit must cover the
        single-operation one, and each limit is at most ten times its
        default (single 1,000,000, 24 hours 5,000,000, withdrawal
        1,000,000 USDT). Needs settings.write (ADMIN).
      tags: [session]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                two_person_approval:
                  type: boolean
                single_max_usdt:
                  $ref: '#/components/schemas/Decimal'
                daily_max_usdt:
                  $ref: '#/components/schemas/Decimal'
                withdrawal_max_usdt:
                  $ref: '#/components/schemas/Decimal'
                change_delay_seconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  description: At least change_delay_floor_seconds (COMMON_INVALID_ARGUMENT below it).
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/todo:
    get:
      operationId: getTodo
      summary: What waits for the administrator
      description: |
        The counts behind the console's badges, as far as the role shows
        them (zero otherwise): withdrawals in review (counted up to 200)
        and fund operations waiting for a decision. A count that cannot be
        read is zero and named in `partial`.
      tags: [session]
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/events:
    get:
      operationId: streamEvents
      summary: The counts as they change (Server-Sent Events)
      description: |
        An event stream: `todo` with the counts of GET /admin/v1/todo at
        once and whenever they change (checked every 10 seconds),
        `signed_out` when the session ends, and a comment after 20 seconds
        without an event. The stream does not keep the session alive; the
        browser reconnects after 5 seconds when it drops.
      tags: [session]
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users:
    get:
      operationId: listUsers
      summary: Accounts, newest first
      description: >-
        Needs users.read. Contact data stays in auth-service; find one account by its ID, email address, phone number
        or username with users/lookup. A keyword (q, A93) lists the accounts whose username, email address or phone
        number contains it, whatever the case (B167: user-service matches usernames, auth-service the email addresses
        and phone numbers, at most 500 of those).
      tags: [users]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
        - name: region
          in: query
          description: ISO 3166-1 alpha-2.
          schema:
            type: string
        - name: q
          in: query
          description: >-
            A keyword: the accounts whose username, email address or phone number contains it (any case). 2 to 64
            characters once trimmed, as auth-service and user-service take it (B170), without control characters,
            otherwise 400.
          schema:
            type: string
            minLength: 2
            maxLength: 64
            examples: [pacminer]
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/orders:
    get:
      operationId: listOrders
      summary: Spot orders in their latest state, newest first
      description: From the read model orders_current. Needs reports.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: order_id
          in: query
          description: One order (the console's search).
          schema:
            type: string
            format: uuid
        - name: symbol
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, OPEN, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED]
        - name: side
          in: query
          schema:
            type: string
            enum: [BUY, SELL]
        - $ref: '#/components/parameters/Accounts'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/trades:
    get:
      operationId: listTrades
      summary: Spot trades, newest first
      description: >-
        From the read model trades; user_id matches either side. With accounts=bots only the trades between two bots,
        with accounts=users those with anyone else on a side (a user's trade with a bot is the users'). Needs
        reports.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: symbol
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Accounts'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of trades.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits:
    get:
      operationId: listDeposits
      summary: Deposits in their latest state, newest first
      description: From the read model wallet_deposits. Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: asset
          in: query
          schema:
            type: string
        - name: network
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DETECTED, CONFIRMING, CONFIRMED, CREDITED, ORPHANED, REJECTED]
        - name: tx_hash
          in: query
          description: The deposits of one transaction, any letter case (the console's search).
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deposits.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deposit'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/review:
    get:
      operationId: listReviewDeposits
      summary: wallet-service's deposits, for decisions
      description: |
        Newest first, straight from wallet-service (not the read model):
        attention=true lists the deposits waiting for a decision (booked
        to UNCLAIMED_DEPOSIT, or a backfill the custodian's callback
        disagreed with), manual_pending=true the backfilled ones without
        a callback yet. Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: status
          in: query
          schema:
            type: string
            enum: [DETECTED, CONFIRMING, CONFIRMED, CREDITED, ORPHANED, REJECTED]
        - name: network
          in: query
          schema:
            type: string
        - name: attention
          in: query
          schema:
            type: string
            enum: ['true']
        - name: manual_pending
          in: query
          schema:
            type: string
            enum: ['true']
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deposits.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewDeposit'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/manual/check:
    post:
      operationId: checkDepositBackfill
      summary: Check a backfill of a lost custodian callback without booking it
      description: |
        The checks of POST /admin/v1/deposits/manual (the network is a
        custodian's, the address is a user's on it, neither the trade nor
        the transfer is known, the amount fits the asset's precision) and
        what it would book. Not audited. Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '200':
          description: What the backfill would book.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, asset, unclaimed, value_usdt]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  asset:
                    type: string
                  unclaimed:
                    type: boolean
                    description: Below the network's minimum, so booked to UNCLAIMED_DEPOSIT instead of the user.
                  value_usdt:
                    description: The amount's worth; null without a price (a second administrator then decides).
                    $ref: '#/components/schemas/NullableDecimal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/manual:
    post:
      operationId: backfillDeposit
      summary: Backfill a custodian deposit whose callback was lost
      description: |
        For a deposit the administrator found in the custodian's console
        (this console cannot ask the custodian, so nothing here checks it
        there). After the checks of POST /admin/v1/deposits/manual/check
        it is a fund operation (kind DEPOSIT_BACKFILL): in single-person
        mode within the limits it is booked at once (EXECUTED), otherwise
        it waits for a second administrator (PENDING). Booked like a
        callback (credited, or to UNCLAIMED_DEPOSIT below the minimum)
        with source MANUAL; the custodian's own callback, when it comes,
        is matched against it, never booked again. Audited. Needs
        deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BackfillRequest'
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 10
      responses:
        '201':
          description: The fund operation, executed or waiting for a second administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}:
    get:
      operationId: getReviewDeposit
      summary: One of wallet-service's deposits
      description: Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeposit'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}/credit:
    post:
      operationId: creditDeposit
      summary: Give an unclaimed deposit to its user
      description: |
        Only a deposit booked to UNCLAIMED_DEPOSIT (below the minimum, the
        account closed or not eligible) and only its own asset and amount:
        the ledger moves it to the user's spot account (DEPOSIT_CREDIT,
        audited as ledger.unclaimed_released). An unsupported token has no
        asset and can only be rejected (WALLET_DEPOSIT_NOT_RELEASABLE).
        Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The deposit, CREDITED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeposit'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}/assign:
    post:
      operationId: assignDeposit
      summary: Credit a deposit of nobody to a user
      description: |
        A deposit of nobody (user_id the nil UUID, reason UNKNOWN_ADDRESS:
        the custodian reported a deposit to an address no user has, B7a)
        waits in UNCLAIMED_DEPOSIT. This credits its own asset and amount
        to the user named: a fund operation of kind DEPOSIT_ASSIGN, carried
        out at once in single-person mode within the limits, else waiting
        for a second administrator (C5.5 ㉑). Credited to a user other than
        the address's holder, now or before it was retired, it waits for a
        second administrator whatever its worth (escalation
        NOT_ADDRESS_HOLDER). wallet-service sets the owner
        and releases it (audited as wallet.deposit.assigned and
        ledger.unclaimed_released). Any other deposit is
        ADMIN_DEPOSIT_NOT_UNOWNED; while another request for the deposit
        waits or once one was carried out, ADMIN_DEPOSIT_ASSIGN_OPEN (one
        live request per deposit); a user who may not take deposits is
        refused by wallet-service. The same request under its
        Idempotency-Key returns the operation, finishing one whose outcome
        was unknown. Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: The user it is credited to.
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The operation, EXECUTED with the release's journal, or PENDING with why it waits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}/reject:
    post:
      operationId: rejectDeposit
      summary: Close a deposit waiting for a decision without moving funds
      description: |
        Marks it handled with the reason (resolution DISMISSED): an
        unclaimed deposit stays in UNCLAIMED_DEPOSIT, a disagreeing
        callback stays unbooked (a backfill it disagreed with is never
        sent to the ledger). An unclaimed deposit the ledger released
        already, its release not recorded, is not closed: 409
        WALLET_DEPOSIT_RELEASED (details journal_id); crediting it again
        records the release. A deposit of nobody the ledger released to a
        user already is not closed either: 409
        WALLET_DEPOSIT_RELEASED_TO_USER (details user_id, journal_id);
        assigning it to that user records the release. Audited by the
        wallet (wallet.deposit.dismissed). Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeposit'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/dashboard:
    get:
      operationId: getDashboard
      summary: The overview
      description: |
        Accounts (user-service), the last 24 hours' trading and what waits
        in the wallet (read models), the reference feed (market-data-service)
        and a daily series. A part that cannot be read is left empty and
        named in `partial`. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/lookup:
    get:
      operationId: lookupUser
      summary: Find an account by user ID, email address, phone number or username
      description: >-
        Phone numbers in E.164 with the leading "+"; a username whatever its case (B167). Anything that names no
        account is 404 - the console then lists the accounts that contain it (GET /admin/v1/users?q=, A93); only an
        input no account could match (empty, over 254 characters, control characters) is 400. Needs users.read.
      tags: [users]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 254
            examples: [alice@example.com, user_8c6fbf82]
      responses:
        '200':
          description: The account and its balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/status:
    post:
      operationId: changeUserStatus
      summary: Move an account to another status (freeze, unfreeze, review, close)
      description: |
        user-service applies its state machine (appendix B) and records the
        change with the administrator as the actor. Needs users.status.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to:
                  type: string
                  enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
                reason:
                  type: string
                  description: Reason code of user-service, e.g. SUSPICIOUS_LOGIN, USER_REQUEST.
                note:
                  type: string
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}:
    get:
      operationId: getUser
      summary: An account with the console's tags on it
      description: Needs users.read. Unknown accounts fail with COMMON_NOT_FOUND.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/notes:
    get:
      operationId: listUserNotes
      summary: Administrators' notes on an account, newest first
      description: Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addUserNote
      summary: Write a note on an account
      description: Notes are never edited or removed; each is audited (admin.users.note_added). Needs users.notes.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/tags:
    put:
      operationId: setUserTags
      summary: Replace an account's tags
      description: |
        Tags are upper case codes (letters, digits, _; up to 32, at most
        10), e.g. VIP, SUSPICIOUS, TEST; the console's own, user-service
        never sees them. A change is audited with the tags before and after
        (admin.users.tags_changed). Needs users.notes.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
      responses:
        '200':
          description: The tags as stored (upper case, sorted).
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/adjustments:
    post:
      operationId: adjustUserBalance
      summary: Credit or debit a user's balance
      description: |
        A manual adjustment (MANUAL_ADJUSTMENT against the ADJUSTMENT system
        account) of the user's SPOT or FUTURES account: booked at once in
        single-person mode within the limits (EXECUTED with its journal, or
        FAILED with the ledger's refusal such as
        LEDGER_ADJUSTMENT_DISABLED), otherwise PENDING for a second
        administrator with the reason in `escalation`. When the ledger does
        not answer the call fails with COMMON_UNAVAILABLE and the detail
        `approval_id` names the operation, left PENDING for its requester
        to finish (decide). Needs ledger.adjust.request.
      tags: [users, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, reason]
              properties:
                account_type:
                  type: string
                  enum: [SPOT, FUTURES]
                  default: SPOT
                asset:
                  type: string
                  examples: [USDT]
                amount:
                  description: Positive credits, negative debits.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                  description: A ticket or order number kept with it (in the journal's memo).
      responses:
        '201':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/cancel-orders:
    post:
      operationId: cancelUserOrders
      summary: Cancel every open order of an account
      description: Needs orders.cancel. The cancellations complete asynchronously in the matching engine.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Cancellations requested.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/security:
    get:
      operationId: getUserSecurity
      summary: An account's sign-in security
      description: |
        Identities (masked: a***@x.com, +65912****4567), authenticator,
        password, lock, live sessions and devices (addresses masked), and
        the rebind requests waiting (auth-service). Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The account's security.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Security'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/contacts/reveal:
    post:
      operationId: revealUserContacts
      summary: An account's email and phone, unmasked
      description: |
        Each call is audited (admin.users.contacts_revealed, naming the
        kinds shown, not the values); the answer is not cached. Needs
        users.contacts.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The identities.
          content:
            application/json:
              schema:
                type: object
                required: [identities]
                properties:
                  identities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/login-history:
    get:
      operationId: listUserLogins
      summary: An account's sign-in attempts, newest first
      description: Addresses are masked. Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sign-ins.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoginEntry'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: End one of an account's sessions, or all of them
      description: |
        The sessions end with reason ADMIN (auth-service); audited as
        admin.users.sessions_revoked. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                session_id:
                  type: string
                  format: uuid
                  description: Omitted for every live session.
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: How many sessions ended.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/username-reset:
    post:
      operationId: resetUsername
      summary: Give an account a new drawn username
      description: |
        A moderation step (design 2026-10-07, avatars and usernames §1.6):
        the username becomes user_ and 8 lowercase letters or digits, the
        user is told in the app (USERNAME_RESET) and may pick another at
        once (the 7-day wait does not start). One person, audited as
        admin.users.username_reset with the old and new names. Needs
        users.status.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The account with its new username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/avatar-reset:
    post:
      operationId: resetAvatar
      summary: Take an account back to the default avatar
      description: |
        A moderation step: the uploaded files are deleted, the user is told
        in the app (AVATAR_RESET) and may upload another. Without an
        uploaded avatar it changes nothing and tells no one. One person,
        audited as admin.users.avatar_reset. Needs users.status.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The account with the default avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/totp-reset:
    post:
      operationId: resetUserTotp
      summary: Remove an account's authenticator app
      description: |
        The user is told by mail and can bind a new one; audited as
        admin.users.totp_reset. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Whether there was one to remove.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/password-reset:
    post:
      operationId: resetUserPassword
      summary: Give an account a temporary password
      description: |
        A random password (four groups of four letters and digits) replaces
        the user's; every session ends, the password lock is cleared and
        the user is told by mail as for a reset (withdrawals are reviewed
        for a day). The password is in this answer only: pass it on and
        ask the user to change it. Audited as admin.users.password_reset,
        without the password. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The temporary password (not cached).
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password, sessions_revoked]
                properties:
                  temporary_password:
                    type: string
                  sessions_revoked:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/history:
    get:
      operationId: getUserHistory
      summary: An account's status changes and accepted documents
      description: Status changes newest first, at most 50 (user-service). Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                required: [status_changes, consents]
                properties:
                  status_changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusChange'
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consent'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/risk:
    get:
      operationId: getUserRisk
      summary: The risk rules' assessments of an account, newest first
      description: |
        Only assessments with a rule hit are kept (risk-service). Moving the
        account to RISK_REVIEW and back is POST /admin/v1/users/{id}/status.
        Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The assessments.
          content:
            application/json:
              schema:
                type: object
                required: [assessments]
                properties:
                  assessments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assessment'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/identity-requests:
    get:
      operationId: listIdentityRequests
      summary: Identity rebind requests, newest first
      description: |
        A user with a single identity asks to move it to a new value and an
        administrator decides (auth-service). Values are masked. Needs
        users.read.
      tags: [users]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_REVIEW, APPROVED, REJECTED]
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdentityRequest'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/identity-requests/{id}/decide:
    post:
      operationId: decideIdentityRequest
      summary: Approve or reject an identity rebind request
      description: |
        Approving moves the identity to the new value and tells the user;
        a value another account holds fails with AUTH_IDENTITY_TAKEN. Audited as
        admin.users.identity_request_decided. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityRequest'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/balances:
    get:
      operationId: getUserBalances
      summary: An account's balances, valued in USDT
      description: |
        Every SPOT and FUTURES balance with its total (available + frozen)
        valued at its USDT pair's last price, SPOT first and the larger
        worth first; assets without a USDT price are listed in `unpriced`
        and left out of the total. Needs users.read.
      tags: [users, ledger]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [balances, total_usdt, unpriced]
                properties:
                  balances:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValuedBalance'
                  total_usdt:
                    $ref: '#/components/schemas/Decimal'
                  unpriced:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/holds:
    get:
      operationId: listUserHolds
      summary: Holds on an account's SPOT balance, newest first
      description: Active and released. Needs users.read.
      tags: [users, ledger]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The holds.
          content:
            application/json:
              schema:
                type: object
                required: [holds]
                properties:
                  holds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hold'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: placeUserHold
      summary: Freeze part of an account's SPOT balance
      description: |
        The ledger moves the amount from available to frozen (ADMIN_FREEZE)
        and audits it as ledger.hold_placed; more than the available
        balance fails with LEDGER_INSUFFICIENT_BALANCE. The user sees the
        amount frozen until it is released. Needs ledger.hold.
      tags: [users, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, reason]
              properties:
                asset:
                  type: string
                  examples: [USDT]
                amount:
                  description: Positive.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/holds/{hold}:
    delete:
      operationId: releaseUserHold
      summary: Release a hold
      description: |
        The ledger returns the amount to the available balance
        (ADMIN_UNFREEZE) and audits it as ledger.hold_released; a hold is
        released once (LEDGER_HOLD_RELEASED). Needs ledger.hold.
      tags: [users, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserID'
        - name: hold
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The released hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/orders/{order}/cancel:
    post:
      operationId: cancelUserOrder
      summary: Cancel one of an account's spot orders
      description: |
        The cancel completes asynchronously in the matching engine; the
        answer is the order as spot-trading-service has it. Audited as
        admin.orders.canceled. Needs orders.cancel.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/OrderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Cancel requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/contract-orders:
    get:
      operationId: listUserContractOrders
      summary: An account's active contract orders
      description: As derivatives-service renders them, at most 100. Needs users.read.
      tags: [users, derivatives]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The orders.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractOrder'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/contract-orders/{order}/cancel:
    post:
      operationId: cancelUserContractOrder
      summary: Cancel one of an account's contract orders
      description: Completes asynchronously in the engine. Audited as admin.derivatives.order_canceled. Needs orders.cancel.
      tags: [users, derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/OrderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Cancel requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractOrder'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/positions:
    get:
      operationId: listUserPositions
      summary: An account's open contract positions
      description: As derivatives-service renders them, with the liquidation estimate. Needs users.read.
      tags: [users, derivatives]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPosition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/futures-margin:
    get:
      operationId: getUserFuturesMargin
      summary: An account's cross margin, and what a debit would leave of it
      description: |
        The cross positions' equity and maintenance margin at the marks, as
        derivatives-service's margin monitor measures them, and the equity
        and state after a debit of the FUTURES balance (a negative
        adjustment lowers the equity at once; LIQUIDATE means the next round
        of the monitor takes the positions over). Unmeasured while a cross
        position's contract has no fresh mark price. Needs users.read.
      tags: [users, derivatives]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - name: debit
          in: query
          description: The debit to measure (positive; 0 by default).
          schema:
            $ref: '#/components/schemas/Decimal'
        - name: asset
          in: query
          description: >-
            The FUTURES account's asset: USDT (the default) for the linear contracts, a coin for its coin-margined ones
            (review ER ⑤).
          schema:
            type: string
      responses:
        '200':
          description: The cross margin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossMargin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/positions/close:
    post:
      operationId: closeUserPosition
      summary: Close a position at the market (force close)
      description: |
        The user's orders resting on the contract are canceled first, all
        of them (an opening order filled after the close would open the
        position again); once the engine confirmed (the console waits a few
        seconds, then fails with DERIV_CLOSE_PENDING to try again), a
        market order of kind ADMIN takes the whole position: reduce-only in
        one-way mode, against its side in hedge mode. A position under
        liquidation is left to the liquidation engine
        (DERIV_POSITION_LIQUIDATING); HOUSE's are not closed here
        (DERIV_HOUSE_NOT_CLOSED). The answer is the order as last seen: the
        console waits a few seconds for it to finish. On a thin book it may
        fill in part (CANCELED with filled_quantity below quantity): the
        rest of the position stays, look again and close it again. Audited
        as admin.derivatives.position_close_requested with its key, and as
        admin.derivatives.position_closed with what filled once the order is
        final. Needs derivatives.write.
      tags: [users, derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, position_side, reason]
              properties:
                symbol:
                  type: string
                  examples: [BTC-USDT-PERP]
                position_side:
                  type: string
                  enum: [BOTH, LONG, SHORT]
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The closing order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractOrder'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals:
    get:
      operationId: listWithdrawals
      summary: Withdrawals, the review queue by default
      description: |
        From wallet-service. The review queue (PENDING_REVIEW) lists oldest
        first, every other status newest first, unless order says otherwise.
        Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - name: status
          in: query
          description: A withdrawal status (appendix B), e.g. APPROVED, SUBMITTED, BROADCAST, CONFIRMED, REJECTED, FAILED; ALL for every status.
          schema:
            type: string
            default: PENDING_REVIEW
        - $ref: '#/components/parameters/UserFilter'
        - name: asset
          in: query
          schema:
            type: string
        - name: network
          in: query
          description: One network, e.g. TRON or ETH-SEPOLIA; every network when empty.
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: held
          in: query
          description: true for the withdrawals on hold (in review), false for the others.
          schema:
            type: string
            enum: ['true', 'false']
        - name: min_value_usdt
          in: query
          schema:
            $ref: '#/components/schemas/Decimal'
        - name: max_value_usdt
          in: query
          schema:
            $ref: '#/components/schemas/Decimal'
        - name: min_risk
          in: query
          description: The lowest risk score listed.
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of withdrawals.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Withdrawal'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/{id}/review:
    post:
      operationId: reviewWithdrawal
      summary: Approve or reject a withdrawal in review
      description: |
        The administrator's email is the reviewer; a withdrawal above
        20,000 USDT needs two distinct reviewers. In single-person mode
        one approval completes a withdrawal worth at most the settings'
        withdrawal_max_usdt both when it was requested and at the current
        price; one worth more now, or of no fresh price (over a minute
        old), needs two reviewers whatever the risk rules asked for: the
        approval counts and another administrator approves too. Rejecting
        releases the frozen amount. The same review again with its
        Idempotency-Key answers with the withdrawal as it stands. A
        withdrawal of an asset whose withdrawals are suspended is approved
        all the same; the answer carries suspended_at and
        suspension_reason: it waits until they are resumed. Needs
        withdrawals.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The withdrawal after the review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/review-batch:
    post:
      operationId: reviewWithdrawalBatch
      summary: Approve or reject several withdrawals with one reason
      description: |
        Each withdrawal is reviewed on its own as by POST
        /admin/v1/withdrawals/{id}/review (and audited by the wallet); one
        that fails (already decided, unknown) leaves the others decided and
        says why. One on hold is left out (ADMIN_WITHDRAWAL_HELD: its
        reviewer decides it on its own). At most 50 at a time. The same
        batch again with its Idempotency-Key answers for those it reviewed
        as they stand. Needs withdrawals.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, approve, reason]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: What came of each.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id:
                          type: string
                        ok:
                          type: boolean
                        status:
                          type: string
                          description: The withdrawal's status after the review.
                        code:
                          type: string
                          description: The error code of a failed one.
                        message:
                          type: string
                        suspended:
                          type: boolean
                          description: Approved, it waits until its asset's withdrawals are resumed.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/suspensions:
    get:
      operationId: listWithdrawalSuspensions
      summary: The assets whose withdrawals are suspended
      description: |
        wallet-service suspends an asset's withdrawals when funds are
        missing on two custody checks (or an operator does, exchangectl
        wallet withdrawals-suspend): new requests are refused, approved
        ones wait. Needs withdrawals.read.
      tags: [withdrawals]
      responses:
        '200':
          description: The suspended assets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WithdrawalSuspension'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/suspensions/{asset}/resume:
    post:
      operationId: resumeWithdrawals
      summary: Lift an asset's withdrawal suspension
      description: |
        Its approved withdrawals go out within a round, and the custody
        checks start over (funds still missing suspend it again on two
        checks). wallet-service audits it (wallet.withdrawals.resume) in
        the ADMIN's name. COMMON_NOT_FOUND when it is not suspended.
        Needs withdrawals.resume (ADMIN).
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The suspension lifted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalSuspension'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/{id}:
    get:
      operationId: getWithdrawal
      summary: A withdrawal with what its review needs
      description: |
        From wallet-service: the withdrawal, its address in the user's
        address book (when it was added, when its cooling-off ended) and
        the user's withdrawals' worth today and this month. Needs
        withdrawals.read.
      tags: [withdrawals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalDetail'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/{id}/hold:
    post:
      operationId: holdWithdrawal
      summary: Put a withdrawal in review on hold, or take it off hold
      description: |
        A held withdrawal stays in review with the reviewer's note (say,
        while the user is called) until it is taken off hold or decided;
        deciding it takes it off hold. Only a withdrawal in review
        (WALLET_WITHDRAWAL_NOT_IN_REVIEW otherwise). Audited by the wallet
        (wallet.withdrawal.hold, wallet.withdrawal.unhold). Needs
        withdrawals.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold]
              properties:
                hold:
                  type: boolean
                note:
                  type: string
                  minLength: 3
                  description: Required to put it on hold.
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/products:
    get:
      operationId: getProducts
      summary: The product lines, each with its switch and what closing it touches
      description: |
        Design 2026-10-07 (product switches) §1 #5, batch K0: spot trading
        and the USDT- and coin-margined contracts, each with its switch
        (the flags product.spot, product.usdt_m and product.coin_m, seeded
        open and never deleted; one not stored counts as open), when and
        by whom it was last switched, and what closing it would touch now:
        the open orders (spot: the active orders on spot and margin
        accounts, liquidation orders left out and margin repayments, which a
        closed spot line keeps, counted; contracts: the open orders and the
        take-profits and stop-losses) and the open positions (contracts:
        positions; spot: the margin accounts that owe anything), HOUSE's and
        the market-making accounts' (MARKET_MAKER_USER_IDS) left out, as the
        services count them (GET /internal/products/{line},
        api/internal/products.yaml; each read waits 5 seconds at most). A
        count that cannot be read is null and its line named in `partial`.
        Needs instruments.read. The flags page leaves product.* to this
        endpoint (400 there).
      tags: [instruments]
      responses:
        '200':
          description: The product lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Products'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setProduct
      summary: Open or close a product line
      description: |
        Switches one product line, by one administrator (no funds move).
        Closing it hides it from the sites within a minute (GET
        /v1/platform/products), refuses new orders other than reduce-only
        closes and cancels (PRODUCT_CLOSED; new conditional orders too;
        spot: on margin accounts too, but for repayments),
        refuses transfers into its FUTURES accounts (USDT's for usdt_m;
        BTC's, ETH's and ASTRA's for coin_m), and cancels its open orders
        through the services' POST /internal/products/{line}/cancel-open
        (spot: spot-trading-service; contracts, conditional ones included:
        derivatives-service), each cancel audited as admin.orders.canceled;
        every 5 seconds the services also cancel what slipped in as it
        closed. HOUSE and the market-making accounts keep quoting (every
        trade is against them: positions close, liquidations fill); the
        simulated market's spot bots wait while spot is closed. Positions,
        funding, liquidations (margin ones on spot too) and the
        reconciliation go on. Opening it again restores all of it; the
        canceled orders stay canceled. The cancel waits 15 seconds at most;
        one that fails part way or does not answer in time, or a service
        without the endpoint yet, leaves the line closed, is said in the
        answer's `cancel` (FAILED or UNAVAILABLE) and in the audit (cancel:
        failed or unavailable). Switching to the state it is in changes
        nothing, but closing a closed line again cancels its orders still
        open (audited as admin.products.orders_canceled): run again, a
        cancel takes what is left (spot's margin repayments and the
        liquidations stay whatever is run).
        Audited as
        admin.products.toggled (product, from, to, canceled orders,
        reason). Needs instruments.trading (ADMIN).
      tags: [instruments]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product, enabled, reason]
              properties:
                product:
                  $ref: '#/components/schemas/ProductName'
                enabled:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The product lines after the change, with the orders canceled by it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Products'
                  - type: object
                    required: [canceled_orders, cancel]
                    properties:
                      canceled_orders:
                        type: integer
                        description: The open orders the change canceled (0 when it opened a line or changed nothing; cancel.canceled when it canceled).
                      cancel:
                        description: How canceling the closed line's orders went; null when the change asked no cancel (it opened a line or changed nothing).
                        oneOf:
                          - $ref: '#/components/schemas/ProductCancel'
                          - type: 'null'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/products/spot/reduce-only:
    get:
      operationId: getSpotReduceOnly
      summary: The contracts spot's last closure left reduce-only
      description: |
        A92. Closing spot halts the platform coin's spot pair; its
        perpetuals, whose index comes from it, go reduce-only as their
        mark price goes stale, and opening spot again lifts nothing (a
        person decides the market is sound, requirements §11.7). Spot's
        last closure is read from its flag's history (product.spot): the
        latest openings and the closing before them; the contracts listed
        are those under reduce-only now that went so between the closing
        and a minute after the (earliest of the latest) opening, from
        derivatives-service. While spot is closed, or was never closed,
        closed_at and opened_at are null and nothing is listed. Needs
        instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The closure and its contracts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotReduceOnly'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/products/spot/reduce-only/lift:
    post:
      operationId: liftSpotReduceOnly
      summary: Lift the reduce-only of the contracts spot's last closure left so
      description: |
        A92. Lifts, one by one, the contracts GET
        /admin/v1/products/spot/reduce-only lists now (through
        derivatives-service's lift, as POST
        /admin/v1/derivatives/contracts/{symbol}/lift-reduce-only does), in
        the administrator's name; each is audited as
        admin.contracts.resumed (target contract:SYMBOL; details: product,
        closed_at, opened_at, reduce_only_reason, reduce_only_since, lifted
        and an error). One failing does not stop the others; a contract
        whose mark price is still stale goes reduce-only again within
        seconds. Needs derivatives.write.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: How each lift went (none when nothing was listed).
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractLift'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments:
    get:
      operationId: listInstruments
      summary: Assets (with networks), trading pairs and perpetual contracts
      description: |
        As instrument-service returns them (protobuf JSON with field names;
        int64 as strings). They change through the versioned reference-data
        file (exchangectl instruments apply, run by every deploy) and, since
        C3, through POST /admin/v1/instruments/apply. Needs instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The reference data.
          content:
            application/json:
              schema:
                type: object
                required: [assets, pairs, contracts]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  pairs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pair'
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/config:
    get:
      operationId: getInstrumentConfig
      summary: The reference data as a config document
      description: |
        In the shape of deploy/instruments/<env>.json (what exchangectl
        instruments apply reads), statuses and versions included: what the
        console's forms start from. Needs instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentConfig'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/preview:
    post:
      operationId: previewInstrumentConfig
      summary: What a config document would change, changing nothing
      description: |
        The document names only the items to create or change, each whole
        (a field left out becomes empty). Items missing are left alone,
        statuses never change here (the status endpoints do that): a new
        pair or contract starts in PREPARE (ADMIN_NEW_ITEM_NOT_PREPARE for
        another status). A pair's
        new reference symbol must be listed on the reference market's spot
        market (ADMIN_REFERENCE_UNKNOWN otherwise: it would fail the
        reference reads of every pair); clearing the reference symbol of a
        pair HOUSE quotes or a perpetual's index follows is refused
        (ADMIN_REFERENCE_IN_USE); `warnings` note what else follows.

        `guard` lists the trading parameters the document moves (fee rates,
        a pair's fee tier, reference symbol and multiplier, a contract's
        fee tier and risk ladder) with, for a ladder, the open positions it
        would liquidate (derivatives-service measures them as its margin
        monitor does). Such a document is applied only by an ADMIN bringing
        back `guard.confirmation` (bound to them and to exactly these
        changes, valid 10 minutes), and then waits (see apply). Needs
        instruments.write.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: '#/components/schemas/InstrumentConfigPatch'
      responses:
        '200':
          description: The changes it would make.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConfigResult'
                  - type: object
                    required: [guard]
                    properties:
                      guard:
                        $ref: '#/components/schemas/ChangeGuard'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/apply:
    post:
      operationId: applyInstrumentConfig
      summary: Apply a config document
      description: |
        As POST /admin/v1/instruments/preview, then applied in one
        transaction by instrument-service (source CONSOLE in its history,
        each change versioned and published). The deploy's sync of the
        reference-data file keeps what the console changed last (exchangectl
        instruments apply --force overrides). Audited
        (admin.instruments.applied). Needs instruments.write.

        A document moving trading parameters (design 2026-10-02 §2 item 6)
        needs instruments.trading (ADMIN) and the preview's confirmation
        (ADMIN_CONFIRMATION_REQUIRED without it, with `reason` expired or
        changed when it no longer holds): it answers 202 with the change,
        the same change when the confirmation is brought again (one
        confirmation confirms one change), which takes effect the settings'
        change_delay_seconds later, or,
        while admin.two_person_approval is on, that long after a second
        ADMIN approved it (POST /admin/v1/instruments/changes/{id}/decide);
        audited as admin.instruments.change_requested. New items touch
        nobody until opened and apply at once.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, reason]
              properties:
                config:
                  $ref: '#/components/schemas/InstrumentConfigPatch'
                reason:
                  type: string
                  minLength: 3
                confirmation:
                  type: string
                  description: The preview's guard.confirmation.token, for a document moving trading parameters.
      responses:
        '200':
          description: The changes made.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConfigResult'
                  - type: object
                    required: [change]
                    properties:
                      change:
                        type: 'null'
        '202':
          description: The changes confirmed, waiting.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConfigResult'
                  - type: object
                    required: [change]
                    properties:
                      change:
                        $ref: '#/components/schemas/InstrumentChange'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles:
    get:
      operationId: listArticles
      summary: A section's announcements or help articles, every status
      description: |
        Kept by notification-service and read by the sites through GET
        /v1/announcements and /v1/help once published (design 2026-10-02
        §4.5). Every administrator reads them.
      tags: [content]
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [ANNOUNCEMENT, HELP, LEGAL, HOME]
      responses:
        '200':
          description: The articles.
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createArticle
      summary: Write a draft
      description: |
        Chinese (zh-CN) title and Markdown body required, Traditional
        Chinese (zh-TW) and English optional (a reader without their
        language gets the Simplified; G7b). A slug holds one article per mode in its section: a TEST
        and a FORMAL one side by side, or one for BOTH; another that
        overlaps is NOTIFY_ARTICLE_EXISTS (409). Audited as
        admin.content.created on <section>:<slug>. Needs content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArticleWrite'
                - type: object
                  required: [section, reason]
                  properties:
                    section:
                      type: string
                      enum: [ANNOUNCEMENT, HELP, LEGAL, HOME]
                    reason:
                      type: string
                      minLength: 3
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles/{id}:
    get:
      operationId: getArticle
      summary: An article with every text
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateArticle
      summary: Rewrite an article
      description: |
        At the version read (COMMON_CONFLICT when someone saved it
        meanwhile); its status stays: a published article changes on the
        sites within a minute. Audited as admin.content.updated. Needs
        content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArticleWrite'
                - type: object
                  required: [version, reason]
                  properties:
                    version:
                      type: integer
                    reason:
                      type: string
                      minLength: 3
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles/{id}/publish:
    post:
      operationId: publishArticle
      summary: Publish an article, now or at a time
      description: |
        The sites show it from publish_at on (now when left out). Audited
        as admin.content.published. Needs content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                publish_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles/{id}/archive:
    post:
      operationId: archiveArticle
      summary: Take an article off the sites
      description: It may be published again. Audited as admin.content.archived. Needs content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/broadcasts:
    get:
      operationId: listBroadcasts
      summary: The in-app messages sent, newest first
      description: With how many each reached and how many of them read it. Every administrator reads them.
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Broadcast'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: sendBroadcast
      summary: Send an in-app message to one user, a tag's users or everyone
      description: |
        notification-service delivers it in rounds, each user once in their
        language (Chinese without English), as a notice of type BROADCAST
        on the sites' inbox and pushed live; email also mails it. A tag's
        users are those tagged now (ADMIN_TAG_EMPTY when none, at most
        10,000). Audited as admin.notices.sent on broadcast:<id>. Needs
        notices.send.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, title, body, reason]
              properties:
                audience:
                  type: string
                  enum: [ALL, USER, TAG]
                user_id:
                  type: string
                  format: uuid
                  description: With USER.
                tag:
                  type: string
                  description: With TAG.
                title:
                  $ref: '#/components/schemas/LocalizedText'
                body:
                  $ref: '#/components/schemas/LocalizedText'
                link:
                  type: string
                  description: A path on the sites the message leads to, such as /assets.
                email:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The message, being delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/broadcasts/{id}:
    get:
      operationId: getBroadcast
      summary: An in-app message sent, with its counts
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/broadcasts/{id}/resume:
    post:
      operationId: resumeBroadcast
      summary: Send a FAILED in-app message again from where it stopped
      description: |
        A message whose rounds failed ten times in a row (about half an
        hour, the error in last_error) waits for this; the other messages
        went on meanwhile (C5.5 ⑫). Anything but FAILED is COMMON_CONFLICT.
        Audited as admin.notices.resumed. Needs notices.send.
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The message, sending again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim:
    get:
      operationId: getSim
      summary: The simulated market of the platform coin, as market-sim renders it
      description: |
        ASTRA design §6 (docs/runbook/market-sim.md): the target and the
        last price, the settings and their version, the guards' counts,
        the bots with their balances and errors, the running and queued
        events, the price band (anchor, where the makers quote, whether
        they walk toward a target beyond the band), the watchdog and the
        perpetual. Needs reports.read.
      tags: [sim]
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimStatus'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/history:
    get:
      operationId: getSimHistory
      summary: The target and the last price every 10 seconds
      tags: [sim]
      parameters:
        - name: minutes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 1440
      responses:
        '200':
          description: The samples, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimSample'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/events:
    get:
      operationId: listSimEvents
      summary: The price events running and queued, or the latest of every status
      tags: [sim]
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimEvent'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSimEvent
      summary: Create a price event
      description: |
        Needs sim.control and a reason. market-sim runs it (at once or at
        starts_at, at most 24 hours ahead) in the administrator's name;
        beyond one operator's share of price moves in an hour (30% at once,
        50% an hour) it becomes a request for a second administrator with
        sim.control (202, decided on the approvals), whose name market-sim
        then receives as the approver. 403 SIM_EVENTS_OFF while the flag
        sim.events is off; 400 beyond the hard caps.

        An OVERLAY is a price event on any pair (design 2026-10-07, general
        price control; J0 contract §3.1, docs/runbook/market-sim.md): each
        followed pair gets an event whose factor ramps the pair's reference
        data (book, trades, ticker, candles; with risk, the perpetuals'
        index and mark and the leverage's valuation) to the target and back
        to 1, the simulated market's own pair a JUMP of its model. One
        operator's share is counted by pair (30% at once, 50% an hour; the
        request names the pair beyond it); all or none of a request's events
        are made, answered as items. 403 SIM_OVERLAY_OFF while the flag
        market.overlay is off; 409 SIM_OVERLAY_RUNNING (a pair has an event
        open; details.symbol), 409 SIM_OVERLAY_LOSS_CAP (HOUSE's worst loss
        estimated beyond OVERLAY_MAX_LOSS_USDT: details.symbol,
        estimate_usdt and cap_usdt, or reason when HOUSE's rooms cannot be
        read); 400 SIM_OVERLAY_TOO_FAR (beyond ±90%), SIM_NOT_OVERLAYABLE (a
        pair that follows no reference market and is not the simulated
        market's); 503 SIM_OVERLAY_UNCONFIGURED.
      tags: [sim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SimEventWrite'
                - $ref: '#/components/schemas/Reason'
      responses:
        '201':
          description: The event; an OVERLAY's events, one a pair.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [event]
                    properties:
                      event:
                        $ref: '#/components/schemas/SimEvent'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/SimEventItem'
        '202':
          description: Beyond one operator's share; waiting for a second administrator.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/events/{id}/end:
    post:
      operationId: endSimEvent
      summary: Cancel a queued event or end a running one
      description: |
        A HALT ends by resuming the pair and its perpetual. A running
        OVERLAY comes back to the reference price at once (立即恢复): its
        factor goes linearly to 1 within 3 seconds, its result CANCELED;
        the pair counts as having an event until then. Needs sim.control.
      tags: [sim]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The event, ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimEvent'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/events/{id}/plan:
    get:
      operationId: getSimPlan
      summary: A threshold target's plan and where the market is against it
      description: |
        ASTRA A6: a TARGET's envelope minute by minute (the planned price
        with its band), its spikes, and now: the target price, the planned
        one, the deviation ln(target/plan), whether the target is at risk
        of missing the level, when it crossed and how it ended (HIT,
        MISSED, CANCELED). market-sim's answer as it is. Needs
        reports.read.
      tags: [sim]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimPlan'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/prices:
    get:
      operationId: getSimPrices
      summary: The last price of every listed pair, for the price event form
      description: |
        market-data's tickers (a followed pair's last is the reference
        market's, times the factor of a price event running on it): the
        form shows each chosen pair's price now and where the target takes
        it (J3). Needs reports.read.
      tags: [sim]
      responses:
        '200':
          description: The prices by pair.
          content:
            application/json:
              schema:
                type: object
                required: [prices]
                properties:
                  prices:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Decimal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/target-preview:
    get:
      operationId: previewSimTarget
      summary: Whether a threshold target is feasible, and its envelope, before it is asked for
      description: |
        ASTRA A6, for the price control's form: from the current target,
        whether the level is reachable within the window (the shortest
        window that is, min_duration_seconds), the move it plans, whether
        it is beyond one operator's share (a second administrator approves
        it), and the planned envelope. Needs reports.read.
      tags: [sim]
      parameters:
        - name: price
          in: query
          required: true
          description: The level.
          schema:
            type: string
        - name: duration_seconds
          in: query
          required: true
          description: The window, at most a day (market-sim's longest).
          schema:
            type: integer
            minimum: 60
            maximum: 86400
        - name: direction
          in: query
          description: ABOVE or BELOW; inferred from the current target when absent.
          schema:
            type: string
            enum: [ABOVE, BELOW]
        - name: starts_at
          in: query
          description: When it starts, at most 24 hours ahead (else 400 ADMIN_SIM_TOO_FAR_AHEAD); now when absent.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimTargetPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/params:
    put:
      operationId: updateSimParams
      summary: Replace the simulated market's settings
      description: |
        Every field, as GET /admin/v1/sim shows them. Needs sim.control.
        Changes that move the price or the turnover beyond one operator's
        share become a request for a second administrator (202).
      tags: [sim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [params]
                  properties:
                    params:
                      $ref: '#/components/schemas/SimParams'
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The settings' new version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        '202':
          description: Waiting for a second administrator.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/impact:
    post:
      operationId: simImpact
      summary: What a mark price would do to the simulated market's perpetual
      description: |
        ASTRA design §6.3: the open longs and shorts, the positions the
        margin monitor would take over at that price that it does not now
        (a cross account whole), their notional and accounts, and what they
        lack beyond their margin (the insurance fund's estimated share);
        HOUSE left out (derivatives-service's price impact). Changes
        nothing. Needs reports.read.
      tags: [sim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price:
                  $ref: '#/components/schemas/Decimal'
      responses:
        '200':
          description: The impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimImpact'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/token:
    get:
      operationId: getSimToken
      summary: Who holds the simulated market's coin
      description: |
        The coin (the base of market-sim's pair, ASTRA) as the ledger's
        lines hold it (the read model, a few seconds behind): the bots
        (market-sim's list) and the other users with how many of each hold
        some, the platform's system accounts, what manual adjustments
        issued (the ADJUSTMENT account's debit) and the 20 largest holders.
        Needs reports.read.
      tags: [sim]
      responses:
        '200':
          description: The holdings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimToken'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/mint:
    post:
      operationId: mintSimBots
      summary: More of the coin or USDT for the bots
      description: |
        A fund operation of kind SIM_MINT (ASTRA design §4; no transfers
        between bots, the pool grows by audited adjustments): the amount
        split evenly, to two decimal places, over the bots (of one role, or
        every one), the first taking the rounding; one manual adjustment of
        each bot's SPOT account, keyed by the operation and the bot.
        Booked at once in single-person mode within the limits (EXECUTED,
        or FAILED with the ledger's refusal of the first bot), otherwise
        PENDING for a second administrator with ledger.adjust.approve;
        COMMON_UNAVAILABLE with the detail approval_id when the ledger does
        not answer. A refusal after some bots were booked answers the
        ledger's code with the details approval_id, bot, booked and of: the
        operation stays PENDING (counted in its requester's 24 hours) to be
        finished on the approvals page once the cause is fixed, its keys
        booking only the rest. At most 10,000,000 of the coin or 1,000,000
        USDT at once, whoever approves (422 ADMIN_SIM_MINT_CAP, details
        asset and max). Needs ledger.adjust.request.
      tags: [sim, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, reason]
              properties:
                asset:
                  type: string
                  description: The coin or USDT.
                  examples: [ASTRA]
                amount:
                  description: In all, positive.
                  $ref: '#/components/schemas/Decimal'
                role:
                  type: string
                  enum: [MAKER, TAKER, TREND, EXECUTOR]
                  description: Only the bots of this role; every bot when absent.
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
      responses:
        '201':
          description: The operation (payload bots lists each bot's share as JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/profile:
    get:
      operationId: getPlatformProfile
      summary: The platform's profile, as the sites show it
      description: |
        Design 2026-10-04 §4.1 (D2): the name, logos, colours, footer,
        contact, test mode (and its banner), registration and the welcome
        credits the sites read, with who last changed it. instrument-service keeps it;
        the welcome credits are the ledger's (changed with
        /admin/v1/platform/welcome-credits). Every administrator reads it.
      tags: [platform]
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformProfileAdmin'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updatePlatformProfile
      summary: Replace the platform's profile (all but the images and the welcome credits)
      description: |
        expected_version is the version read: 409
        INSTRUMENT_PLATFORM_CHANGED when someone saved in between. The
        sites show the change within a minute, without a build. One ADMIN
        (settings.write) alone; audited as admin.platform.updated with the
        fields that changed, before and after (design §5).
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlatformProfileWrite'
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The profile as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformProfileAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/images/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [logo_light, logo_dark, favicon, apple_touch_icon]
    put:
      operationId: uploadPlatformImage
      summary: Upload one of the platform's images
      description: |
        Square, at most 200 KB; PNG, SVG (rebuilt from an allow list) or
        WebP for the logos, PNG or SVG for the favicon, PNG of at least
        180 px for the apple-touch-icon (instrument-service checks them).
        Its URL changes with the version, so no cache serves the old one.
        settings.write; audited as admin.platform.image_updated with its
        type, size and SHA-256, never its bytes.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [data, mime]
                  properties:
                    data:
                      type: string
                      description: The image, base64.
                    mime:
                      type: string
                      enum: [image/png, image/svg+xml, image/webp]
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The profile with the image's new URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformProfileAdmin'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePlatformImage
      summary: Remove an uploaded image (the built-in one shows again)
      description: settings.write; audited as admin.platform.image_removed.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The profile without the image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformProfileAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps:
    get:
      operationId: listPlatformApps
      summary: The apps to download (Android, iOS) as the console sets them
      description: |
        Design 2026-10-07 (App download page) §2.3: each platform's mode
        (OFF, LINK, FILE), link, version notes and switch, its current app
        and the files kept on the server, what the sites show now, its
        version and who changed it last. instrument-service keeps the
        settings; the files are on the server's disk, nginx serves them
        under /downloads/ on the three sites. With them the switch for the
        sites' download entries (`entry`, H5; PUT
        /admin/v1/platform/download-entry). Every administrator reads
        them. Batch H0.
      tags: [platform]
      responses:
        '200':
          description: Both platforms, Android first, and the entries' switch.
          content:
            application/json:
              schema:
                type: object
                required: [apps, entry]
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformAppAdmin'
                  entry:
                    $ref: '#/components/schemas/AppEntryAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps/{platform}:
    parameters:
      - $ref: '#/components/parameters/AppPlatform'
    put:
      operationId: updatePlatformApp
      summary: Set a platform's download - off, a link or its uploaded app - with its notes and switch
      description: |
        expected_version is the version read: 409 INSTRUMENT_PLATFORM_CHANGED
        when someone saved, uploaded or deleted in between. LINK needs an
        https link; FILE needs a current app (completing an upload sets FILE
        by itself). The sites show the change within a minute. One ADMIN
        (settings.write) alone; audited as admin.platform.app_updated with
        the fields that changed, before and after.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlatformAppWrite'
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The platform as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAppAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps/{platform}/uploads:
    parameters:
      - $ref: '#/components/parameters/AppPlatform'
    post:
      operationId: startAppUpload
      summary: Start uploading an app or iOS's configuration profile, in parts
      description: |
        The file goes up in parts of part_size (10 MiB, the last one
        smaller), so that no request passes Cloudflare's 100 MB (§1.2 #5):
        PUT each part (any order, again to resume), then complete. The
        platform and kind fix the extension: ANDROID APP .apk, IOS APP .ipa,
        IOS MOBILECONFIG .mobileconfig; at most 500 MiB (524,288,000
        bytes), a .mobileconfig 1 MiB. An upload not completed within 24
        hours is dropped with its parts. 409 PLATFORM_APP_UPLOADS_FULL while
        three uploads are open; 409 PLATFORM_APP_FILES_FULL while the
        platform keeps 10 files (a configuration profile that replaces
        iOS's aside); 409 PLATFORM_APP_DISK_FULL when the server's disk has
        less than twice the size and 2 GiB more. settings.write.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUploadStart'
      responses:
        '201':
          description: The upload, waiting for its parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpload'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps/{platform}/uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/AppPlatform'
      - $ref: '#/components/parameters/AppUploadID'
    get:
      operationId: getAppUpload
      summary: An upload with the parts received (to resume one)
      description: settings.write; 404 once completed, dropped or expired.
      tags: [platform]
      responses:
        '200':
          description: The upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpload'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: dropAppUpload
      summary: Drop an upload and its parts
      description: 409 PLATFORM_APP_UPLOAD_BUSY while a completion or a part being written holds it. settings.write.
      tags: [platform]
      responses:
        '204':
          description: Dropped.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps/{platform}/uploads/{upload_id}/parts/{n}:
    parameters:
      - $ref: '#/components/parameters/AppPlatform'
      - $ref: '#/components/parameters/AppUploadID'
      - name: n
        in: path
        required: true
        description: The part, from 1 to parts.
        schema:
          type: integer
          minimum: 1
    put:
      operationId: putAppUploadPart
      summary: Send one part of an upload
      description: |
        Exactly part_size bytes, the last part the rest (400
        COMMON_INVALID_ARGUMENT otherwise, or for a part number out of
        range); a part sent again replaces it; 409
        PLATFORM_APP_UPLOAD_BUSY while a completion or another part being
        written holds the upload (send the parts one after another). nginx
        lets this route take 16 MB (client_max_body_size), the console's
        other routes less. settings.write.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The upload with the part received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpload'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps/{platform}/uploads/{upload_id}/complete:
    parameters:
      - $ref: '#/components/parameters/AppPlatform'
      - $ref: '#/components/parameters/AppUploadID'
    post:
      operationId: completeAppUpload
      summary: Put an upload's parts together, check the package and make it the platform's app
      description: |
        Joins the parts and checks the size and SHA-256 given at the start,
        then the package: an .apk is a zip holding AndroidManifest.xml
        (package, versionName, versionCode, minSdkVersion read from it), an
        .ipa a zip holding Payload/<name>.app/Info.plist (CFBundleIdentifier,
        CFBundleShortVersionString, CFBundleVersion, MinimumOSVersion), a
        .mobileconfig a property list, signed or not, of PayloadType
        Configuration. Stored under a new name (its file_id) in
        /downloads/android/ or /downloads/ios/; an .ipa gets a manifest.plist
        beside it naming https://<the profile's domain> (else the console's
        own site), for the over-the-air install - upload again after
        changing the domain. An app becomes the platform's current one and
        the mode FILE (enabled stays as it is; the files before it are kept
        until deleted); a .mobileconfig becomes iOS's configuration profile,
        replacing the one before, which is deleted. 409
        PLATFORM_APP_UPLOAD_INCOMPLETE while a part is missing (details
        missing, the part numbers); 422 PLATFORM_APP_FILE_INVALID when the
        size, the SHA-256 or the package does not hold (details reason),
        which drops the upload; 409 PLATFORM_APP_UPLOAD_BUSY while another
        completion runs; 409 PLATFORM_APP_FILES_FULL while the platform
        keeps 10 files. Any failure but a file refused keeps the upload
        for another try. settings.write; audited as
        admin.platform.app_file_uploaded with the platform, kind, name,
        size, SHA-256 and what the package says.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The platform with its new file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAppAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/apps/{platform}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/AppPlatform'
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteAppFile
      summary: Delete an uploaded file from the server
      description: |
        Deletes the file (an .ipa with its manifest.plist) from the disk and
        the platform's list. The current app deleted, the platform goes back
        to its link (LINK) when it has one, else OFF (§1.2 #7); iOS's
        configuration profile deleted, mobileconfig_url goes. settings.write;
        audited as admin.platform.app_file_deleted with the platform, kind,
        name, size and SHA-256.
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The platform without the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAppAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/download-entry:
    put:
      operationId: setDownloadEntry
      summary: Show or hide the sites' download entries
      description: |
        Design 2026-10-07 (App download page) §1.2 #8, user 19:3x, batch
        H5: the switch 显示下载入口, on by default. On, the sites show their
        download entries whether or not a platform is offered (the page and
        the QR panel then say none is offered yet); off, the entries are
        hidden and /download still opens when visited. The sites read it
        from GET /v1/platform/apps (`entry`) within a minute. One ADMIN
        (settings.write) alone; audited as admin.platform.download_entry
        (from, to). Switching it to the state it is in changes nothing (no
        version, no audit).
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [visible]
                  properties:
                    visible:
                      type: boolean
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The switch as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEntryAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/platform/welcome-credits:
    get:
      operationId: getWelcomeCredits
      summary: What a new account gets (the ledger's setting)
      description: |
        The welcome credits (design 2026-10-04 §4.2) and the master switch
        ledger.welcome_credit: a new account gets them while both say so.
        A launch sets them to nothing. Every administrator reads them.
      tags: [platform]
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeCreditsSetting'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setWelcomeCredits
      summary: Change the welcome credits
      description: |
        settings.write. Lowering or clearing (an amount of 0 or [] is
        nothing) applies at once: 200 with the setting, audited as
        admin.platform.welcome_changed (old, new). Raising any asset, or
        from nothing to something, waits for a second ADMIN: 202 with a
        WELCOME_CREDIT request (escalation WELCOME_RAISE). A raise is
        worth at most 10,000 USDT a change (422 ADMIN_WELCOME_RAISE_CAP,
        whoever approves), priced at the USDT pairs' fresh prices (422
        ADMIN_WELCOME_UNPRICED without one), and held to the ledger's
        rules first (400 for an asset code other than 2-12 capitals and
        digits, an asset not listed, more decimals than the asset has).
        expected_version is the version read: 409 LEDGER_SETTINGS_CHANGED
        when it moved, then and when the request is approved (it fails;
        unless the ledger holds the very change at the next version, set
        by its requester, by an attempt whose answer was lost: then it is
        EXECUTED; when the setting cannot be read again the outcome is
        unknown and it stays PENDING, 503). The request lapses a day after
        it was asked for: approving it then only fails it ("expired at
        <time>"). The same raise asked again by the same administrator
        against the same version while the first waits: 409
        ADMIN_WELCOME_RAISE_PENDING (details approval_id). All amounts 0
        is no credits: the ledger gets [].
      tags: [platform]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [credits, expected_version]
                  properties:
                    credits:
                      type: array
                      maxItems: 10
                      items:
                        $ref: '#/components/schemas/WelcomeCredit'
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Lowered or cleared, at once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeCreditsSetting'
        '202':
          description: A raise waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/launch-checklist:
    get:
      operationId: getLaunchChecklist
      summary: What of the test setup is still on (read-only)
      description: |
        Design 2026-10-04 §4.6 (D2): each item from its source now, with
        what it is (value) and whether it is what a launch needs. ready
        when every item is OK. It changes nothing and covers what the
        console can change and see; the deployment side is the launch
        handbook's. PENDING: its source is not there yet; UNKNOWN: its
        source did not answer. The 14 items of §4.6 and house (review ㉚:
        market.house_liquidity on, HOUSE holding every backed asset a
        pair is made of), then margin (margin design 2026-10-06 §8):
        margin.enabled off, or on with margin.liquidation on and neither it
        nor margin.auto_borrow on for everyone without rules (the test
        server's are), then the contracts' (coin-margined design 2026-10-06
        §2.7): insurance, the fund of every open contract's settlement
        asset above zero, and coin_m, derivatives.coin_m never on for
        everyone. Every administrator reads it.
      tags: [platform]
      responses:
        '200':
          description: The checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchChecklist'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/assets/{code}/profile:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{2,10}$'
    get:
      operationId: getAssetProfile
      summary: An asset's profile, as the sites show it
      description: |
        The name, introductions, links and logo the sites show for an
        asset beyond its code (ASTRA design §5.3; instrument-service keeps
        it). The logo is at logo_url, a path the console's domain also
        serves. Needs instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetProfile'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAssetProfile
      summary: Replace an asset's profile
      description: |
        The text replaces the old (an empty display name shows the asset's
        name); logo (base64, with logo_mime: PNG, SVG or WebP, square, at
        most 200 KB; an SVG is rebuilt from an allow list of elements)
        replaces the logo, clear_logo removes it, neither keeps it. The
        sites show it within a minute: a new logo gets a new URL. Audited
        as admin.instruments.profile_updated on asset:<code>, the logo by
        its type and size. Needs instruments.write.
      tags: [instruments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetProfileWrite'
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The profile, its version moved on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetProfile'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/changes:
    get:
      operationId: listInstrumentChanges
      summary: The changes of trading parameters, newest first
      description: |
        Waiting for a second ADMIN (PENDING_APPROVAL) or their time
        (SCHEDULED), applied, canceled, rejected or failed (the target
        moved since it was confirmed). Needs instruments.read.
      tags: [instruments]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_APPROVAL, SCHEDULED, APPLIED, CANCELED, REJECTED, FAILED]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstrumentChange'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/changes/{id}/decide:
    post:
      operationId: decideInstrumentChange
      summary: Approve or reject a change waiting for a second ADMIN
      description: |
        Approved, it takes effect change_delay_seconds later; not by its
        requester (ADMIN_SELF_APPROVAL, who cancels instead);
        ADMIN_CHANGE_CLOSED once decided. Audited as
        admin.instruments.change_approved or change_rejected. Needs
        instruments.trading.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ChangeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentChange'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/changes/{id}/cancel:
    post:
      operationId: cancelInstrumentChange
      summary: Cancel a change before it takes effect
      description: |
        Any ADMIN, its requester included; ADMIN_CHANGE_CLOSED once it took
        effect or was closed, ADMIN_CHANGE_APPLYING while an apply round has
        it. Audited as admin.instruments.change_canceled. Needs
        instruments.trading.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ChangeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentChange'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/pairs/{symbol}/status/preview:
    post:
      operationId: previewPairStatus
      summary: What moving a trading pair to another status does
      description: |
        A halt takes effect at once (`immediate`, the emergency brake);
        anything else is a change of trading parameters: the answer carries
        the confirmation POST .../status brings back, and how long the
        change will wait. INSTRUMENT_STATUS_TRANSITION_INVALID for a move
        the state machine forbids. Needs instruments.trading.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
      responses:
        '200':
          description: The move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/pairs/{symbol}/status:
    post:
      operationId: setPairStatus
      summary: Move a trading pair to another status (the per-pair emergency switch)
      description: |
        PREPARE → TRADING ⇄ HALT; TRADING or HALT → CANCEL_ONLY →
        DELISTED, and CANCEL_ONLY → TRADING reopens what was closed but not
        delisted (B122); DELISTED is final. Fails with
        INSTRUMENT_STATUS_TRANSITION_INVALID otherwise. A halt takes effect at once (200); any other move needs
        the preview's confirmation (POST .../status/preview) and answers
        202 with the change that waits (see POST
        /admin/v1/instruments/apply). Needs instruments.trading (ADMIN).
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Halted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '202':
          description: The change confirmed, waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/flags:
    get:
      operationId: listFlags
      summary: Feature flags (requirements §5.14)
      description: Every flag the platform knows; one never set is off, with version 0. Needs flags.read.
      tags: [flags]
      responses:
        '200':
          description: The flags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flag'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/flags/{key}:
    put:
      operationId: switchFlag
      summary: Turn a flag on or off
      description: |
        Keeps the flag's rules (regions, statuses, allow lists); services
        pick the change up within 5 seconds. Fails with COMMON_NOT_FOUND
        for a key the platform does not define. Needs flags.write.
      tags: [flags]
      security:
        - session: []
          csrf: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            examples: [wallet.withdraw]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The flag after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/adjustments:
    post:
      operationId: requestAdjustment
      summary: Request a manual adjustment of a user's balance
      description: |
        Creates a PENDING request for another administrator with
        ledger.adjust.approve (escalation REQUESTED), unless `direct` asks
        to carry it out at once, which works as POST
        /admin/v1/users/{id}/adjustments. A positive amount credits the
        user's SPOT (or FUTURES) account against the ADJUSTMENT system
        account, a negative one debits it. Needs ledger.adjust.request.
      tags: [ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, asset, amount, reason]
              properties:
                user_id:
                  type: string
                  format: uuid
                account_type:
                  type: string
                  enum: [SPOT, FUTURES]
                  default: SPOT
                asset:
                  type: string
                  examples: [USDT]
                amount:
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                direct:
                  type: boolean
                  default: false
                  description: Carry it out at once when single-person mode and its limits allow.
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/approvals:
    get:
      operationId: listApprovals
      summary: Fund operations, newest first
      description: Two-person requests and single-person operations. Needs ledger.adjust.request or audit.read.
      tags: [ledger]
      parameters:
        - name: status
          in: query
          description: Empty for all.
          schema:
            type: string
            enum: [PENDING, EXECUTED, REJECTED, FAILED]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Approval'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/approvals/{id}/sim-preview:
    get:
      operationId: simApprovalPreview
      summary: A simulated market's request measured now, for its decider
      description: |
        When the request lapses (a day after it was asked for, or when its
        event was to start), the target price now, where the change would
        take the price (a jump's or a target event's price, the settings'
        new anchor; null for changes that move no price directly), that
        move now beside the one market-sim measured when it was asked for,
        and what the price would do to the perpetual (as /sim/impact; null
        when not measured). Needs reports.read.
      tags: [sim]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request measured now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/approvals/{id}/decide:
    post:
      operationId: decideApproval
      summary: Approve (and book) or reject a pending fund operation
      description: |
        Approving one's own request fails with ADMIN_SELF_APPROVAL, except
        a single-person operation whose outcome was unknown (its requester
        finishes it); rejecting one's own request withdraws it. A decided
        one fails with ADMIN_APPROVAL_DECIDED, unless the decider took the
        same decision: then it answers with the operation as that decision
        left it (a retry). Approving books the operation with the
        idempotency key approval:<id>: EXECUTED with the journal, or FAILED
        when the ledger refuses (for instance LEDGER_ADJUSTMENT_DISABLED
        while the flag ledger.manual_adjustment is off). A fund operation
        is marked attempted (attempted_at) before it is booked: when the
        ledger cannot be reached it stays PENDING with how the attempt
        ended in result, the error's details name it (approval_id), and it
        can be approved again but no longer rejected
        (ADMIN_APPROVAL_ATTEMPTED). Needs ledger.adjust.approve;
        a simulated market's change (SIM_EVENT, SIM_PARAMS) needs
        sim.control instead, and approving one that lapsed (a day after it
        was asked for, or when its event was to start) fails it, result
        "expired at <time>", nothing sent to market-sim. A welcome credits
        raise (WELCOME_CREDIT) needs settings.write and lapses a day after
        it was asked for, the same way; so do margin terms (MARGIN_PARAMS,
        instruments.trading) and a margin liquidation by hand
        (MARGIN_LIQUIDATE, derivatives.write); HOUSE's caps (HOUSE_CAPS,
        ledger.adjust.approve) lapse a day after they were asked for too. A
        change (SIM_EVENT, SIM_PARAMS, WELCOME_CREDIT, MARGIN_PARAMS,
        MARGIN_LIQUIDATE, HOUSE_CAPS) is not marked attempted: when its service cannot be reached, or the welcome
        credits or margin terms changed and cannot be read again, the
        answer is 503 COMMON_UNAVAILABLE with details.approval_id, the
        request stays PENDING as it was and can be approved again (or
        rejected); margin terms found set as asked at the next version by
        the request's requester are that earlier attempt's, and so are
        HOUSE's caps whose history names the request. HOUSE's caps changed
        are audited as admin.house.caps_changed, cap by cap, before and
        after.
      tags: [ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/audit-logs:
    get:
      operationId: searchAuditLogs
      summary: The audit trail, newest first
      description: |
        From ClickHouse audit_logs, which lags the change by a few seconds.
        Needs audit.read.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          description: Exact actor, e.g. an administrator's email or cli:ubuntu.
          schema:
            type: string
        - name: target
          in: query
          description: Exact target, e.g. user:<id>, pair:BTC-USDT, flag:wallet.withdraw.
          schema:
            type: string
        - name: event_type
          in: query
          description: Exact event type, e.g. exchange.audit.v1.AdminAction.
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/audit-logs/export:
    get:
      operationId: exportAuditLogs
      summary: The audit entries matching the filters, as CSV
      description: |
        The search's filters, newest first, at most 10,000 rows; the header
        X-Truncated is true when more were left out (narrow the time
        range). UTF-8 with a byte order mark, so spreadsheets read Chinese;
        columns occurred_at, event_type, actor, target, action, reason,
        details, event_id (action, reason and details are the
        administrator action's, or a configuration change's old and new
        values). Written a page at a time (X-Truncated is known before
        the rows, from a count). The export is itself audited as
        admin.audit.exported. It has email and IP addresses: needs
        audit.export (ADMIN, AUDITOR; C5.5 ⑪).
      tags: [audit]
      parameters:
        - name: actor
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The CSV file (Content-Disposition attachment).
          headers:
            X-Truncated:
              description: More entries matched than were exported.
              schema:
                type: string
                enum: ['true', 'false']
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/trading:
    get:
      operationId: tradingReport
      summary: Trades and orders per symbol and day, week or month (UTC), newest first
      description: |
        From the ClickHouse read models (trades, order_updates), which lag
        the services by a few seconds. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TradingDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/wallet:
    get:
      operationId: walletReport
      summary: Credited deposits and confirmed withdrawals per asset and day, week or month (UTC)
      description: |
        Deposits booked to users (not the unclaimed ones) by the day they
        were credited; withdrawals by the day they were confirmed. Needs
        reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/candles:
    get:
      operationId: candleReport
      summary: Candles of a symbol from the trades read model, newest first
      description: Intervals are aligned to the epoch in UTC. Needs reports.read.
      tags: [reports]
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            examples: [BTC-USDT]
        - name: interval
          in: query
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h, 1d]
            default: 1h
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 48
      responses:
        '200':
          description: The candles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/derivatives:
    get:
      operationId: derivativesReport
      summary: Each perpetual contract's trading, funding and liquidations per day, week or month (UTC)
      description: |
        From the ClickHouse contract read models (derivatives_fills,
        derivatives_funding, derivatives_liquidations): settled fills and
        their fees and results, the funding the positions paid and
        received at the day's settlements, the positions taken over, the
        auto-deleveraged counterparties and what the insurance fund paid.
        Needs reports.read.
      tags: [reports, derivatives]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DerivativesDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/open-interest:
    get:
      operationId: openInterestReport
      summary: Each contract's open positions from the positions read model
      description: |
        The latest position snapshots (derivatives_positions); a few
        seconds behind derivatives-service. Needs reports.read.
      tags: [reports, derivatives]
      responses:
        '200':
          description: The contracts with open positions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenInterest'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/users:
    get:
      operationId: usersReport
      summary: The users' activity per day, week or month (UTC), oldest first
      description: |
        Per bucket: the accounts registered and signed in (the auth
        events), those trading (either side of a spot trade, or a
        contract fill) and those with a deposit credited, each counted
        once; total is every account registered by the bucket's end.
        HOUSE and the simulated market's bots are left out (partial names
        "bots" when market-sim could not say which they are). Every bucket
        of the period comes, empty ones too. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items, partial]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsersBucket'
                  partial:
                    type: array
                    items:
                      type: string
                      enum: [bots]
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/house-pnl:
    get:
      operationId: housePnLReport
      summary: HOUSE's result per day, week or month (UTC) in USDT, oldest first
      description: |
        Spot (ADR-0013, ADR-0015): HOUSE's trading valued day by day, the
        quote it got less paid plus the base it holds from trading at each
        pair's last price that day, in USDT at the last price of the quote
        asset's USDT pair; spot_pnl is its change over the bucket and
        spot_result its level since HOUSE began, at the bucket's end. A
        pair without a price when one is needed is left out of every day
        (unpriced). Contracts: the realized results of HOUSE's fills less
        their fees, and the funding it got (negative when it paid); a
        coin-margined contract's, in its coin, valued at the fill's price
        and the funding at the settlement's mark price (USD as USDT). total
        sums the three; cumulative runs over the period. Needs
        reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items, unpriced]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HousePnLBucket'
                  unpriced:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts:
    get:
      operationId: listContractStates
      summary: Each perpetual contract's status, reduce-only state, mark price and open interest
      description: |
        Live from derivatives-service. A contract goes reduce-only by
        itself when its index or mark price fails (requirements §11.7:
        risk.events SystemDegraded); only a person lifts it. Needs
        derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The contracts.
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractState'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/status:
    post:
      operationId: setContractStatus
      summary: Move a perpetual contract to another status
      description: |
        The same transitions as trading pairs (PREPARE → TRADING ⇄ HALT;
        TRADING or HALT → CANCEL_ONLY → DELISTED; CANCEL_ONLY → TRADING
        until delisted) and the same guard: a
        halt at once (200), any other move confirmed from its preview and
        waiting (202); instrument-service records it. Needs
        instruments.trading (ADMIN).
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Halted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '202':
          description: The change confirmed, waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/status/preview:
    post:
      operationId: previewContractStatus
      summary: What moving a perpetual contract to another status does
      description: As POST /admin/v1/instruments/pairs/{symbol}/status/preview. Needs instruments.trading.
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
      responses:
        '200':
          description: The move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/coins/{coin}/status/preview:
    post:
      operationId: previewCoinContractsStatus
      summary: What closing or reopening a coin's contracts does
      description: |
        A coin's contracts are its USDⓈ-M and COIN-M perpetuals that are
        not delisted (coin-margined design 2026-10-06 §3.5, coordinator
        2026-10-06 22:50). Closing (to CANCEL_ONLY) takes those trading or
        halted: reduce only, HOUSE keeps quoting so that positions can
        close (its market.house_liquidity rules are left alone until a
        contract is delisted). Reopening (to TRADING) takes those closed;
        a halted one is resumed on its own, and one in preparation opened
        on its own. Lists the contracts that move and those that stay,
        with the confirmation of the one change they make;
        INSTRUMENT_STATUS_TRANSITION_INVALID when none can move,
        COMMON_NOT_FOUND for a coin without contracts. Delisting stays per
        contract. Needs instruments.trading.
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Coin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [CANCEL_ONLY, TRADING]
      responses:
        '200':
          description: The moves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinStatusPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/coins/{coin}/status:
    post:
      operationId: setCoinContractsStatus
      summary: Close or reopen a coin's contracts
      description: |
        Confirmed from its preview, one change of kind
        COIN_CONTRACTS_STATUS (target coin:<coin>) for all of them: it
        waits the change delay and, while admin.two_person_approval is on,
        a second ADMIN's approval (202). When due its contracts move one
        by one, each audited as admin.instruments.contract_status; none
        moves when one of them is no longer where the preview found it
        (the change fails: preview again), a contract found where it goes
        is in effect already, and a move that fails is reported in the
        change's result with those that took effect. Needs
        instruments.trading (ADMIN).
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Coin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoinStatusRequest'
      responses:
        '202':
          description: The change confirmed, waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinStatusResult'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/lift-reduce-only:
    post:
      operationId: liftReduceOnly
      summary: End a contract's reduce-only once its prices are sound again
      description: |
        lifted is false when the contract was not reduce-only. Check the
        mark price first: a contract whose mark is still stale degrades
        again within seconds. Needs derivatives.write.
      tags: [derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                required: [symbol, lifted]
                properties:
                  symbol:
                    type: string
                  lifted:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/risk:
    get:
      operationId: listRiskPositions
      summary: Positions warned, taken over by the liquidation engine or close to it
      description: |
        Live from derivatives-service: positions taken over, warned
        (margin balance at most 1.2 × maintenance margin) or with a margin
        ratio of at least 0.5, riskiest first. Cross positions are
        measured on their own here. Needs derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskPosition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/liquidations:
    get:
      operationId: listLiquidations
      summary: Liquidation steps, newest first
      description: From the ClickHouse read model derivatives_liquidations. Needs derivatives.read.
      tags: [derivatives]
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: kind
          in: query
          description: Empty for all.
          schema:
            type: string
            enum: [WARNING, STARTED, FILLED, ADL]
        - name: symbol
          in: query
          description: One contract (BTC-USDT-PERP).
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of steps.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LiquidationStep'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/positions:
    get:
      operationId: listPositions
      summary: Every user's open contract positions, riskiest first
      description: |
        From derivatives-service, valued at the mark price: highest margin
        ratio (maintenance margin / margin balance) first, then the
        largest; HOUSE's positions come last. Cross positions are measured
        on their own; their liquidation price is on the user's page, and
        they count as warned when their cross account is. mark_fresh says
        whether the mark price is fresh. At most `limit` (500) positions;
        `truncated` says there are more. Needs derivatives.read.
      tags: [derivatives]
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - name: watch
          in: query
          description: true for the positions under watch only (warned, their cross account warned, taken over, margin ratio ≥ 0.5); never HOUSE's.
          schema:
            type: string
            enum: ['true']
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions, truncated, house_user_id]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskPosition'
                  truncated:
                    type: boolean
                  house_user_id:
                    type: [string, 'null']
                    description: HOUSE's account on the contracts (its positions are the counterparty of users').
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-fund:
    get:
      operationId: getInsuranceFund
      summary: The insurance fund's balance
      description: |
        The ledger's INSURANCE_FUND system account, with PNL_CLEARING (the
        open positions' unsettled results, which may be negative). Needs
        derivatives.read.
      tags: [derivatives]
      parameters:
        - name: asset
          in: query
          schema:
            type: string
            default: USDT
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceFund'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-funds:
    get:
      operationId: listInsuranceFunds
      summary: The insurance fund of every settlement asset
      description: |
        One InsuranceFund per asset a listed contract settles in (USDT, and
        the base asset of each coin-margined contract) and per other asset
        the fund holds: USDT first, then by asset (coin-margined design
        2026-10-06 §2.7). A liquidation's loss beyond its margin is paid
        from its settlement asset's fund, margin trading's from the same
        rows. Contributions as POST
        /admin/v1/derivatives/insurance-fund/contributions with the asset.
        Needs derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The funds.
          content:
            application/json:
              schema:
                type: object
                required: [funds]
                properties:
                  funds:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsuranceFund'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-fund/contributions:
    post:
      operationId: requestInsuranceFunding
      summary: Contribute simulated funds to the insurance fund
      description: |
        Creates a PENDING INSURANCE_FUND request for another administrator
        with ledger.adjust.approve, or with `direct` carries it out at once
        when single-person mode and its limits allow (as POST
        /admin/v1/users/{id}/adjustments does for an adjustment); booking
        it (ledger FundInsurance, INSURANCE_CONTRIBUTION from ADJUSTMENT)
        needs the flag ledger.manual_adjustment. Needs
        ledger.adjust.request.
      tags: [derivatives, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                asset:
                  type: string
                  default: USDT
                amount:
                  description: Positive.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                direct:
                  type: boolean
                  default: false
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/house:
    get:
      operationId: getHouse
      summary: HOUSE's book (virtual liquidity, ADR-0013 and ADR-0015)
      description: |
        HOUSE's spot inventory (the ledger's MARKET_MAKER accounts) valued
        at the last prices, what it traded per pair (the trades read model)
        and its result at those prices, and its perpetual contract
        positions (the account HOUSE_USER_ID). Internal assets go below
        zero when HOUSE sold them short. A part that cannot be read is left
        empty and named in `partial`. Needs reports.read.
      tags: [reports]
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/house/caps:
    get:
      operationId: getHouseCaps
      summary: HOUSE's caps at run time, the request that waits to change them and the latest changes
      description: |
        What market-maker quotes within (review C45; user 2026-10-07, A69):
        a level's, a pair's and all spot positions' caps, a contract's
        position cap and the backed inventory kept back (USDT), and the
        contracts' leverage on HOUSE's contract equity (a multiple), with
        their version; the HOUSE_CAPS request that waits (null for none),
        market-maker's latest changes, newest first, and the caps of the
        first version (the deployment's, from market-maker's environment).
        503 while market-maker cannot be read. Needs reports.read.
      tags: [reports]
      responses:
        '200':
          description: The caps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseCapsView'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: requestHouseCaps
      summary: Ask a second administrator to change HOUSE's caps
      description: |
        The caps given that differ from those of the version read, each
        within its range (user 2026-10-07 06:0x, review C47) - level zero or
        more (zero: a level is not capped), symbol, total, contract and
        safety above zero, every USDT cap at most 1e15, contract_leverage
        from 1 to 125 - and moving each at most ten times up or down (400
        HOUSE_CAPS_STEP with cap, from and to, as market-maker refuses it;
        a level cap going to or from 0 is not a step) - become a
        HOUSE_CAPS request that always waits for a second administrator,
        whatever the approval mode: 202 with it. 409 HOUSE_CAPS_VERSION when
        the caps moved since version was read (details version, the one
        now); 409 ADMIN_HOUSE_CAPS_PENDING while another request waits
        (details approval_id); 400 for an unknown cap, a bad value or
        nothing that changes. Needs ledger.adjust.request (as HOUSE's fund
        operations); audited as admin.house.caps_requested.
      tags: [reports, ledger]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseCapsRequest'
      responses:
        '202':
          description: The request, waiting for a second administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/health:
    get:
      operationId: getHealth
      summary: Every service's readiness
      description: |
        Asks each service's ops endpoint (/readyz) within 2 seconds; with
        details=true also reads its metrics (its version, its Kafka
        consumers' lag and the records they parked in a DLQ since it
        started) and the reference feed's state: the system health page.
        Needs reports.read.
      tags: [reports]
      parameters:
        - name: details
          in: query
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: The services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceHealth'
                  feed:
                    description: With details; left out when market-data-service could not be asked.
                    $ref: '#/components/schemas/FeedStatus'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/system-balances:
    get:
      operationId: getSystemBalances
      summary: The platform's system accounts
      description: |
        FEE_REVENUE, INSURANCE_FUND, MARKET_MAKER (HOUSE), PNL_CLEARING,
        ADJUSTMENT, DEPOSIT_PENDING and the rest, in one asset or all.
        Needs reports.read.
      tags: [ledger]
      parameters:
        - name: asset
          in: query
          description: One asset; every asset when empty.
          schema:
            type: string
      responses:
        '200':
          description: The accounts by type and asset.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      required: [account_type, asset, available, frozen]
                      properties:
                        account_type:
                          type: string
                        asset:
                          type: string
                        available:
                          $ref: '#/components/schemas/Decimal'
                        frozen:
                          $ref: '#/components/schemas/Decimal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/reconciliation:
    get:
      operationId: getReconciliation
      summary: The ledger's invariant checks
      description: |
        The latest run of every check of the ledger's reconciliation (hourly,
        requirements §11.4) and the last 50 runs that found mismatches, with
        the first ten mismatches of each. Needs reports.read.
      tags: [ledger]
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [latest, failures]
                properties:
                  latest:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
                  failures:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody:
    get:
      operationId: getCustody
      summary: The custody wallet (ADR-0011)
      description: |
        The custodian's coins with their balances as it reports them now,
        matched to the networks that use them; the latest chain check of
        each holder and asset (the custodian and the platform's own
        wallets: held, expected by the ledger, held elsewhere, on its way
        out, unbooked fees, shortfall); the withdrawals with the custodian;
        and how many callbacks need a person. Without a configured
        custodian `configured` is false; an unreachable one leaves `coins`
        empty and says why in `error`. One custodian at a time (`provider`;
        its own checks and the platform wallets'). Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: provider
          in: query
          description: |
            The custodian: UDUN (the default) or UDUNMOCK, the stand-in that
            serves only the hidden test asset (ADR-0017).
          schema:
            type: string
            enum: [UDUN, UDUNMOCK]
      responses:
        '200':
          description: The custody wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyOverview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks:
    get:
      operationId: listCustodyCallbacks
      summary: The custodians' callbacks, newest first
      description: Every callback as received, with its signature check and outcome; one custodian's when `provider` is given. Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: provider
          in: query
          description: |
            The custodian: UDUN (the default) or UDUNMOCK, the stand-in that
            serves only the hidden test asset (ADR-0017).
          schema:
            type: string
            enum: [UDUN, UDUNMOCK]
        - name: result
          in: query
          description: One outcome; every outcome when empty.
          schema:
            type: string
            enum: [RECEIVED, APPLIED, IGNORED, UNMATCHED, REJECTED, FAILED, DISCREPANCY]
        - name: kind
          in: query
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAWAL]
        - name: q
          in: query
          description: A trade ID, withdrawal ID (businessId), transaction hash or address.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of callbacks.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyCallback'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks/{id}:
    get:
      operationId: getCustodyCallback
      summary: One callback with the request as received
      description: Needs withdrawals.read.
      tags: [custody]
      parameters:
        - $ref: '#/components/parameters/CallbackID'
      responses:
        '200':
          description: The callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyCallback'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks/{id}/replay:
    post:
      operationId: replayCustodyCallback
      summary: Apply a stored callback again
      description: |
        For a verified callback that FAILED, stayed UNMATCHED or RECEIVED:
        its signature is checked again (not its age) and it is applied as
        if it had just arrived, which is harmless for one already applied.
        Audited. Needs withdrawals.review.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/CallbackID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The callback after the replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyCallback'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/fees:
    get:
      operationId: listCustodyFees
      summary: The custodians' withdrawal fees, newest first
      description: |
        A custodian's fee on a withdrawal is booked from GAS_SUPPLY as it
        comes (BOOKABLE; journal_id null while GAS_SUPPLY is short), or
        held for a person (HELD: its unit on the network is not confirmed,
        or it looks wrong) who books or writes it off (C6). One
        custodian's when `provider` is given. Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: provider
          in: query
          description: The custodian (UDUN, UDUNMOCK); every custodian's when empty.
          schema:
            type: string
            enum: [UDUN, UDUNMOCK]
        - name: status
          in: query
          description: One status; every status when empty.
          schema:
            type: string
            enum: [HELD, BOOKABLE, WRITTEN_OFF]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of fees.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyFee'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/fees/{withdrawal_id}/book:
    post:
      operationId: bookCustodyFee
      summary: Book a held fee from GAS_SUPPLY
      description: |
        As the custodian reported it, or in the asset and amount found
        charged (the platform must hold that asset with the custodian on
        the withdrawal's network, at most its decimals; else 400: write it
        off). wallet-service records the decision and audits it as
        wallet.custody.fee.book with the administrator as the actor, as
        exchangectl wallet custody-fee does; its processor books it within
        a round. As charged is at most 5 times what was reported: by
        amount in the reported asset, by worth in USDT at the last prices
        in another (422 ADMIN_FEE_ABOVE_REPORTED; ADMIN_FEE_UNPRICED when
        one of the two has no fresh price): more is booked with exchangectl
        wallet custody-fee (review ㉖). As charged, a fee not among the
        held ones is refused (409 ADMIN_FEE_NOT_HELD, review ㉗). A fee that waits for no one
        (booked, written off) is 409 WALLET_CUSTODY_FEE_NOT_HELD (details
        status), one another decision took first 409
        WALLET_CUSTODY_FEE_CHANGED; a withdrawal without a custodian's fee
        404 WALLET_CUSTODY_FEE_NOT_FOUND. Needs ledger.adjust.approve.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/FeeWithdrawalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                asset:
                  type: string
                  description: The asset it was charged in; the reported one when absent.
                amount:
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The fee as decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyFee'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/fees/{withdrawal_id}/write-off:
    post:
      operationId: writeOffCustodyFee
      summary: Write a held fee off
      description: |
        For a fee not taken from the coin balances the platform holds, or
        reported in another unit: nothing is booked. Also a BOOKABLE one
        still waiting for GAS_SUPPLY. Audited by wallet-service as
        wallet.custody.fee.write_off. 409 WALLET_CUSTODY_FEE_NOT_HELD or
        _CHANGED when it waits for no one, 404 WALLET_CUSTODY_FEE_NOT_FOUND
        without a fee. Needs ledger.adjust.approve.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/FeeWithdrawalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The fee as decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyFee'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/assets:
    get:
      operationId: listMarginAssets
      summary: The margin assets' parameters, with what is lent of each now
      description: |
        Design 2026-10-06 §4.1, §8 (margin-service's asset_terms). Every
        asset that can be borrowed or counts as collateral, with its terms
        (seeded from deploy/instruments/margin.json), what users owe of it
        now (HOUSE's lending, −Σ the users' debt rows), the rate the hour's
        interest takes, and the request waiting to change it. Needs
        instruments.read.
      tags: [margin]
      responses:
        '200':
          description: The assets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginAsset'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/assets/{asset}:
    parameters:
      - name: asset
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Z0-9]{2,12}$'
    put:
      operationId: setMarginAsset
      summary: Change an asset's margin parameters
      description: |
        Design §8. Needs instruments.trading (ADMIN: the trading
        parameters); every field is given, as margin-service sets them all.
        What only stops new borrowing applies at once: 200, audited as
        admin.margin.asset_changed with the fields before and after
        (borrowing switched off, a lower pool or user cap; the loans stay).
        Anything else waits for a second ADMIN with instruments.trading in
        either approval mode: 202 with a MARGIN_PARAMS request (payload
        target asset:<asset>, terms, previous, changed, expected_version),
        escalation MARGIN_RISK, audited as admin.margin.params_requested
        (the interest model and its rates; the haircut and collateral
        switched either way, which move every holder's margin level;
        borrowing switched on, a higher cap). A request mixing both waits
        whole. Approved, margin-service sets the terms in its requester's
        name. expected_version is the version read: 409
        MARGIN_PARAMS_CHANGED when it moved, then and when the request is
        approved (the request fails). A request for the asset waiting
        already, against the version now: 409 ADMIN_MARGIN_CHANGE_PENDING
        (details approval_id); stopping new borrowing is never held up by
        one. A request lapses a day after it was asked for. 404 for an
        asset margin-service does not list. 400 when nothing changes, and
        unless haircut is above 0 and at most 1 (4 decimals), user_cap at
        most pool_cap, the rates at least 0 (12 decimals) and the floating
        curve rising (float_base ≤ float_kink_rate ≤ float_max_rate,
        float_kink above 0 and under 1), as asset_terms' constraints.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarginAssetParams'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Applied at once (it only stops new borrowing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAsset'
        '202':
          description: Waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/settings:
    get:
      operationId: getMarginSettings
      summary: The cross account's terms
      description: |
        Design §4.2, §4.4, §8 (margin-service's cross_terms). The cross
        account's leverage, thresholds and liquidation fee, the design's
        thresholds by isolated leverage, which the console offers when a
        pair's leverage changes, and the request waiting to change them.
        Needs instruments.read.
      tags: [margin]
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginSettings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setMarginSettings
      summary: Change the cross account's terms
      description: |
        Design §8. Needs instruments.trading; every change waits for a
        second ADMIN with it, in either approval mode: 202 with a
        MARGIN_PARAMS request (target cross), escalation MARGIN_RISK,
        audited as admin.margin.params_requested (a threshold moved either
        way liquidates or spares accounts at once, a leverage changes what
        may be borrowed, the fee what a liquidation costs). 400 when
        nothing changes, and unless the liquidation_level is above 1 and
        under the warn_level (4 decimals) and the liquidation_fee 0 to 0.1
        (6 decimals). admin-service holds the leverage to 2 to 10 (the
        terms' column) before the request waits; which leverages are
        allowed is margin-service's policy (3 or 5), checked when the
        request is approved (the request fails otherwise). expected_version,
        a request waiting already and the lapse as for an asset.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarginSettingsParams'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/pairs:
    get:
      operationId: listMarginPairs
      summary: The pairs margin trades on, with their isolated terms
      description: |
        Design §4.2, §8 (margin-service's pair_terms). The pairs whose two
        assets are both margin assets: whether each takes isolated
        accounts, its isolated leverage, thresholds and liquidation fee,
        the isolated accounts on it, and the request waiting to change it.
        The cross account trades all of them on its own terms. Needs
        instruments.read.
      tags: [margin]
      responses:
        '200':
          description: The pairs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginPair'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/pairs/{symbol}:
    parameters:
      - $ref: '#/components/parameters/Symbol'
    put:
      operationId: setMarginPair
      summary: Change a pair's isolated terms
      description: |
        Design §8. Needs instruments.trading; every field is given.
        Switching isolated accounts off applies at once (200: no new
        isolated account on the pair, those open stay; audited as
        admin.margin.pair_changed). Anything else waits for a second ADMIN
        with it, in either approval mode (202 with a MARGIN_PARAMS request,
        target pair:<symbol>, escalation MARGIN_RISK): the leverage, the
        thresholds and the liquidation fee, which the pair's accounts take
        at once, and switching isolated accounts on. 400 when nothing
        changes, and unless liquidation_level is above 1 and under
        warn_level, liquidation_fee 0 to 0.1 and the leverage 2 to 10 (the
        terms' column); which leverages are allowed is margin-service's
        policy (3, 5 or 10), checked when the request is approved (the
        request fails otherwise). 404 for a pair margin-service does not
        list.
        expected_version, a request waiting already and the lapse as for an
        asset.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarginPairParams'
                - type: object
                  required: [expected_version]
                  properties:
                    expected_version:
                      type: integer
                      format: int64
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Applied at once (isolated accounts switched off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginPair'
        '202':
          description: Waits for a second ADMIN.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts:
    get:
      operationId: listMarginAccounts
      summary: Margin accounts, riskiest first
      description: |
        Design §2, §8. From margin-service, valued as it values them (§2):
        the lowest margin level (total assets ÷ total liabilities) first,
        the accounts without liabilities last, by net assets. Accounts that
        hold or owe nothing are left out. At most `limit`; truncated says
        there are more. Each with the liquidation by hand waiting for it.
        Needs derivatives.read.
      tags: [margin]
      parameters:
        - name: status
          in: query
          description: Empty for all.
          schema:
            $ref: '#/components/schemas/MarginAccountStatus'
        - name: account
          in: query
          schema:
            $ref: '#/components/schemas/MarginAccountType'
        - name: symbol
          in: query
          description: One pair's isolated accounts (BTC-USDT).
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginAccount'
                  truncated:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    get:
      operationId: getMarginAccount
      summary: A margin account with its balances and debts, loans, interest and liquidations
      description: |
        Design §8. The account as listed; each asset it holds or owes, with
        its worth; its loans by asset; the latest 50 loan changes (borrows,
        repayments and interest in margin-service's one view); the latest
        50 interest charges; the latest 20 liquidations (margin-service's
        own, with their step: SHORTFALL while the insurance fund lacks an
        asset). 404
        MARGIN_ACCOUNT_NOT_FOUND for an account the user never opened.
        Needs derivatives.read.
      tags: [margin]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccountDetail'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}/freeze:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    post:
      operationId: freezeMarginAccount
      summary: Freeze a margin account
      description: |
        Design §8. Its open orders are canceled (margin-service's E3: a
        cancel that fails is logged, the freeze stands and the orders can
        be canceled again); no new orders, borrowing or transfers out until
        it is unfrozen (status FROZEN). Repaying stays open, interest goes
        on, and the system still liquidates it at the liquidation line. Needs derivatives.write; one administrator, at
        once; audited on the user as admin.margin.account_frozen. Frozen
        or being liquidated already: 409 MARGIN_FROZEN, except that the
        same administrator freezing it again for the same reason (a retry
        whose first answer was lost) gets the account. The reason is kept
        with the freeze, at most 500 bytes.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The account, frozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccount'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    post:
      operationId: unfreezeMarginAccount
      summary: Unfreeze a margin account an administrator froze
      description: |
        Design §8. Needs derivatives.write; one administrator, at once;
        audited on the user as admin.margin.account_unfrozen. Not frozen by
        an administrator (a liquidation's freeze ends with it): 409
        MARGIN_NOT_FROZEN.
      tags: [margin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The account, unfrozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccount'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/accounts/{user_id}/{account}/liquidate:
    parameters:
      - $ref: '#/components/parameters/MarginUserID'
      - $ref: '#/components/parameters/MarginAccountKey'
    post:
      operationId: liquidateMarginAccount
      summary: Ask for a margin account's liquidation (a second administrator approves)
      description: |
        Design §4.5, §8. Liquidates the account as the system does at the
        liquidation line, whatever its margin level: frozen, its orders
        canceled, its assets sold to HOUSE at the market to repay its
        debts, the fee to the insurance fund (INSURANCE_FUND), a shortfall
        from it. Needs derivatives.write; always waits for a second
        administrator with it, in either approval mode (202 with a
        MARGIN_LIQUIDATE request, escalation MARGIN_RISK, value_usdt its
        total liabilities; the payload keeps the account as it stood);
        approved, margin-service starts it at once in the requester's name
        (MANUAL, with the approval: once per approval), and the request's
        result names the liquidation. Only while margin-service liquidates
        the user's accounts (the flag margin.liquidation for the user): 409
        ADMIN_MARGIN_LIQUIDATION_OFF otherwise; approved while it is off, the
        request is FAILED with that code as its result and nothing goes to
        margin-service. Nothing owed: 409 ADMIN_MARGIN_NOTHING_OWED; a
        liquidation under way: 409 MARGIN_FROZEN; a request for the account
        waiting already: 409 ADMIN_MARGIN_CHANGE_PENDING (details
        approval_id). A request lapses a day after it was asked for.
      tags: [margin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Waits for a second administrator.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/liquidations:
    get:
      operationId: listMarginLiquidations
      summary: Margin liquidations, newest first
      description: |
        Design §8. From the ClickHouse read model margin_liquidations: one
        row a liquidation, at the liquidation line or approved by hand,
        with the debts it repaid, what stayed, its fee to the insurance
        fund and any shortfall the fund covered; started in the last
        `days` (seen completed only: completed). A row seen completed only
        has no start fields, and one from before ClickHouse 00010 no
        trigger or approval. Needs reports.read.
      tags: [margin]
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: account
          in: query
          schema:
            $ref: '#/components/schemas/MarginAccountType'
        - name: symbol
          in: query
          description: One pair's isolated accounts (BTC-USDT).
          schema:
            type: string
        - name: trigger
          in: query
          schema:
            type: string
            enum: [AUTO, MANUAL]
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of liquidations.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginLiquidation'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/margin/interest:
    get:
      operationId: marginInterestReport
      summary: Margin interest per day, week or month (UTC) and asset, oldest first
      description: |
        Design §4.3, §8. From the ClickHouse read models: per bucket and
        asset, the interest charged and repaid (the ledger's interest rows,
        ledger_entries), what users owe at the bucket's end, the average
        principal and hourly rate and the accounts charged
        (margin_interest's hourly charges), in the asset and in USDT at the
        bucket's last trade of its USDT pair (null without one). Needs
        reports.read.
      tags: [margin]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
        - name: asset
          in: query
          description: One asset; all when absent.
          schema:
            type: string
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarginInterestBucket'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: admin_session
    csrf:
      type: apiKey
      in: header
      name: X-Admin-CSRF
      description: The value "1" on every request other than GET; a cross-site form cannot set it.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Every request that moves money carries one (C5.5 ⑥): the console makes a key per operation and sends it again with
        each retry. The first request with a key makes the operation (its approval, hold, closing order or message takes
        its ID from the key); the same request again answers with what it made, finishing a fund operation whose outcome
        was unknown; the key with another request fails with 409 COMMON_IDEMPOTENCY_CONFLICT. Keys are each
        administrator's own and kept 24 hours. Missing or longer than 128 characters: 400.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FeeWithdrawalID:
      name: withdrawal_id
      in: path
      required: true
      description: The withdrawal the custodian charged the fee on.
      schema:
        type: string
        format: uuid
    CallbackID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The previous page's next_cursor; omitted for the first page.
      schema:
        type: string
    Kind:
      name: kind
      in: query
      description: |
        L1: the kinds of account to list, comma-separated or repeated -
        HUMAN, BOT, TEST, SYSTEM, or ALL for every kind; whatever the case.
        Left out, the humans only (the console's default). Another value is
        400.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [HUMAN, BOT, TEST, SYSTEM, ALL]
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      description: From this time on (RFC 3339).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Before this time (RFC 3339).
      schema:
        type: string
        format: date-time
    UserFilter:
      name: user_id
      in: query
      schema:
        type: string
        format: uuid
    Accounts:
      name: accounts
      in: query
      description: >-
        Keeps the simulated market's bots (bots) or everyone else (users); all when absent. Needs market-sim's list of
        bots (503 COMMON_UNAVAILABLE without it); without the filter the rows are only marked, and stay unmarked while
        market-sim does not answer.
      schema:
        type: string
        enum: [bots, users]
    Days:
      name: days
      in: query
      description: Days back, today included.
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 7
    ReportFrom:
      name: from
      in: query
      description: |
        The period's first day (UTC), instead of days; to defaults to
        today. At most a year by day, three years by week or month.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: The period's last day (UTC), included; needs from.
      schema:
        type: string
        format: date
    ReportBucket:
      name: bucket
      in: query
      description: The rows' span; a row's day is its bucket's first (a week starts on Monday).
      schema:
        type: string
        enum: [day, week, month]
        default: day
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Contract:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        examples: [BTC-USDT-PERP]
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        examples: [BTC-USDT]
    Coin:
      name: coin
      in: path
      required: true
      description: A coin, the base asset of its contracts.
      schema:
        type: string
        examples: [BTC]
    ChangeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MarginUserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppPlatform:
      name: platform
      in: path
      required: true
      schema:
        type: string
        enum: [ANDROID, IOS]
    AppUploadID:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MarginAccountKey:
      name: account
      in: path
      required: true
      description: MARGIN_CROSS, or MARGIN_ISOLATED:<symbol> for an isolated account (design 2026-10-06 §2).
      schema:
        type: string
        pattern: '^(MARGIN_CROSS|MARGIN_ISOLATED:[A-Z0-9]{2,12}-[A-Z0-9]{2,12})$'
        examples: [MARGIN_CROSS, 'MARGIN_ISOLATED:BTC-USDT']
  responses:
    Error:
      $ref: '../openapi/common.yaml#/components/responses/Error'
  schemas:
    House:
      type: object
      required: [assets, pairs, contracts, totals, partial]
      properties:
        assets:
          type: array
          items:
            type: object
            required: [asset, backed, balance, price, value_usdt]
            properties:
              asset:
                type: string
              backed:
                type: boolean
                description: The asset has deposits or withdrawals; HOUSE must hold it to sell it.
              balance:
                $ref: '#/components/schemas/Decimal'
              price:
                description: USDT per unit (the last price of its USDT pair); null without one.
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
              value_usdt:
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
        pairs:
          type: array
          items:
            type: object
            required: [symbol, trades, bought_base, sold_base, paid_quote, got_quote, last_at, net_base, net_quote, price, pnl_usdt]
            properties:
              symbol:
                type: string
              trades:
                type: integer
              bought_base:
                $ref: '#/components/schemas/Decimal'
              sold_base:
                $ref: '#/components/schemas/Decimal'
              paid_quote:
                $ref: '#/components/schemas/Decimal'
              got_quote:
                $ref: '#/components/schemas/Decimal'
              last_at:
                type: string
                format: date-time
              net_base:
                description: Bought less sold.
                $ref: '#/components/schemas/Decimal'
              net_quote:
                description: Got less paid.
                $ref: '#/components/schemas/Decimal'
              price:
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
              pnl_usdt:
                description: net_base at the last price plus net_quote (USDT pairs); null without a price.
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
        contracts:
          type: array
          description: HOUSE's open positions as derivatives-service renders a user's positions (settle_asset, contracts and
            value_usd as UserPosition's).
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          required: [inventory_usdt, backed_usdt, internal_usdt, pnl_usdt]
          properties:
            inventory_usdt:
              $ref: '#/components/schemas/Decimal'
            backed_usdt:
              $ref: '#/components/schemas/Decimal'
            internal_usdt:
              description: Below zero while HOUSE is short on internal assets.
              $ref: '#/components/schemas/Decimal'
            pnl_usdt:
              $ref: '#/components/schemas/Decimal'
        partial:
          type: array
          items:
            type: string
            enum: [prices, assets, inventory, trades, contracts]
    ServiceHealth:
      type: object
      required: [service, ready, latency_ms]
      properties:
        service:
          type: string
        ready:
          type: boolean
        latency_ms:
          type: integer
        error:
          type: string
        version:
          type: string
          description: With details; the commit the service was built from.
        kafka_lag:
          type: integer
          description: With details, for a service with Kafka consumers; records behind, summed over its consumers.
        dlq:
          type: integer
          description: With details, for a service with Kafka consumers; records parked in a DLQ since it started.
        config_present:
          type: object
          additionalProperties:
            type: boolean
          description: With details, whether the third parties the service uses are configured (exchange_config_present{item}), never their values.
    ReconciliationRun:
      type: object
      required: [check, started_at, mismatches, details]
      properties:
        check:
          type: string
          examples: [JOURNAL_BALANCED]
        started_at:
          type: string
          format: date-time
        mismatches:
          type: integer
        details:
          type: array
          description: The first ten mismatches.
          items:
            type: object
            required: [key, detail]
            properties:
              key:
                type: string
              detail:
                type: string
    NextCursor:
      type: [string, 'null']
      description: Pass as cursor for the next page; null on the last.
    UserSummary:
      type: object
      required: [id, username, avatar_url, avatar_thumb_url, status, region, language, kyc_level, created_at, tags, kind]
      properties:
        kind:
          $ref: '#/components/schemas/UserKind'
        id:
          type: string
          format: uuid
        username:
          type: string
          description: The user's username (design 2026-10-07, avatars and usernames); read-only here but for the reset.
        avatar_url:
          type: [string, 'null']
          description: The uploaded avatar (256 x 256), a path the console's site serves too; null for the default, one of the 12 built-in images chosen by the user ID as on the sites.
        avatar_thumb_url:
          type: [string, 'null']
          description: The same at 64 x 64.
        status:
          type: string
          enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
        region:
          type: string
        language:
          type: string
        timezone:
          type: string
          description: An IANA zone; empty for the browser's.
        kyc_level:
          type: integer
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          description: The console's tags on the account.
          items:
            type: string
    UserKind:
      type: string
      enum: [HUMAN, BOT, TEST, SYSTEM]
      description: |
        L0/L1: HUMAN, a person (every sign-up); BOT, the simulated market's
        bots; TEST, the end-to-end scripts' accounts; SYSTEM, HOUSE and the
        like. Operators and scripts set it, not the console; only the
        console's lists and figures read it.
    Note:
      type: object
      required: [id, body, admin_id, admin_email, created_at]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        admin_id:
          type: string
          format: uuid
        admin_email:
          type: string
        created_at:
          type: string
          format: date-time
    Order:
      type: object
      required: [order_id, client_order_id, user_id, symbol, side, type, time_in_force, price, quantity, quote_amount, status,
        filled_quantity, filled_quote, reason, created_at, updated_at, bot]
      properties:
        order_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        user_id:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL, '']
          description: Empty for an order the trading service refused before it was accepted (its rejection carries no side or type).
        type:
          type: string
          examples: [LIMIT, MARKET]
        time_in_force:
          type: string
        price:
          $ref: '#/components/schemas/NullableDecimal'
        quantity:
          $ref: '#/components/schemas/NullableDecimal'
        quote_amount:
          $ref: '#/components/schemas/NullableDecimal'
        status:
          type: string
        filled_quantity:
          $ref: '#/components/schemas/Decimal'
        filled_quote:
          $ref: '#/components/schemas/Decimal'
        reason:
          type: string
          description: Why it was canceled or rejected; empty otherwise.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        bot:
          type: boolean
          description: A simulated market's bot placed it (false while market-sim does not answer).
    Trade:
      type: object
      required: [trade_id, symbol, trade_number, price, quantity, quote_quantity, taker_side, buyer_user_id, buyer_order_id,
        seller_user_id, seller_order_id, buyer_is_maker, buyer_fee, seller_fee, executed_at, buyer_bot, seller_bot]
      properties:
        trade_id:
          type: string
          format: uuid
        symbol:
          type: string
        trade_number:
          type: integer
          format: int64
        price:
          $ref: '#/components/schemas/Decimal'
        quantity:
          $ref: '#/components/schemas/Decimal'
        quote_quantity:
          $ref: '#/components/schemas/Decimal'
        taker_side:
          type: string
          enum: [BUY, SELL]
        buyer_user_id:
          type: string
        buyer_order_id:
          type: string
        seller_user_id:
          type: string
        seller_order_id:
          type: string
        buyer_is_maker:
          type: boolean
        buyer_fee:
          $ref: '#/components/schemas/Decimal'
        seller_fee:
          $ref: '#/components/schemas/Decimal'
        executed_at:
          type: string
          format: date-time
        house_side:
          type: string
          enum: ['', BUY, SELL]
          description: The side HOUSE took (its virtual liquidity, ADR-0015); empty between users.
        buyer_bot:
          type: boolean
          description: The buyer is a simulated market's bot (false while market-sim does not answer).
        seller_bot:
          type: boolean
          description: The seller is a simulated market's bot.
        settle_asset:
          type: string
          description: A contract trade's settlement asset (a coin-margined one's quantity is whole contracts, its quote_quantity
            the USD value); empty on a spot trade, and on a contract's from before the coin-margined contracts (USDT).
    Deposit:
      type: object
      required: [deposit_id, user_id, asset, network, kind, address, tx_hash, amount, status, unclaimed, reason, confirmations,
        required_confirmations, updated_at]
      properties:
        deposit_id:
          type: string
          format: uuid
        user_id:
          type: string
          description: Empty for a deposit to no known address.
        asset:
          type: string
        network:
          type: string
        kind:
          type: string
          examples: [CHAIN, INTERNAL]
        address:
          type: string
        tx_hash:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        status:
          type: string
        unclaimed:
          type: boolean
        reason:
          type: string
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        updated_at:
          type: string
          format: date-time
    FeedStatus:
      type: object
      description: The reference feed (market-data-service).
      required: [state, received_at, followed, halted]
      properties:
        state:
          type: string
          enum: [OFF, OK, DELAYED, DOWN]
        received_at:
          type: [string, 'null']
          format: date-time
        followed:
          type: array
          items:
            type: string
        halted:
          type: array
          description: Pairs halted because the feed was lost (market.halt_on_feed_loss).
          items:
            type: object
            required: [symbol, halted_at]
            properties:
              symbol:
                type: string
              halted_at:
                type: string
                format: date-time
    Dashboard:
      type: object
      required: [users, trading, wallet, risk, feed, series, partial]
      properties:
        users:
          type: object
          required: [total, new_24h, by_kind]
          description: The humans' accounts (L1; every account's from a user-service without kinds), and each kind's beside them.
          properties:
            total:
              type: integer
              format: int64
            new_24h:
              type: integer
              format: int64
            by_kind:
              type: array
              description: HUMAN, BOT, TEST and SYSTEM in that order, purged test accounts counted nowhere; empty from a user-service without kinds.
              items:
                type: object
                required: [kind, total, new_24h]
                properties:
                  kind:
                    $ref: '#/components/schemas/UserKind'
                  total:
                    type: integer
                    format: int64
                  new_24h:
                    type: integer
                    format: int64
        trading:
          type: object
          required: [trades_24h, active_traders_24h, turnover_24h]
          properties:
            trades_24h:
              type: integer
              format: int64
            active_traders_24h:
              type: integer
              format: int64
            turnover_24h:
              type: array
              items:
                type: object
                required: [quote_asset, amount]
                properties:
                  quote_asset:
                    type: string
                  amount:
                    $ref: '#/components/schemas/Decimal'
        wallet:
          type: object
          required: [pending_deposits, pending_withdrawals]
          properties:
            pending_deposits:
              type: integer
              format: int64
              description: Deposits detected or confirming.
            pending_withdrawals:
              type: integer
              format: int64
              description: Withdrawals waiting for review.
        risk:
          type: object
          required: [events_24h]
          properties:
            events_24h:
              type: integer
              format: int64
        feed:
          description: The reference feed; null when market-data-service could not be asked.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FeedStatus'
        series:
          type: array
          description: One per UTC day, oldest first.
          items:
            type: object
            required: [day, new_users, trades, turnover_usdt]
            properties:
              day:
                type: string
                format: date
              new_users:
                type: integer
                format: int64
              trades:
                type: integer
                format: int64
              turnover_usdt:
                $ref: '#/components/schemas/Decimal'
        partial:
          type: array
          description: The parts that could not be read (users, activity, feed).
          items:
            type: string
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['12.5']
    SimParams:
      type: object
      description: The model's and the bots' settings by name (numbers; docs/runbook/market-sim.md「设置」).
      additionalProperties:
        type: number
    SimStatus:
      type: object
      required: [symbol, enabled, running, target_price, last_price, references_fresh, params, version, guards, bots, events, perp,
        perp_running, anchor_price, price_band, quote_center, walking, band_distance, last_trade_at, watchdog, at]
      properties:
        symbol:
          type: string
        enabled:
          type: boolean
        running:
          type: boolean
        target_price:
          type: [string, 'null']
        last_price:
          type: [string, 'null']
        references_fresh:
          type: boolean
        params:
          $ref: '#/components/schemas/SimParams'
        version:
          type: integer
        guards:
          type: object
          additionalProperties:
            type: integer
        bots:
          type: array
          items:
            $ref: '#/components/schemas/SimBot'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SimEvent'
        perp:
          type: string
          description: The perpetual on the coin; empty without one.
        perp_running:
          type: boolean
        anchor_price:
          type: [string, 'null']
        price_band:
          type: string
        quote_center:
          type: [string, 'null']
        walking:
          type: boolean
        band_distance:
          type: [number, 'null']
          description: The target's distance from the anchor in bands (within ±1 inside the band).
        last_trade_at:
          type: [string, 'null']
          format: date-time
        watchdog:
          type: object
          required: [fired, last_at]
          properties:
            fired:
              type: integer
            last_at:
              type: [string, 'null']
              format: date-time
        at:
          type: [string, 'null']
          format: date-time
    SimBot:
      type: object
      required: [user_id, role, label, enabled, balances_known, usdt, coin, perp_position, futures_usdt, error, error_at, retry_at]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [MAKER, TAKER, TREND, EXECUTOR]
        label:
          type: string
        enabled:
          type: boolean
        balances_known:
          type: boolean
        usdt:
          type: string
        coin:
          type: string
        perp_position:
          type: string
        futures_usdt:
          type: string
        error:
          type: string
        error_at:
          type: [string, 'null']
          format: date-time
        retry_at:
          type: [string, 'null']
          format: date-time
    SimEvent:
      type: object
      required: [id, type, size, price, mu, factor, duration_seconds, hold_seconds, starts_at, status, created_by, approved_by, reason,
        created_at, started_at, ended_at, from_price, ended_by]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [JUMP, TARGET, TREND, VOLATILITY, PAUSE, HALT, REANCHOR, SPIKE, OVERLAY]
        symbol:
          type: string
          description: An OVERLAY's pair (J3; absent on the simulated market's own events, as the fields below).
        target_factor:
          type: number
          description: An OVERLAY's target over the reference price when it was made (1.16 is +16%); price is that target.
        ramp_up_seconds:
          type: integer
        ramp_down_seconds:
          type: integer
        risk:
          type: boolean
          description: The OVERLAY reaches the perpetuals' index and mark and the leverage's valuation.
        factor_now:
          type: number
          description: An OVERLAY's factor now (1 unless running).
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: How far an OVERLAY is through its ramps and hold.
        base_price:
          type: [string, 'null']
          description: The reference price an OVERLAY started from.
        peak_price:
          type: [string, 'null']
          description: The platform's price furthest its way while it ran.
        end_reference_price:
          type: [string, 'null']
          description: The reference market's price when it came back to 1.
        end_platform_price:
          type: [string, 'null']
          description: The platform's price then.
        size:
          type: number
        price:
          type: [string, 'null']
        mu:
          type: number
        factor:
          type: number
        duration_seconds:
          type: integer
        hold_seconds:
          type: integer
        starts_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, RUNNING, DONE, CANCELED]
        created_by:
          type: string
        approved_by:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        from_price:
          type: [string, 'null']
        ended_by:
          type: string
        direction:
          type: [string, 'null']
          description: A TARGET's side of its level (ABOVE, BELOW; ASTRA A6); empty or null otherwise.
        then:
          type: [string, 'null']
          description: What a TARGET does once crossed (FOLLOW, HOLD).
        result:
          type: [string, 'null']
          description: How a TARGET ended (HIT, MISSED, CANCELED); empty while running.
        crossed_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        closing_at:
          type: [string, 'null']
          format: date-time
          description: When a TARGET's closing window starts (its last 10%, at least a minute); no spike starts in it.
        hold_until:
          type: [string, 'null']
          format: date-time
        parent_id:
          type: [string, 'null']
          description: A SPIKE's TARGET.
        width_seconds:
          type: [integer, 'null']
          description: A SPIKE's width.
        spikes:
          type: array
          description: A TARGET's spikes, made with it (in the answer to its creation only).
          items:
            $ref: '#/components/schemas/SimEvent'
    SimEventItem:
      type: object
      description: An OVERLAY request's event on one pair (J0 contract §3.1).
      required: [symbol, event_id, type, status, factor_target, base_price, event]
      properties:
        symbol:
          type: string
        event_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [OVERLAY, JUMP]
          description: JUMP on the simulated market's own pair.
        status:
          type: string
          enum: [SCHEDULED, RUNNING, DONE, CANCELED]
        factor_target:
          type: number
        base_price:
          type: [string, 'null']
          description: The reference price it starts from (the simulated market's target for a JUMP); null while queued.
        event:
          $ref: '#/components/schemas/SimEvent'
    SimEventWrite:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [JUMP, TARGET, TREND, VOLATILITY, PAUSE, HALT, REANCHOR, SPIKE, OVERLAY]
        symbols:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
          description: |
            An OVERLAY's pairs, distinct: each that follows a reference
            market gets an OVERLAY event, the simulated market's own pair a
            JUMP of its model (ramp_up_seconds its duration; hold, ramp down
            and risk do not apply to it).
        target_price:
          type: string
          description: An OVERLAY's target price, for one pair only; or target_pct.
        target_pct:
          type: number
          description: An OVERLAY's target in percent of each pair's reference price when it is made (16 is +16%, -20 is −20%); not 0.
        ramp_up_seconds:
          type: integer
          minimum: 1
          description: How long an OVERLAY takes to reach its target.
        ramp_down_seconds:
          type: integer
          minimum: 3
          description: How long an OVERLAY takes back to the reference price; its ramps and hold_seconds together 600 at most.
        risk:
          type: boolean
          description: |
            An OVERLAY reaches the perpetuals' index and mark and the
            leverage's valuation (true when absent, user 2026-10-07 03:0x),
            as a real move would: warnings, liquidations and funding
            follow. false is the console's 不连带合约与杠杆: they see the
            reference market's price, and the spot price and the
            perpetual's mark part.
        size:
          type: number
          description: JUMP's move (0.1 is +10%); a SPIKE's, a share of the planned price (at most 0.05 alone, 0.10 approved).
        price:
          type: string
          description: TARGET's level.
        mu:
          type: number
          description: TREND's drift a day.
        factor:
          type: number
          description: VOLATILITY's factor.
        duration_seconds:
          type: integer
          minimum: 0
        hold_seconds:
          type: integer
          minimum: 0
          description: A TARGET held this long at its level once crossed (then HOLD; at most a day); an OVERLAY held at its target between its ramps.
        starts_at:
          type: string
          format: date-time
          description: At most 24 hours ahead (else 400 ADMIN_SIM_TOO_FAR_AHEAD); a time already past is now, kept in the audit and the request as asked_starts_at.
        direction:
          type: string
          enum: [ABOVE, BELOW]
          description: A TARGET's side of its level (ASTRA A6); inferred from the current target when absent.
        then:
          type: string
          enum: [FOLLOW, HOLD]
          description: What a TARGET does once crossed; FOLLOW when absent.
        spikes:
          type: array
          description: Spikes a TARGET plans, each becoming its own SPIKE event (all or nothing).
          items:
            $ref: '#/components/schemas/SimSpikeWrite'
        width_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: A SPIKE's width; 20 when absent.
    SimSpikeWrite:
      type: object
      required: [at, size]
      properties:
        at:
          type: string
          format: date-time
        size:
          type: number
          description: A share of the planned price, e.g. -0.04.
        width_seconds:
          type: integer
          minimum: 1
          maximum: 60
    SimPlanPoint:
      type: object
      required: [at, plan, low, high]
      properties:
        at:
          type: string
          format: date-time
        plan:
          type: [string, number]
        low:
          type: [string, number]
        high:
          type: [string, number]
    SimPlan:
      type: object
      required: [event_id, points]
      properties:
        event_id:
          type: string
        direction:
          type: [string, 'null']
        level:
          type: [string, number, 'null']
        from_price:
          type: [string, number, 'null']
        starts_at:
          type: [string, 'null']
          format: date-time
        closing_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        hold_until:
          type: [string, 'null']
          format: date-time
        status:
          type: [string, 'null']
          description: The target's status (SCHEDULED, RUNNING, DONE, CANCELED).
        points:
          type: array
          items:
            $ref: '#/components/schemas/SimPlanPoint'
        spikes:
          type: array
          items:
            $ref: '#/components/schemas/SimEvent'
        now:
          type: [object, 'null']
          description: Where the target is against the plan, while it runs.
          properties:
            at:
              type: string
              format: date-time
            target:
              type: [string, number, 'null']
            plan:
              type: [string, number, 'null']
            low:
              type: [string, number, 'null']
            high:
              type: [string, number, 'null']
            deviation:
              type: [number, 'null']
              description: ln(target/plan).
            at_risk:
              type: boolean
            crossed_at:
              type: [string, 'null']
              format: date-time
            result:
              type: [string, 'null']
    SimTargetPreview:
      type: object
      required: [feasible, min_duration_seconds, move, needs_approval, points]
      properties:
        now:
          type: string
          format: date-time
          description: The server's time, which the form takes its spikes' times from (review 29; a browser's clock may be off).
        direction:
          type: [string, 'null']
          description: The side of the level, as asked or inferred from the current target (ABOVE, BELOW).
        feasible:
          type: boolean
        min_duration_seconds:
          type: integer
          description: The shortest window in which the level is reachable from the current target.
        move:
          type: number
          description: The planned move, |ln(level/current target)|.
        needs_approval:
          type: boolean
          description: "Beyond one operator's share (30% alone, 50% an hour): a second administrator approves it."
        points:
          type: array
          items:
            $ref: '#/components/schemas/SimPlanPoint'
    SimSample:
      type: object
      required: [at, target_price, last_price]
      properties:
        at:
          type: string
          format: date-time
        target_price:
          type: string
        last_price:
          type: [string, 'null']
    SimImpact:
      type: object
      description: derivatives-service's price impact (the margin monitor's rules at the target), with the sides open now.
      required: [symbol, target_price, positions, longs, shorts, liquidated, notional, accounts, insurance_cost, unmeasured, examples]
      properties:
        symbol:
          type: string
        target_price:
          $ref: '#/components/schemas/Decimal'
        positions:
          type: integer
          description: The open positions, HOUSE's apart.
        longs:
          type: [integer, 'null']
          description: The open longs; null when the positions cannot all be read.
        shorts:
          type: [integer, 'null']
        liquidated:
          type: integer
          description: The positions the monitor would take over at the target that it does not now (a cross account whole).
        notional:
          $ref: '#/components/schemas/Decimal'
        accounts:
          type: integer
        insurance_cost:
          description: What the liquidated lack beyond their margin at the target, for the insurance fund.
          $ref: '#/components/schemas/Decimal'
        unmeasured:
          type: integer
          description: The positions left out for want of a fresh mark price now.
        examples:
          type: array
          description: The largest of the liquidated, 20 at most.
          items:
            type: object
            required: [user_id, symbol, position_side, cross, notional, margin_balance, maintenance_before, maintenance_after]
            properties:
              user_id:
                type: string
              symbol:
                type: string
              position_side:
                type: string
              cross:
                type: boolean
              notional:
                type: string
              margin_balance:
                type: string
              maintenance_before:
                type: string
              maintenance_after:
                type: string
    SimPreview:
      type: object
      required: [expires_at, expired, target_price, expected_price, move, requested_move, impact]
      properties:
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        target_price:
          $ref: '#/components/schemas/NullableDecimal'
        expected_price:
          $ref: '#/components/schemas/NullableDecimal'
        move:
          type: [number, 'null']
          description: expected_price ÷ target_price − 1, now.
        requested_move:
          type: [string, 'null']
          description: The move market-sim measured when it was asked for.
        impact:
          oneOf:
            - $ref: '#/components/schemas/SimImpact'
            - type: 'null'
        spike_impacts:
          type: array
          description: |
            A target's spikes (A6, review 29): what its worst spike each way
            would do to the perpetual, measured where the mark goes at the
            tip (about half the spike, from the lower of the target now and
            the level down, from the higher up). Empty for anything else.
          items:
            type: object
            required: [price, impact]
            properties:
              price:
                $ref: '#/components/schemas/Decimal'
              impact:
                $ref: '#/components/schemas/SimImpact'
        overlay:
          type: array
          description: |
            A price event on any pair (OVERLAY, A81): each pair measured now,
            target_price, expected_price, move and impact staying null (the
            simulated market's model does not move). Absent for the
            simulated market's own changes.
          items:
            type: object
            required: [symbol, price, target_price, move, loss_usdt, loss_note]
            properties:
              symbol:
                type: string
              price:
                description: The platform's price now (market-data's ticker; a followed pair's is the reference market's).
                $ref: '#/components/schemas/NullableDecimal'
              target_price:
                description: Where the event's target takes it from that price.
                $ref: '#/components/schemas/NullableDecimal'
              move:
                type: [number, 'null']
              loss_usdt:
                description: |
                  HOUSE's worst loss on the event, worked out as market-sim
                  does before it starts (J0 contract §3.3: what HOUSE may
                  still buy or sell there and, with risk, on the pair's
                  perpetuals, from market-maker's rooms); market-sim alone
                  refuses one beyond OVERLAY_MAX_LOSS_USDT.
                $ref: '#/components/schemas/NullableDecimal'
              loss_note:
                type: [string, 'null']
                enum: [NO_PRICE, NOT_QUOTED, UNREADABLE, null]
                description: Why there is no loss_usdt.
    SimHolding:
      type: object
      required: [amount, holders]
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        holders:
          type: integer
          description: How many accounts hold some.
    SimToken:
      type: object
      required: [asset, price, bots, users, platform, issued, top, at]
      properties:
        asset:
          type: string
          examples: [ASTRA]
        price:
          description: The pair's last trade as market-sim reads it; null before the first.
          $ref: '#/components/schemas/NullableDecimal'
        bots:
          $ref: '#/components/schemas/SimHolding'
        users:
          description: Every other user (HOUSE included, when it holds the coin).
          $ref: '#/components/schemas/SimHolding'
        platform:
          type: array
          description: The system accounts holding some (fees and the like), ADJUSTMENT apart.
          items:
            type: object
            required: [account_type, amount]
            properties:
              account_type:
                type: string
                examples: [FEE_REVENUE]
              amount:
                $ref: '#/components/schemas/Decimal'
        issued:
          description: What manual adjustments issued (the ADJUSTMENT account's debit); the bots, users and platform hold it all.
          $ref: '#/components/schemas/Decimal'
        top:
          type: array
          description: The largest holders, largest first (20 at most).
          items:
            type: object
            required: [user_id, amount]
            properties:
              user_id:
                type: string
                format: uuid
              amount:
                $ref: '#/components/schemas/Decimal'
        at:
          type: string
          format: date-time
    AssetProfile:
      type: object
      required: [display_name, description, links, logo_mime, logo_size, logo_url, version]
      properties:
        display_name:
          type: string
          description: Replaces the asset's name on the sites when set.
        description:
          type: object
          description: Introductions by language (zh-CN, zh-TW, en; G7b), up to 1,000 characters each.
          additionalProperties:
            type: string
        links:
          type: object
          description: https URLs by kind (website, explorer, whitepaper).
          additionalProperties:
            type: string
        logo_mime:
          type: string
          description: image/png, image/svg+xml or image/webp; empty without a logo.
        logo_size:
          type: integer
        logo_url:
          type: string
          description: The logo's path with its version (/v1/market/assets/{code}/logo?v=...); empty without one.
        version:
          type: integer
    AssetProfileWrite:
      type: object
      required: [display_name, description, links]
      properties:
        display_name:
          type: string
          maxLength: 32
        description:
          type: object
          additionalProperties:
            type: string
        links:
          type: object
          additionalProperties:
            type: string
        logo:
          type: string
          description: A new logo, base64.
        logo_mime:
          type: string
          enum: [image/png, image/svg+xml, image/webp]
        clear_logo:
          type: boolean
    PlatformTexts:
      description: >-
        A text by language; zh-CN stands in for a language without one (an empty zh-TW shows the Simplified; G7b,
        instrument-service answers all three keys since G7).
      type: object
      required: [zh-CN, zh-TW, en]
      properties:
        zh-CN:
          type: string
        zh-TW:
          type: string
        en:
          type: string
    WelcomeCredit:
      type: object
      required: [asset, amount]
      properties:
        asset:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
    WelcomeCreditsSetting:
      type: object
      required: [credits, flag_enabled, version, updated_by, updated_at]
      properties:
        credits:
          type: array
          items:
            $ref: '#/components/schemas/WelcomeCredit'
        flag_enabled:
          type: boolean
          description: ledger.welcome_credit, the master switch (both must hold for a grant).
        version:
          type: integer
          format: int64
        updated_by:
          type: string
          description: '"system:WELCOME_FUNDS" for the first value taken from the environment.'
        updated_at:
          type: [string, 'null']
          format: date-time
    HouseCaps:
      description: HOUSE's caps as market-maker keeps them (review C45), decimal strings.
      type: object
      required: [level, symbol, total, contract, safety, contract_leverage, version, updated_by, updated_at]
      properties:
        level:
          description: A book level's quantity, USDT; zero or more, zero for no cap.
          $ref: '#/components/schemas/Decimal'
        symbol:
          description: An asset's holding (a pair's position), USDT; above zero.
          $ref: '#/components/schemas/Decimal'
        total:
          description: All holdings but USDT together, USDT; above zero.
          $ref: '#/components/schemas/Decimal'
        contract:
          description: A contract's net position, USDT; above zero.
          $ref: '#/components/schemas/Decimal'
        safety:
          description: The backed inventory kept back and the quote asset kept when buying, USDT; above zero.
          $ref: '#/components/schemas/Decimal'
        contract_leverage:
          description: All contract positions of a settlement asset together at most this many times HOUSE's contract equity in it; 1 to 125.
          $ref: '#/components/schemas/Decimal'
        version:
          type: integer
          format: int64
        updated_by:
          type: string
          description: The requester of the last change; environment for the deployment's defaults.
        updated_at:
          type: string
          format: date-time
    HouseCapsChange:
      type: object
      required: [version, caps, previous, actor, approver, approval_id, reason, signed_by, at]
      properties:
        version:
          type: integer
          format: int64
        caps:
          type: object
          description: The six caps after the change.
          additionalProperties:
            type: string
        previous:
          description: The caps before (null for the first version).
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
        actor:
          type: string
        approver:
          type: string
        approval_id:
          type: string
        reason:
          type: string
        signed_by:
          type: string
          description: The key that signed the change (review C47) - admin for the console's, ops for exchangectl's (no approver); empty for the first version and before C47.
        at:
          type: string
          format: date-time
    HouseCapsView:
      type: object
      required: [caps, pending, changes, initial]
      properties:
        caps:
          $ref: '#/components/schemas/HouseCaps'
        pending:
          description: The HOUSE_CAPS request that waits; null for none.
          oneOf:
            - $ref: '#/components/schemas/Approval'
            - type: 'null'
        changes:
          type: array
          description: market-maker's latest changes of the caps (at most 10), newest first; empty when they cannot be read.
          items:
            $ref: '#/components/schemas/HouseCapsChange'
        initial:
          description: The six caps of the first version, from market-maker's environment; null when it is not among the latest 100 changes or they cannot be read.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: 'null'
    HouseCapsRequest:
      type: object
      required: [caps, version, reason]
      properties:
        caps:
          type: object
          description: The caps to change by name, decimal strings (the others stay as they are).
          properties:
            level:
              type: string
            symbol:
              type: string
            total:
              type: string
            contract:
              type: string
            safety:
              type: string
            contract_leverage:
              type: string
          additionalProperties: false
        version:
          type: integer
          format: int64
          description: The caps' version read.
        reason:
          type: string
          minLength: 3
    AppEntryAdmin:
      description: The switch for the sites' download entries (batch H5) with its version and last change.
      type: object
      required: [visible, version, updated_by, updated_at]
      properties:
        visible:
          type: boolean
          description: On by default; the sites read it as GET /v1/platform/apps's entry.visible.
        version:
          type: integer
          format: int64
          description: Goes up with every switch; the public answer's ETag carries it.
        updated_by:
          type: string
          description: Who switched it last (system:migration for the default).
        updated_at:
          type: string
          format: date-time
    PlatformAppAdmin:
      description: >-
        One platform's download as the console sets it (design 2026-10-07, App download page): what the sites show
        is public (null while OFF, disabled or incomplete; as api/openapi/platform.yaml's AppDownload).
      type: object
      required: [platform, mode, link_url, enabled, notes, current, mobileconfig, files, public, version, updated_at, updated_by]
      properties:
        platform:
          type: string
          enum: [ANDROID, IOS]
        mode:
          type: string
          enum: [OFF, LINK, FILE]
        link_url:
          type: string
          description: An https link (an app store, TestFlight, another page); kept while the mode is FILE or OFF; empty for none.
        enabled:
          type: boolean
        notes:
          description: The version notes the download page shows.
          $ref: '#/components/schemas/PlatformTexts'
        current:
          description: The app the FILE mode serves; null for none.
          oneOf:
            - $ref: '#/components/schemas/AppFile'
            - type: 'null'
        mobileconfig:
          description: iOS's optional configuration profile; null for none (always null on Android).
          oneOf:
            - $ref: '#/components/schemas/AppFile'
            - type: 'null'
        files:
          type: array
          description: Every file kept on the server for the platform, newest first (the current app and configuration profile among them); at most 10.
          items:
            $ref: '#/components/schemas/AppFile'
        public:
          description: What GET /v1/platform/apps answers for the platform now.
          oneOf:
            - $ref: '../openapi/platform.yaml#/components/schemas/AppDownload'
            - type: 'null'
        version:
          type: integer
          format: int64
          description: Goes up with every change (a setting, an upload, a deletion); PUT brings it back as expected_version.
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    AppFile:
      description: A file uploaded in the console, as the server keeps it.
      type: object
      required: [file_id, kind, name, size, sha256, url, manifest_url, package, version, build, min_os, uploaded_at, uploaded_by]
      properties:
        file_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [APP, MOBILECONFIG]
        name:
          type: string
          description: The file's name when uploaded (it is stored as <file_id>.<extension>).
        size:
          type: integer
          format: int64
        sha256:
          type: string
        url:
          type: string
          description: Where the sites serve it, https://<domain>/downloads/<android|ios>/<file_id>.<extension>.
        manifest_url:
          type: [string, 'null']
          description: An .ipa's manifest.plist for the over-the-air install; null otherwise.
        package:
          type: [string, 'null']
          description: The Android package or the iOS bundle identifier (null for a .mobileconfig).
        version:
          type: [string, 'null']
        build:
          type: [string, 'null']
        min_os:
          type: [string, 'null']
        uploaded_at:
          type: string
          format: date-time
        uploaded_by:
          type: string
    PlatformAppWrite:
      type: object
      required: [mode, link_url, notes, enabled, expected_version]
      properties:
        mode:
          type: string
          enum: [OFF, LINK, FILE]
        link_url:
          type: string
          maxLength: 500
          pattern: '^(https://.+)?$'
          description: https only, at most 500 characters; empty for none (a LINK needs one).
        notes:
          $ref: '#/components/schemas/PlatformTexts'
        enabled:
          type: boolean
        expected_version:
          type: integer
          format: int64
    AppUploadStart:
      type: object
      required: [kind, name, size, sha256]
      properties:
        kind:
          type: string
          enum: [APP, MOBILECONFIG]
          description: MOBILECONFIG on IOS only.
        name:
          type: string
          maxLength: 200
          pattern: '\.(apk|ipa|mobileconfig)$'
          description: The file's name, ending .apk, .ipa or .mobileconfig as the platform and kind say; at most 200 characters.
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 524288000
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    AppUpload:
      type: object
      required: [upload_id, platform, kind, name, size, sha256, part_size, parts, received, expires_at, started_by]
      properties:
        upload_id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ANDROID, IOS]
        kind:
          type: string
          enum: [APP, MOBILECONFIG]
        name:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        part_size:
          type: integer
          description: 10485760 (10 MiB); every part but the last has exactly this many bytes.
        parts:
          type: integer
        received:
          type: array
          description: The part numbers received, ascending.
          items:
            type: integer
        expires_at:
          type: string
          format: date-time
          description: Dropped with its parts if not completed by then (24 hours after its start).
        started_by:
          type: string
    PlatformProfileAdmin:
      description: The platform's profile (as api/openapi/platform.yaml's PlatformProfile) and who last changed it.
      type: object
      required: [name, short_name, domain, theme_color, brand_color, images, footer, contact, social, default_locale, test_mode, registration,
