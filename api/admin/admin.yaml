      type: object
      description: A fund operation (a manual adjustment, an insurance fund contribution or a deposit backfill).
      required: [id, kind, payload, reason, status, requested_by, requested_by_email, decided_by, decided_by_email, result, created_at,
        decided_at, mode, value_usdt, escalation, journal_id, attempted_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [LEDGER_ADJUSTMENT, INSURANCE_FUND, DEPOSIT_BACKFILL, SIM_EVENT, SIM_PARAMS, SIM_MINT, DEPOSIT_ASSIGN, WELCOME_CREDIT,
            MARGIN_PARAMS, MARGIN_LIQUIDATE]
        payload:
          type: object
          description: |
            For LEDGER_ADJUSTMENT user_id, asset and amount, account_type FUTURES when not the SPOT account; for INSURANCE_FUND
            asset and amount; reference when given. For DEPOSIT_BACKFILL user_id, asset, amount, network, trade_id, address,
            tx_hash and entered_by (the backfill's result names the deposit, its journal_id stays null). For SIM_EVENT and
            SIM_PARAMS change (the event or {params} as JSON), actor (the requester, market-sim's actor) and move (the price move
            market-sim measured; volume for a turnover change); the result names the event or the settings' version. For
            SIM_MINT asset, amount (in all), bots (each bot's share as JSON: [{user_id, label, amount}]) and role when only
            one role's bots; its journal_id is the first bot's. For DEPOSIT_ASSIGN user_id (the user it is credited to),
            deposit_id, asset, amount, network, address, tx_hash, and former_holder (a retired address's holder) or
            address_owner (its holder now) when it has one; its journal_id is the release's. For MARGIN_PARAMS (a draft,
            design 2026-10-06 §8) target (asset:<code>, settings or pair:<symbol>), before and after (the parameters as
            JSON) and expected_version; the result names the version applied. For MARGIN_LIQUIDATE (a draft) user_id,
            account, symbol and margin_level when asked; the result names the liquidation.
          additionalProperties:
            type: string
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, EXECUTED, REJECTED, FAILED]
        requested_by:
          type: string
          format: uuid
          description: The requesting administrator's ID.
        requested_by_email:
          type: string
        decided_by:
          type: [string, 'null']
        decided_by_email:
          type: [string, 'null']
        result:
          type: string
          description: |
            The journal once executed, the ledger's refusal, or the rejection reason; while pending after an attempt
            (attempted_at), how the last attempt ended (a mint: "booked n of m; <bot>: <code>: <message>").
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
        mode:
          type: string
          enum: [TWO_PERSON, SINGLE]
          description: SINGLE when its requester carries it out alone (single-person mode).
        value_usdt:
          description: Its worth in USDT when requested; null without a price.
          $ref: '#/components/schemas/NullableDecimal'
        escalation:
          type: string
          enum: ['', REQUESTED, TWO_PERSON_MODE, SINGLE_LIMIT, DAILY_LIMIT, NO_PRICE, SIM_SHARE, NOT_ADDRESS_HOLDER, WELCOME_RAISE,
            MARGIN_RISK]
          description: |
            Why a two-person operation waits for a second administrator:
            asked for, two-person mode on, above the single-operation
            limit, over the 24-hour limit, or of unknown worth, or a
            simulated market's change beyond one operator's share, or a
            deposit of nobody credited to a user other than its address's
            holder, or a margin change that always takes two (rates,
            leverage, thresholds, haircuts, more to lend, a manual
            liquidation; a draft); empty in single-person mode.
        journal_id:
          type: [string, 'null']
        attempted_at:
          type: [string, 'null']
          format: date-time
          description: |
            When an attempt to carry out a fund operation began (a single-person operation when requested, a two-person one
            when approved). PENDING with it, the attempt did not finish and may have booked: it is finished (approved again:
            its ledger key makes that safe), never rejected (ADMIN_APPROVAL_ATTEMPTED). Null for the simulated market's
            changes and before any attempt.
        expired:
          type: boolean
          description: |
            In the list: a simulated market's pending request past its expiry (a day after it was asked for, or when its
            event was to start), or a welcome credits raise's (a day after), by the server's clock; approving it only marks
            it FAILED. False otherwise.
