      operationId: derivativesReport
      summary: Each perpetual contract's trading, funding and liquidations per day, week or month (UTC)
      description: |
        From the ClickHouse contract read models (derivatives_fills,
        derivatives_funding, derivatives_liquidations): settled fills and
        their fees and results, the funding the positions paid and
        received at the day's settlements, the positions taken over, the
