openapi: 3.1.0
info:
  title: Exchange admin console API
  version: 0.1.0
  description: |
    The admin console's API (requirements §5.12), served by admin-service
    under /admin/v1 behind nginx; the user gateway never routes here, and
    this contract stays out of the public API reference.

    Administrators are created by an ADMIN on the administrators page
    (POST /admin/v1/admins), or with `exchangectl admin create` when no
    ADMIN can sign in (no sign-up). Signing in takes the password and a code of the
    authenticator app bound at creation; each code works once, and five
    failures lock the account for 15 minutes. The feature flag
    admin.login_without_totp switches the code off (test environments):
    the password alone signs in, and GET /admin/v1/login-options tells the
    sign-in page not to ask for it. The session is an HttpOnly,
    Secure, SameSite=Strict cookie `admin_session` scoped to /admin/; it
    ends after 8 hours, or after an hour without a request. Every request
    other than GET must carry the header `X-Admin-CSRF: 1`.

    Roles grant permissions: ADMIN (everything, and alone the console's
    settings, the administrators and the trading parameters: statuses,
    fee rates, risk ladders, reference symbols), OPERATOR (accounts,
    orders, the rest of the reference data and new pairs and contracts,
    lifting a contract's reduce-only, feature flags other than the
    console's own), FINANCE (withdrawal reviews, ledger adjustments,
    insurance fund contributions), AUDITOR (read-only). Everyone may read,
    including the reports from the ClickHouse read models. A call
    outside the role fails with ADMIN_FORBIDDEN. Every change is audited
    (audit.events → ClickHouse audit_logs) with the administrator's email
    as the actor; changes also carry a reason of at least 3 characters.

    Fund operations (manual ledger adjustments and insurance fund
    contributions) are approved by a second administrator while the flag
    admin.two_person_approval is on. Off (single-person mode, the test
    server), an administrator carries one out alone when asked to
    (`direct`, and always from a user's page) if it is worth at most the
    single-operation limit and keeps their operations of the last 24 hours
    within the daily limit (GET /admin/v1/settings; 100,000 and 500,000
    USDT by default); anything larger, or of unknown worth, still waits
    for a second administrator. The ledger books each operation once with
    the idempotency key approval:<id>.

    Lists page with an opaque cursor: an answer's `next_cursor` (null on
    the last page) is passed back as `cursor` for the next; `limit` is
    1 to 200 (50 by default) unless an endpoint says otherwise. Orders,
    trades, deposits and the overview come from the ClickHouse read
    models, a few seconds behind the services.
servers:
  - url: https://admin.astras.vip
security:
  - session: []
tags:
  - name: session
  - name: admins
  - name: users
  - name: withdrawals
  - name: instruments
  - name: flags
  - name: ledger
  - name: audit
  - name: reports
  - name: derivatives
  - name: content
  - name: custody
  - name: sim
paths:
  /admin/v1/login-options:
    get:
      operationId: loginOptions
      summary: What signing in asks for
      description: |
        Whether the sign-in page asks for the authenticator code: true
        unless the feature flag admin.login_without_totp is on. Needs no
        session.
      tags: [session]
      security: []
      responses:
        '200':
          description: The sign-in options.
          content:
            application/json:
              schema:
                type: object
                required: [totp_required]
                properties:
                  totp_required:
                    type: boolean
  /admin/v1/login:
    post:
      operationId: login
      summary: Sign in with password and authenticator code
      description: |
        Sets the session cookie. Fails with ADMIN_LOGIN_FAILED for a wrong
        email, password or code (or a code used before), ADMIN_LOCKED
        after five failures in a row (15 minutes), and COMMON_RATE_LIMITED
        beyond 10 attempts a minute from one IP. The code may be left out
        while the flag admin.login_without_totp is on; it is then not
        checked.
      tags: [session]
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Required unless GET /admin/v1/login-options says otherwise.
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: admin_session=...; Path=/admin/; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                required: [admin, expires_at]
                properties:
                  admin:
                    $ref: '#/components/schemas/Admin'
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/logout:
    post:
      operationId: logout
      summary: End the session
      tags: [session]
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/me:
    get:
      operationId: me
      summary: The signed-in administrator and their permissions
      tags: [session]
      responses:
        '200':
          description: The administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/roles:
    get:
      operationId: listRoles
      summary: Every role with its permissions
      description: Any administrator reads them.
      tags: [admins]
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolePermissions'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins:
    get:
      operationId: listAdmins
      summary: The administrators
      description: Every administrator, with their live sessions. Needs admins.manage.
      tags: [admins]
      responses:
        '200':
          description: The administrators.
          content:
            application/json:
              schema:
                type: object
                required: [admins]
                properties:
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedAdmin'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAdmin
      summary: Create an administrator
      description: |
        Answers with the administrator, a password and an authenticator
        secret, shown this once: the answer is not cached (Cache-Control:
        no-store), and neither is logged or audited. The new administrator
        binds the secret in an authenticator app and signs in with both.
        Audited as admin.created. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role, reason]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 1
                role:
                  $ref: '#/components/schemas/AdminRole'
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The administrator and their credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentials'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/status:
    post:
      operationId: setAdminStatus
      summary: Disable or enable an administrator
      description: |
        Disabling ends their sessions at once; enabling also lifts a lock
        after failed sign-ins. Nobody changes their own account here
        (ADMIN_SELF), and an active ADMIN always remains
        (ADMIN_LAST_ADMIN). Audited as admin.disabled or admin.enabled.
        Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/role:
    post:
      operationId: setAdminRole
      summary: Change an administrator's role
      description: |
        Takes effect on their next request. Not one's own (ADMIN_SELF), nor
        the last active ADMIN's (ADMIN_LAST_ADMIN). Audited as
        admin.role_changed. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role:
                  $ref: '#/components/schemas/AdminRole'
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAdmin'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/password-reset:
    post:
      operationId: resetAdminPassword
      summary: Give an administrator a new password
      description: |
        Answers with the new password, shown this once (no-store, never
        logged or audited), and ends their sessions. Not one's own
        (ADMIN_SELF). Audited as admin.password_reset. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentials'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/totp-reset:
    post:
      operationId: resetAdminTOTP
      summary: Give an administrator a new authenticator secret
      description: |
        Answers with the new secret and its otpauth URI, shown this once
        (no-store, never logged or audited); the old authenticator stops
        working and their sessions end. Not one's own (ADMIN_SELF).
        Audited as admin.totp_reset. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCredentials'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/sessions:
    get:
      operationId: adminSessions
      summary: An administrator's live sessions
      description: At most 50, the latest first. Needs admins.manage.
      tags: [admins]
      parameters:
        - $ref: '#/components/parameters/AdminID'
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSession'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/admins/{id}/sessions/revoke:
    post:
      operationId: revokeAdminSessions
      summary: End every session of an administrator
      description: |
        Not one's own (ADMIN_SELF; signing out ends one's session).
        Audited as admin.sessions_revoked. Needs admins.manage.
      tags: [admins]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: The sessions ended.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/settings:
    get:
      operationId: getSettings
      summary: The console's settings
      description: |
        Whether fund operations need a second administrator (the flag
        admin.two_person_approval) and the single-person limits, with the
        caller's single-person total of the last 24 hours. Every
        administrator may read them.
      tags: [session]
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSettings
      summary: Change the console's settings
      description: |
        Changes the fields given: the limits and the delay of trading
        parameters' changes (audited as admin.settings.changed) and
        two-person approval (switches the flag
        admin.two_person_approval, audited by the flags; the other
        instances follow within 5 seconds). The daily limit must cover the
        single-operation one. Needs settings.write (ADMIN).
      tags: [session]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                two_person_approval:
                  type: boolean
                single_max_usdt:
                  $ref: '#/components/schemas/Decimal'
                daily_max_usdt:
                  $ref: '#/components/schemas/Decimal'
                withdrawal_max_usdt:
                  $ref: '#/components/schemas/Decimal'
                change_delay_seconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/todo:
    get:
      operationId: getTodo
      summary: What waits for the administrator
      description: |
        The counts behind the console's badges, as far as the role shows
        them (zero otherwise): withdrawals in review (counted up to 200)
        and fund operations waiting for a decision. A count that cannot be
        read is zero and named in `partial`.
      tags: [session]
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/events:
    get:
      operationId: streamEvents
      summary: The counts as they change (Server-Sent Events)
      description: |
        An event stream: `todo` with the counts of GET /admin/v1/todo at
        once and whenever they change (checked every 10 seconds),
        `signed_out` when the session ends, and a comment after 20 seconds
        without an event. The stream does not keep the session alive; the
        browser reconnects after 5 seconds when it drops.
      tags: [session]
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users:
    get:
      operationId: listUsers
      summary: Accounts, newest first
      description: Needs users.read. Contact data stays in auth-service; find an account by email or phone with users/lookup.
      tags: [users]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
        - name: region
          in: query
          description: ISO 3166-1 alpha-2.
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/orders:
    get:
      operationId: listOrders
      summary: Spot orders in their latest state, newest first
      description: From the read model orders_current. Needs reports.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: order_id
          in: query
          description: One order (the console's search).
          schema:
            type: string
            format: uuid
        - name: symbol
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, OPEN, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED]
        - name: side
          in: query
          schema:
            type: string
            enum: [BUY, SELL]
        - $ref: '#/components/parameters/Accounts'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/trades:
    get:
      operationId: listTrades
      summary: Spot trades, newest first
      description: >-
        From the read model trades; user_id matches either side. With accounts=bots only the trades between two bots,
        with accounts=users those with anyone else on a side (a user's trade with a bot is the users'). Needs
        reports.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: symbol
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Accounts'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of trades.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits:
    get:
      operationId: listDeposits
      summary: Deposits in their latest state, newest first
      description: From the read model wallet_deposits. Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: asset
          in: query
          schema:
            type: string
        - name: network
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DETECTED, CONFIRMING, CONFIRMED, CREDITED, ORPHANED, REJECTED]
        - name: tx_hash
          in: query
          description: The deposits of one transaction, any letter case (the console's search).
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deposits.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deposit'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/review:
    get:
      operationId: listReviewDeposits
      summary: wallet-service's deposits, for decisions
      description: |
        Newest first, straight from wallet-service (not the read model):
        attention=true lists the deposits waiting for a decision (booked
        to UNCLAIMED_DEPOSIT, or a backfill the custodian's callback
        disagreed with), manual_pending=true the backfilled ones without
        a callback yet. Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - $ref: '#/components/parameters/UserFilter'
        - name: status
          in: query
          schema:
            type: string
            enum: [DETECTED, CONFIRMING, CONFIRMED, CREDITED, ORPHANED, REJECTED]
        - name: network
          in: query
          schema:
            type: string
        - name: attention
          in: query
          schema:
            type: string
            enum: ['true']
        - name: manual_pending
          in: query
          schema:
            type: string
            enum: ['true']
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deposits.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewDeposit'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/manual/check:
    post:
      operationId: checkDepositBackfill
      summary: Check a backfill of a lost custodian callback without booking it
      description: |
        The checks of POST /admin/v1/deposits/manual (the network is a
        custodian's, the address is a user's on it, neither the trade nor
        the transfer is known, the amount fits the asset's precision) and
        what it would book. Not audited. Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '200':
          description: What the backfill would book.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, asset, unclaimed, value_usdt]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  asset:
                    type: string
                  unclaimed:
                    type: boolean
                    description: Below the network's minimum, so booked to UNCLAIMED_DEPOSIT instead of the user.
                  value_usdt:
                    description: The amount's worth; null without a price (a second administrator then decides).
                    $ref: '#/components/schemas/NullableDecimal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/manual:
    post:
      operationId: backfillDeposit
      summary: Backfill a custodian deposit whose callback was lost
      description: |
        For a deposit the administrator found in the custodian's console
        (this console cannot ask the custodian, so nothing here checks it
        there). After the checks of POST /admin/v1/deposits/manual/check
        it is a fund operation (kind DEPOSIT_BACKFILL): in single-person
        mode within the limits it is booked at once (EXECUTED), otherwise
        it waits for a second administrator (PENDING). Booked like a
        callback (credited, or to UNCLAIMED_DEPOSIT below the minimum)
        with source MANUAL; the custodian's own callback, when it comes,
        is matched against it, never booked again. Audited. Needs
        deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BackfillRequest'
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 10
      responses:
        '201':
          description: The fund operation, executed or waiting for a second administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}:
    get:
      operationId: getReviewDeposit
      summary: One of wallet-service's deposits
      description: Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeposit'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}/credit:
    post:
      operationId: creditDeposit
      summary: Give an unclaimed deposit to its user
      description: |
        Only a deposit booked to UNCLAIMED_DEPOSIT (below the minimum, the
        account closed or not eligible) and only its own asset and amount:
        the ledger moves it to the user's spot account (DEPOSIT_CREDIT,
        audited as ledger.unclaimed_released). An unsupported token has no
        asset and can only be rejected (WALLET_DEPOSIT_NOT_RELEASABLE).
        Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The deposit, CREDITED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeposit'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/deposits/{id}/reject:
    post:
      operationId: rejectDeposit
      summary: Close a deposit waiting for a decision without moving funds
      description: |
        Marks it handled with the reason (resolution DISMISSED): an
        unclaimed deposit stays in UNCLAIMED_DEPOSIT, a disagreeing
        callback stays unbooked. Audited by the wallet
        (wallet.deposit.dismissed). Needs deposits.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDeposit'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/dashboard:
    get:
      operationId: getDashboard
      summary: The overview
      description: |
        Accounts (user-service), the last 24 hours' trading and what waits
        in the wallet (read models), the reference feed (market-data-service)
        and a daily series. A part that cannot be read is left empty and
        named in `partial`. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/lookup:
    get:
      operationId: lookupUser
      summary: Find an account by user ID, email address or phone number
      description: Phone numbers in E.164 with the leading "+". Needs users.read.
      tags: [users]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            examples: [alice@example.com]
      responses:
        '200':
          description: The account and its balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/status:
    post:
      operationId: changeUserStatus
      summary: Move an account to another status (freeze, unfreeze, review, close)
      description: |
        user-service applies its state machine (appendix B) and records the
        change with the administrator as the actor. Needs users.status.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to:
                  type: string
                  enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
                reason:
                  type: string
                  description: Reason code of user-service, e.g. SUSPICIOUS_LOGIN, USER_REQUEST.
                note:
                  type: string
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}:
    get:
      operationId: getUser
      summary: An account with the console's tags on it
      description: Needs users.read. Unknown accounts fail with COMMON_NOT_FOUND.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/notes:
    get:
      operationId: listUserNotes
      summary: Administrators' notes on an account, newest first
      description: Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addUserNote
      summary: Write a note on an account
      description: Notes are never edited or removed; each is audited (admin.users.note_added). Needs users.notes.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/tags:
    put:
      operationId: setUserTags
      summary: Replace an account's tags
      description: |
        Tags are upper case codes (letters, digits, _; up to 32, at most
        10), e.g. VIP, SUSPICIOUS, TEST; the console's own, user-service
        never sees them. A change is audited with the tags before and after
        (admin.users.tags_changed). Needs users.notes.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  maxItems: 10
                  items:
                    type: string
      responses:
        '200':
          description: The tags as stored (upper case, sorted).
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/adjustments:
    post:
      operationId: adjustUserBalance
      summary: Credit or debit a user's balance
      description: |
        A manual adjustment (MANUAL_ADJUSTMENT against the ADJUSTMENT system
        account) of the user's SPOT or FUTURES account: booked at once in
        single-person mode within the limits (EXECUTED with its journal, or
        FAILED with the ledger's refusal such as
        LEDGER_ADJUSTMENT_DISABLED), otherwise PENDING for a second
        administrator with the reason in `escalation`. When the ledger does
        not answer the call fails with COMMON_UNAVAILABLE and the detail
        `approval_id` names the operation, left PENDING for its requester
        to finish (decide). Needs ledger.adjust.request.
      tags: [users, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, reason]
              properties:
                account_type:
                  type: string
                  enum: [SPOT, FUTURES]
                  default: SPOT
                asset:
                  type: string
                  examples: [USDT]
                amount:
                  description: Positive credits, negative debits.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                  description: A ticket or order number kept with it (in the journal's memo).
      responses:
        '201':
          description: The operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/cancel-orders:
    post:
      operationId: cancelUserOrders
      summary: Cancel every open order of an account
      description: Needs orders.cancel. The cancellations complete asynchronously in the matching engine.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Cancellations requested.
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/security:
    get:
      operationId: getUserSecurity
      summary: An account's sign-in security
      description: |
        Identities (masked: a***@x.com, +65912****4567), authenticator,
        password, lock, live sessions and devices (addresses masked), and
        the rebind requests waiting (auth-service). Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The account's security.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Security'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/contacts/reveal:
    post:
      operationId: revealUserContacts
      summary: An account's email and phone, unmasked
      description: |
        Each call is audited (admin.users.contacts_revealed, naming the
        kinds shown, not the values); the answer is not cached. Needs
        users.contacts.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The identities.
          content:
            application/json:
              schema:
                type: object
                required: [identities]
                properties:
                  identities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Identity'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/login-history:
    get:
      operationId: listUserLogins
      summary: An account's sign-in attempts, newest first
      description: Addresses are masked. Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of sign-ins.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoginEntry'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: End one of an account's sessions, or all of them
      description: |
        The sessions end with reason ADMIN (auth-service); audited as
        admin.users.sessions_revoked. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                session_id:
                  type: string
                  format: uuid
                  description: Omitted for every live session.
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: How many sessions ended.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/totp-reset:
    post:
      operationId: resetUserTotp
      summary: Remove an account's authenticator app
      description: |
        The user is told by mail and can bind a new one; audited as
        admin.users.totp_reset. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: Whether there was one to remove.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/password-reset:
    post:
      operationId: resetUserPassword
      summary: Give an account a temporary password
      description: |
        A random password (four groups of four letters and digits) replaces
        the user's; every session ends, the password lock is cleared and
        the user is told by mail as for a reset (withdrawals are reviewed
        for a day). The password is in this answer only: pass it on and
        ask the user to change it. Audited as admin.users.password_reset,
        without the password. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The temporary password (not cached).
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password, sessions_revoked]
                properties:
                  temporary_password:
                    type: string
                  sessions_revoked:
                    type: integer
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/history:
    get:
      operationId: getUserHistory
      summary: An account's status changes and accepted documents
      description: Status changes newest first, at most 50 (user-service). Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                required: [status_changes, consents]
                properties:
                  status_changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusChange'
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consent'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/risk:
    get:
      operationId: getUserRisk
      summary: The risk rules' assessments of an account, newest first
      description: |
        Only assessments with a rule hit are kept (risk-service). Moving the
        account to RISK_REVIEW and back is POST /admin/v1/users/{id}/status.
        Needs users.read.
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The assessments.
          content:
            application/json:
              schema:
                type: object
                required: [assessments]
                properties:
                  assessments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assessment'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/identity-requests:
    get:
      operationId: listIdentityRequests
      summary: Identity rebind requests, newest first
      description: |
        A user with a single identity asks to move it to a new value and an
        administrator decides (auth-service). Values are masked. Needs
        users.read.
      tags: [users]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_REVIEW, APPROVED, REJECTED]
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdentityRequest'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/identity-requests/{id}/decide:
    post:
      operationId: decideIdentityRequest
      summary: Approve or reject an identity rebind request
      description: |
        Approving moves the identity to the new value and tells the user;
        a value another account holds fails with AUTH_IDENTITY_TAKEN. Audited as
        admin.users.identity_request_decided. Needs users.security.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityRequest'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/balances:
    get:
      operationId: getUserBalances
      summary: An account's balances, valued in USDT
      description: |
        Every SPOT and FUTURES balance with its total (available + frozen)
        valued at its USDT pair's last price, SPOT first and the larger
        worth first; assets without a USDT price are listed in `unpriced`
        and left out of the total. Needs users.read.
      tags: [users, ledger]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [balances, total_usdt, unpriced]
                properties:
                  balances:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValuedBalance'
                  total_usdt:
                    $ref: '#/components/schemas/Decimal'
                  unpriced:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/holds:
    get:
      operationId: listUserHolds
      summary: Holds on an account's SPOT balance, newest first
      description: Active and released. Needs users.read.
      tags: [users, ledger]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The holds.
          content:
            application/json:
              schema:
                type: object
                required: [holds]
                properties:
                  holds:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hold'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: placeUserHold
      summary: Freeze part of an account's SPOT balance
      description: |
        The ledger moves the amount from available to frozen (ADMIN_FREEZE)
        and audits it as ledger.hold_placed; more than the available
        balance fails with LEDGER_INSUFFICIENT_BALANCE. The user sees the
        amount frozen until it is released. Needs ledger.hold.
      tags: [users, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, reason]
              properties:
                asset:
                  type: string
                  examples: [USDT]
                amount:
                  description: Positive.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/holds/{hold}:
    delete:
      operationId: releaseUserHold
      summary: Release a hold
      description: |
        The ledger returns the amount to the available balance
        (ADMIN_UNFREEZE) and audits it as ledger.hold_released; a hold is
        released once (LEDGER_HOLD_RELEASED). Needs ledger.hold.
      tags: [users, ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - name: hold
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The released hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/orders/{order}/cancel:
    post:
      operationId: cancelUserOrder
      summary: Cancel one of an account's spot orders
      description: |
        The cancel completes asynchronously in the matching engine; the
        answer is the order as spot-trading-service has it. Audited as
        admin.orders.canceled. Needs orders.cancel.
      tags: [users]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/OrderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Cancel requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrder'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/contract-orders:
    get:
      operationId: listUserContractOrders
      summary: An account's active contract orders
      description: As derivatives-service renders them, at most 100. Needs users.read.
      tags: [users, derivatives]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The orders.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractOrder'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/contract-orders/{order}/cancel:
    post:
      operationId: cancelUserContractOrder
      summary: Cancel one of an account's contract orders
      description: Completes asynchronously in the engine. Audited as admin.derivatives.order_canceled. Needs orders.cancel.
      tags: [users, derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/OrderID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '202':
          description: Cancel requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractOrder'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/positions:
    get:
      operationId: listUserPositions
      summary: An account's open contract positions
      description: As derivatives-service renders them, with the liquidation estimate. Needs users.read.
      tags: [users, derivatives]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPosition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/users/{id}/positions/close:
    post:
      operationId: closeUserPosition
      summary: Close a position at the market (force close)
      description: |
        The closing orders resting on the position are canceled first;
        once the engine confirmed (the console waits a few seconds, then
        fails with DERIV_CLOSE_PENDING to try again), a market order of
        kind ADMIN takes the whole position: reduce-only in one-way mode,
        against its side in hedge mode. A position under liquidation is
        left to the liquidation engine (DERIV_POSITION_LIQUIDATING). The
        answer is the order. Audited as admin.derivatives.position_closed.
        Needs derivatives.write.
      tags: [users, derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, position_side, reason]
              properties:
                symbol:
                  type: string
                  examples: [BTC-USDT-PERP]
                position_side:
                  type: string
                  enum: [BOTH, LONG, SHORT]
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The closing order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractOrder'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals:
    get:
      operationId: listWithdrawals
      summary: Withdrawals, the review queue by default
      description: |
        From wallet-service. The review queue (PENDING_REVIEW) lists oldest
        first, every other status newest first, unless order says otherwise.
        Needs withdrawals.read.
      tags: [withdrawals]
      parameters:
        - name: status
          in: query
          description: A withdrawal status (appendix B), e.g. APPROVED, SUBMITTED, BROADCAST, CONFIRMED, REJECTED, FAILED; ALL for every status.
          schema:
            type: string
            default: PENDING_REVIEW
        - $ref: '#/components/parameters/UserFilter'
        - name: asset
          in: query
          schema:
            type: string
        - name: network
          in: query
          description: One network, e.g. TRON or ETH-SEPOLIA; every network when empty.
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: held
          in: query
          description: true for the withdrawals on hold, false for the others.
          schema:
            type: string
            enum: ['true', 'false']
        - name: min_value_usdt
          in: query
          schema:
            $ref: '#/components/schemas/Decimal'
        - name: max_value_usdt
          in: query
          schema:
            $ref: '#/components/schemas/Decimal'
        - name: min_risk
          in: query
          description: The lowest risk score listed.
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of withdrawals.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Withdrawal'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/{id}/review:
    post:
      operationId: reviewWithdrawal
      summary: Approve or reject a withdrawal in review
      description: |
        The administrator's email is the reviewer; a withdrawal above
        20,000 USDT needs two distinct reviewers. Rejecting releases the
        frozen amount. Needs withdrawals.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The withdrawal after the review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/review-batch:
    post:
      operationId: reviewWithdrawalBatch
      summary: Approve or reject several withdrawals with one reason
      description: |
        Each withdrawal is reviewed on its own as by POST
        /admin/v1/withdrawals/{id}/review (and audited by the wallet); one
        that fails (already decided, unknown) leaves the others decided and
        says why. At most 50 at a time. Needs withdrawals.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, approve, reason]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: What came of each.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, ok]
                      properties:
                        id:
                          type: string
                        ok:
                          type: boolean
                        status:
                          type: string
                          description: The withdrawal's status after the review.
                        code:
                          type: string
                          description: The error code of a failed one.
                        message:
                          type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/{id}:
    get:
      operationId: getWithdrawal
      summary: A withdrawal with what its review needs
      description: |
        From wallet-service: the withdrawal, its address in the user's
        address book (when it was added, when its cooling-off ended) and
        the user's withdrawals' worth today and this month. Needs
        withdrawals.read.
      tags: [withdrawals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalDetail'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/withdrawals/{id}/hold:
    post:
      operationId: holdWithdrawal
      summary: Put a withdrawal in review on hold, or take it off hold
      description: |
        A held withdrawal stays in review with the reviewer's note (say,
        while the user is called) until it is taken off hold or decided;
        deciding it takes it off hold. Only a withdrawal in review
        (WALLET_WITHDRAWAL_NOT_IN_REVIEW otherwise). Audited by the wallet
        (wallet.withdrawal.hold, wallet.withdrawal.unhold). Needs
        withdrawals.review.
      tags: [withdrawals]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold]
              properties:
                hold:
                  type: boolean
                note:
                  type: string
                  minLength: 3
                  description: Required to put it on hold.
      responses:
        '200':
          description: The withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments:
    get:
      operationId: listInstruments
      summary: Assets (with networks), trading pairs and perpetual contracts
      description: |
        As instrument-service returns them (protobuf JSON with field names;
        int64 as strings). They change through the versioned reference-data
        file (exchangectl instruments apply, run by every deploy) and, since
        C3, through POST /admin/v1/instruments/apply. Needs instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The reference data.
          content:
            application/json:
              schema:
                type: object
                required: [assets, pairs, contracts]
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  pairs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pair'
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/config:
    get:
      operationId: getInstrumentConfig
      summary: The reference data as a config document
      description: |
        In the shape of deploy/instruments/<env>.json (what exchangectl
        instruments apply reads), statuses and versions included: what the
        console's forms start from. Needs instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentConfig'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/preview:
    post:
      operationId: previewInstrumentConfig
      summary: What a config document would change, changing nothing
      description: |
        The document names only the items to create or change, each whole
        (a field left out becomes empty). Items missing are left alone,
        statuses never change here (the status endpoints do that): a new
        pair or contract starts in PREPARE (ADMIN_NEW_ITEM_NOT_PREPARE for
        another status). A pair's
        new reference symbol must be listed on the reference market's spot
        market (ADMIN_REFERENCE_UNKNOWN otherwise: it would fail the
        reference reads of every pair); clearing the reference symbol of a
        pair HOUSE quotes or a perpetual's index follows is refused
        (ADMIN_REFERENCE_IN_USE); `warnings` note what else follows.

        `guard` lists the trading parameters the document moves (fee rates,
        a pair's fee tier, reference symbol and multiplier, a contract's
        fee tier and risk ladder) with, for a ladder, the open positions it
        would liquidate (derivatives-service measures them as its margin
        monitor does). Such a document is applied only by an ADMIN bringing
        back `guard.confirmation` (bound to them and to exactly these
        changes, valid 10 minutes), and then waits (see apply). Needs
        instruments.write.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: '#/components/schemas/InstrumentConfigPatch'
      responses:
        '200':
          description: The changes it would make.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConfigResult'
                  - type: object
                    required: [guard]
                    properties:
                      guard:
                        $ref: '#/components/schemas/ChangeGuard'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/apply:
    post:
      operationId: applyInstrumentConfig
      summary: Apply a config document
      description: |
        As POST /admin/v1/instruments/preview, then applied in one
        transaction by instrument-service (source CONSOLE in its history,
        each change versioned and published). The deploy's sync of the
        reference-data file keeps what the console changed last (exchangectl
        instruments apply --force overrides). Audited
        (admin.instruments.applied). Needs instruments.write.

        A document moving trading parameters (design 2026-10-02 §2 item 6)
        needs instruments.trading (ADMIN) and the preview's confirmation
        (ADMIN_CONFIRMATION_REQUIRED without it, with `reason` expired or
        changed when it no longer holds): it answers 202 with the change,
        which takes effect the settings' change_delay_seconds later, or,
        while admin.two_person_approval is on, that long after a second
        ADMIN approved it (POST /admin/v1/instruments/changes/{id}/decide);
        audited as admin.instruments.change_requested. New items touch
        nobody until opened and apply at once.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, reason]
              properties:
                config:
                  $ref: '#/components/schemas/InstrumentConfigPatch'
                reason:
                  type: string
                  minLength: 3
                confirmation:
                  type: string
                  description: The preview's guard.confirmation.token, for a document moving trading parameters.
      responses:
        '200':
          description: The changes made.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConfigResult'
                  - type: object
                    required: [change]
                    properties:
                      change:
                        type: 'null'
        '202':
          description: The changes confirmed, waiting.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ConfigResult'
                  - type: object
                    required: [change]
                    properties:
                      change:
                        $ref: '#/components/schemas/InstrumentChange'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles:
    get:
      operationId: listArticles
      summary: A section's announcements or help articles, every status
      description: |
        Kept by notification-service and read by the sites through GET
        /v1/announcements and /v1/help once published (design 2026-10-02
        §4.5). Every administrator reads them.
      tags: [content]
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [ANNOUNCEMENT, HELP]
      responses:
        '200':
          description: The articles.
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createArticle
      summary: Write a draft
      description: |
        Chinese (zh-CN) title and Markdown body required, English
        optional; the slug is unique in its section
        (NOTIFY_ARTICLE_EXISTS). Audited as admin.content.created on
        <section>:<slug>. Needs content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArticleWrite'
                - type: object
                  required: [section, reason]
                  properties:
                    section:
                      type: string
                      enum: [ANNOUNCEMENT, HELP]
                    reason:
                      type: string
                      minLength: 3
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles/{id}:
    get:
      operationId: getArticle
      summary: An article with every text
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateArticle
      summary: Rewrite an article
      description: |
        At the version read (COMMON_CONFLICT when someone saved it
        meanwhile); its status stays: a published article changes on the
        sites within a minute. Audited as admin.content.updated. Needs
        content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ArticleWrite'
                - type: object
                  required: [version, reason]
                  properties:
                    version:
                      type: integer
                    reason:
                      type: string
                      minLength: 3
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles/{id}/publish:
    post:
      operationId: publishArticle
      summary: Publish an article, now or at a time
      description: |
        The sites show it from publish_at on (now when left out). Audited
        as admin.content.published. Needs content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                publish_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/articles/{id}/archive:
    post:
      operationId: archiveArticle
      summary: Take an article off the sites
      description: It may be published again. Audited as admin.content.archived. Needs content.write.
      tags: [content]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ArticleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version:
                  type: integer
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentArticle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/broadcasts:
    get:
      operationId: listBroadcasts
      summary: The in-app messages sent, newest first
      description: With how many each reached and how many of them read it. Every administrator reads them.
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Broadcast'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: sendBroadcast
      summary: Send an in-app message to one user, a tag's users or everyone
      description: |
        notification-service delivers it in rounds, each user once in their
        language (Chinese without English), as a notice of type BROADCAST
        on the sites' inbox and pushed live; email also mails it. A tag's
        users are those tagged now (ADMIN_TAG_EMPTY when none, at most
        10,000). Audited as admin.notices.sent on broadcast:<id>. Needs
        notices.send.
      tags: [content]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, title, body, reason]
              properties:
                audience:
                  type: string
                  enum: [ALL, USER, TAG]
                user_id:
                  type: string
                  format: uuid
                  description: With USER.
                tag:
                  type: string
                  description: With TAG.
                title:
                  $ref: '#/components/schemas/LocalizedText'
                body:
                  $ref: '#/components/schemas/LocalizedText'
                link:
                  type: string
                  description: A path on the sites the message leads to, such as /assets.
                email:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '201':
          description: The message, being delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/broadcasts/{id}:
    get:
      operationId: getBroadcast
      summary: An in-app message sent, with its counts
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Broadcast'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim:
    get:
      operationId: getSim
      summary: The simulated market of the platform coin, as market-sim renders it
      description: |
        ASTRA design §6 (docs/runbook/market-sim.md): the target and the
        last price, the settings and their version, the guards' counts,
        the bots with their balances and errors, the running and queued
        events, the price band (anchor, where the makers quote, whether
        they walk toward a target beyond the band), the watchdog and the
        perpetual. Needs reports.read.
      tags: [sim]
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimStatus'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/history:
    get:
      operationId: getSimHistory
      summary: The target and the last price every 10 seconds
      tags: [sim]
      parameters:
        - name: minutes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 1440
      responses:
        '200':
          description: The samples, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimSample'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/events:
    get:
      operationId: listSimEvents
      summary: The price events running and queued, or the latest of every status
      tags: [sim]
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimEvent'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createSimEvent
      summary: Create a price event
      description: |
        Needs sim.control and a reason. market-sim runs it (at once or at
        starts_at, at most 24 hours ahead) in the administrator's name;
        beyond one operator's share of price moves in an hour (30% at once,
        50% an hour) it becomes a request for a second administrator with
        sim.control (202, decided on the approvals), whose name market-sim
        then receives as the approver. 403 SIM_EVENTS_OFF while the flag
        sim.events is off; 400 beyond the hard caps.
      tags: [sim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SimEventWrite'
                - $ref: '#/components/schemas/Reason'
      responses:
        '201':
          description: The event.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: '#/components/schemas/SimEvent'
        '202':
          description: Beyond one operator's share; waiting for a second administrator.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/events/{id}/end:
    post:
      operationId: endSimEvent
      summary: Cancel a queued event or end a running one
      description: A HALT ends by resuming the pair and its perpetual. Needs sim.control.
      tags: [sim]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The event, ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimEvent'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/params:
    put:
      operationId: updateSimParams
      summary: Replace the simulated market's settings
      description: |
        Every field, as GET /admin/v1/sim shows them. Needs sim.control.
        Changes that move the price or the turnover beyond one operator's
        share become a request for a second administrator (202).
      tags: [sim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [params]
                  properties:
                    params:
                      $ref: '#/components/schemas/SimParams'
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The settings' new version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        '202':
          description: Waiting for a second administrator.
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/impact:
    post:
      operationId: simImpact
      summary: What a mark price would do to the simulated market's perpetual
      description: |
        ASTRA design §6.3: the open longs and shorts, the positions the
        margin monitor would take over at that price that it does not now
        (a cross account whole), their notional and accounts, and what they
        lack beyond their margin (the insurance fund's estimated share);
        HOUSE left out (derivatives-service's price impact). Changes
        nothing. Needs reports.read.
      tags: [sim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price:
                  $ref: '#/components/schemas/Decimal'
      responses:
        '200':
          description: The impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimImpact'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/token:
    get:
      operationId: getSimToken
      summary: Who holds the simulated market's coin
      description: |
        The coin (the base of market-sim's pair, ASTRA) as the ledger's
        lines hold it (the read model, a few seconds behind): the bots
        (market-sim's list) and the other users with how many of each hold
        some, the platform's system accounts, what manual adjustments
        issued (the ADJUSTMENT account's debit) and the 20 largest holders.
        Needs reports.read.
      tags: [sim]
      responses:
        '200':
          description: The holdings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimToken'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/sim/mint:
    post:
      operationId: mintSimBots
      summary: More of the coin or USDT for the bots
      description: |
        A fund operation of kind SIM_MINT (ASTRA design §4; no transfers
        between bots, the pool grows by audited adjustments): the amount
        split evenly, to two decimal places, over the bots (of one role, or
        every one), the first taking the rounding; one manual adjustment of
        each bot's SPOT account, keyed by the operation and the bot.
        Booked at once in single-person mode within the limits (EXECUTED,
        or FAILED with the ledger's refusal of the first bot), otherwise
        PENDING for a second administrator with ledger.adjust.approve;
        COMMON_UNAVAILABLE with the detail approval_id when the ledger does
        not answer. A refusal after some bots were booked answers the
        ledger's code with the details approval_id, bot, booked and of: the
        operation stays PENDING (counted in its requester's 24 hours) to be
        finished on the approvals page once the cause is fixed, its keys
        booking only the rest. At most 10,000,000 of the coin or 1,000,000
        USDT at once, whoever approves (422 ADMIN_SIM_MINT_CAP, details
        asset and max). Needs ledger.adjust.request.
      tags: [sim, ledger]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, reason]
              properties:
                asset:
                  type: string
                  description: The coin or USDT.
                  examples: [ASTRA]
                amount:
                  description: In all, positive.
                  $ref: '#/components/schemas/Decimal'
                role:
                  type: string
                  enum: [MAKER, TAKER, TREND, EXECUTOR]
                  description: Only the bots of this role; every bot when absent.
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
      responses:
        '201':
          description: The operation (payload bots lists each bot's share as JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/assets/{code}/profile:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9]{2,10}$'
    get:
      operationId: getAssetProfile
      summary: An asset's profile, as the sites show it
      description: |
        The name, introductions, links and logo the sites show for an
        asset beyond its code (ASTRA design §5.3; instrument-service keeps
        it). The logo is at logo_url, a path the console's domain also
        serves. Needs instruments.read.
      tags: [instruments]
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetProfile'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateAssetProfile
      summary: Replace an asset's profile
      description: |
        The text replaces the old (an empty display name shows the asset's
        name); logo (base64, with logo_mime: PNG, SVG or WebP, square, at
        most 200 KB; an SVG is rebuilt from an allow list of elements)
        replaces the logo, clear_logo removes it, neither keeps it. The
        sites show it within a minute: a new logo gets a new URL. Audited
        as admin.instruments.profile_updated on asset:<code>, the logo by
        its type and size. Needs instruments.write.
      tags: [instruments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetProfileWrite'
                - $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The profile, its version moved on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetProfile'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/changes:
    get:
      operationId: listInstrumentChanges
      summary: The changes of trading parameters, newest first
      description: |
        Waiting for a second ADMIN (PENDING_APPROVAL) or their time
        (SCHEDULED), applied, canceled, rejected or failed (the target
        moved since it was confirmed). Needs instruments.read.
      tags: [instruments]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_APPROVAL, SCHEDULED, APPLIED, CANCELED, REJECTED, FAILED]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstrumentChange'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/changes/{id}/decide:
    post:
      operationId: decideInstrumentChange
      summary: Approve or reject a change waiting for a second ADMIN
      description: |
        Approved, it takes effect change_delay_seconds later; not by its
        requester (ADMIN_SELF_APPROVAL, who cancels instead);
        ADMIN_CHANGE_CLOSED once decided. Audited as
        admin.instruments.change_approved or change_rejected. Needs
        instruments.trading.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ChangeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentChange'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/changes/{id}/cancel:
    post:
      operationId: cancelInstrumentChange
      summary: Cancel a change before it takes effect
      description: |
        Any ADMIN, its requester included; ADMIN_CHANGE_CLOSED once it took
        effect or was closed. Audited as admin.instruments.change_canceled.
        Needs instruments.trading.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ChangeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentChange'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/pairs/{symbol}/status/preview:
    post:
      operationId: previewPairStatus
      summary: What moving a trading pair to another status does
      description: |
        A halt takes effect at once (`immediate`, the emergency brake);
        anything else is a change of trading parameters: the answer carries
        the confirmation POST .../status brings back, and how long the
        change will wait. INSTRUMENT_STATUS_TRANSITION_INVALID for a move
        the state machine forbids. Needs instruments.trading.
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
      responses:
        '200':
          description: The move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/instruments/pairs/{symbol}/status:
    post:
      operationId: setPairStatus
      summary: Move a trading pair to another status (the per-pair emergency switch)
      description: |
        PREPARE → TRADING ⇄ HALT; TRADING or HALT → CANCEL_ONLY →
        DELISTED (CANCEL_ONLY is the way out: it cannot return to
        trading). Fails with INSTRUMENT_STATUS_TRANSITION_INVALID
        otherwise. A halt takes effect at once (200); any other move needs
        the preview's confirmation (POST .../status/preview) and answers
        202 with the change that waits (see POST
        /admin/v1/instruments/apply). Needs instruments.trading (ADMIN).
      tags: [instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Symbol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Halted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '202':
          description: The change confirmed, waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/flags:
    get:
      operationId: listFlags
      summary: Feature flags (requirements §5.14)
      description: Every flag the platform knows; one never set is off, with version 0. Needs flags.read.
      tags: [flags]
      responses:
        '200':
          description: The flags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flag'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/flags/{key}:
    put:
      operationId: switchFlag
      summary: Turn a flag on or off
      description: |
        Keeps the flag's rules (regions, statuses, allow lists); services
        pick the change up within 5 seconds. Fails with COMMON_NOT_FOUND
        for a key the platform does not define. Needs flags.write.
      tags: [flags]
      security:
        - session: []
          csrf: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            examples: [wallet.withdraw]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, reason]
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The flag after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/adjustments:
    post:
      operationId: requestAdjustment
      summary: Request a manual adjustment of a user's balance
      description: |
        Creates a PENDING request for another administrator with
        ledger.adjust.approve (escalation REQUESTED), unless `direct` asks
        to carry it out at once, which works as POST
        /admin/v1/users/{id}/adjustments. A positive amount credits the
        user's SPOT (or FUTURES) account against the ADJUSTMENT system
        account, a negative one debits it. Needs ledger.adjust.request.
      tags: [ledger]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, asset, amount, reason]
              properties:
                user_id:
                  type: string
                  format: uuid
                account_type:
                  type: string
                  enum: [SPOT, FUTURES]
                  default: SPOT
                asset:
                  type: string
                  examples: [USDT]
                amount:
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                direct:
                  type: boolean
                  default: false
                  description: Carry it out at once when single-person mode and its limits allow.
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/approvals:
    get:
      operationId: listApprovals
      summary: Fund operations, newest first
      description: Two-person requests and single-person operations. Needs ledger.adjust.request or audit.read.
      tags: [ledger]
      parameters:
        - name: status
          in: query
          description: Empty for all.
          schema:
            type: string
            enum: [PENDING, EXECUTED, REJECTED, FAILED]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Approval'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/approvals/{id}/decide:
    post:
      operationId: decideApproval
      summary: Approve (and book) or reject a pending fund operation
      description: |
        Approving one's own request fails with ADMIN_SELF_APPROVAL, except
        a single-person operation whose outcome was unknown (its requester
        finishes it); rejecting one's own request withdraws it. A decided
        one fails with ADMIN_APPROVAL_DECIDED. Approving books the
        operation with the idempotency key approval:<id>: EXECUTED with
        the journal, or FAILED when the ledger refuses (for instance
        LEDGER_ADJUSTMENT_DISABLED while the flag ledger.manual_adjustment
        is off). When the ledger cannot be reached the request stays
        PENDING and can be approved again. Needs ledger.adjust.approve.
      tags: [ledger]
      security:
        - session: []
          csrf: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve, reason]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  minLength: 3
      responses:
        '200':
          description: The decided request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/audit-logs:
    get:
      operationId: searchAuditLogs
      summary: The audit trail, newest first
      description: |
        From ClickHouse audit_logs, which lags the change by a few seconds.
        Needs audit.read.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          description: Exact actor, e.g. an administrator's email or cli:ubuntu.
          schema:
            type: string
        - name: target
          in: query
          description: Exact target, e.g. user:<id>, pair:BTC-USDT, flag:wallet.withdraw.
          schema:
            type: string
        - name: event_type
          in: query
          description: Exact event type, e.g. exchange.audit.v1.AdminAction.
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/audit-logs/export:
    get:
      operationId: exportAuditLogs
      summary: The audit entries matching the filters, as CSV
      description: |
        The search's filters, newest first, at most 10,000 rows; the header
        X-Truncated is true when more were left out (narrow the time
        range). UTF-8 with a byte order mark, so spreadsheets read Chinese;
        columns occurred_at, event_type, actor, target, action, reason,
        details, event_id (action, reason and details are the
        administrator action's, or a configuration change's old and new
        values). The export is itself audited as admin.audit.exported.
        Needs audit.read.
      tags: [audit]
      parameters:
        - name: actor
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: The CSV file (Content-Disposition attachment).
          headers:
            X-Truncated:
              description: More entries matched than were exported.
              schema:
                type: string
                enum: ['true', 'false']
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/trading:
    get:
      operationId: tradingReport
      summary: Trades and orders per symbol and day, week or month (UTC), newest first
      description: |
        From the ClickHouse read models (trades, order_updates), which lag
        the services by a few seconds. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TradingDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/wallet:
    get:
      operationId: walletReport
      summary: Credited deposits and confirmed withdrawals per asset and day, week or month (UTC)
      description: |
        Deposits booked to users (not the unclaimed ones) by the day they
        were credited; withdrawals by the day they were confirmed. Needs
        reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/candles:
    get:
      operationId: candleReport
      summary: Candles of a symbol from the trades read model, newest first
      description: Intervals are aligned to the epoch in UTC. Needs reports.read.
      tags: [reports]
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            examples: [BTC-USDT]
        - name: interval
          in: query
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h, 1d]
            default: 1h
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 48
      responses:
        '200':
          description: The candles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candle'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/derivatives:
    get:
      operationId: derivativesReport
      summary: Each perpetual contract's trading, funding and liquidations per day, week or month (UTC)
      description: |
        From the ClickHouse contract read models (derivatives_fills,
        derivatives_funding, derivatives_liquidations): settled fills and
        their fees and results, the funding the positions paid and
        received at the day's settlements, the positions taken over, the
        auto-deleveraged counterparties and what the insurance fund paid.
        Needs reports.read.
      tags: [reports, derivatives]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The days.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DerivativesDay'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/open-interest:
    get:
      operationId: openInterestReport
      summary: Each contract's open positions from the positions read model
      description: |
        The latest position snapshots (derivatives_positions); a few
        seconds behind derivatives-service. Needs reports.read.
      tags: [reports, derivatives]
      responses:
        '200':
          description: The contracts with open positions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenInterest'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/users:
    get:
      operationId: usersReport
      summary: The users' activity per day, week or month (UTC), oldest first
      description: |
        Per bucket: the accounts registered and signed in (the auth
        events), those trading (either side of a spot trade, or a
        contract fill) and those with a deposit credited, each counted
        once; total is every account registered by the bucket's end.
        HOUSE and the simulated market's bots are left out (partial names
        "bots" when market-sim could not say which they are). Every bucket
        of the period comes, empty ones too. Needs reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items, partial]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsersBucket'
                  partial:
                    type: array
                    items:
                      type: string
                      enum: [bots]
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/reports/house-pnl:
    get:
      operationId: housePnLReport
      summary: HOUSE's result per day, week or month (UTC) in USDT, oldest first
      description: |
        Spot (ADR-0013, ADR-0015): HOUSE's trading valued day by day, the
        quote it got less paid plus the base it holds from trading at each
        pair's last price that day, in USDT at the last price of the quote
        asset's USDT pair; spot_pnl is its change over the bucket and
        spot_result its level since HOUSE began, at the bucket's end. A
        pair without a price when one is needed is left out of every day
        (unpriced). Contracts: the realized results of HOUSE's fills less
        their fees, and the funding it got (negative when it paid). total
        sums the three; cumulative runs over the period. Needs
        reports.read.
      tags: [reports]
      parameters:
        - $ref: '#/components/parameters/Days'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucket'
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                type: object
                required: [items, unpriced]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HousePnLBucket'
                  unpriced:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts:
    get:
      operationId: listContractStates
      summary: Each perpetual contract's status, reduce-only state, mark price and open interest
      description: |
        Live from derivatives-service. A contract goes reduce-only by
        itself when its index or mark price fails (requirements §11.7:
        risk.events SystemDegraded); only a person lifts it. Needs
        derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The contracts.
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractState'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/status:
    post:
      operationId: setContractStatus
      summary: Move a perpetual contract to another status
      description: |
        The same transitions as trading pairs (PREPARE → TRADING ⇄ HALT;
        TRADING or HALT → CANCEL_ONLY → DELISTED) and the same guard: a
        halt at once (200), any other move confirmed from its preview and
        waiting (202); instrument-service records it. Needs
        instruments.trading (ADMIN).
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Halted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '202':
          description: The change confirmed, waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/status/preview:
    post:
      operationId: previewContractStatus
      summary: What moving a perpetual contract to another status does
      description: As POST /admin/v1/instruments/pairs/{symbol}/status/preview. Needs instruments.trading.
      tags: [derivatives, instruments]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
      responses:
        '200':
          description: The move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPreview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/contracts/{symbol}/lift-reduce-only:
    post:
      operationId: liftReduceOnly
      summary: End a contract's reduce-only once its prices are sound again
      description: |
        lifted is false when the contract was not reduce-only. Check the
        mark price first: a contract whose mark is still stale degrades
        again within seconds. Needs derivatives.write.
      tags: [derivatives]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/Contract'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                required: [symbol, lifted]
                properties:
                  symbol:
                    type: string
                  lifted:
                    type: boolean
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/risk:
    get:
      operationId: listRiskPositions
      summary: Positions warned, taken over by the liquidation engine or close to it
      description: |
        Live from derivatives-service: positions taken over, warned
        (margin balance at most 1.2 × maintenance margin) or with a margin
        ratio of at least 0.5, riskiest first. Cross positions are
        measured on their own here. Needs derivatives.read.
      tags: [derivatives]
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskPosition'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/liquidations:
    get:
      operationId: listLiquidations
      summary: Liquidation steps, newest first
      description: From the ClickHouse read model derivatives_liquidations. Needs derivatives.read.
      tags: [derivatives]
      parameters:
        - $ref: '#/components/parameters/Days'
        - name: kind
          in: query
          description: Empty for all.
          schema:
            type: string
            enum: [WARNING, STARTED, FILLED, ADL]
        - name: symbol
          in: query
          description: One contract (BTC-USDT-PERP).
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: A page of steps.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LiquidationStep'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/positions:
    get:
      operationId: listPositions
      summary: Every user's open contract positions, riskiest first
      description: |
        From derivatives-service, valued at the mark price: highest margin
        ratio (maintenance margin / margin balance) first, then the
        largest. Cross positions are measured on their own; their
        liquidation price is on the user's page. At most `limit` (500)
        positions; `truncated` says there are more. Needs derivatives.read.
      tags: [derivatives]
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/UserFilter'
        - name: watch
          in: query
          description: true for the positions under watch only (warned, taken over, margin ratio ≥ 0.5).
          schema:
            type: string
            enum: ['true']
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: The positions.
          content:
            application/json:
              schema:
                type: object
                required: [positions, truncated, house_user_id]
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskPosition'
                  truncated:
                    type: boolean
                  house_user_id:
                    type: [string, 'null']
                    description: HOUSE's account on the contracts (its positions are the counterparty of users').
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-fund:
    get:
      operationId: getInsuranceFund
      summary: The insurance fund's balance
      description: |
        The ledger's INSURANCE_FUND system account, with PNL_CLEARING (the
        open positions' unsettled results, which may be negative). Needs
        derivatives.read.
      tags: [derivatives]
      parameters:
        - name: asset
          in: query
          schema:
            type: string
            default: USDT
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceFund'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/derivatives/insurance-fund/contributions:
    post:
      operationId: requestInsuranceFunding
      summary: Contribute simulated funds to the insurance fund
      description: |
        Creates a PENDING INSURANCE_FUND request for another administrator
        with ledger.adjust.approve, or with `direct` carries it out at once
        when single-person mode and its limits allow (as POST
        /admin/v1/users/{id}/adjustments does for an adjustment); booking
        it (ledger FundInsurance, INSURANCE_CONTRIBUTION from ADJUSTMENT)
        needs the flag ledger.manual_adjustment. Needs
        ledger.adjust.request.
      tags: [derivatives, ledger]
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                asset:
                  type: string
                  default: USDT
                amount:
                  description: Positive.
                  $ref: '#/components/schemas/Decimal'
                reason:
                  type: string
                  minLength: 3
                reference:
                  type: string
                  maxLength: 64
                direct:
                  type: boolean
                  default: false
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/house:
    get:
      operationId: getHouse
      summary: HOUSE's book (virtual liquidity, ADR-0013 and ADR-0015)
      description: |
        HOUSE's spot inventory (the ledger's MARKET_MAKER accounts) valued
        at the last prices, what it traded per pair (the trades read model)
        and its result at those prices, and its perpetual contract
        positions (the account HOUSE_USER_ID). Internal assets go below
        zero when HOUSE sold them short. A part that cannot be read is left
        empty and named in `partial`. Needs reports.read.
      tags: [reports]
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/health:
    get:
      operationId: getHealth
      summary: Every service's readiness
      description: |
        Asks each service's ops endpoint (/readyz) within 2 seconds; with
        details=true also reads its metrics (its version, its Kafka
        consumers' lag and the records they parked in a DLQ since it
        started) and the reference feed's state: the system health page.
        Needs reports.read.
      tags: [reports]
      parameters:
        - name: details
          in: query
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: The services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceHealth'
                  feed:
                    description: With details; left out when market-data-service could not be asked.
                    $ref: '#/components/schemas/FeedStatus'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/system-balances:
    get:
      operationId: getSystemBalances
      summary: The platform's system accounts
      description: |
        FEE_REVENUE, INSURANCE_FUND, MARKET_MAKER (HOUSE), PNL_CLEARING,
        ADJUSTMENT, DEPOSIT_PENDING and the rest, in one asset or all.
        Needs reports.read.
      tags: [ledger]
      parameters:
        - name: asset
          in: query
          description: One asset; every asset when empty.
          schema:
            type: string
      responses:
        '200':
          description: The accounts by type and asset.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items:
                      type: object
                      required: [account_type, asset, available, frozen]
                      properties:
                        account_type:
                          type: string
                        asset:
                          type: string
                        available:
                          $ref: '#/components/schemas/Decimal'
                        frozen:
                          $ref: '#/components/schemas/Decimal'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/ledger/reconciliation:
    get:
      operationId: getReconciliation
      summary: The ledger's invariant checks
      description: |
        The latest run of every check of the ledger's reconciliation (hourly,
        requirements §11.4) and the last 50 runs that found mismatches, with
        the first ten mismatches of each. Needs reports.read.
      tags: [ledger]
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [latest, failures]
                properties:
                  latest:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
                  failures:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationRun'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody:
    get:
      operationId: getCustody
      summary: The custody wallet (ADR-0011)
      description: |
        The custodian's coins with their balances as it reports them now,
        matched to the networks that use them; the latest chain check of
        each holder and asset (the custodian and the platform's own
        wallets: held, expected by the ledger, held elsewhere, on its way
        out, unbooked fees, shortfall); the withdrawals with the custodian;
        and how many callbacks need a person. Without a configured
        custodian `configured` is false; an unreachable one leaves `coins`
        empty and says why in `error`. Needs withdrawals.read.
      tags: [custody]
      responses:
        '200':
          description: The custody wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyOverview'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks:
    get:
      operationId: listCustodyCallbacks
      summary: The custodian's callbacks, newest first
      description: Every callback as received, with its signature check and outcome. Needs withdrawals.read.
      tags: [custody]
      parameters:
        - name: result
          in: query
          description: One outcome; every outcome when empty.
          schema:
            type: string
            enum: [RECEIVED, APPLIED, IGNORED, UNMATCHED, REJECTED, FAILED, DISCREPANCY]
        - name: kind
          in: query
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAWAL]
        - name: q
          in: query
          description: A trade ID, withdrawal ID (businessId), transaction hash or address.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of callbacks.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustodyCallback'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks/{id}:
    get:
      operationId: getCustodyCallback
      summary: One callback with the request as received
      description: Needs withdrawals.read.
      tags: [custody]
      parameters:
        - $ref: '#/components/parameters/CallbackID'
      responses:
        '200':
          description: The callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyCallback'
        default:
          $ref: '#/components/responses/Error'
  /admin/v1/custody/callbacks/{id}/replay:
    post:
      operationId: replayCustodyCallback
      summary: Apply a stored callback again
      description: |
        For a verified callback that FAILED, stayed UNMATCHED or RECEIVED:
        its signature is checked again (not its age) and it is applied as
        if it had just arrived, which is harmless for one already applied.
        Audited. Needs withdrawals.review.
      tags: [custody]
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/CallbackID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
      responses:
        '200':
          description: The callback after the replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyCallback'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: admin_session
    csrf:
      type: apiKey
      in: header
      name: X-Admin-CSRF
      description: The value "1" on every request other than GET; a cross-site form cannot set it.
  parameters:
    CallbackID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: The previous page's next_cursor; omitted for the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    From:
      name: from
      in: query
      description: From this time on (RFC 3339).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Before this time (RFC 3339).
      schema:
        type: string
        format: date-time
    UserFilter:
      name: user_id
      in: query
      schema:
        type: string
        format: uuid
    Accounts:
      name: accounts
      in: query
      description: >-
        Keeps the simulated market's bots (bots) or everyone else (users); all when absent. Needs market-sim's list of
        bots (503 COMMON_UNAVAILABLE without it); without the filter the rows are only marked, and stay unmarked while
        market-sim does not answer.
      schema:
        type: string
        enum: [bots, users]
    Days:
      name: days
      in: query
      description: Days back, today included.
      schema:
        type: integer
        minimum: 1
        maximum: 90
        default: 7
    ReportFrom:
      name: from
      in: query
      description: |
        The period's first day (UTC), instead of days; to defaults to
        today. At most a year by day, three years by week or month.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: The period's last day (UTC), included; needs from.
      schema:
        type: string
        format: date
    ReportBucket:
      name: bucket
      in: query
      description: The rows' span; a row's day is its bucket's first (a week starts on Monday).
      schema:
        type: string
        enum: [day, week, month]
        default: day
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderID:
      name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Contract:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        examples: [BTC-USDT-PERP]
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        examples: [BTC-USDT]
    ChangeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      $ref: '../openapi/common.yaml#/components/responses/Error'
  schemas:
    House:
      type: object
      required: [assets, pairs, contracts, totals, partial]
      properties:
        assets:
          type: array
          items:
            type: object
            required: [asset, backed, balance, price, value_usdt]
            properties:
              asset:
                type: string
              backed:
                type: boolean
                description: The asset has deposits or withdrawals; HOUSE must hold it to sell it.
              balance:
                $ref: '#/components/schemas/Decimal'
              price:
                description: USDT per unit (the last price of its USDT pair); null without one.
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
              value_usdt:
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
        pairs:
          type: array
          items:
            type: object
            required: [symbol, trades, bought_base, sold_base, paid_quote, got_quote, last_at, net_base, net_quote, price, pnl_usdt]
            properties:
              symbol:
                type: string
              trades:
                type: integer
              bought_base:
                $ref: '#/components/schemas/Decimal'
              sold_base:
                $ref: '#/components/schemas/Decimal'
              paid_quote:
                $ref: '#/components/schemas/Decimal'
              got_quote:
                $ref: '#/components/schemas/Decimal'
              last_at:
                type: string
                format: date-time
              net_base:
                description: Bought less sold.
                $ref: '#/components/schemas/Decimal'
              net_quote:
                description: Got less paid.
                $ref: '#/components/schemas/Decimal'
              price:
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
              pnl_usdt:
                description: net_base at the last price plus net_quote (USDT pairs); null without a price.
                oneOf:
                  - $ref: '#/components/schemas/Decimal'
                  - type: 'null'
        contracts:
          type: array
          description: HOUSE's open positions as derivatives-service renders a user's positions.
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          required: [inventory_usdt, backed_usdt, internal_usdt, pnl_usdt]
          properties:
            inventory_usdt:
              $ref: '#/components/schemas/Decimal'
            backed_usdt:
              $ref: '#/components/schemas/Decimal'
            internal_usdt:
              description: Below zero while HOUSE is short on internal assets.
              $ref: '#/components/schemas/Decimal'
            pnl_usdt:
              $ref: '#/components/schemas/Decimal'
        partial:
          type: array
          items:
            type: string
            enum: [prices, assets, inventory, trades, contracts]
    ServiceHealth:
      type: object
      required: [service, ready, latency_ms]
      properties:
        service:
          type: string
        ready:
          type: boolean
        latency_ms:
          type: integer
        error:
          type: string
        version:
          type: string
          description: With details; the commit the service was built from.
        kafka_lag:
          type: integer
          description: With details, for a service with Kafka consumers; records behind, summed over its consumers.
        dlq:
          type: integer
          description: With details, for a service with Kafka consumers; records parked in a DLQ since it started.
    ReconciliationRun:
      type: object
      required: [check, started_at, mismatches, details]
      properties:
        check:
          type: string
          examples: [JOURNAL_BALANCED]
        started_at:
          type: string
          format: date-time
        mismatches:
          type: integer
        details:
          type: array
          description: The first ten mismatches.
          items:
            type: object
            required: [key, detail]
            properties:
              key:
                type: string
              detail:
                type: string
    NextCursor:
      type: [string, 'null']
      description: Pass as cursor for the next page; null on the last.
    UserSummary:
      type: object
      required: [id, status, region, language, kyc_level, created_at, tags]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
        region:
          type: string
        language:
          type: string
        timezone:
          type: string
          description: An IANA zone; empty for the browser's.
        kyc_level:
          type: integer
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          description: The console's tags on the account.
          items:
            type: string
    Note:
      type: object
      required: [id, body, admin_id, admin_email, created_at]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        admin_id:
          type: string
          format: uuid
        admin_email:
          type: string
        created_at:
          type: string
          format: date-time
    Order:
      type: object
      required: [order_id, client_order_id, user_id, symbol, side, type, time_in_force, price, quantity, quote_amount, status,
        filled_quantity, filled_quote, reason, created_at, updated_at, bot]
      properties:
        order_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        user_id:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL, '']
          description: Empty for an order the trading service refused before it was accepted (its rejection carries no side or type).
        type:
          type: string
          examples: [LIMIT, MARKET]
        time_in_force:
          type: string
        price:
          $ref: '#/components/schemas/NullableDecimal'
        quantity:
          $ref: '#/components/schemas/NullableDecimal'
        quote_amount:
          $ref: '#/components/schemas/NullableDecimal'
        status:
          type: string
        filled_quantity:
          $ref: '#/components/schemas/Decimal'
        filled_quote:
          $ref: '#/components/schemas/Decimal'
        reason:
          type: string
          description: Why it was canceled or rejected; empty otherwise.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        bot:
          type: boolean
          description: A simulated market's bot placed it (false while market-sim does not answer).
    Trade:
      type: object
      required: [trade_id, symbol, trade_number, price, quantity, quote_quantity, taker_side, buyer_user_id, buyer_order_id,
        seller_user_id, seller_order_id, buyer_is_maker, buyer_fee, seller_fee, executed_at, buyer_bot, seller_bot]
      properties:
        trade_id:
          type: string
          format: uuid
        symbol:
          type: string
        trade_number:
          type: integer
          format: int64
        price:
          $ref: '#/components/schemas/Decimal'
        quantity:
          $ref: '#/components/schemas/Decimal'
        quote_quantity:
          $ref: '#/components/schemas/Decimal'
        taker_side:
          type: string
          enum: [BUY, SELL]
        buyer_user_id:
          type: string
        buyer_order_id:
          type: string
        seller_user_id:
          type: string
        seller_order_id:
          type: string
        buyer_is_maker:
          type: boolean
        buyer_fee:
          $ref: '#/components/schemas/Decimal'
        seller_fee:
          $ref: '#/components/schemas/Decimal'
        executed_at:
          type: string
          format: date-time
        house_side:
          type: string
          enum: ['', BUY, SELL]
          description: The side HOUSE took (its virtual liquidity, ADR-0015); empty between users.
        buyer_bot:
          type: boolean
          description: The buyer is a simulated market's bot (false while market-sim does not answer).
        seller_bot:
          type: boolean
          description: The seller is a simulated market's bot.
    Deposit:
      type: object
      required: [deposit_id, user_id, asset, network, kind, address, tx_hash, amount, status, unclaimed, reason, confirmations,
        required_confirmations, updated_at]
      properties:
        deposit_id:
          type: string
          format: uuid
        user_id:
          type: string
          description: Empty for a deposit to no known address.
        asset:
          type: string
        network:
          type: string
        kind:
          type: string
          examples: [CHAIN, INTERNAL]
        address:
          type: string
        tx_hash:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        status:
          type: string
        unclaimed:
          type: boolean
        reason:
          type: string
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        updated_at:
          type: string
          format: date-time
    FeedStatus:
      type: object
      description: The reference feed (market-data-service).
      required: [state, received_at, followed, halted]
      properties:
        state:
          type: string
          enum: [OFF, OK, DELAYED, DOWN]
        received_at:
          type: [string, 'null']
          format: date-time
        followed:
          type: array
          items:
            type: string
        halted:
          type: array
          description: Pairs halted because the feed was lost (market.halt_on_feed_loss).
          items:
            type: object
            required: [symbol, halted_at]
            properties:
              symbol:
                type: string
              halted_at:
                type: string
                format: date-time
    Dashboard:
      type: object
      required: [users, trading, wallet, risk, feed, series, partial]
      properties:
        users:
          type: object
          required: [total, new_24h]
          properties:
            total:
              type: integer
              format: int64
            new_24h:
              type: integer
              format: int64
        trading:
          type: object
          required: [trades_24h, active_traders_24h, turnover_24h]
          properties:
            trades_24h:
              type: integer
              format: int64
            active_traders_24h:
              type: integer
              format: int64
            turnover_24h:
              type: array
              items:
                type: object
                required: [quote_asset, amount]
                properties:
                  quote_asset:
                    type: string
                  amount:
                    $ref: '#/components/schemas/Decimal'
        wallet:
          type: object
          required: [pending_deposits, pending_withdrawals]
          properties:
            pending_deposits:
              type: integer
              format: int64
              description: Deposits detected or confirming.
            pending_withdrawals:
              type: integer
              format: int64
              description: Withdrawals waiting for review.
        risk:
          type: object
          required: [events_24h]
          properties:
            events_24h:
              type: integer
              format: int64
        feed:
          description: The reference feed; null when market-data-service could not be asked.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/FeedStatus'
        series:
          type: array
          description: One per UTC day, oldest first.
          items:
            type: object
            required: [day, new_users, trades, turnover_usdt]
            properties:
              day:
                type: string
                format: date
              new_users:
                type: integer
                format: int64
              trades:
                type: integer
                format: int64
              turnover_usdt:
                $ref: '#/components/schemas/Decimal'
        partial:
          type: array
          description: The parts that could not be read (users, activity, feed).
          items:
            type: string
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      examples: ['12.5']
    SimParams:
      type: object
      description: The model's and the bots' settings by name (numbers; docs/runbook/market-sim.md「设置」).
      additionalProperties:
        type: number
    SimStatus:
      type: object
      required: [symbol, enabled, running, target_price, last_price, references_fresh, params, version, guards, bots, events, perp,
        perp_running, anchor_price, price_band, quote_center, walking, band_distance, last_trade_at, watchdog, at]
      properties:
        symbol:
          type: string
        enabled:
          type: boolean
        running:
          type: boolean
        target_price:
          type: [string, 'null']
        last_price:
          type: [string, 'null']
        references_fresh:
          type: boolean
        params:
          $ref: '#/components/schemas/SimParams'
        version:
          type: integer
        guards:
          type: object
          additionalProperties:
            type: integer
        bots:
          type: array
          items:
            $ref: '#/components/schemas/SimBot'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SimEvent'
        perp:
          type: string
          description: The perpetual on the coin; empty without one.
        perp_running:
          type: boolean
        anchor_price:
          type: [string, 'null']
        price_band:
          type: string
        quote_center:
          type: [string, 'null']
        walking:
          type: boolean
        band_distance:
          type: [number, 'null']
          description: The target's distance from the anchor in bands (within ±1 inside the band).
        last_trade_at:
          type: [string, 'null']
          format: date-time
        watchdog:
          type: object
          required: [fired, last_at]
          properties:
            fired:
              type: integer
            last_at:
              type: [string, 'null']
              format: date-time
        at:
          type: [string, 'null']
          format: date-time
    SimBot:
      type: object
      required: [user_id, role, label, enabled, balances_known, usdt, coin, perp_position, futures_usdt, error, error_at, retry_at]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [MAKER, TAKER, TREND, EXECUTOR]
        label:
          type: string
        enabled:
          type: boolean
        balances_known:
          type: boolean
        usdt:
          type: string
        coin:
          type: string
        perp_position:
          type: string
        futures_usdt:
          type: string
        error:
          type: string
        error_at:
          type: [string, 'null']
          format: date-time
        retry_at:
          type: [string, 'null']
          format: date-time
    SimEvent:
      type: object
      required: [id, type, size, price, mu, factor, duration_seconds, hold_seconds, starts_at, status, created_by, approved_by, reason,
        created_at, started_at, ended_at, from_price, ended_by]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [JUMP, TARGET, TREND, VOLATILITY, PAUSE, HALT, REANCHOR]
        size:
          type: number
        price:
          type: [string, 'null']
        mu:
          type: number
        factor:
          type: number
        duration_seconds:
          type: integer
        hold_seconds:
          type: integer
        starts_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, RUNNING, DONE, CANCELED]
        created_by:
          type: string
        approved_by:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        from_price:
          type: [string, 'null']
        ended_by:
          type: string
    SimEventWrite:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [JUMP, TARGET, TREND, VOLATILITY, PAUSE, HALT, REANCHOR]
        size:
          type: number
          description: JUMP's move (0.1 is +10%).
        price:
          type: string
          description: TARGET's price.
        mu:
          type: number
          description: TREND's drift a day.
        factor:
          type: number
          description: VOLATILITY's factor.
        duration_seconds:
          type: integer
          minimum: 0
        hold_seconds:
          type: integer
          minimum: 0
        starts_at:
          type: string
          format: date-time
    SimSample:
      type: object
      required: [at, target_price, last_price]
      properties:
        at:
          type: string
          format: date-time
        target_price:
          type: string
        last_price:
          type: [string, 'null']
    SimImpact:
      type: object
      description: derivatives-service's price impact (the margin monitor's rules at the target), with the sides open now.
      required: [symbol, target_price, positions, longs, shorts, liquidated, notional, accounts, insurance_cost, unmeasured, examples]
      properties:
        symbol:
          type: string
        target_price:
          $ref: '#/components/schemas/Decimal'
        positions:
          type: integer
          description: The open positions, HOUSE's apart.
        longs:
          type: [integer, 'null']
          description: The open longs; null when the positions cannot all be read.
        shorts:
          type: [integer, 'null']
        liquidated:
          type: integer
          description: The positions the monitor would take over at the target that it does not now (a cross account whole).
        notional:
          $ref: '#/components/schemas/Decimal'
        accounts:
          type: integer
        insurance_cost:
          description: What the liquidated lack beyond their margin at the target, for the insurance fund.
          $ref: '#/components/schemas/Decimal'
        unmeasured:
          type: integer
          description: The positions left out for want of a fresh mark price now.
        examples:
          type: array
          description: The largest of the liquidated, 20 at most.
          items:
            type: object
            required: [user_id, symbol, position_side, cross, notional, margin_balance, maintenance_before, maintenance_after]
            properties:
              user_id:
                type: string
              symbol:
                type: string
              position_side:
                type: string
              cross:
                type: boolean
              notional:
                type: string
              margin_balance:
                type: string
              maintenance_before:
                type: string
              maintenance_after:
                type: string
    SimHolding:
      type: object
      required: [amount, holders]
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        holders:
          type: integer
          description: How many accounts hold some.
    SimToken:
      type: object
      required: [asset, price, bots, users, platform, issued, top, at]
      properties:
        asset:
          type: string
          examples: [ASTRA]
        price:
          description: The pair's last trade as market-sim reads it; null before the first.
          $ref: '#/components/schemas/NullableDecimal'
        bots:
          $ref: '#/components/schemas/SimHolding'
        users:
          description: Every other user (HOUSE included, when it holds the coin).
          $ref: '#/components/schemas/SimHolding'
        platform:
          type: array
          description: The system accounts holding some (fees and the like), ADJUSTMENT apart.
          items:
            type: object
            required: [account_type, amount]
            properties:
              account_type:
                type: string
                examples: [FEE_REVENUE]
              amount:
                $ref: '#/components/schemas/Decimal'
        issued:
          description: What manual adjustments issued (the ADJUSTMENT account's debit); the bots, users and platform hold it all.
          $ref: '#/components/schemas/Decimal'
        top:
          type: array
          description: The largest holders, largest first (20 at most).
          items:
            type: object
            required: [user_id, amount]
            properties:
              user_id:
                type: string
                format: uuid
              amount:
                $ref: '#/components/schemas/Decimal'
        at:
          type: string
          format: date-time
    AssetProfile:
      type: object
      required: [display_name, description, links, logo_mime, logo_size, logo_url, version]
      properties:
        display_name:
          type: string
          description: Replaces the asset's name on the sites when set.
        description:
          type: object
          description: Introductions by language (zh-CN, en), up to 1,000 characters each.
          additionalProperties:
            type: string
        links:
          type: object
          description: https URLs by kind (website, explorer, whitepaper).
          additionalProperties:
            type: string
        logo_mime:
          type: string
          description: image/png, image/svg+xml or image/webp; empty without a logo.
        logo_size:
          type: integer
        logo_url:
          type: string
          description: The logo's path with its version (/v1/market/assets/{code}/logo?v=...); empty without one.
        version:
          type: integer
    AssetProfileWrite:
      type: object
      required: [display_name, description, links]
      properties:
        display_name:
          type: string
          maxLength: 32
        description:
          type: object
          additionalProperties:
            type: string
        links:
          type: object
          additionalProperties:
            type: string
        logo:
          type: string
          description: A new logo, base64.
        logo_mime:
          type: string
          enum: [image/png, image/svg+xml, image/webp]
        clear_logo:
          type: boolean
    Reason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
    Transition:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
    LocalizedText:
      type: object
      description: By locale; zh-CN required, en optional.
      required: [zh-CN]
      properties:
        zh-CN:
          type: string
        en:
          type: string
    ArticleText:
      type: object
      required: [locale, title, summary, body]
      properties:
        locale:
          type: string
          enum: [zh-CN, en]
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 500
        body:
          type: string
          description: Markdown.
    ArticleWrite:
      type: object
      required: [slug, category, pinned, order, texts]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        category:
          type: string
          description: Announcements notice or product; help account, funds, trading, futures or faq (others allowed).
        pinned:
          type: boolean
        order:
          type: integer
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ArticleText'
    ContentArticle:
      type: object
      required: [id, section, slug, category, pinned, order, status, publish_at, version, updated_by, created_at, updated_at, texts]
      properties:
        id:
          type: string
          format: uuid
        section:
          type: string
          enum: [ANNOUNCEMENT, HELP]
        slug:
          type: string
        category:
          type: string
        pinned:
          type: boolean
        order:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        publish_at:
          type: [string, 'null']
          format: date-time
          description: A published article shows from then on (later than now when scheduled).
        version:
          type: integer
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        texts:
          type: array
          items:
            $ref: '#/components/schemas/ArticleText'
    Broadcast:
      type: object
      required: [id, audience, users, title, body, link, email, status, recipients, read, created_by, created_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        audience:
          type: string
          enum: [ALL, USERS]
          description: Everyone, or named users (one, or a tag's when sent).
        users:
          type: integer
          description: The named users; 0 for everyone.
        title:
          $ref: '#/components/schemas/LocalizedText'
        body:
          $ref: '#/components/schemas/LocalizedText'
        link:
          type: string
        email:
          type: boolean
        status:
          type: string
          enum: [SENDING, SENT]
        recipients:
          type: integer
          description: Users who have it.
        read:
          type: integer
          description: Of them, those who read it.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    StatusRequest:
      type: object
      required: [to, reason]
      properties:
        to:
          type: string
          enum: [PREPARE, TRADING, HALT, CANCEL_ONLY, DELISTED]
        reason:
          type: string
          minLength: 3
        confirmation:
          type: string
          description: The preview's confirmation.token; a halt needs none.
    StatusResult:
      type: object
      required: [from, to, change]
      properties:
        from:
          type: string
        to:
          type: string
        change:
          description: The change waiting; null for a halt, done at once.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/InstrumentChange'
    Confirmation:
      type: object
      description: Binds the confirming call to the preview an ADMIN saw (sealed, valid 10 minutes).
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    StatusPreview:
      type: object
      required: [symbol, from, to, immediate, confirmation, delay_seconds, two_person]
      properties:
        symbol:
          type: string
        from:
          type: string
        to:
          type: string
        immediate:
          type: boolean
          description: A halt, at once and without confirmation.
        confirmation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
          description: How long the change will wait once confirmed (or approved); 0 for a halt.
        two_person:
          type: boolean
          description: A second ADMIN must approve it first (admin.two_person_approval).
    ParamChange:
      type: object
      description: A trading parameter a change moves (JSON values as stored; null for none).
      required: [entity, key, field, before, after]
      properties:
        entity:
          type: string
          enum: [FEE_SCHEDULE, TRADING_PAIR, CONTRACT]
        key:
          type: string
        field:
          type: string
          enum: [maker_fee_rate, taker_fee_rate, fee_tier, reference_symbol, reference_multiplier, risk_tiers, status]
        before: {}
        after: {}
    TierImpact:
      type: object
      description: |
        What a contract's new risk ladder would do to its open positions at
        the mark prices (HOUSE aside): positions the margin monitor would
        take over that it does not now (a cross account whole) with their
        notional and accounts, those newly warned, those above the risk
        limit of their leverage (they stay but cannot grow), those without
        a fresh mark price; the largest examples.
      required: [symbol, positions, liquidated, notional, accounts, warned, over_limit, unmeasured, examples]
      properties:
        symbol:
          type: string
        positions:
          type: integer
        liquidated:
          type: integer
        notional:
          $ref: '#/components/schemas/Decimal'
        accounts:
          type: integer
        warned:
          type: integer
        over_limit:
          type: integer
        unmeasured:
          type: integer
        examples:
          type: array
          items:
            type: object
            required: [user_id, symbol, position_side, cross, notional, margin_balance, maintenance_before, maintenance_after]
            properties:
              user_id:
                type: string
                format: uuid
              symbol:
                type: string
              position_side:
                type: string
              cross:
                type: boolean
              notional:
                $ref: '#/components/schemas/Decimal'
              margin_balance:
                $ref: '#/components/schemas/Decimal'
              maintenance_before:
                $ref: '#/components/schemas/Decimal'
              maintenance_after:
                $ref: '#/components/schemas/Decimal'
    ChangeGuard:
      type: object
      description: What a preview says of a document's trading parameters.
      required: [params, impacts, confirmation, delay_seconds, two_person]
      properties:
        params:
          type: array
          description: The trading parameters it moves; none means it applies at once.
          items:
            $ref: '#/components/schemas/ParamChange'
        impacts:
          type: array
          items:
            $ref: '#/components/schemas/TierImpact'
        confirmation:
          description: Null without trading parameters, for a caller without instruments.trading, or while a ladder's impact cannot be measured (warning IMPACT_UNKNOWN).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Confirmation'
        delay_seconds:
          type: integer
        two_person:
          type: boolean
    InstrumentChange:
      type: object
      description: A change of trading parameters an ADMIN confirmed (design 2026-10-02 §2 item 6).
      required: [id, kind, target, status, reason, summary, requested_by, requested_by_email, approved_by_email, approved_at,
        closed_by_email, closed_at, effective_at, applied_at, result, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CONFIG, PAIR_STATUS, CONTRACT_STATUS]
        target:
          type: string
          examples: [instruments, pair:BTC-USDT, contract:BTC-USDT-PERP]
        status:
          type: string
          enum: [PENDING_APPROVAL, SCHEDULED, APPLIED, CANCELED, REJECTED, FAILED]
        reason:
          type: string
        summary:
          type: object
          description: What the confirmation showed.
          required: [params, impacts, items]
          properties:
            fingerprint:
              type: string
            from:
              type: string
              description: A status change's status when confirmed.
            params:
              type: array
              items:
                $ref: '#/components/schemas/ParamChange'
            impacts:
              type: array
              items:
                $ref: '#/components/schemas/TierImpact'
            items:
              type: array
              description: A document's items, created or updated.
              items:
                type: object
                required: [entity, key, action, version]
                properties:
                  entity:
                    type: string
                  key:
                    type: string
                  action:
                    type: string
                  version:
                    type: integer
        requested_by:
          type: string
          format: uuid
        requested_by_email:
          type: string
        approved_by_email:
          type: [string, 'null']
        approved_at:
          type: [string, 'null']
          format: date-time
        closed_by_email:
          type: [string, 'null']
          description: Who canceled or rejected it.
        closed_at:
          type: [string, 'null']
          format: date-time
        effective_at:
          type: [string, 'null']
          format: date-time
          description: When it takes (or took) effect; null while it waits for approval or after it was closed unscheduled.
        applied_at:
          type: [string, 'null']
          format: date-time
        result:
          type: string
          description: What applying it did, or why it failed.
        created_at:
          type: string
          format: date-time
    Admin:
      type: object
      required: [id, email, name, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    AdminRole:
      type: string
      enum: [ADMIN, OPERATOR, FINANCE, AUDITOR]
    Permission:
      type: string
      enum: [users.read, users.status, orders.cancel, instruments.read, instruments.write, flags.read, flags.write,
        withdrawals.read, withdrawals.review, ledger.adjust.request, ledger.adjust.approve, audit.read, reports.read,
        derivatives.read, derivatives.write, settings.write, users.notes, users.security, users.contacts, ledger.hold,
        deposits.review, admins.manage, instruments.trading, content.write, notices.send, sim.control]
    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/AdminRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    ManagedAdmin:
      description: An administrator as the administrators page lists them.
      allOf:
        - $ref: '#/components/schemas/Admin'
        - type: object
          required: [status, failed_attempts, locked_until, last_login_at, created_at, sessions]
          properties:
            status:
              type: string
              enum: [ACTIVE, DISABLED]
            failed_attempts:
              type: integer
              description: Failed sign-ins since the last success; five lock the account for 15 minutes.
            locked_until:
              type: [string, 'null']
              format: date-time
            last_login_at:
              type: [string, 'null']
              format: date-time
            created_at:
              type: string
              format: date-time
            sessions:
              type: integer
              description: Live sessions.
    AdminCredentials:
      type: object
      description: |
        Shown once and never kept in the clear: a creation answers with all
        three and the administrator, a password reset with the password, an
        authenticator reset with the secret and its URI.
      required: [password, totp_secret, totp_uri]
      properties:
        admin:
          $ref: '#/components/schemas/ManagedAdmin'
        password:
          type: [string, 'null']
        totp_secret:
          type: [string, 'null']
          description: Base32, for typing into an authenticator app.
        totp_uri:
          type: [string, 'null']
          description: The otpauth:// URI, for a QR code.
    AdminSession:
      type: object
      required: [ip, user_agent, created_at, last_seen_at, expires_at]
      properties:
        ip:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Settings:
      type: object
      required: [two_person_approval, single_max_usdt, daily_max_usdt, withdrawal_max_usdt, change_delay_seconds, daily_used_usdt, updated_by,
        updated_at]
      properties:
        two_person_approval:
          type: boolean
          description: Fund operations need a second administrator (the flag admin.two_person_approval).
        change_delay_seconds:
          type: integer
          description: How long a confirmed change of trading parameters waits before it takes effect (60 to 86400, 300 by default).
        single_max_usdt:
          description: In single-person mode, one fund operation is worth at most this much.
          $ref: '#/components/schemas/Decimal'
        daily_max_usdt:
          description: In single-person mode, an administrator's fund operations of the last 24 hours sum to at most this much.
          $ref: '#/components/schemas/Decimal'
        withdrawal_max_usdt:
          description: In single-person mode, one approval completes a withdrawal worth at most this much, however many reviewers it needs.
          $ref: '#/components/schemas/Decimal'
        daily_used_usdt:
          description: The caller's single-person fund operations of the last 24 hours (pending ones included).
          $ref: '#/components/schemas/Decimal'
        updated_by:
          type: string
          description: Who last changed the limits; empty for the defaults.
        updated_at:
          type: [string, 'null']
          format: date-time
    Todo:
      type: object
      required: [withdrawals, approvals, identity_requests, deposits, instrument_changes, partial]
      properties:
        instrument_changes:
          type: integer
          description: Changes of trading parameters waiting for a second ADMIN or their time (with instruments.trading).
        withdrawals:
          type: integer
          description: Withdrawals in review (with withdrawals.read; counted up to 200).
        approvals:
          type: integer
          description: Fund operations waiting for a decision (with ledger.adjust.request or ledger.adjust.approve).
        identity_requests:
          type: integer
          description: Identity rebind requests waiting for a decision (with users.security; counted up to 200).
        deposits:
          type: integer
          description: Deposits waiting for a decision (with deposits.review; counted up to 200).
        partial:
          type: array
          items:
            type: string
            enum: [withdrawals, identity_requests, deposits]
    Identity:
      type: object
      required: [kind, value, verified_at, created_at]
      properties:
        kind:
          type: string
          enum: [EMAIL, PHONE]
        value:
          type: string
          description: Masked except from POST /admin/v1/users/{id}/contacts/reveal.
        verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    Security:
      type: object
      required: [identities, totp, password_changed_at, last_login_at, locked_seconds, sessions, devices, pending_identity_requests]
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        totp:
          type: object
          required: [status, activated_at]
          properties:
            status:
              type: string
              enum: [ACTIVE, PENDING, NONE]
              description: PENDING is set up but never confirmed.
            activated_at:
              type: [string, 'null']
              format: date-time
        password_changed_at:
          type: [string, 'null']
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        locked_seconds:
          type: integer
          description: How long password sign-in stays locked after repeated failures; 0 when it is not.
        sessions:
          type: array
          items:
            type: object
            required: [id, device_id, client_type, user_agent, ip, created_at, last_seen_at]
            properties:
              id:
                type: string
                format: uuid
              device_id:
                type: string
              client_type:
                type: string
              user_agent:
                type: string
              ip:
                type: string
                description: Masked (203.0.113.*).
              created_at:
                type: [string, 'null']
                format: date-time
              last_seen_at:
                type: [string, 'null']
                format: date-time
        devices:
          type: array
          items:
            type: object
            required: [device_id, first_seen_at, last_seen_at]
            properties:
              device_id:
                type: string
              first_seen_at:
                type: [string, 'null']
                format: date-time
              last_seen_at:
                type: [string, 'null']
                format: date-time
        pending_identity_requests:
          type: integer
    LoginEntry:
      type: object
      required: [id, method, result, identity_mask, device_id, user_agent, ip, new_device, created_at]
      properties:
        id:
          type: integer
        method:
          type: string
          description: PASSWORD, OTP, LOGIN_CHALLENGE or REGISTER.
        result:
          type: string
          description: SUCCESS or a failure code.
        identity_mask:
          type: string
        device_id:
          type: string
        user_agent:
          type: string
        ip:
          type: string
          description: Masked.
        new_device:
          type: boolean
        created_at:
          type: [string, 'null']
          format: date-time
    StatusChange:
      type: object
      required: [from_status, to_status, reason_code, actor, at]
      properties:
        from_status:
          type: string
        to_status:
          type: string
        reason_code:
          type: string
        actor:
          type: string
          description: An administrator's email, cli:<os user> or a service.
        at:
          type: [string, 'null']
          format: date-time
    Consent:
      type: object
      required: [document, version, accepted_at]
      properties:
        document:
          type: string
          description: TERMS or RISK_DISCLOSURE.
        version:
          type: string
        accepted_at:
          type: [string, 'null']
          format: date-time
    Assessment:
      type: object
      required: [id, source_event_type, score, action, hits, enforced, created_at]
      properties:
        id:
          type: string
          format: uuid
        source_event_type:
          type: string
          description: The auth event assessed, e.g. auth.LoginSucceeded.
        score:
          type: integer
          minimum: 0
          maximum: 100
        action:
          type: string
          enum: [NONE, STEP_UP, REVIEW, REJECT]
        hits:
          type: array
          items:
            type: object
            required: [rule, score, detail]
            properties:
              rule:
                type: string
              score:
                type: integer
              detail:
                type: string
        enforced:
          type: boolean
          description: Whether the action was carried out (risk.enforce).
        created_at:
          type: [string, 'null']
          format: date-time
    ValuedBalance:
      type: object
      required: [account_type, asset, available, frozen, total, value_usdt]
      properties:
        account_type:
          type: string
          enum: [SPOT, FUTURES]
        asset:
          type: string
        available:
          $ref: '#/components/schemas/Decimal'
        frozen:
          $ref: '#/components/schemas/Decimal'
        total:
          $ref: '#/components/schemas/Decimal'
        value_usdt:
          description: The total at the asset's USDT pair's last price; null without one.
          $ref: '#/components/schemas/NullableDecimal'
    Hold:
      type: object
      description: An administrator's hold on part of a user's SPOT balance (ADMIN_FREEZE until released with ADMIN_UNFREEZE).
      required: [id, account_type, asset, amount, reason, actor, journal_id, created_at, active, released_at, released_by, release_reason,
        release_journal_id]
      properties:
        id:
          type: string
          format: uuid
        account_type:
          type: string
          enum: [SPOT]
        asset:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        reason:
          type: string
        actor:
          type: string
          description: The administrator who placed it.
        journal_id:
          type: string
          format: uuid
        created_at:
          type: [string, 'null']
          format: date-time
        active:
          type: boolean
        released_at:
          type: [string, 'null']
          format: date-time
        released_by:
          type: string
        release_reason:
          type: string
        release_journal_id:
          type: [string, 'null']
    ServiceOrder:
      type: object
      description: An order as the service that holds it renders it.
      required: [order_id, status]
      additionalProperties: true
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
    ContractOrder:
      type: object
      description: A contract order as derivatives-service renders it.
      required: [order_id, client_order_id, symbol, side, position_side, type, price, quantity, reduce_only, status, filled_quantity,
        cancel_requested, created_at]
      additionalProperties: true
      properties:
        order_id:
          type: string
          format: uuid
        client_order_id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        position_side:
          type: string
          enum: [BOTH, LONG, SHORT]
        type:
          type: string
          enum: [LIMIT, MARKET]
        price:
          $ref: '#/components/schemas/Decimal'
        quantity:
          $ref: '#/components/schemas/Decimal'
        reduce_only:
          type: boolean
        status:
          type: string
        filled_quantity:
          $ref: '#/components/schemas/Decimal'
        cancel_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserPosition:
      type: object
      description: A contract position as derivatives-service renders it.
      required: [position_id, symbol, position_side, quantity, entry_price, mark_price, unrealized_pnl, margin, margin_mode, leverage,
        liquidation_price]
      additionalProperties: true
      properties:
        position_id:
          type: string
          format: uuid
        symbol:
          type: string
        position_side:
          type: string
          enum: [BOTH, LONG, SHORT]
        quantity:
          description: Signed, positive long.
          $ref: '#/components/schemas/Decimal'
        entry_price:
          $ref: '#/components/schemas/Decimal'
        mark_price:
          $ref: '#/components/schemas/NullableDecimal'
        unrealized_pnl:
          $ref: '#/components/schemas/NullableDecimal'
        margin:
          $ref: '#/components/schemas/Decimal'
        margin_mode:
          type: string
          enum: [CROSS, ISOLATED]
        leverage:
          type: integer
        liquidation_price:
          $ref: '#/components/schemas/NullableDecimal'
    IdentityRequest:
      type: object
      required: [id, user_id, kind, new_value, current_value, status, created_at, decided_at, decided_by, reason]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [EMAIL, PHONE]
        new_value:
          type: string
          description: Masked.
        current_value:
          type: string
          description: Masked; empty when the identity is gone.
        status:
          type: string
          enum: [PENDING_REVIEW, APPROVED, REJECTED]
        created_at:
          type: [string, 'null']
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by:
          type: string
        reason:
          type: string
    UserView:
      type: object
      required: [user, balances]
      properties:
        user:
          type: object
          required: [id, status, region, language, kyc_level, created_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [ACTIVE, RISK_REVIEW, FROZEN, CLOSED]
            region:
              type: string
            language:
              type: string
            kyc_level:
              type: integer
            created_at:
              type: string
              format: date-time
        balances:
          type: array
          items:
            type: object
            required: [account_type, asset, available, frozen]
            properties:
              account_type:
                type: string
                examples: [SPOT]
              asset:
                type: string
              available:
                $ref: '#/components/schemas/Decimal'
              frozen:
                $ref: '#/components/schemas/Decimal'
    Withdrawal:
      type: object
      required: [id, asset, network, address, amount, fee, internal, status, risk_reasons, approvals_required, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: In lists only.
        asset:
          type: string
        network:
          type: string
        address:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        fee:
          $ref: '#/components/schemas/Decimal'
        internal:
          type: boolean
        custody:
          type: boolean
          description: The custodian sends it (ADR-0011).
        status:
          type: string
        provider_status:
          type: string
          description: |
            In lists only: the custodian's last word on it (SUBMITTED until
            it acknowledges, ACCEPTED, REVIEW, APPROVED, REJECTED, SUCCESS,
            FAILED); empty when the platform sends it.
        submitted_at:
          type: [string, 'null']
          format: date-time
        risk_score:
          type: integer
          description: In lists only.
        risk_reasons:
          type: array
          items:
            type: string
            examples: [NEW_ACCOUNT, NEW_DEVICE, SECURITY_CHANGE, NEW_ADDRESS, LARGE_AMOUNT, DAILY_SHARE]
        value_usdt:
          $ref: '#/components/schemas/Decimal'
        approvals_required:
          type: integer
        approvals:
          type: array
          description: Reviewers so far (in lists only).
          items:
            type: string
        reject_reason:
          type: [string, 'null']
        tx_hash:
          type: [string, 'null']
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        created_at:
          type: string
          format: date-time
        approved_at:
          type: [string, 'null']
        broadcast_at:
          type: [string, 'null']
        confirmed_at:
          type: [string, 'null']
        held_at:
          type: [string, 'null']
          format: date-time
          description: Set while a reviewer has it on hold (held_by, with hold_note).
        held_by:
          type: string
        hold_note:
          type: string
    WithdrawalDetail:
      type: object
      required: [withdrawal, address_book, used_today_usdt, used_month_usdt]
      properties:
        withdrawal:
          $ref: '#/components/schemas/Withdrawal'
        address_book:
          description: The address in the user's address book; null when it was deleted.
          oneOf:
            - type: object
              required: [label, created_at, usable_at]
              properties:
                label:
                  type: string
                created_at:
                  type: string
                  format: date-time
                usable_at:
                  type: string
                  format: date-time
                  description: The end of its cooling-off period.
            - type: 'null'
        used_today_usdt:
          description: The user's withdrawals' worth today (UTC), refused ones left out.
          $ref: '#/components/schemas/Decimal'
        used_month_usdt:
          description: The same this month.
          $ref: '#/components/schemas/Decimal'
    ReviewDeposit:
      type: object
      description: A deposit as wallet-service has it, with the admin console's decisions on it.
      required: [id, user_id, kind, asset, network, address, tx_hash, amount, status, unclaimed, reason, trade_id, confirmations,
        required_confirmations, journal_id, detected_at, confirmed_at, credited_at, source, entered_by, callback_at, discrepancy, attention,
        resolution, resolved_by, resolved_at, resolution_note, release_journal_id]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CHAIN, INTERNAL]
        asset:
          type: [string, 'null']
          description: Null for a token no asset is configured for.
        network:
          type: string
        address:
          type: string
        tx_hash:
          type: string
        amount:
          $ref: '#/components/schemas/Decimal'
        status:
          type: string
          enum: [DETECTED, CONFIRMING, CONFIRMED, CREDITED, ORPHANED, REJECTED]
        unclaimed:
          type: boolean
          description: Booked to UNCLAIMED_DEPOSIT instead of the user.
        reason:
          type: [string, 'null']
          enum: [BELOW_MINIMUM, ACCOUNT_CLOSED, NOT_ELIGIBLE, UNSUPPORTED_TOKEN, null]
        trade_id:
          type: [string, 'null']
          description: The custodian's trade (UDUN:<tradeId>).
        confirmations:
          type: integer
        required_confirmations:
          type: integer
        journal_id:
          type: [string, 'null']
        detected_at:
          type: string
          format: date-time
        confirmed_at:
          type: [string, 'null']
        credited_at:
          type: [string, 'null']
        source:
          type: string
          enum: [AUTO, MANUAL]
          description: MANUAL for an administrator's backfill of a lost callback.
        entered_by:
          type: string
        callback_at:
          type: [string, 'null']
          description: When the custodian's own callback matched a backfill.
        discrepancy:
          type: string
          description: What in the custodian's callback disagreed with a backfill.
        attention:
          type: boolean
          description: Waits for an administrator's decision.
        resolution:
          type: string
          enum: ['', CREDITED, DISMISSED]
        resolved_by:
          type: string
        resolved_at:
          type: [string, 'null']
        resolution_note:
          type: string
        release_journal_id:
          type: [string, 'null']
    InstrumentConfig:
      type: object
      description: The reference data in the shape of deploy/instruments/<env>.json.
      required: [fee_schedules, assets, pairs, contracts]
      properties:
        fee_schedules:
          type: array
          items:
            $ref: '#/components/schemas/FeeScheduleConfig'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetConfig'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/PairConfig'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractConfig'
    InstrumentConfigPatch:
      type: object
      description: Some items to create or change, each whole; the others are left alone.
      properties:
        fee_schedules:
          type: array
          items:
            $ref: '#/components/schemas/FeeScheduleConfig'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetConfig'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/PairConfig'
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/ContractConfig'
    FeeScheduleConfig:
      type: object
      required: [tier, maker_fee_rate, taker_fee_rate]
      properties:
        tier:
          type: string
          pattern: '^[a-z0-9_-]{1,32}$'
        maker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        taker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        version:
          type: integer
    AssetConfig:
      type: object
      required: [asset_code, name, decimals, deposit_enabled, withdraw_enabled, trading_enabled, risk_restricted]
      properties:
        asset_code:
          type: string
          pattern: '^[A-Z0-9]{2,10}$'
        name:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          description: Fixed once set.
        deposit_enabled:
          type: boolean
        withdraw_enabled:
          type: boolean
        trading_enabled:
          type: boolean
        risk_restricted:
          type: boolean
        rank:
          type: integer
        categories:
          type: array
          items:
            type: string
        version:
          type: integer
        networks:
          type: array
          description: The networks to create or change; the others are left alone.
          items:
            $ref: '#/components/schemas/NetworkConfig'
    NetworkConfig:
      type: object
      required: [network, chain, contract_address, confirmations, min_deposit, min_withdraw, withdraw_fee, memo_required, deposit_enabled,
        withdraw_enabled]
      properties:
        asset_code:
          type: string
        network:
          type: string
        chain:
          type: string
        contract_address:
          type: string
        confirmations:
          type: integer
        min_deposit:
          $ref: '#/components/schemas/Decimal'
        min_withdraw:
          $ref: '#/components/schemas/Decimal'
        withdraw_fee:
          $ref: '#/components/schemas/Decimal'
        memo_required:
          type: boolean
        deposit_enabled:
