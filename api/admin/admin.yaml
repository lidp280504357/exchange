      required: [id, user_id, kind, asset, network, address, tx_hash, amount, status, unclaimed, reason, trade_id, confirmations,
        required_confirmations, journal_id, detected_at, confirmed_at, credited_at, source, entered_by, callback_at, discrepancy, attention,
        resolution, resolved_by, resolved_at, resolution_note, release_journal_id]
      properties:
        id:
          type: string
          format: uuid
