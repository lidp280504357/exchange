<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Astras · 网络不可用</title>
    <!-- Served by the service worker without a network: everything it needs is on this page. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b0e11; color: #eaecef; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      .mark { width: 56px; height: 56px; border-radius: 50%; background: #1a1f27; display: grid; place-items: center; font-size: 26px; }
      h1 { margin: 8px 0 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; color: #a7b1bc; font-size: 14px; line-height: 1.6; }
      button { margin-top: 12px; min-height: 44px; padding: 0 28px; border: 0; border-radius: 8px; background: #f0b90b; color: #0b0e11; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⚡</div>
      <h1>网络不可用</h1>
      <p>请检查网络连接，恢复后重新打开页面。<br />You are offline: check the connection and try again.</p>
      <button type="button" onclick="location.reload()">重新加载 · Retry</button>
    </main>
  </body>
</html>
