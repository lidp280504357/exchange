# The front end (ADR-0012): the PC site, the mobile site and the admin
# console share a data layer (packages/core) and a design system
# (packages/ui); e2e holds the browser smoke tests of the deployed sites.
packages:
  - apps/*
  - packages/*
  - e2e
# Install scripts stay off: esbuild's only checks its binary, which comes
# as an optional dependency per platform.
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@storybook/addon-docs@10.6.1'
  - '@storybook/builder-vite@10.6.1'
  - '@storybook/react-dom-shim@10.6.1'
  - '@storybook/react-vite@10.6.1'
  - '@storybook/react@10.6.1'
  - framer-motion@13.4.6
  - lucide-react@1.49.0
  - motion@13.4.6
  - storybook@10.6.1
